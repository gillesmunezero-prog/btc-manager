// Recherche globale : filtre cote client les donnees deja chargees par l'application (aucune
// lecture Firestore supplementaire declenchee par la frappe). Tolerante a la casse/aux accents/
// a la saisie partielle via normTxt, avec une correspondance "tous les mots tapes doivent se
// retrouver quelque part dans le texte de l'objet" (pas besoin de moteur de recherche externe).
// ============================================================================================
// PHASE 7 — Mode scan (points 10-12, 24-25). Reconnaissance automatique du type d'objet scanne par
// le prefixe/URL decode (pas besoin de choisir "scanner lot" vs "scanner palette", point 10).
// Decodage 100% local (jsQR, aucune image envoyee a un service externe — point 43 "pas d'IA
// externe, pas de reconnaissance d'image [distante]"). Repli clavier systematique si la camera est
// refusee/indisponible/HTTPS manquant (points 11/12) : l'utilisateur n'est jamais bloque.
// ============================================================================================
function decoderTexteScan(texte) {
  if (!texte) return null;
  var t = ("" + texte).trim();
  try {
    var url = new URL(t);
    var lot = url.searchParams.get("lot");
    var palette = url.searchParams.get("palette");
    if (lot) return { type: "lot", id: lot };
    if (palette) return { type: "palette", id: palette };
  } catch (e) {}
  if (/^LOT:/i.test(t)) return { type: "lot", id: t.slice(4).trim() };
  if (/^PAL:/i.test(t)) return { type: "palette", id: t.slice(4).trim() };
  if (/^PAL-/i.test(t)) return { type: "palette", id: t };
  if (/^BTC-/i.test(t)) return { type: "lot", id: t };
  return null; // code inconnu : ni URL de l'app, ni prefixe reconnu
}

// "continu" (utilise par l'inventaire, point 22/23) : n'appelle PAS onFermer apres un scan reussi,
// permet d'enchainer les scans sans revenir a l'ecran precedent. "dejaVus" (optionnel) : ensemble de
// codes deja traites par l'appelant, pour afficher "Palette déjà scannée" au lieu de la retraiter
// (point 25 — anti-double-scan, complementaire a la dedup locale sur images video consecutives).
function ModaleScanner({ onFermer, onObjetReconnu, continu, dejaVus, titre }) {
  const videoRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const [etat, setEtat] = React.useState("init"); // init | camera | refuse | indisponible | https
  const [dernierCode, setDernierCode] = React.useState("");
  const [saisie, setSaisie] = React.useState("");
  const [msg, setMsg] = React.useState("");

  const traiterCode = React.useCallback((texte) => {
    if (texte === dernierCode) return; // anti-rebond : meme image lue plusieurs fois de suite
    setDernierCode(texte);
    var objet = decoderTexteScan(texte);
    if (!objet) { setMsg("❌ Code inconnu"); if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} } return; }
    if (dejaVus && dejaVus[objet.type + ":" + objet.id]) {
      setMsg("⚠️ " + (objet.type === "lot" ? "Lot" : "Palette") + " " + objet.id + " déjà scanné(e)");
      if (navigator.vibrate) { try { navigator.vibrate([30, 30, 30]); } catch (e) {} }
      return;
    }
    setMsg("✓ " + (objet.type === "lot" ? "Lot" : "Palette") + " " + objet.id + " reconnu(e)");
    if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
    onObjetReconnu(objet);
    if (!continu) { setTimeout(onFermer, 400); }
    else { setTimeout(function () { setDernierCode(""); }, 1200); } // permet de re-scanner un AUTRE code juste apres
  }, [dernierCode, dejaVus, continu, onObjetReconnu, onFermer]);

  React.useEffect(() => {
    var annule = false;
    function boucleScan() {
      if (annule) return;
      if (!videoRef.current || !canvasRef.current || typeof jsQR === "undefined") { rafRef.current = requestAnimationFrame(boucleScan); return; }
      var video = videoRef.current, canvas = canvasRef.current;
      if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        try {
          var image = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var code = jsQR(image.data, image.width, image.height);
          if (code && code.data) { traiterCode(code.data); }
        } catch (e) {}
      }
      rafRef.current = requestAnimationFrame(boucleScan);
    }
    async function demarrer() {
      if (!window.isSecureContext) { setEtat("https"); return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setEtat("indisponible"); return; }
      if (typeof jsQR === "undefined") { setEtat("indisponible"); return; }
      try {
        var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        if (annule) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
        streamRef.current = stream;
        if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play(); }
        setEtat("camera");
        boucleScan();
      } catch (e) {
        setEtat(e && e.name === "NotAllowedError" ? "refuse" : "indisponible");
      }
    }
    demarrer();
    return function () {
      annule = true;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (streamRef.current) { streamRef.current.getTracks().forEach(function (t) { t.stop(); }); }
    };
  }, [traiterCode]);

  const soumettreSaisie = (e) => {
    e.preventDefault();
    var objet = decoderTexteScan(saisie.trim());
    if (!objet) { setMsg("❌ Code inconnu — vérifiez le numéro (ex: BTC-2026-09-001 ou PAL-2026-000123)."); return; }
    if (dejaVus && dejaVus[objet.type + ":" + objet.id]) { setMsg("⚠️ Déjà scanné(e)."); return; }
    setMsg("✓ " + (objet.type === "lot" ? "Lot" : "Palette") + " " + objet.id + " reconnu(e)");
    onObjetReconnu(objet);
    setSaisie("");
    if (!continu) onFermer();
  };

  return (
    <div className="btp-modal-overlay" onClick={onFermer}>
      <div className="btp-modal" style={{ maxWidth: 420 }} onClick={(e) => e.stopPropagation()}>
        <div className="btp-modal-title" style={{ marginBottom: 12 }}>📷 {titre || "Scanner"}</div>
        {etat === "camera" && (
          <div style={{ position: "relative", background: "#000", borderRadius: 10, overflow: "hidden" }}>
            <video ref={videoRef} playsInline muted style={{ width: "100%", display: "block", maxHeight: 320, objectFit: "cover" }} />
            <div style={{ position: "absolute", inset: 0, border: "3px solid rgba(255,255,255,.5)", margin: 30, borderRadius: 12, pointerEvents: "none" }} />
          </div>
        )}
        {etat === "init" && <div style={{ padding: 20, textAlign: "center", color: "var(--btp-text2)" }}>Activation de la caméra…</div>}
        <canvas ref={canvasRef} style={{ display: "none" }} />
        {(etat === "refuse" || etat === "indisponible" || etat === "https") && (
          <div className="btp-alert alert-error" style={{ marginBottom: 12 }}>
            {etat === "refuse" && "⚠️ Accès à la caméra refusé. Autorisez la caméra dans les paramètres du navigateur, ou saisissez le code ci-dessous."}
            {etat === "indisponible" && "⚠️ Caméra indisponible sur cet appareil ou navigateur. Saisissez le code ci-dessous."}
            {etat === "https" && "⚠️ Le scan caméra nécessite une connexion sécurisée (HTTPS). Saisissez le code ci-dessous."}
          </div>
        )}
        {msg && <div style={{ marginTop: 10, marginBottom: 6, fontWeight: 700, color: msg.indexOf("❌") >= 0 ? "#EC7063" : (msg.indexOf("⚠️") >= 0 ? "#F39C12" : "#2ECC71") }}>{msg}</div>}
        <form onSubmit={soumettreSaisie} style={{ marginTop: 14 }}>
          <label className="btp-label">Saisir le code (si la caméra ne fonctionne pas)</label>
          <div style={{ display: "flex", gap: 8 }}>
            <input className="btp-input" placeholder="Ex: BTC-2026-09-001 ou PAL-2026-000123" value={saisie} onChange={(e) => setSaisie(e.target.value)} style={{ flex: 1 }} />
            <button className="btn btn-primary" type="submit">Valider</button>
          </div>
        </form>
        <button className="btn btn-ghost btn-full" style={{ marginTop: 14 }} onClick={onFermer}>Fermer</button>
      </div>
    </div>
  );
}

// Bouton "Scanner" pret a l'emploi (point 10) : ouvre la modale, route automatiquement vers
// FicheLot ou FichePalette selon le type reconnu. A deposer dans n'importe quel tableau de bord ;
// "user"/"userData" sont transmis normalement par le composant appelant (memes props que partout
// ailleurs dans l'application, pas d'etat global).
function BoutonScanner({ user, userData, style, libelle }) {
  const [ouvert, setOuvert] = React.useState(false);
  const [cible, setCible] = React.useState(null); // { type, id }
  return (
    <React.Fragment>
      <button className="btn btn-primary btn-lg" style={Object.assign({ fontSize: 16, fontWeight: 800 }, style)} onClick={() => setOuvert(true)}>📷 {libelle || "Scanner"}</button>
      {ouvert && <ModaleScanner onFermer={() => setOuvert(false)} onObjetReconnu={(o) => setCible(o)} />}
      {cible && cible.type === "lot" && <FicheLot numeroLot={cible.id} user={user} userData={userData} onClose={() => setCible(null)} />}
      {cible && cible.type === "palette" && <FichePalette paletteId={cible.id} user={user} userData={userData} onClose={() => setCible(null)} />}
    </React.Fragment>
  );
}

// Phase 7 (points 22/23/25) : premier workflow d'inventaire terrain. L'utilisateur demarre un
// inventaire (optionnellement filtre sur un emplacement), scanne les palettes presentes en serie
// (anti-double-scan integre a ModaleScanner via "dejaVus"), puis obtient une comparaison
// attendues/scannees. NE CORRIGE JAMAIS le stock automatiquement (point 22) : produit une
// proposition d'ecart a examiner et traiter manuellement (ex: via le diagnostic Direction).
function InventaireParScan({ user, userData, onFermer }) {
  const [etape, setEtape] = React.useState("configuration"); // configuration | scan | resultat
  const [emplacement, setEmplacement] = React.useState("");
  const [attendues, setAttendues] = React.useState([]);
  const [scannees, setScannees] = React.useState([]); // [{paletteId, ts}]
  const [showScanner, setShowScanner] = React.useState(false);
  const [chargement, setChargement] = React.useState(false);

  const dejaVus = {};
  scannees.forEach(function (s) { dejaVus["palette:" + s.paletteId] = true; });

  const demarrer = async () => {
    setChargement(true);
    try {
      var query = db.collection("stock_palettes");
      if (emplacement.trim()) query = query.where("emplacement", "==", emplacement.trim());
      var snap = await query.limit(1000).get();
      var liste = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })
        .filter(function (p) { return (p.disponibleCache || 0) > 0; });
      setAttendues(liste);
      setScannees([]);
      setEtape("scan");
    } catch (e) {
      window.alert("Erreur : " + e.message);
    } finally {
      setChargement(false);
    }
  };

  const surObjetScanne = (objet) => {
    if (objet.type !== "palette") return; // l'inventaire ne porte que sur les palettes (point 22)
    setScannees(function (prev) { return prev.concat([{ paletteId: objet.id, ts: Date.now() }]); });
  };

  const idsAttendus = {}; attendues.forEach(function (p) { idsAttendus[p.paletteId] = p; });
  const idsScannes = {}; scannees.forEach(function (s) { idsScannes[s.paletteId] = true; });
  const manquantes = attendues.filter(function (p) { return !idsScannes[p.paletteId]; });
  const inattendues = scannees.filter(function (s) { return !idsAttendus[s.paletteId]; });

  return (
    <div className="btp-modal-overlay" onClick={onFermer}>
      <div className="btp-modal" style={{ maxWidth: 520, maxHeight: "88vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
        <div className="btp-modal-title" style={{ marginBottom: 12 }}>📋 Inventaire par scan</div>

        {etape === "configuration" && (
          <React.Fragment>
            <label className="btp-label">Emplacement à inventorier (facultatif — laisser vide pour tout)</label>
            <input className="btp-input" placeholder="Ex: Zone A" value={emplacement} onChange={(e) => setEmplacement(e.target.value)} style={{ marginBottom: 14 }} />
            <button className="btn btn-primary btn-full" onClick={demarrer} disabled={chargement}>{chargement ? "Chargement…" : ("▶️ Démarrer l'inventaire" + (emplacement.trim() ? (" — " + emplacement.trim()) : ""))}</button>
            <button className="btn btn-ghost btn-full" style={{ marginTop: 10 }} onClick={onFermer}>Annuler</button>
          </React.Fragment>
        )}

        {etape === "scan" && (
          <React.Fragment>
            <div style={{ fontSize: 13, color: "var(--btp-text2)", marginBottom: 10 }}>{attendues.length} palette(s) attendue(s){emplacement.trim() ? (" en " + emplacement.trim()) : ""}.</div>
            <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 14 }}>
              <button className="btn btn-primary" onClick={() => setShowScanner(true)}>📷 Scanner</button>
              <strong style={{ fontSize: 15 }}>{scannees.length} palette{scannees.length > 1 ? "s" : ""} scannée{scannees.length > 1 ? "s" : ""}</strong>
            </div>
            {scannees.length > 0 && (
              <div style={{ maxHeight: 160, overflowY: "auto", marginBottom: 14, fontSize: 12 }}>
                {scannees.slice().reverse().map(function (s, i) {
                  var ok = !!idsAttendus[s.paletteId];
                  return <div key={i} style={{ color: ok ? "#2ECC71" : "#F39C12" }}>{ok ? "✓" : "⚠️"} {s.paletteId}{!ok ? " (inattendue)" : ""}</div>;
                })}
              </div>
            )}
            <button className="btn btn-success btn-full" onClick={() => setEtape("resultat")}>✅ Terminer l'inventaire</button>
            <button className="btn btn-ghost btn-full" style={{ marginTop: 10 }} onClick={onFermer}>Annuler</button>
          </React.Fragment>
        )}

        {etape === "resultat" && (
          <React.Fragment>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 13, marginBottom: 4 }}>Attendues : <strong>{attendues.length}</strong> · Scannées : <strong>{scannees.length}</strong></div>
              <div style={{ fontSize: 13, color: manquantes.length > 0 ? "#EC7063" : "#2ECC71" }}>Manquantes : <strong>{manquantes.length}</strong></div>
              <div style={{ fontSize: 13, color: inattendues.length > 0 ? "#F39C12" : "#2ECC71" }}>Inattendues : <strong>{inattendues.length}</strong></div>
            </div>
            {manquantes.length > 0 && (
              <div style={{ marginBottom: 12 }}>
                <strong style={{ fontSize: 12, color: "#EC7063" }}>Palettes attendues non trouvées</strong>
                <ul style={{ margin: "6px 0 0 18px", fontSize: 12 }}>
                  {manquantes.map(function (p) { return <li key={p.paletteId}>{p.paletteId} — lot {p.numeroLot} · {(p.disponibleCache || 0).toLocaleString()} u</li>; })}
                </ul>
              </div>
            )}
            {inattendues.length > 0 && (
              <div style={{ marginBottom: 12 }}>
                <strong style={{ fontSize: 12, color: "#F39C12" }}>Palettes scannées non attendues ici</strong>
                <ul style={{ margin: "6px 0 0 18px", fontSize: 12 }}>
                  {inattendues.map(function (s) { return <li key={s.paletteId}>{s.paletteId}</li>; })}
                </ul>
              </div>
            )}
            {manquantes.length === 0 && inattendues.length === 0 && <div style={{ color: "#2ECC71", fontWeight: 700 }}>🟢 Inventaire conforme : rien à signaler.</div>}
            <p style={{ fontSize: 11, color: "var(--btp-text2)", marginTop: 10 }}>Cet écart est une proposition à vérifier — aucune correction automatique du stock n'a été effectuée.</p>
            <button className="btn btn-ghost btn-full" style={{ marginTop: 10 }} onClick={onFermer}>Fermer</button>
          </React.Fragment>
        )}
      </div>
      {showScanner && (
        <ModaleScanner titre="Scanner les palettes" continu={true} dejaVus={dejaVus}
          onFermer={() => setShowScanner(false)} onObjetReconnu={surObjetScanne} />
      )}
    </div>
  );
}

function GlobalSearch(props) {
  const [ouverte, setOuverte] = React.useState(false);
  const [requete, setRequete] = React.useState("");
  const [recents, setRecents] = React.useState([]);
  const inputRef = React.useRef(null);
  const CLE_RECENTS = "btcmanager_recherche_recents";

  React.useEffect(() => {
    function onKeyDown(e) {
      var k = e.key ? e.key.toLowerCase() : "";
      if ((e.ctrlKey || e.metaKey) && k === "k") {
        e.preventDefault();
        setOuverte(true);
      } else if (e.key === "Escape") {
        setOuverte(false);
      }
    }
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, []);

  React.useEffect(() => {
    if (ouverte) {
      try {
        var raw = localStorage.getItem(CLE_RECENTS);
        setRecents(raw ? JSON.parse(raw) : []);
      } catch (e) { setRecents([]); }
      setTimeout(function () { if (inputRef.current) inputRef.current.focus(); }, 30);
    } else {
      setRequete("");
    }
  }, [ouverte]);

  function memoriserRecent(item) {
    try {
      var raw = localStorage.getItem(CLE_RECENTS);
      var liste = raw ? JSON.parse(raw) : [];
      liste = liste.filter(function (x) { return !(x.type === item.type && x.label === item.label); });
      liste.unshift({ type: item.type, id: item.id, label: item.label, subtitle: item.subtitle });
      localStorage.setItem(CLE_RECENTS, JSON.stringify(liste.slice(0, 6)));
    } catch (e) { /* confort seulement : on ignore si localStorage est indisponible */ }
  }

  function ouvrir(item) {
    memoriserRecent(item);
    setOuverte(false);
    props.ouvrirObjet(item.type, item.type === "nc" ? item.ncData : item.id);
  }

  var tokens = normTxt(requete).split(/\s+/).filter(Boolean);
  function correspond(texte) {
    if (tokens.length === 0) return false;
    var n = normTxt(texte);
    return tokens.every(function (t) { return n.indexOf(t) !== -1; });
  }

  var resLots = [], resPalettes = [], resCommandes = [], resChantiers = [], resNC = [], resProduits = [];
  if (tokens.length > 0) {
    resLots = (props.lots || []).filter(function (l) { return correspond((l.numeroLot || "") + " " + (l.type || "")); }).slice(0, 6);
    resPalettes = (props.palettes || []).filter(function (p) { return correspond((p.paletteId || "") + " " + (p.numeroLot || "") + " " + (p.typeBTC || "")); }).slice(0, 6);
    resCommandes = (props.commandes || []).filter(function (c) { return correspond((c.numBC || "") + " " + (c.client || "") + " " + (c.chantierNom || "") + " " + (c.typNom || c.type || "")); }).slice(0, 6);
    resChantiers = (props.chantiers || []).filter(function (ch) { return correspond((ch.nom || "") + " " + (ch.client || "")); }).slice(0, 6);
    resNC = (props.ncs || []).filter(function (nc) { return correspond((nc.numeroLot || "") + " " + (nc.description || "") + " " + (nc.responsable || "")); }).slice(0, 6);
    resProduits = CATALOGUE.filter(function (p) { return correspond(p.nom + " " + p.id + " " + p.dim); }).slice(0, 6);
  }
  var total = resLots.length + resPalettes.length + resCommandes.length + resChantiers.length + resNC.length + resProduits.length;

  if (!ouverte) {
    return (
      <button className="gsearch-trigger" onClick={() => setOuverte(true)}>
        🔍 <span className="gsearch-trigger-texte">Rechercher</span> <span className="gsearch-kbd">Ctrl+K</span>
      </button>
    );
  }

  return (
    <div className="gsearch-overlay" onClick={() => setOuverte(false)}>
      <div className="gsearch-box" onClick={(e) => e.stopPropagation()}>
        <div className="gsearch-input-row">
          <span>🔍</span>
          <input ref={inputRef} className="gsearch-input"
            placeholder="Lot, palette, commande, chantier, non-conformité, produit…"
            value={requete} onChange={(e) => setRequete(e.target.value)} />
          <button className="gsearch-close" onClick={() => setOuverte(false)}>✕</button>
        </div>
        <div className="gsearch-results">
          {tokens.length === 0 && (
            <div className="gsearch-groupe">
              <div className="gsearch-groupe-titre">Récents</div>
              {recents.length === 0 && <div className="gsearch-vide-inline">Aucune recherche récente.</div>}
              {recents.map(function (r, i) {
                return (
                  <div key={i} className="gsearch-item" onClick={() => ouvrir(r)}>
                    <div className="gsearch-item-titre">{r.label}</div>
                    <div className="gsearch-item-sub">{r.subtitle}</div>
                  </div>
                );
              })}
            </div>
          )}
          {tokens.length > 0 && total === 0 && (
            <div className="gsearch-vide">
              <div>Aucun résultat pour « {requete} »</div>
              <div className="gsearch-suggestions">
                <button className="btn btn-sm btn-ghost" onClick={() => { props.onNavigate("qse"); setOuverte(false); }}>Voir les lots</button>
                <button className="btn btn-sm btn-ghost" onClick={() => { props.onNavigate("chantiers"); setOuverte(false); }}>Voir les chantiers</button>
              </div>
            </div>
          )}
          {resLots.length > 0 && (
            <div className="gsearch-groupe">
              <div className="gsearch-groupe-titre">Lots</div>
              {resLots.map(function (l) {
                return (
                  <div key={l.numeroLot} className="gsearch-item" onClick={() => ouvrir({ type: "lot", id: l.numeroLot, label: l.numeroLot, subtitle: getProduit(l.type).nom })}>
                    <div className="gsearch-item-titre">🏷️ {l.numeroLot}</div>
                    <div className="gsearch-item-sub">{getProduit(l.type).nom} · {(l.quantite || 0).toLocaleString()} u</div>
                  </div>
                );
              })}
            </div>
          )}
          {resPalettes.length > 0 && (
            <div className="gsearch-groupe">
              <div className="gsearch-groupe-titre">Palettes</div>
              {resPalettes.map(function (p) {
                return (
                  <div key={p.paletteId} className="gsearch-item" onClick={() => ouvrir({ type: "palette", id: p.paletteId, label: p.paletteId, subtitle: "Lot " + p.numeroLot })}>
                    <div className="gsearch-item-titre">📦 {p.paletteId}</div>
                    <div className="gsearch-item-sub">Lot {p.numeroLot} · {getProduit(p.typeBTC).nom} · {(p.disponibleCache || 0).toLocaleString()} u dispo.</div>
                  </div>
                );
              })}
            </div>
          )}
          {resChantiers.length > 0 && (
            <div className="gsearch-groupe">
              <div className="gsearch-groupe-titre">Chantiers</div>
              {resChantiers.map(function (ch) {
                return (
                  <div key={ch.id} className="gsearch-item" onClick={() => ouvrir({ type: "chantier", id: ch.id, label: ch.nom, subtitle: "Client : " + (ch.client || "-") })}>
                    <div className="gsearch-item-titre">🏗️ {ch.nom}</div>
                    <div className="gsearch-item-sub">Client : {ch.client || "-"}</div>
                  </div>
                );
              })}
            </div>
          )}
          {resCommandes.length > 0 && (
            <div className="gsearch-groupe">
              <div className="gsearch-groupe-titre">Commandes</div>
              {resCommandes.map(function (c) {
                return (
                  <div key={c.id} className="gsearch-item" onClick={() => ouvrir({ type: "commande", id: c.id, label: c.numBC || "(sans n°)", subtitle: c.chantierNom || c.client || "-" })}>
                    <div className="gsearch-item-titre">📋 {c.numBC || "(sans n°)"}</div>
                    <div className="gsearch-item-sub">{c.chantierNom || c.client || "-"} · {(c.quantite || 0).toLocaleString()} u demandé{(c.quantiteReservee || 0) > 0 ? (" · " + c.quantiteReservee.toLocaleString() + " réservé") : ""}{(c.quantiteLivree || 0) > 0 ? (" · " + c.quantiteLivree.toLocaleString() + " livré") : ""} · reste {Math.max(0, (c.quantite || 0) - (c.quantiteLivree || 0)).toLocaleString()}</div>
                  </div>
                );
              })}
            </div>
          )}
          {resNC.length > 0 && (
            <div className="gsearch-groupe">
              <div className="gsearch-groupe-titre">Non-conformités</div>
              {resNC.map(function (nc) {
                return (
                  <div key={nc.id} className="gsearch-item" onClick={() => ouvrir({ type: "nc", id: nc.id, ncData: nc, label: nc.description, subtitle: (nc.numeroLot || "lot inconnu") + " · " + nc.statut })}>
                    <div className="gsearch-item-titre">🚫 {nc.description}</div>
                    <div className="gsearch-item-sub">{nc.numeroLot || "Lot inconnu"} · {nc.statut}</div>
                  </div>
                );
              })}
            </div>
          )}
          {resProduits.length > 0 && (
            <div className="gsearch-groupe">
              <div className="gsearch-groupe-titre">Produits</div>
              {resProduits.map(function (p) {
                return (
                  <div key={p.id} className="gsearch-item" onClick={() => ouvrir({ type: "produit", id: p.id, label: p.nom, subtitle: p.dim })}>
                    <div className="gsearch-item-titre">🧱 {p.nom}</div>
                    <div className="gsearch-item-sub">{p.dim} · {p.prix.toFixed(2)} €</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// Panneau de diagnostic Phase 5 (Direction uniquement) : compare le compteur agrege existant au
// grand livre de mouvements, et permet d'initialiser le suivi par lot pour les lots anciens.
// Requetes a la demande (bouton), pas d'ecouteur permanent — c'est un outil de transition, pas un
// ecran consulte en continu (point 22).
function DiagnosticStockPhase5({ stocks, user, userData }) {
  const [ecarts, setEcarts] = React.useState(null);
  const [anomalies, setAnomalies] = React.useState(null);
  const [chargement, setChargement] = React.useState(false);
  const [msgMigration, setMsgMigration] = React.useState("");
  const [migrationEnCours, setMigrationEnCours] = React.useState(false);
  const [msgReparation, setMsgReparation] = React.useState({}); // lot -> message

  // Point 19 : donnees deja chargees une fois (pas d'ecouteur permanent), reutilisees pour le
  // tableau de reconciliation ET pour le diagnostic d'anomalies — un seul jeu de requetes ciblees.
  const calculerDiagnostic = async () => {
    setChargement(true);
    try {
      const [mvtSnap, lotsSnap, allocSnap, cmdSnap, paletteSnap, controlesSnap, ncSnap] = await Promise.all([
        db.collection("stock_mouvements").limit(3000).get(),
        db.collection("qse_lots").limit(1000).get(),
        db.collection("stock_allocations").limit(2000).get(),
        db.collection("commandes").limit(1000).get(),
        db.collection("stock_palettes").limit(2000).get(),
        db.collection("qse_controles").limit(2000).get(),
        db.collection("qse_nc").limit(2000).get()
      ]);
      const mouvements = mvtSnap.docs.map((d) => d.data());
      const lots = lotsSnap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      const allocations = allocSnap.docs.map((d) => d.data());
      const commandes = cmdSnap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      const palettes = paletteSnap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      const controles = controlesSnap.docs.map((d) => d.data());
      const ncs = ncSnap.docs.map((d) => d.data());
      const res = CATALOGUE.map((prod) => reconcilierStockType(prod.id, stocks, mouvements, lots, allocations))
        .filter((r) => r.ancien > 0 || r.calculeDepuisMouvements !== 0 || r.reserve > 0);
      setEcarts(res);
      const controlesParLot = {}; controles.forEach((c) => { if (c.numeroLot) (controlesParLot[c.numeroLot] = controlesParLot[c.numeroLot] || []).push(c); });
      const ncParLot = {}; ncs.forEach((n) => { if (n.numeroLot) (ncParLot[n.numeroLot] = ncParLot[n.numeroLot] || []).push(n); });
      const lotsBloques = lots.filter((l) => l.annule || qseStatutLot(l, controlesParLot[l.numeroLot] || [], ncParLot[l.numeroLot] || []).code === "bloque").map((l) => l.numeroLot);
      setAnomalies(diagnostiquerCoherenceStock(lots, mouvements, allocations, commandes, stocks, palettes, lotsBloques));
    } catch (e) {
      setEcarts([]); setAnomalies([]);
    } finally {
      setChargement(false);
    }
  };

  const lancerMigration = async () => {
    setMigrationEnCours(true);
    setMsgMigration("");
    try {
      const res = await initialiserDisponibleCachePourLotsExistants(user, userData);
      setMsgMigration("✅ " + res.traites + " lot(s) initialisé(s), " + res.ignores + " déjà à jour.");
    } catch (e) {
      setMsgMigration("❌ Erreur : " + e.message);
    } finally {
      setMigrationEnCours(false);
    }
  };

  // Point 20 : reparation controlee — ne touche QUE le cache, avec confirmation et tracabilite.
  const reparerCache = async (a) => {
    if (!window.confirm("Recalculer le cache du lot " + a.lot + " à " + a.attendu.toLocaleString() + " u (valeur déduite du grand livre) ?")) return;
    try {
      await reparerCacheLot(a.lot, a.attendu, user, userData);
      setMsgReparation(function (prev) { return Object.assign({}, prev, { [a.lot]: "✅ Cache recalculé." }); });
    } catch (e) {
      setMsgReparation(function (prev) { return Object.assign({}, prev, { [a.lot]: "❌ Erreur : " + e.message }); });
    }
  };

  const libellesAnomalie = {
    cache_incoherent: "Cache de disponibilité incohérent avec le grand livre",
    stock_negatif: "Stock physique négatif sur le lot",
    reservation_superieure_au_disponible: "Réservations actives supérieures au stock physique",
    mouvement_sans_allocation_correspondante: "Mouvements de livraison sans allocation correspondante",
    commande_livree_sans_mouvement: "Commande livrée sans mouvement de stock",
    commande_livraison_incoherente: "Quantité livrée de la commande incohérente avec ses allocations",
    compteur_negatif: "Compteur agrégé négatif",
    palette_lot_inexistant: "Palette liée à un lot inexistant",
    palette_type_different: "Type BTC de la palette différent de celui du lot",
    palette_quantite_negative: "Quantité disponible négative sur la palette",
    palette_disponible_sur_lot_bloque: "Palette disponible alors que le lot est bloqué",
    palettes_superieures_au_stock_lot: "Somme des palettes supérieure au stock physique du lot",
    palette_livree_sans_allocation: "Mouvement de livraison sur une palette sans allocation correspondante"
  };

  return (
    <div style={{ background: "var(--btp-card)", borderRadius: 12, padding: 16, marginTop: 20, boxShadow: "0 2px 8px rgba(0,0,0,0.08)" }}>
      <h4 style={{ marginBottom: 6, color: "var(--btp-gold)" }}>🔎 Diagnostic stock (grand livre de traçabilité par lot)</h4>
      <p style={{ fontSize: 12, color: "var(--btp-text2)", marginBottom: 12 }}>
        Outil de transition, réservé à la Direction. Un écart n'est pas forcément une anomalie : il correspond souvent au stock antérieur à l'activation du suivi par lot, jamais individuellement journalisé.
      </p>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
        <button className="btn btn-sm btn-gold" onClick={calculerDiagnostic} disabled={chargement}>{chargement ? "Calcul…" : "Calculer l'écart compteur / grand livre"}</button>
        <button className="btn btn-sm btn-ghost" onClick={lancerMigration} disabled={migrationEnCours}>{migrationEnCours ? "Initialisation…" : "Initialiser le suivi par lot (lots existants)"}</button>
      </div>
      {msgMigration && <div style={{ fontSize: 12, marginBottom: 12, color: msgMigration.indexOf("❌") >= 0 ? "#EC7063" : "#2ECC71" }}>{msgMigration}</div>}
      <p style={{ fontSize: 11, color: "var(--btp-text2)", marginBottom: 12, fontStyle: "italic" }}>
        "Initialiser le suivi par lot" fixe, pour chaque lot QSE déjà existant qui n'a pas encore de suivi précis, sa disponibilité de départ = sa quantité produite. Aucun mouvement n'a jamais pu réduire un lot avant cette fonctionnalité, donc cette valeur est fiable. Action idempotente : cliquer plusieurs fois ne modifie pas les lots déjà initialisés, et ne touche à aucune donnée de production ou de qualité.
      </p>

      {anomalies != null && (
        <div style={{ marginBottom: 16, padding: "8px 12px", borderRadius: 8, background: anomalies.length === 0 ? "rgba(46,204,113,.12)" : "rgba(243,156,18,.12)", border: "1px solid " + (anomalies.length === 0 ? "#2ecc71" : "#F39C12") }}>
          <strong>{anomalies.length === 0 ? "🟢 Santé du stock : cohérent" : ("🟠 Santé du stock : " + anomalies.length + " anomalie(s) à vérifier")}</strong>
        </div>
      )}
      {anomalies != null && anomalies.length > 0 && (
        <table className="btp-table" style={{ marginBottom: 16 }}>
          <thead><tr><th>Lot / Commande</th><th>Type d'écart</th><th>Attendu</th><th>Trouvé</th><th></th></tr></thead>
          <tbody>
            {anomalies.map(function (a, i) {
              return (
                <tr key={i}>
                  <td>{a.palette ? (a.palette + (a.lot ? (" (" + a.lot + ")") : "")) : (a.lot || a.numBC || a.typeBTC || "—")}</td>
                  <td>{libellesAnomalie[a.type] || a.type}</td>
                  <td>{a.attendu != null ? a.attendu.toLocaleString() : "—"}</td>
                  <td>{a.trouve != null ? a.trouve.toLocaleString() : "—"}</td>
                  <td>
                    {a.type === "cache_incoherent"
                      ? <button className="btn btn-sm btn-ghost" onClick={() => reparerCache(a)}>Recalculer le cache</button>
                      : <span style={{ fontSize: 11, color: "var(--btp-text2)" }}>{a.action}</span>}
                    {msgReparation[a.lot] && <div style={{ fontSize: 11, marginTop: 4, color: msgReparation[a.lot].indexOf("❌") >= 0 ? "#EC7063" : "#2ECC71" }}>{msgReparation[a.lot]}</div>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}

      {ecarts && ecarts.length === 0 && <p style={{ fontSize: 12, color: "var(--btp-text2)" }}>Aucun écart notable détecté.</p>}
      {ecarts && ecarts.length > 0 && (
        <table className="btp-table">
          <thead><tr><th>Type BTC</th><th>Physique</th><th>Traçable</th><th>Historique non traçable</th><th>Réservé</th><th>Disponible</th></tr></thead>
          <tbody>
            {ecarts.map((r) => (
              <tr key={r.type}>
                <td>{getProduit(r.type).nom}</td>
                <td>{r.physique.toLocaleString()} u</td>
                <td>{r.tracable.toLocaleString()} u</td>
                <td>{r.historiqueNonTracable.toLocaleString()} u</td>
                <td style={{ color: "#5DADE2" }}>{r.reserve.toLocaleString()} u</td>
                <td style={{ fontWeight: 700, color: "#2ecc71" }}>{r.disponible.toLocaleString()} u</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

  function exportCSV(rows, colonnes, nomFichier){
    try{
      var sep=";";
      var esc=function(val){ if(val===null||val===undefined) return ""; var sVal=String(val); if(sVal.indexOf(String.fromCharCode(34))>=0||sVal.indexOf(sep)>=0||sVal.indexOf("\n")>=0){ sVal=String.fromCharCode(34)+sVal.split(String.fromCharCode(34)).join(String.fromCharCode(34)+String.fromCharCode(34))+String.fromCharCode(34); } return sVal; };
      var entete=colonnes.map(function(c){return esc(c.titre);}).join(sep);
      var lignes=rows.map(function(r){ return colonnes.map(function(c){ var v=(typeof c.valeur==="function")?c.valeur(r):r[c.cle]; return esc(v); }).join(sep); });
      var contenu=[entete].concat(lignes).join("\r\n");
      var blob=new Blob(["\uFEFF"+contenu],{type:"text/csv;charset=utf-8;"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      var d=new Date(); var ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      a.href=url; a.download=nomFichier+"_"+ds+".csv";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
    }catch(e){ alert("Erreur export : "+e.message); }
  }

    var mdp = window.prompt("Pour confirmer, saisissez votre mot de passe administrateur :");

      setDirViderMsg("❌ Mot de passe incorrect. Suppression annulee.");
      return;
    }
    setDirViderMsg("Suppression en cours...");
    try {
      for (var col of ["productions", "commandes"]) {
        var snap = await db.collection(col).get();
        while (snap.docs.length > 0) {
          var batch = db.batch();
          var slice = snap.docs.slice(0, 400);
          slice.forEach(function(d) { batch.delete(d.ref); });
          await batch.commit();
          if (snap.docs.length <= 400) break;
          snap = await db.collection(col).get();

    } catch (e) { setDirViderMsg("❌ Erreur: " + e.message); }
  }

                      var joursRestants=Math.max(0,28-joursPasses);
                      return <div style={{marginTop:6,fontSize:11,color:joursRestants<5?'var(--btp-red)':'var(--btp-gold)'}}>

          {tabFiche==="commande"&&(

                  <textarea placeholder="Notes pour la Direction (optionnel)" value={cmdNotes} onChange={e=>setCmdNotes(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid var(--btp-border)",fontSize:14,resize:"vertical",minHeight:50,marginBottom:12}} />

          {tabFiche==="reception"&&(
            <div className="fade-in">
              <h4 style={{marginBottom:12,color:"var(--btp-blue)"}}>Confirmer la reception des BTC sur le chantier</h4>
              {cmdCh.filter(function(c){return c.status==="Livree"||(c.quantiteLivree||0)>0;}).length===0?
                <p style={{color:"var(--btp-text2)"}}>Aucune livraison a confirmer pour l'instant.</p>:
                cmdCh.filter(function(c){return (c.quantiteLivree||0)>0;}).map(function(c){
                  var livree = c.quantiteLivree||0;
                  var confirme = c.quantiteConfirmeeChef||0;
                  var aConfirmer = Math.max(0, livree - confirme);
                  return(
                    <div key={c.id} style={{background:"var(--btp-card)",borderRadius:10,padding:14,marginBottom:10,border:"1px solid #EEE",borderLeft:"4px solid #27AE60"}}>
                      <div style={{fontWeight:700,fontSize:14}}>{getProduit(c.type).nom}</div>
                      <div style={{fontSize:12,color:"var(--btp-text2)",marginTop:4}}>Commande: {(c.quantite||0).toLocaleString()} u | Livre par stock: <strong>{livree.toLocaleString()}</strong> u | Deja confirme: {confirme.toLocaleString()} u</div>
                      {aConfirmer > 0 ? (
                        <div style={{marginTop:10,padding:"10px 14px",background:"#EAFAF1",borderRadius:8}}>
                          <div style={{fontSize:13,color:"#1E8449",fontWeight:600,marginBottom:8}}>A confirmer: {aConfirmer.toLocaleString()} u</div>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
                            <label style={{fontSize:12,color:"#EC7063",fontWeight:700}}>⚠️ BTC non conformes :</label>
                            <input type="number" min="0" placeholder="0" value={qteNonConformeInput[c.id]||""} onChange={e=>{var v={...qteNonConformeInput};v[c.id]=e.target.value;setQteNonConformeInput(v);}} style={{width:80,padding:"4px 8px",border:"2px solid #C0392B",borderRadius:6,fontSize:13,textAlign:"center"}} />
                            <span style={{fontSize:11,color:"var(--btp-text2)"}}>(laisser vide si aucun)</span>
                          </div>
                          {(parseInt(qteNonConformeInput[c.id])||0)>0&&<div style={{fontSize:11,color:"#EC7063",marginBottom:6,background:"#FDEBD0",padding:"4px 8px",borderRadius:6}}>⚠️ {parseInt(qteNonConformeInput[c.id])} BTC non conformes signalés pour ristourne.</div>}
                          <button onClick={()=>validerReception(c.id,aConfirmer,qteNonConformeInput[c.id]||0)} style={{padding:"8px 16px",background:"#27AE60",color:"white",border:"none",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13}}>✅ Confirmer la réception</button>
                        </div>
                      ):(
                        <div style={{marginTop:8,fontSize:12,color:"var(--btp-green)",fontWeight:600}}>✅ Reception confirmee</div>
                      )}
                    </div>
                  );
                })
              }
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function FicheChantierDirection({ chantier, commandes, onClose, onOuvrirLot, user, userData }) {
  const [tabFiche, setTabFiche] = useState("suivi");
  const [lotsUtilises, setLotsUtilises] = React.useState(null); // null = pas encore charge
  const [paletteOuverte, setPaletteOuverte] = React.useState(null); // Phase 7 (point 28)

  React.useEffect(() => {
    let annule = false;
    db.collection("stock_allocations").where("chantierId", "==", chantier.id).get().then(function (snap) {
      if (!annule) setLotsUtilises(snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
    }).catch(function () { if (!annule) setLotsUtilises([]); });
    return () => { annule = true; };
  }, [chantier.id]);
  var cmdCh = commandes.filter(function(c){ return c.chantierId === chantier.id; });
  var besoins = chantier.besoins || {};
  var typesChantier = CATALOGUE.filter(function(p){ return (besoins[p.id]||0) > 0; });

  // Lignes financières : uniquement sur les BTC réellement livrés et confirmés
  var lignesFinancieres = typesChantier.map(function(prod) {
    var besoin = besoins[prod.id] || 0;
    var cmdsProd = cmdCh.filter(function(c){ return c.type===prod.id; });
    var cmdTotal = cmdsProd.reduce(function(a,c){ return a+(c.quantite||0); }, 0);
    var livre = cmdsProd.reduce(function(a,c){ return a+(c.quantiteLivree||0); }, 0);
    var confirme = cmdsProd.reduce(function(a,c){ return a+(c.quantiteConfirmeeChef||0); }, 0);
    var reste = Math.max(0, besoin - livre);
    var montantLivre = livre * prod.prix;
    var montantBesoin = besoin * prod.prix;
    return { prod:prod, besoin:besoin, cmdTotal:cmdTotal, livre:livre, confirme:confirme, reste:reste, montantLivre:montantLivre, montantBesoin:montantBesoin };
  });

  var totalBesoin = lignesFinancieres.reduce(function(a,l){return a+l.besoin;},0);
  var totalCmde = lignesFinancieres.reduce(function(a,l){return a+l.cmdTotal;},0);
  var totalLivre = lignesFinancieres.reduce(function(a,l){return a+l.livre;},0);
  var totalMontantLivre = lignesFinancieres.reduce(function(a,l){return a+l.montantLivre;},0);
  var totalMontantBesoin = lignesFinancieres.reduce(function(a,l){return a+l.montantBesoin;},0);
  var totalReste = lignesFinancieres.reduce(function(a,l){return a+l.reste;},0);
  var pctGlobal = totalBesoin>0?Math.min(100,Math.round(totalLivre/totalBesoin*100)):0;

  var ts = function(t) { return { padding:"7px 14px", border:"none", cursor:"pointer", borderRadius:8, marginRight:6,
    background:tabFiche===t?"#8B1A10":"#F5E6D3", color:tabFiche===t?"white":"#2C1810", fontWeight:tabFiche===t?700:500, fontSize:13 }; };

  return (
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.55)",zIndex:1000,overflowY:"auto",padding:16}}>
      <div style={{background:"var(--btp-card)",borderRadius:16,maxWidth:780,margin:"0 auto",boxShadow:"0 8px 40px rgba(0,0,0,0.3)"}}>
        <div style={{background:"linear-gradient(90deg,#8B1A10,#C0392B)",color:"white",padding:"16px 20px",borderRadius:"16px 16px 0 0"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
            <div>
              <h2 style={{marginBottom:4,fontSize:18}}>{chantier.nom}</h2>
              <div style={{fontSize:13,opacity:.9}}>Client: <strong>{chantier.client}</strong> | Chef: {chantier.chefNom||"-"}</div>
              {chantier.adresse&&<div style={{fontSize:12,opacity:.8,marginTop:2}}>{chantier.adresse}</div>}
            </div>
            <button onClick={onClose} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"white",padding:"6px 14px",borderRadius:8,cursor:"pointer",fontWeight:700}}>✕ Fermer</button>
          </div>
          <div style={{display:"flex",gap:16,marginTop:12,flexWrap:"wrap"}}>
            <div style={{background:"rgba(255,255,255,0.15)",borderRadius:10,padding:"8px 16px",textAlign:"center"}}>
              <div style={{fontSize:11,opacity:.8}}>Avancement</div>
              <div style={{fontSize:20,fontWeight:700}}>{pctGlobal}%</div>
            </div>
            <div style={{background:"rgba(255,255,255,0.15)",borderRadius:10,padding:"8px 16px",textAlign:"center"}}>
              <div style={{fontSize:11,opacity:.8}}>Livre</div>
              <div style={{fontSize:18,fontWeight:700}}>{totalLivre.toLocaleString()} u</div>
            </div>
            <div style={{background:"rgba(255,255,255,0.15)",borderRadius:10,padding:"8px 16px",textAlign:"center"}}>
              <div style={{fontSize:11,opacity:.8}}>Montant livre</div>
              <div style={{fontSize:18,fontWeight:700}}>{totalMontantLivre.toLocaleString("fr-FR",{minimumFractionDigits:2})} EUR</div>
            </div>
            <div style={{background:"rgba(255,255,255,0.15)",borderRadius:10,padding:"8px 16px",textAlign:"center"}}>
              <div style={{fontSize:11,opacity:.8}}>Montant total chantier</div>
              <div style={{fontSize:18,fontWeight:700}}>{totalMontantBesoin.toLocaleString("fr-FR",{minimumFractionDigits:2})} EUR</div>

                    </tr></thead>
                    <tbody>{lignesFinancieres.map(function(l,i){
                      var pct=l.besoin>0?Math.min(100,Math.round(l.livre/l.besoin*100)):0;

                          <td style={{padding:"8px 10px"}}><div style={{fontWeight:600}}>{l.prod.nom}</div><div style={{fontSize:11,color:"#BDC3C7"}}>{l.prod.dim}</div></td>
                          <td style={{padding:"8px 10px",textAlign:"right"}}>{l.besoin.toLocaleString()}</td>
                          <td style={{padding:"8px 10px",textAlign:"right",color:"var(--btp-blue)"}}>{l.cmdTotal.toLocaleString()}</td>
                          <td style={{padding:"8px 10px",textAlign:"right"}}>
                            <div>{l.livre.toLocaleString()}</div>
                            <div style={{background:"#EEE",borderRadius:3,height:4,marginTop:3,minWidth:50}}>
                              <div style={{height:4,borderRadius:3,background:pct===100?"#27AE60":"#C0392B",width:pct+"%"}}></div>
                            </div>
                          </td>
                          <td style={{padding:"8px 10px",textAlign:"right",color:l.confirme>=l.livre?"#2ECC71":"#F39C12"}}>{l.confirme.toLocaleString()}</td>
                          <td style={{padding:"8px 10px",textAlign:"right",fontWeight:700,color:l.reste===0?"#2ECC71":"#EC7063"}}>{l.reste.toLocaleString()}</td>
                        </tr>
                      );
                    })}</tbody>
                    <tfoot><tr style={{background:"var(--btp-steel)",fontWeight:700}}>
                      <td style={{padding:"8px 10px"}}>TOTAL</td>
                      <td style={{padding:"8px 10px",textAlign:"right"}}>{totalBesoin.toLocaleString()}</td>
                      <td style={{padding:"8px 10px",textAlign:"right",color:"var(--btp-blue)"}}>{totalCmde.toLocaleString()}</td>
                      <td style={{padding:"8px 10px",textAlign:"right"}}>{totalLivre.toLocaleString()}</td>
                      <td style={{padding:"8px 10px",textAlign:"right"}}></td>
                      <td style={{padding:"8px 10px",textAlign:"right",color:"#EC7063"}}>{totalReste.toLocaleString()}</td>

                {(function(){
                  var lignesFact = [];
                  cmdCh.forEach(function(cmd) {
                    var confirme = cmd.quantiteConfirmeeChef || 0;

                    var prod = getProduit(cmd.type);
                    var montant = confirme * prod.prix;
                    var dateStr = cmd.valideAt && cmd.valideAt.toDate ? cmd.valideAt.toDate().toLocaleDateString("fr-FR") : (cmd.timestamp && cmd.timestamp.toDate ? cmd.timestamp.toDate().toLocaleDateString("fr-FR") : "-");
                    lignesFact.push({ cmd:cmd, prod:prod, confirme:confirme, montant:montant, dateStr:dateStr });

                                  <td style={{padding:"8px 10px",textAlign:"right",fontWeight:700,color:"var(--btp-orange)"}}>{l.montant.toLocaleString("fr-FR",{minimumFractionDigits:2})} EUR</td>
                                  <td style={{padding:"8px 10px",textAlign:"right",color:"#EC7063",fontWeight:700}}>{(l.cmd.qteNonConforme||0).toLocaleString()} u</td>
                                  <td style={{padding:"8px 10px",textAlign:"right",color:"#F39C12",fontWeight:700}}>-{((l.cmd.qteNonConforme||0)*l.prod.prix).toLocaleString("fr-FR",{minimumFractionDigits:2})} EUR</td>
                                  <td style={{padding:"8px 10px",textAlign:"right",color:"var(--btp-green)",fontWeight:700}}>{(l.montant-((l.cmd.qteNonConforme||0)*l.prod.prix)).toLocaleString("fr-FR",{minimumFractionDigits:2})} EUR</td>
                                </tr>

                            <tr style={{background:"#8B1A10",color:"white",fontWeight:700,fontSize:15}}>
                              <td colSpan={6} style={{padding:"12px 10px",textAlign:"right",letterSpacing:1}}>TOTAL GENERAL A FACTURER</td>
                              <td style={{padding:"12px 10px",textAlign:"right",fontSize:15}}>{totalGeneral.toLocaleString("fr-FR",{minimumFractionDigits:2})} EUR</td>
                              <td style={{padding:"12px 10px",textAlign:"right",fontSize:15,background:"#C0392B"}}>-{totalRistourne.toLocaleString("fr-FR",{minimumFractionDigits:2})} EUR</td>
                              <td style={{padding:"12px 10px",textAlign:"right",fontSize:15,background:"#27AE60",fontWeight:800}}>{totalNet.toLocaleString("fr-FR",{minimumFractionDigits:2})} EUR</td>

                      </div>
                      <div style={{background:"#1E2D3D",border:"1px solid #2C3E50",borderRadius:10,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>

                        </div>
                      </div>
                    </div>

                cmdCh.map(function(c,i){
                  var livree=c.quantiteLivree||0; var tot=c.quantite||0; var reste=Math.max(0,tot-livree);
                  var confirme=c.quantiteConfirmeeChef||0;

      if (pertinentes.length === 0) {

      } else {

        setMsgScan("✅ Ce " + (objet.type === "lot" ? "lot" : "palette") + " a été livré sur votre chantier (" + nomsChantiers + ") — " + total.toLocaleString() + " u.");

                    <textarea placeholder="Notes (optionnel)" value={cmdNotes} onChange={e=>setCmdNotes(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid var(--btp-border)",marginBottom:12,fontSize:14,resize:"vertical",minHeight:50}} />
                    {msgCmd&&<div style={{padding:"8px 12px",borderRadius:8,marginBottom:10,fontSize:13,background:msgCmd.includes("envoyee")?"#EBF5FB":"#FFECEC",color:msgCmd.includes("envoyee")?"#1A5276":"#C0392B"}}>{msgCmd}</div>}
                    <button onClick={passerCommande} style={{width:"100%",padding:"10px",background:"#2980B9",color:"white",border:"none",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:14}}>Envoyer la commande</button>
                  </div>
                )}
              </div>
            }
          </div>
        )}
      </div>
      {showScanChef && (
        <ModaleScanner titre="Scanner un lot reçu" onFermer={() => setShowScanChef(false)} onObjetReconnu={surObjetScanneChef} continu={false} />
      )}
    </div>
  );
}


function DashboardStock({ user, userData }) {
  const [commandes, setCommandes] = useState([]);
  const [stocks, setStocks] = useState({});
  const [qteEnvoi, setQteEnvoi] = useState({}); // par cmdId
  const [productions, setProductions] = React.useState([]);
  const [fifoParCmd, setFifoParCmd] = React.useState({}); // cmdId -> { chargement, lignes, deficit, utiliseHistorique, erreur, token }
  const [msgLivraison, setMsgLivraison] = React.useState({}); // cmdId -> message (reservation)
  const [allocationsParCmd, setAllocationsParCmd] = React.useState({}); // cmdId -> [allocation]
  const [msgAllocLivraison, setMsgAllocLivraison] = React.useState({}); // allocId -> message
  const [chantiers, setChantiers] = React.useState([]);
  const [editCmd, setEditCmd] = React.useState(null);
  const [editCmdType, setEditCmdType] = React.useState("");
  const [editCmdQte, setEditCmdQte] = React.useState("");
  const [editCmdChantierId, setEditCmdChantierId] = React.useState("");
  const [msgEditCmd, setMsgEditCmd] = React.useState("");
  // Phase 7 : inventaire par scan (points 22/23/25) et verification par scan a la preparation (points 26/27).
  const [showInventaire, setShowInventaire] = React.useState(false);
  const [scanVerifPourCmd, setScanVerifPourCmd] = React.useState(null); // cmdId en cours de verification
  const [resultatsScanCmd, setResultatsScanCmd] = React.useState({}); // cmdId -> [{texte, ok}]

  useEffect(() => {
    var u1 = db.collection("commandes").where("status","==","Validee").onSnapshot(snap => {
      setCommandes(snap.docs.map(d => Object.assign({id:d.id}, d.data())));
    });
    var u2 = db.collection("stocks").onSnapshot(snap => {
      var s = {}; snap.docs.forEach(d => { s[d.id] = d.data(); }); setStocks(s);
    });
    var u3 = db.collection("productions").orderBy("timestamp","desc").onSnapshot(snap => {
      setProductions(snap.docs.map(d=>({id:d.id,...d.data()})));
    });
    var u4 = db.collection("chantiers").onSnapshot(snap => {
      setChantiers(snap.docs.map(d => Object.assign({id:d.id}, d.data())));
    });
    return () => { u1(); u2(); u3(); u4(); };
  }, []);

  // Charge les reservations d'une commande precise (requete CIBLEE, pas d'ecouteur permanent sur
  // tout le grand livre — discipline de performance, point 34). Regenere un token de livraison
  // stable par allocation a chaque chargement, pour l'idempotence du prochain clic "Confirmer".
  const chargerAllocationsCmd = async (cmdId) => {
    var snap = await db.collection("stock_allocations").where("commandeId","==",cmdId).get();
    var allocs = snap.docs
      .map(function (d) { return Object.assign({ id: d.id, _token: d.id + "_" + Date.now() + "_" + Math.random().toString(36).slice(2), _qte: "" }, d.data()); })
      .filter(function (a) { return a.statut === "Reservee" || a.statut === "PartiellementLivree"; });
    setAllocationsParCmd(function (prev) { return Object.assign({}, prev, { [cmdId]: allocs }); });
  };

  React.useEffect(() => {
    commandes.forEach(function (cmd) {
      if ((cmd.quantiteReservee || 0) > 0 && !allocationsParCmd[cmd.id]) { chargerAllocationsCmd(cmd.id); }
    });
  }, [commandes]);

  // Calcule la proposition FIFO pour une commande des que l'utilisateur saisit une quantite (simple
  // simulation, ne reserve rien). Requetes ciblees a la demande (pas d'ecouteur permanent).
  const calculerPropositionFIFO = async (cmd, qte) => {
    setFifoParCmd(function (prev) { return Object.assign({}, prev, { [cmd.id]: { chargement: true } }); });
    try {
      var lotsEligibles = await chargerLotsDisponiblesPourType(cmd.type);
      var totalTracable = lotsEligibles.reduce(function (a, l) { return a + l.disponible; }, 0);
      var s = stocks[cmd.type] || {};
      var stockHistorique = Math.max(0, (s.sec || 0) - totalTracable - (s.historiqueReserve || 0));
      var proposition = proposerAllocationFIFO(lotsEligibles, qte, stockHistorique);
      var token = cmd.id + "_" + Date.now() + "_" + Math.random().toString(36).slice(2);
      setFifoParCmd(function (prev) { return Object.assign({}, prev, { [cmd.id]: Object.assign({ chargement: false, token: token }, proposition) }); });
    } catch (e) {
      setFifoParCmd(function (prev) { return Object.assign({}, prev, { [cmd.id]: { chargement: false, erreur: e.message } }); });
    }
  };

  const modifierLigneFIFO = (cmdId, idx, nouvelleQte) => {
    setFifoParCmd(function (prev) {
      var etat = prev[cmdId];
      if (!etat || !etat.lignes) return prev;
      var lignes = etat.lignes.slice();
      var max = lignes[idx].historique ? Infinity : lignes[idx].disponibleMax;
      var v = Math.max(0, Math.min(nouvelleQte, max != null ? max : nouvelleQte));
      lignes[idx] = Object.assign({}, lignes[idx], { quantite: v });
      var couvert = lignes.reduce(function (a, l) { return a + l.quantite; }, 0);
      return Object.assign({}, prev, { [cmdId]: Object.assign({}, etat, { lignes: lignes, couvert: couvert }) });
    });
  };

  // Etape "Réserver" (point 8) : bloque le stock sans le sortir physiquement.
  const declencherReservation = async (cmd) => {
    var etat = fifoParCmd[cmd.id];
    if (!etat || !etat.lignes || etat.lignes.length === 0) return;
    setMsgLivraison(function (prev) { return Object.assign({}, prev, { [cmd.id]: "Réservation..." }); });
    try {
      await reserverCommandeStock(cmd, etat.lignes, etat.token, user, userData);
      var newQte = Object.assign({}, qteEnvoi); delete newQte[cmd.id]; setQteEnvoi(newQte);
      var newFifo = Object.assign({}, fifoParCmd); delete newFifo[cmd.id]; setFifoParCmd(newFifo);
      setMsgLivraison(function (prev) { return Object.assign({}, prev, { [cmd.id]: "✅ Réservation enregistrée." }); });
      await chargerAllocationsCmd(cmd.id);
    } catch (e) {
      setMsgLivraison(function (prev) { return Object.assign({}, prev, { [cmd.id]: "❌ Erreur : " + e.message }); });
    }
  };

  // Etape "Confirmer livraison" (point 8/10) : sortie physique reelle, totale ou partielle, d'une
  // reservation existante.
  const livrerAlloc = async (cmdId, alloc) => {
    var reste = (alloc.quantiteReservee || 0) - (alloc.quantiteLivree || 0);
    var qte = parseInt(alloc._qte, 10);
    if (!qte || qte <= 0) qte = reste;
    if (qte > reste) qte = reste;
    setMsgAllocLivraison(function (prev) { return Object.assign({}, prev, { [alloc.id]: "Enregistrement..." }); });
    try {
      await livrerReservation(alloc, qte, alloc._token, user, userData);
      setMsgAllocLivraison(function (prev) { return Object.assign({}, prev, { [alloc.id]: "✅ Livré." }); });
      await chargerAllocationsCmd(cmdId);
    } catch (e) {
      setMsgAllocLivraison(function (prev) { return Object.assign({}, prev, { [alloc.id]: "❌ Erreur : " + e.message }); });
    }
  };

  const annulerAlloc = async (cmdId, alloc) => {
    var reste = (alloc.quantiteReservee || 0) - (alloc.quantiteLivree || 0);
    if (!window.confirm("Annuler cette réservation de " + reste.toLocaleString() + " u ? Le stock redeviendra disponible.")) return;
    try {
      await annulerReservation(alloc, null, "Annulation manuelle (Responsable Stock)", user, userData);
      await chargerAllocationsCmd(cmdId);
    } catch (e) {
      setMsgAllocLivraison(function (prev) { return Object.assign({}, prev, { [alloc.id]: "❌ Erreur : " + e.message }); });
    }
  };

  // Phase 7 (points 26/27) : verifie une palette (ou un lot) scanne au moment du chargement d'une
  // livraison, contre les reservations actives de la commande — bon type, bon lot, palette
  // disponible, lot non bloque. N'AUTOMATISE aucune livraison : c'est une aide a la verification,
  // le clic "Confirmer livraison" (deja existant) reste le geste qui declenche la sortie physique.
  const verifierPaletteScanneePourCmd = async (cmdId, objet) => {
    var allocs = allocationsParCmd[cmdId] || [];
    var resultat;
    try {
      if (objet.type === "palette") {
        var paletteSnap = await db.collection("stock_palettes").doc(objet.id).get();
        if (!paletteSnap.exists) {
          resultat = { texte: "❌ Palette " + objet.id + " introuvable", ok: false };
        } else {
          var p = paletteSnap.data();
          var lotSnap = await db.collection("qse_lots").doc(p.numeroLot).get();
          var lotBloqueVerif = lotSnap.exists && lotSnap.data().annule === true;
          var allocCorrespondante = allocs.find(function (a) { return a.paletteId === objet.id; }) ||
            allocs.find(function (a) { return !a.paletteId && a.numeroLot === p.numeroLot; });
          if (lotBloqueVerif) resultat = { texte: "🚫 Palette " + objet.id + " — lot bloqué, non utilisable pour une livraison normale", ok: false };
          else if (!allocCorrespondante) resultat = { texte: "❌ Palette " + objet.id + " (lot " + p.numeroLot + ") ne correspond à aucune réservation de cette commande", ok: false };
          else resultat = { texte: "✓ Palette " + objet.id + " (lot " + p.numeroLot + ") conforme — " + (p.disponibleCache || 0).toLocaleString() + " u disponibles", ok: true };
        }
      } else {
        var allocLot = allocs.find(function (a) { return a.numeroLot === objet.id; });
        resultat = allocLot ? { texte: "✓ Lot " + objet.id + " conforme pour cette commande", ok: true } : { texte: "❌ Lot " + objet.id + " ne correspond à aucune réservation de cette commande", ok: false };
      }
    } catch (e) {
      resultat = { texte: "❌ Erreur de vérification : " + e.message, ok: false };
    }
    setResultatsScanCmd(function (prev) {
      var liste = (prev[cmdId] || []).slice();
      liste.unshift(resultat);
      return Object.assign({}, prev, { [cmdId]: liste.slice(0, 8) });
    });
  };

  const modifierQteAllocInput = (cmdId, allocId, v) => {
    setAllocationsParCmd(function (prev) {
      var liste = (prev[cmdId] || []).map(function (a) { return a.id === allocId ? Object.assign({}, a, { _qte: v }) : a; });
      return Object.assign({}, prev, { [cmdId]: liste });
    });
  };

  const ouvrirEditCmd = (cmd) => {
    setEditCmd(cmd); setEditCmdType(cmd.type); setEditCmdQte(String(cmd.quantite || "")); setEditCmdChantierId(cmd.chantierId || ""); setMsgEditCmd("");

  // Points 12/13/32 : modifie quantite/type/chantier d'une commande deja validee. Bloque le

  };

  // Point 12 : libere explicitement l'exces de reservation apres une reduction de commande.
  const reajusterExces = async (cmd) => {
    try {

              {CATALOGUE.map(function (p) { return <option key={p.id} value={p.id}>{p.nom}</option>; })}

              <div style={{ fontSize: 12, color: "#F1948A", marginBottom: 10 }}>⚠️ Cette commande a déjà des réservations/livraisons en {getProduit(editCmd.type).nom} : le changement de type sera refusé tant qu'elles ne sont pas annulées.</div>
            )}

              <option value="">{editCmd.chantierNom || "—"}</option>

                {reserveExces > 0 && (
                  <div style={{marginBottom:12,padding:"8px 12px",background:"#FFF3CD",border:"1px solid #F39C12",borderRadius:8,fontSize:12,color:"#7D5A00",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                    <span>⚠️ {reserveExces.toLocaleString()} unités sont réservées en excès sur cette commande (quantité réduite).</span>
                    <button className="btn btn-sm" style={{background:"#F39C12",color:"white"}} onClick={()=>reajusterExces(cmd)}>Réajuster la réservation</button>
                  </div>
                )}

                {allocs.length > 0 && (
                  <div style={{marginBottom:14,background:"var(--btp-card2)",borderRadius:8,padding:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:8}}>
                      <div style={{fontSize:12,fontWeight:700,color:"var(--btp-text2)",textTransform:"uppercase",letterSpacing:".5px"}}>Réservations actives ({allocs.length})</div>
                      <button className="btn btn-sm btn-ghost" onClick={()=>setScanVerifPourCmd(cmd.id)}>📷 Vérifier une palette chargée</button>
                    </div>
                    {(resultatsScanCmd[cmd.id]||[]).length > 0 && (
                      <div style={{marginBottom:8,fontSize:12}}>
                        {resultatsScanCmd[cmd.id].map(function(r,i){ return <div key={i} style={{color:r.ok?"#2ECC71":"#EC7063"}}>{r.texte}</div>; })}
                      </div>
                    )}
                    {allocs.map(function(a){
                      var resteAlloc = (a.quantiteReservee||0)-(a.quantiteLivree||0);
                      return (
                        <div key={a.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,fontSize:13,flexWrap:"wrap"}}>
                          <span style={{flex:1,minWidth:180}}>{a.numeroLot ? ("🏷️ "+a.numeroLot) : "📦 Stock historique non traçable"} — réservé {(a.quantiteReservee||0).toLocaleString()} u{(a.quantiteLivree||0)>0?(", livré "+a.quantiteLivree.toLocaleString()+" u"):""}, reliquat <strong>{resteAlloc.toLocaleString()} u</strong></span>
                          <input type="number" min="1" max={resteAlloc} placeholder={String(resteAlloc)} value={a._qte}
                            onChange={e=>modifierQteAllocInput(cmd.id, a.id, e.target.value)}
