async function qseRecupererProductionDuLot(lot) {
  if (!lot || !lot.productionId) return null;
  const snap = await db.collection("productions").doc(lot.productionId).get();
  return snap.exists ? Object.assign({ id: snap.id }, snap.data()) : null;
}

// ===================== FICHE LOT 360° =====================
// Statut deduit uniquement des donnees factuelles (jamais d'un champ "statut" saisi a la main).
// Ordre de priorite, documente pour rester facile a maintenir:
//   1) une non-conformite non cloturee sur le lot            -> Bloque
//   2) au moins un controle reellement effectue (pas "Non mesure"):
//        - un resultat "Non conforme"                        -> Non conforme (a traiter)
//        - sinon un resultat "Conforme"                       -> Conforme
//   3) aucun controle effectue:
//        - duree de sechage (DUREE_SECHAGE) pas encore ecoulee -> En sechage
//        - duree ecoulee                                       -> Pret a controler
function qseStatutLot(lot, controles, ncs) {
  var ncOuvertes = (ncs || []).filter(function (nc) { return nc.statut !== "Cloturee"; });
  if (ncOuvertes.length > 0) {
    return { code: "bloque", label: "Bloqué — non-conformité ouverte", classe: "fichelot-statut-bloque", icone: "🔴" };
  }
  var controlesEffectues = (controles || []).filter(function (c) { return c.resultat && c.resultat !== "Non mesuré"; });
  var aNonConforme = controlesEffectues.some(function (c) { return c.resultat === "Non conforme"; });
  var aConforme = controlesEffectues.some(function (c) { return c.resultat === "Conforme"; });
  if (aNonConforme) {
    return { code: "non_conforme", label: "Non conforme — à traiter", classe: "fichelot-statut-non_conforme", icone: "🟠" };
  }
  if (aConforme) {
    return { code: "conforme", label: "Conforme", classe: "fichelot-statut-conforme", icone: "🟢" };
  }
  var restant = joursRestants(lot);
  if (restant > 0) {
    return { code: "sechage", label: "En séchage — " + restant + " j restant" + (restant > 1 ? "s" : ""), classe: "fichelot-statut-sechage", icone: "🟠" };
  }
  return { code: "pret_controle", label: "Prêt à contrôler", classe: "fichelot-statut-pret_controle", icone: "🔵" };
}

// Signale des incoherences entre donnees existantes. Ne corrige jamais rien silencieusement.
function qseAnomaliesLot(lot, production, controles, ncs) {
  var out = [];
  if (!lot) return out;
  if (lot.quantite == null || lot.quantite <= 0) {
    out.push("Quantité du lot nulle ou négative (" + lot.quantite + ").");
  }
  if (lot.productionId && !production) {
    out.push("La production d'origine de ce lot est introuvable (peut-être supprimée depuis).");
  }
  if (production && lot.type && production.type && production.type !== lot.type) {
    out.push("Type BTC incohérent entre la production (" + production.type + ") et le lot QSE (" + lot.type + ").");
  }
  var ncOuvertes = (ncs || []).filter(function (nc) { return nc.statut !== "Cloturee"; });
  var aConforme = (controles || []).some(function (c) { return c.resultat === "Conforme"; });
  if (ncOuvertes.length > 0 && aConforme) {
    out.push("Une non-conformité est encore ouverte alors qu'un contrôle \"Conforme\" a été enregistré sur ce lot.");
  }
  var dateLotMs = qseTsMs(lot.dateCreation) || dateProductionMs(lot);
  (controles || []).forEach(function (c) {
    var dc = qseTsMs(c.dateControle);
    if (dc && dateLotMs && dc < dateLotMs) {
      out.push("Un contrôle est daté avant la création du lot (donnée à vérifier).");
    }
  });
  return out;
}

// Fiche 360 d'un lot : centralise tout ce qui le concerne (production, controles, NC, origines,
// stock/commandes du meme type). Auto-suffisante: n'a besoin que du numero de lot pour s'ouvrir,
// donc reutilisable telle quelle depuis QSE, la Production ou n'importe quel futur ecran (recherche
// globale en Phase 3 notamment).
function FicheLot(props) {
  const numeroLot = props.numeroLot;
  const user = props.user;
  const userData = props.userData;
  const onClose = props.onClose;
  const onDeclarerNC = props.onDeclarerNC; // optionnel: fourni uniquement depuis le contexte QSE

  const [lot, setLot] = React.useState(null);
  const [production, setProduction] = React.useState(null);
  const [controles, setControles] = React.useState([]);
  const [ncs, setNcs] = React.useState([]);
  const [origines, setOrigines] = React.useState([]);
  const [commandesType, setCommandesType] = React.useState([]);
  const [stockType, setStockType] = React.useState(null);
  const [mouvements, setMouvements] = React.useState([]);
  const [allocations, setAllocations] = React.useState([]);
  const [charge, setCharge] = React.useState(true);
  const [erreur, setErreur] = React.useState("");
  const [msgAction, setMsgAction] = React.useState("");
  const [formPerte, setFormPerte] = React.useState(null); // { quantite, motif } quand ouvert
  // Phase 7 : palettes du lot, QR/etiquette, creation de palettes, ouverture imbriquee d'une fiche palette.
  const [palettes, setPalettes] = React.useState([]);
  const [showQR, setShowQR] = React.useState(false);
  const [paletteOuverte, setPaletteOuverte] = React.useState(null);
  const [formCreerPalettes, setFormCreerPalettes] = React.useState(null); // { capacite, repartition, token, envoi, erreur }
  const [nouvellesPalettesCreees, setNouvellesPalettesCreees] = React.useState(null); // pour impression en lot juste apres creation

  const rechargerPalettes = React.useCallback(async () => {
    try { setPalettes(await chargerPalettesDuLot(numeroLot)); } catch (e) {}
  }, [numeroLot]);

  React.useEffect(() => {
    let annule = false;
    setCharge(true); setErreur(""); setMsgAction("");
    (async () => {
      try {
        const lotSnap = await db.collection("qse_lots").doc(numeroLot).get();
        if (!lotSnap.exists) {
          if (!annule) { setErreur("Lot introuvable : " + numeroLot); setCharge(false); }
          return;
        }
        const lotData = Object.assign({ id: lotSnap.id }, lotSnap.data());
        const [prod, controlesSnap, ncSnap, originesSnap, stockSnap, mouvementsSnap, allocationsSnap, palettesLot] = await Promise.all([
          qseRecupererProductionDuLot(lotData),
          db.collection("qse_controles").where("numeroLot", "==", numeroLot).get(),
          db.collection("qse_nc").where("numeroLot", "==", numeroLot).get(),
          db.collection("qse_origines_terre").where("numeroLot", "==", numeroLot).get(),
          db.collection("stocks").doc(lotData.type).get(),
          db.collection("stock_mouvements").where("numeroLot", "==", numeroLot).get(),
          db.collection("stock_allocations").where("numeroLot", "==", numeroLot).get(),
          chargerPalettesDuLot(numeroLot)
        ]);
        if (annule) return;
        setLot(lotData);
        setProduction(prod);
        setControles(controlesSnap.docs.map((d) => Object.assign({ id: d.id }, d.data())));
        setNcs(ncSnap.docs.map((d) => Object.assign({ id: d.id }, d.data())));
        setOrigines(originesSnap.docs.map((d) => Object.assign({ id: d.id }, d.data())));
        setStockType(stockSnap.exists ? stockSnap.data() : null);
        setMouvements(mouvementsSnap.docs.map((d) => Object.assign({ id: d.id }, d.data())));
        setAllocations(allocationsSnap.docs.map((d) => Object.assign({ id: d.id, _annulToken: d.id + "_" + Date.now() + "_" + Math.random().toString(36).slice(2) }, d.data())));
        setPalettes(palettesLot);
        const cmdSnap = await db.collection("commandes").where("type", "==", lotData.type).get();
        if (!annule) setCommandesType(cmdSnap.docs.map((d) => Object.assign({ id: d.id }, d.data())));
      } catch (e) {
        if (!annule) setErreur("Erreur de chargement : " + e.message);
      } finally {
        if (!annule) setCharge(false);
      }
    })();
    return () => { annule = true; };
  }, [numeroLot]);

  if (charge) {
    return (
      <div className="btp-modal-overlay" onClick={onClose}>
        <div className="btp-modal" style={{ maxWidth: 260 }} onClick={(e) => e.stopPropagation()}>Chargement du lot…</div>
      </div>
    );
  }

  if (erreur || !lot) {
    return (
      <div className="btp-modal-overlay" onClick={onClose}>
        <div className="btp-modal" onClick={(e) => e.stopPropagation()}>
          <div className="btp-alert alert-error">⚠️ {erreur || "Lot introuvable."}</div>
          <button className="btn btn-ghost btn-full" onClick={onClose}>Fermer</button>
        </div>
      </div>
    );
  }

  const statut = qseStatutLot(lot, controles, ncs);
  const anomalies = qseAnomaliesLot(lot, production, controles, ncs);
  const produit = getProduit(lot.type);
  const ageJours = (function () { var ms = dateProductionMs(lot); return ms ? Math.floor((Date.now() - ms) / MS_PAR_JOUR) : null; })();
  const dateFinSechageMs = (function () { var ms = dateProductionMs(lot); return ms ? ms + DUREE_SECHAGE * MS_PAR_JOUR : null; })();
  const valeurLot = (lot.quantite || 0) * produit.prix;
  const ncOuvertes = ncs.filter(function (nc) { return nc.statut !== "Cloturee"; });
  const controleATraiter = controles.find(function (c) { return !c.resultat || c.resultat === "Non mesuré"; });

  // Phase 5 : si ce lot a ete cree (ou migre) avec le grand livre, sa disponibilite est reelle et
  // auditable (calculerStockLot). Sinon (lot anterieur, jamais initialise), on retombe sur
  // l'ancienne estimation via les NC — jamais de fausse precision affichee comme certaine.
  const tracable = lot.disponibleCache != null;
  const stockLot = tracable ? calculerStockLot(numeroLot, mouvements) : null;
  const pertesDocumenteesNC = ncs.reduce(function (a, nc) { return a + (nc.quantiteConcernee || 0); }, 0);
  const quantiteEstimeeRestante = Math.max(0, (lot.quantite || 0) - pertesDocumenteesNC);
  // Phase 6 (point 21) : "physique restant" (grand livre) et "disponible a reserver" (cache) sont
  // deux notions distinctes des lors qu'une reservation existe — jamais confondues a l'affichage.
  const reserveLot = tracable ? allocations.filter(function (a) { return a.statut === "Reservee" || a.statut === "PartiellementLivree"; }).reduce(function (a, al) { return a + Math.max(0, (al.quantiteReservee || 0) - (al.quantiteLivree || 0)); }, 0) : 0;
  const disponibleAReserver = tracable ? (lot.disponibleCache != null ? lot.disponibleCache : 0) : 0;

  const marquerControle = async (resultat) => {
    if (!controleATraiter) return;
    const auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
    await db.collection("qse_controles").doc(controleATraiter.id).update({
      resultat: resultat, controleur: auteur, dateControle: firebase.firestore.FieldValue.serverTimestamp()
    });
    setControles(function (prev) { return prev.map(function (c) { return c.id === controleATraiter.id ? Object.assign({}, c, { resultat: resultat, controleur: auteur, dateControle: { _ms: Date.now() } }) : c; }); });
    setMsgAction("Contrôle enregistré : " + resultat);
  };

  const declarerNC = () => {
    if (onDeclarerNC) { onDeclarerNC(lot.numeroLot); }
    else { setMsgAction("Ouvrez QSE > Non-conformités et saisissez le lot " + lot.numeroLot + " (autocomplétion disponible)."); }
  };

  const soumettrePerte = async () => {
    if (!formPerte || formPerte.envoi) return;
    var qte = parseInt(formPerte.quantite, 10);
    if (!qte || qte <= 0) { setFormPerte(Object.assign({}, formPerte, { erreur: "Quantité invalide." })); return; }
    setFormPerte(Object.assign({}, formPerte, { envoi: true, erreur: "" }));
    try {
      await declarerPerteLot(lot.numeroLot, lot.type, qte, formPerte.motif || "", formPerte.token, user, userData);
      const [mvtSnap, lotSnap2] = await Promise.all([
        db.collection("stock_mouvements").where("numeroLot", "==", numeroLot).get(),
        db.collection("qse_lots").doc(numeroLot).get()
      ]);
      setMouvements(mvtSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
      if (lotSnap2.exists) setLot(Object.assign({ id: lotSnap2.id }, lotSnap2.data()));
      setFormPerte(null);
      setMsgAction("Perte de " + qte + " u enregistrée.");
    } catch (e) {
      setFormPerte(Object.assign({}, formPerte, { envoi: false, erreur: e.message }));
    }
  };

  const annulerAllocation = async (alloc) => {
    var resteNonLivre = (alloc.quantiteReservee || 0) - (alloc.quantiteLivree || 0);
    var dejaLivre = alloc.quantiteLivree || 0;
    var msg = "Annuler cette affectation (" + (alloc.quantiteReservee || 0).toLocaleString() + " u) ?";
    if (dejaLivre > 0) { msg += " La partie déjà livrée (" + dejaLivre.toLocaleString() + " u) sera également annulée (retour physique en stock)."; }
    if (!window.confirm(msg)) return;
    try {
      if (resteNonLivre > 0) { await annulerReservation(alloc, null, "Annulation depuis la fiche du lot", user, userData); }
      if (dejaLivre > 0) { await annulerLivraisonPhysique(alloc, dejaLivre, alloc._annulToken, user, userData); }
      const [allocSnap2, mvtSnap2, lotSnap3] = await Promise.all([
        db.collection("stock_allocations").where("numeroLot", "==", numeroLot).get(),
        db.collection("stock_mouvements").where("numeroLot", "==", numeroLot).get(),
        db.collection("qse_lots").doc(numeroLot).get()
      ]);
      setAllocations(allocSnap2.docs.map(function (d) { return Object.assign({ id: d.id, _annulToken: d.id + "_" + Date.now() + "_" + Math.random().toString(36).slice(2) }, d.data()); }));
      setMouvements(mvtSnap2.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
      if (lotSnap3.exists) setLot(Object.assign({ id: lotSnap3.id }, lotSnap3.data()));
      setMsgAction("Affectation annulée, stock restitué.");
    } catch (e) {
      setMsgAction("Erreur : " + e.message);
    }
  };

  // Phase 7 (point 6) : ouvre le formulaire de creation de palettes avec une proposition automatique
  // (capacite standard 250, ajustable) — l'utilisateur n'a jamais a ressaisir quatre fois la meme info.
  const ouvrirCreerPalettes = () => {
    var capaciteParDefaut = 250;
    setFormCreerPalettes({
      capacite: String(capaciteParDefaut),
      repartition: proposerRepartitionPalettes(disponibleAReserver, capaciteParDefaut),
      token: numeroLot + "_pal_" + Date.now() + "_" + Math.random().toString(36).slice(2),
      envoi: false, erreur: ""
    });
  };
  const recalculerPropositionPalettes = (capacite) => {
    setFormCreerPalettes(function (prev) {
      if (!prev) return prev;
      return Object.assign({}, prev, { capacite: capacite, repartition: proposerRepartitionPalettes(disponibleAReserver, parseInt(capacite, 10) || 0) });
    });
  };
  const modifierLignePalette = (idx, valeur) => {
    setFormCreerPalettes(function (prev) {
      if (!prev) return prev;
      var r = prev.repartition.slice();
      r[idx] = Math.max(0, parseInt(valeur, 10) || 0);
      return Object.assign({}, prev, { repartition: r });
    });
  };
  const confirmerCreerPalettes = async () => {
    if (!formCreerPalettes || formCreerPalettes.envoi) return;
    var total = formCreerPalettes.repartition.reduce(function (a, q) { return a + q; }, 0);
    if (total <= 0 || total > disponibleAReserver) {
      setFormCreerPalettes(Object.assign({}, formCreerPalettes, { erreur: "La répartition doit couvrir entre 1 et " + disponibleAReserver.toLocaleString() + " u (disponible à réserver)." }));
      return;
    }
    setFormCreerPalettes(Object.assign({}, formCreerPalettes, { envoi: true, erreur: "" }));
    try {
      var ids = await creerPalettesPourLot(lot, formCreerPalettes.repartition, formCreerPalettes.token, user, userData);
      await rechargerPalettes();
      var lotSnapFrais = await db.collection("qse_lots").doc(numeroLot).get();
      if (lotSnapFrais.exists) setLot(Object.assign({ id: lotSnapFrais.id }, lotSnapFrais.data()));
      setNouvellesPalettesCreees(ids);
      setFormCreerPalettes(null);
      setMsgAction(ids.length + " palette(s) créée(s).");
    } catch (e) {
      setFormCreerPalettes(Object.assign({}, formCreerPalettes, { envoi: false, erreur: e.message }));
    }
  };

  return (
    <div className="btp-modal-overlay" onClick={onClose}>
      <div className="btp-modal" style={{ maxWidth: 820, maxHeight: "88vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
        <div className="fichelot-header">
          <div>
            <div className="btp-modal-title" style={{ marginBottom: 4 }}>🏷️ Lot {lot.numeroLot}</div>
            <div style={{ fontSize: 13, color: "var(--btp-text2)" }}>{produit.nom} <span style={{ color: "var(--btp-orange)" }}>({produit.dim})</span></div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <span className={"fichelot-statut " + statut.classe}>{statut.icone} {statut.label}</span>
            <button className="btn btn-sm btn-ghost" onClick={() => setShowQR(true)}>📱 QR / Étiquette</button>
            {tracable && disponibleAReserver > 0 && (
              <button className="btn btn-sm btn-ghost" onClick={() => setFormPerte({ quantite: "", motif: "", token: numeroLot + "_" + Date.now() + "_" + Math.random().toString(36).slice(2) })}>📉 Déclarer une perte</button>
            )}
            <button className="btn btn-sm btn-ghost" onClick={onClose}>✕ Fermer</button>
          </div>
        </div>

        {formPerte && (
          <div className="fichelot-action" style={{ borderLeftColor: "var(--btp-red)", flexDirection: "column", alignItems: "stretch" }}>
            <strong style={{ marginBottom: 6 }}>📉 Déclarer une perte sur ce lot (max {disponibleAReserver.toLocaleString()} u disponibles à réserver)</strong>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
              <div>
                <label className="btp-label">Quantité perdue</label>
                <input type="number" min="1" max={disponibleAReserver} className="btp-input" style={{ width: 120 }}
                  value={formPerte.quantite} onChange={(e) => setFormPerte(Object.assign({}, formPerte, { quantite: e.target.value }))} />
              </div>
              <div style={{ flex: 1, minWidth: 180 }}>
                <label className="btp-label">Motif</label>
                <input className="btp-input" placeholder="Ex: casse au déchargement" value={formPerte.motif} onChange={(e) => setFormPerte(Object.assign({}, formPerte, { motif: e.target.value }))} />
              </div>
              <button className="btn btn-sm btn-danger" onClick={soumettrePerte} disabled={formPerte.envoi}>{formPerte.envoi ? "Enregistrement…" : "Confirmer la perte"}</button>
              <button className="btn btn-sm btn-ghost" onClick={() => setFormPerte(null)}>Annuler</button>
            </div>
            {formPerte.erreur && <div style={{ color: "#F1948A", fontSize: 12, marginTop: 6 }}>⚠️ {formPerte.erreur}</div>}
          </div>
        )}

        {/* Action necessaire : une seule mise en avant, pas dix boutons en permanence */}
        <div className="fichelot-action">
          {statut.code === "sechage" && <span>⏳ Séchage en cours — aucune action requise pour l'instant.</span>}
          {statut.code === "pret_controle" && (
            <React.Fragment>
              <span>🔵 Séchage terminé : ce lot attend son contrôle qualité.</span>
              <span style={{ display: "flex", gap: 8 }}>
                <button className="btn btn-sm btn-success" onClick={() => marquerControle("Conforme")}>✅ Conforme</button>
                <button className="btn btn-sm btn-danger" onClick={() => marquerControle("Non conforme")}>❌ Non conforme</button>
              </span>
            </React.Fragment>
          )}
          {statut.code === "conforme" && <span>✅ Lot conforme — aucune action nécessaire.</span>}
          {statut.code === "non_conforme" && (
            <React.Fragment>
              <span>🟠 Contrôle non conforme, aucune NC déclarée pour l'instant.</span>
              <button className="btn btn-sm btn-primary" onClick={declarerNC}>⚠️ Déclarer une non-conformité</button>
            </React.Fragment>
          )}
          {statut.code === "bloque" && <span>🔴 {ncOuvertes.length} non-conformité(s) ouverte(s) — à traiter dans l'onglet Non-conformités.</span>}
          {msgAction && <div style={{ width: "100%", fontSize: 12, color: "var(--btp-green)", marginTop: 6 }}>{msgAction}</div>}
        </div>

        {lot.annule && (
          <div className="fichelot-anomalies">
            <h4>🚫 Production annulée le {lot.annuleAt && qseTsMs(lot.annuleAt) ? new Date(qseTsMs(lot.annuleAt)).toLocaleDateString("fr-FR") : "—"} par {lot.annulePar || "—"}</h4>
          </div>
        )}

        {anomalies.length > 0 && (
          <div className="fichelot-anomalies">
            <h4>⚠️ Incohérences détectées (signalées, rien n'a été corrigé automatiquement)</h4>
            <ul>{anomalies.map(function (a, i) { return <li key={i}>{a}</li>; })}</ul>
          </div>
        )}

        <div className="fichelot-grid">
          <div className="fichelot-fait"><div className="fichelot-fait-label">Quantité produite</div><div className="fichelot-fait-valeur">{(lot.quantite || 0).toLocaleString()} u</div></div>
          <div className="fichelot-fait"><div className="fichelot-fait-label">Date de fabrication</div><div className="fichelot-fait-valeur">{lot.date || "—"}</div></div>
          <div className="fichelot-fait"><div className="fichelot-fait-label">Âge du lot</div><div className="fichelot-fait-valeur">{ageJours != null ? (ageJours + " j") : "—"}</div></div>
          <div className="fichelot-fait"><div className="fichelot-fait-label">Fin de séchage théorique</div><div className="fichelot-fait-valeur">{dateFinSechageMs ? new Date(dateFinSechageMs).toLocaleDateString("fr-FR") : "—"}</div></div>
          <div className="fichelot-fait"><div className="fichelot-fait-label">Opérateur</div><div className="fichelot-fait-valeur">{production ? (production.responsable || "—") : "—"}</div></div>
          <div className="fichelot-fait"><div className="fichelot-fait-label">Origine de la terre</div><div className="fichelot-fait-valeur">{origines.length > 0 ? origines.map(function (o) { return o.origine; }).join(", ") : "Non renseignée"}</div></div>
          {tracable ? (
            <React.Fragment>
              <div className="fichelot-fait"><div className="fichelot-fait-label">Perdu</div><div className="fichelot-fait-valeur">{stockLot.perdu.toLocaleString()} u</div></div>
              <div className="fichelot-fait"><div className="fichelot-fait-label">Livré</div><div className="fichelot-fait-valeur">{stockLot.livre.toLocaleString()} u</div></div>
              <div className="fichelot-fait"><div className="fichelot-fait-label">Stock physique restant</div><div className="fichelot-fait-valeur">{stockLot.disponible.toLocaleString()} u</div></div>
              <div className="fichelot-fait"><div className="fichelot-fait-label">Réservé</div><div className="fichelot-fait-valeur" style={{ color: "#5DADE2" }}>{reserveLot.toLocaleString()} u</div></div>
              <div className="fichelot-fait"><div className="fichelot-fait-label">Disponible à réserver</div><div className="fichelot-fait-valeur" style={{ color: "#2ecc71" }}>{disponibleAReserver.toLocaleString()} u</div></div>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div className="fichelot-fait"><div className="fichelot-fait-label">Pertes documentées (NC)*</div><div className="fichelot-fait-valeur">{pertesDocumenteesNC.toLocaleString()} u</div></div>
              <div className="fichelot-fait"><div className="fichelot-fait-label">Quantité restante estimée*</div><div className="fichelot-fait-valeur">{quantiteEstimeeRestante.toLocaleString()} u</div></div>
            </React.Fragment>
          )}
          <div className="fichelot-fait"><div className="fichelot-fait-label">Valeur estimée du lot</div><div className="fichelot-fait-valeur">{valeurLot.toLocaleString("fr-FR", { minimumFractionDigits: 2 })} €</div></div>
        </div>
        {tracable
          ? <div className="fichelot-caveat">Quantités calculées à partir du grand livre de mouvements de stock (traçabilité par lot active pour ce lot).</div>
          : <div className="fichelot-caveat">* Lot créé avant l'activation du suivi de stock par lot — estimation basée sur les NC uniquement. Utilisez "Initialiser le suivi par lot" (Direction &gt; Inventaire) pour activer le suivi précis de ce lot.</div>}

        <div className="fichelot-section">
          <h4>Historique du lot</h4>
          <div className="fichelot-timeline">
            <div className="fichelot-tl-item tl-ok">
              <div><div className="fichelot-tl-titre">⚙️ Production</div><div className="fichelot-tl-detail">{lot.date || "—"} · {(lot.quantite || 0).toLocaleString()} u · {production ? (production.responsable || "—") : (lot.creePar || "—")}</div></div>
            </div>
            {lot.phase === "sechage" ? (
              <div className="fichelot-tl-item tl-ok">
                <div><div className="fichelot-tl-titre">⏳ Mise en séchage</div><div className="fichelot-tl-detail">Durée prévue : {DUREE_SECHAGE} jours</div></div>
              </div>
            ) : (
              <div className="fichelot-tl-item tl-pending">
                <div><div className="fichelot-tl-titre">⏳ Séchage</div><div className="fichelot-tl-detail">Enregistré directement en stock sec (pas de séchage suivi)</div></div>
              </div>
            )}
            {controles.length === 0 && (
              <div className="fichelot-tl-item tl-pending"><div><div className="fichelot-tl-titre">🔍 Contrôle qualité</div><div className="fichelot-tl-detail">Aucun contrôle enregistré</div></div></div>
            )}
            {controles.map(function (c) {
              var effectue = c.resultat && c.resultat !== "Non mesuré";
              var cls = !effectue ? "tl-pending" : (c.resultat === "Conforme" ? "tl-ok" : "tl-bad");
              return (
                <div key={c.id} className={"fichelot-tl-item " + cls}>
                  <div>
                    <div className="fichelot-tl-titre">🔍 Contrôle qualité — {effectue ? c.resultat : "en attente"}</div>
                    <div className="fichelot-tl-detail">{effectue ? ("Le " + (qseTsMs(c.dateControle) ? new Date(qseTsMs(c.dateControle)).toLocaleDateString("fr-FR") : "?") + " par " + (c.controleur || "—")) : "Contrôle créé automatiquement à la production, résultat non encore saisi"}</div>
                  </div>
                </div>
              );
            })}
            {ncs.map(function (nc) {
              var cls = nc.statut === "Cloturee" ? "tl-ok" : "tl-bad";
              return (
                <div key={nc.id} className={"fichelot-tl-item " + cls}>
                  <div>
                    <div className="fichelot-tl-titre">🚫 Non-conformité — {nc.statut}</div>
                    <div className="fichelot-tl-detail">{nc.description}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div className="fichelot-section">
          <h4>Contrôles qualité ({controles.length})</h4>
          {controles.length === 0 ? <p style={{ fontSize: 12, color: "var(--btp-text2)" }}>Aucun contrôle enregistré pour ce lot.</p> : (
            <table className="btp-table">
              <thead><tr><th>Date lot</th><th>Réalisé le</th><th>Résultat</th><th>Contrôleur</th></tr></thead>
              <tbody>
                {controles.map(function (c) {
                  return (
                    <tr key={c.id}>
                      <td>{c.date || "—"}</td>
                      <td>{qseTsMs(c.dateControle) ? new Date(qseTsMs(c.dateControle)).toLocaleDateString("fr-FR") : "—"}</td>
                      <td>{c.resultat || "Non mesuré"}</td>
                      <td>{c.controleur || "—"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>

        <div className="fichelot-section">
          <h4>Non-conformités ({ncs.length})</h4>
          {ncs.length === 0 ? <p style={{ fontSize: 12, color: "var(--btp-text2)" }}>Aucune non-conformité liée à ce lot.</p> : (
            <table className="btp-table">
              <thead><tr><th>Description</th><th>Qté concernée</th><th>Valeur estimée</th><th>Action corrective</th><th>Statut</th></tr></thead>
              <tbody>
                {ncs.map(function (nc) {
                  var valeur = nc.quantiteConcernee != null ? nc.quantiteConcernee * produit.prix : null;
                  return (
                    <tr key={nc.id}>
                      <td>{nc.description}</td>
                      <td>{nc.quantiteConcernee != null ? (nc.quantiteConcernee.toLocaleString() + " u") : "—"}</td>
                      <td>{valeur != null ? (valeur.toLocaleString("fr-FR", { minimumFractionDigits: 2 }) + " €") : "—"}</td>
                      <td>{nc.actionCorrective || "—"}</td>
                      <td>{nc.statut}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>

        <div className="fichelot-section">
          <h4>Affectations {tracable ? "(" + allocations.length + ")" : ""}</h4>
          <p style={{ fontSize: 12, color: "var(--btp-text2)" }}>
            Stock global actuel du type <strong>{produit.nom}</strong> : {stockType ? (((stockType.sec || 0) + (stockType.sechage || 0)).toLocaleString() + " u") : "0 u"}.
          </p>
          {tracable && allocations.length > 0 && (
            <table className="btp-table">
              <thead><tr><th>Chantier</th><th>Réservé</th><th>Livré</th><th>Statut</th><th></th></tr></thead>
              <tbody>
                {allocations.map(function (a) {
                  var libelles = { Reservee: "📌 Réservée", PartiellementLivree: "🚚 Partiellement livrée", Livree: "✅ Livrée", Annulee: "↩️ Annulée" };
                  return (
                    <tr key={a.id}>
                      <td>{a.chantierNom || "—"}</td>
                      <td>{(a.quantiteReservee || 0).toLocaleString()} u</td>
                      <td>{(a.quantiteLivree || 0).toLocaleString()} u</td>
                      <td>{libelles[a.statut] || a.statut}</td>
                      <td>{a.statut !== "Annulee" && <button className="btn btn-sm btn-ghost" onClick={() => annulerAllocation(a)}>Annuler</button>}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
          {tracable && allocations.length === 0 && <p style={{ fontSize: 12, color: "var(--btp-text2)" }}>Aucune livraison enregistrée pour ce lot pour l'instant.</p>}
          {!tracable && (
            <React.Fragment>
              <p className="fichelot-caveat">⚠️ Ce lot n'est pas encore suivi par le grand livre de stock : les livraisons ne sont pas individuellement rattachées à ce lot précis.</p>
              {commandesType.length > 0 && (
                <React.Fragment>
                  <p style={{ fontSize: 12, color: "var(--btp-text2)", marginTop: 8 }}>Commandes existantes pour ce type de BTC (non attribuables individuellement à ce lot) :</p>
                  <table className="btp-table">
                    <thead><tr><th>N° BC</th><th>Chantier</th><th>Quantité</th><th>Statut</th></tr></thead>
                    <tbody>
                      {commandesType.slice(0, 10).map(function (c) {
                        return (<tr key={c.id}><td>{c.numBC || "—"}</td><td>{c.chantierNom || "—"}</td><td>{(c.quantite || 0).toLocaleString()} u</td><td>{c.status || "—"}</td></tr>);
                      })}
                    </tbody>
                  </table>
                </React.Fragment>
              )}
            </React.Fragment>
          )}
        </div>

        {tracable && (
          <div className="fichelot-section">
            <h4>Palettes du lot ({palettes.length})</h4>
            <p style={{ fontSize: 12, color: "var(--btp-text2)", marginBottom: 10 }}>Subdivision physique du lot (point 31) : la quantité totale du lot reste la référence, les palettes n'en sont qu'une représentation détaillée pour le terrain.</p>
            {palettes.length === 0 && !formCreerPalettes && (
              <button className="btn btn-sm btn-primary" onClick={ouvrirCreerPalettes} disabled={disponibleAReserver <= 0}>📦 Créer des palettes</button>
            )}
            {palettes.length > 0 && (
              <React.Fragment>
                <table className="btp-table">
                  <thead><tr><th>Palette</th><th>Initiale</th><th>Disponible</th><th>Emplacement</th><th></th></tr></thead>
                  <tbody>
                    {palettes.map(function (p) {
                      return (
                        <tr key={p.id}>
                          <td><button className="btn btn-sm btn-ghost" onClick={() => setPaletteOuverte(p.paletteId)}>🏷️ {p.paletteId}</button></td>
                          <td>{(p.quantiteInitiale || 0).toLocaleString()} u</td>
                          <td style={{ fontWeight: 700, color: (p.disponibleCache || 0) > 0 ? "#2ecc71" : "var(--btp-text2)" }}>{(p.disponibleCache || 0).toLocaleString()} u</td>
                          <td>{p.emplacement || "—"}</td>
                          <td></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <div style={{ display: "flex", gap: 10, marginTop: 10, flexWrap: "wrap" }}>
                  {disponibleAReserver > 0 && !formCreerPalettes && <button className="btn btn-sm btn-ghost" onClick={ouvrirCreerPalettes}>📦 Créer d'autres palettes</button>}
                  <button className="btn btn-sm btn-ghost" onClick={() => setNouvellesPalettesCreees(palettes.map(function (p) { return p.paletteId; }))}>🖨️ Imprimer les étiquettes des palettes</button>
                </div>
              </React.Fragment>
            )}
            {formCreerPalettes && (
              <div className="fichelot-action" style={{ borderLeftColor: "var(--btp-blue)", flexDirection: "column", alignItems: "stretch", marginTop: 10 }}>
                <strong style={{ marginBottom: 6 }}>📦 Créer des palettes ({disponibleAReserver.toLocaleString()} u disponibles à répartir)</strong>
                <div style={{ display: "flex", gap: 10, alignItems: "flex-end", flexWrap: "wrap", marginBottom: 10 }}>
                  <div>
                    <label className="btp-label">Capacité par palette</label>
                    <input type="number" min="1" className="btp-input" style={{ width: 120 }} value={formCreerPalettes.capacite} onChange={(e) => recalculerPropositionPalettes(e.target.value)} />
                  </div>
                  <div style={{ fontSize: 12, color: "var(--btp-text2)" }}>→ proposition : {formCreerPalettes.repartition.length} palette(s)</div>
                </div>
                {formCreerPalettes.repartition.map(function (q, idx) {
                  return (
                    <div key={idx} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6, fontSize: 13 }}>
                      <span style={{ flex: 1 }}>Palette {idx + 1}</span>
                      <input type="number" min="0" className="btp-input" style={{ width: 90, textAlign: "right" }} value={q} onChange={(e) => modifierLignePalette(idx, e.target.value)} />
                      <span style={{ color: "var(--btp-text2)" }}>u</span>
                    </div>
                  );
                })}
                <div style={{ fontSize: 12, color: "var(--btp-text2)", marginTop: 4 }}>Total réparti : <strong>{formCreerPalettes.repartition.reduce(function (a, q) { return a + q; }, 0).toLocaleString()} u</strong></div>
                {formCreerPalettes.erreur && <div style={{ color: "#F1948A", fontSize: 12, marginTop: 6 }}>⚠️ {formCreerPalettes.erreur}</div>}
                <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
                  <button className="btn btn-sm btn-success" onClick={confirmerCreerPalettes} disabled={formCreerPalettes.envoi}>{formCreerPalettes.envoi ? "Création…" : "Confirmer"}</button>
                  <button className="btn btn-sm btn-ghost" onClick={() => setFormCreerPalettes(null)}>Annuler</button>
                </div>
              </div>
            )}
          </div>
        )}

        {tracable && (
          <div className="fichelot-section">
            <h4>Historique stock ({stockLot.mouvements.length})</h4>
            {stockLot.mouvements.length === 0 ? <p style={{ fontSize: 12, color: "var(--btp-text2)" }}>Aucun mouvement enregistré.</p> : (
              <div className="fichelot-timeline">
                {stockLot.mouvements.map(function (m) {
                  var cls = m.quantite >= 0 ? "tl-ok" : "tl-bad";
                  var libelles = { ENTREE_PRODUCTION: "⚙️ Production", SORTIE_LIVRAISON: "🚚 Livraison", PERTE: "📉 Perte", AJUSTEMENT_INVENTAIRE: "🔧 Ajustement inventaire", ANNULATION_LIVRAISON: "↩️ Annulation livraison", CORRECTION: "✏️ Correction" };
                  return (
                    <div key={m.id} className={"fichelot-tl-item " + cls}>
                      <div>
                        <div className="fichelot-tl-titre">{libelles[m.type] || m.type} — {m.quantite > 0 ? "+" : ""}{m.quantite.toLocaleString()} u</div>
                        <div className="fichelot-tl-detail">{qseTsMs(m.dateCreation) ? new Date(qseTsMs(m.dateCreation)).toLocaleDateString("fr-FR") : "—"} · {m.utilisateur || "—"}{m.commentaire ? (" · " + m.commentaire) : ""}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>
      {showQR && (
        <ModaleQREtiquette titre={"Lot " + lot.numeroLot} type="lot" id={lot.numeroLot}
          lignes={[
            { label: "Type", valeur: produit.nom },
            { label: "Date de production", valeur: lot.date || "—" },
            { label: "Quantité initiale", valeur: (lot.quantite || 0).toLocaleString() + " u" },
            { label: "Statut", valeur: statut.label }
          ]}
          onClose={() => setShowQR(false)} />
      )}
      {nouvellesPalettesCreees && (
        <ModaleQREtiquettesLot titre={"Étiquettes palettes — Lot " + lot.numeroLot} type="palette"
          items={nouvellesPalettesCreees.map(function (id) {
            var p = palettes.find(function (x) { return x.paletteId === id; });
            return { id: id, lignes: [{ label: "Lot", valeur: lot.numeroLot }, { label: "Type", valeur: produit.nom }, { label: "Quantité", valeur: p ? (p.quantiteInitiale || 0).toLocaleString() + " u" : "—" }] };
          })}
          onClose={() => setNouvellesPalettesCreees(null)} />
      )}
      {paletteOuverte && (
        <FichePalette paletteId={paletteOuverte} user={user} userData={userData}
          onClose={() => { setPaletteOuverte(null); rechargerPalettes(); }} />
      )}
    </div>
  );
}

// Phase 7 (points 7/19) : fiche palette, symetrique de FicheLot mais a la granularite terrain —
// c'est l'ecran qu'un magasinier voit juste apres un scan. Aucune nouvelle source de verite (point
// 31) : tout est derive du meme grand livre (stock_mouvements filtre par paletteId) et des memes
// stock_allocations (filtrees par paletteId) que le reste de l'application.
function FichePalette(props) {
  const paletteId = props.paletteId;
  const user = props.user;
  const userData = props.userData;
  const onClose = props.onClose;

  const [palette, setPalette] = React.useState(null);
  const [lot, setLot] = React.useState(null);
  const [controles, setControles] = React.useState([]);
  const [ncs, setNcs] = React.useState([]);
  const [mouvements, setMouvements] = React.useState([]);
  const [allocations, setAllocations] = React.useState([]);
  const [emplacements, setEmplacements] = React.useState([]);
  const [commandesType, setCommandesType] = React.useState([]);
  const [charge, setCharge] = React.useState(true);
  const [erreur, setErreur] = React.useState("");
  const [msgAction, setMsgAction] = React.useState("");
  const [showQR, setShowQR] = React.useState(false);
  const [lotOuvert, setLotOuvert] = React.useState(null);
  const [formDeplacer, setFormDeplacer] = React.useState(null); // { emplacement }
  const [formPerte, setFormPerte] = React.useState(null); // { quantite, motif, token }
  const [formReserver, setFormReserver] = React.useState(null); // { commandeId, quantite, token }
  const [formsLivraison, setFormsLivraison] = React.useState({}); // allocId -> { qte, token, envoi, msg }

  const charger = React.useCallback(async () => {
    setCharge(true); setErreur(""); setMsgAction("");
    try {
      const paletteSnap = await db.collection("stock_palettes").doc(paletteId).get();
      if (!paletteSnap.exists) { setErreur("Palette introuvable : " + paletteId); setCharge(false); return; }
      const paletteData = Object.assign({ id: paletteSnap.id }, paletteSnap.data());
      const [lotSnap, mvtSnap, allocSnap, emplSnap] = await Promise.all([
        db.collection("qse_lots").doc(paletteData.numeroLot).get(),
        db.collection("stock_mouvements").where("paletteId", "==", paletteId).get(),
        db.collection("stock_allocations").where("paletteId", "==", paletteId).get(),
        db.collection("stock_palette_emplacements").where("paletteId", "==", paletteId).get()
      ]);
      var lotData = lotSnap.exists ? Object.assign({ id: lotSnap.id }, lotSnap.data()) : null;
      var controlesArr = [], ncsArr = [];
      if (lotData) {
        const [controlesSnap, ncSnap] = await Promise.all([
          db.collection("qse_controles").where("numeroLot", "==", lotData.numeroLot).get(),
          db.collection("qse_nc").where("numeroLot", "==", lotData.numeroLot).get()
        ]);
        controlesArr = controlesSnap.docs.map(function (d) { return d.data(); });
        ncsArr = ncSnap.docs.map(function (d) { return d.data(); });
      }
      const cmdSnap = paletteData.typeBTC ? await db.collection("commandes").where("type", "==", paletteData.typeBTC).where("status", "==", "Validee").get() : null;

      setPalette(paletteData);
      setLot(lotData);
      setControles(controlesArr);
      setNcs(ncsArr);
      setMouvements(mvtSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
      setAllocations(allocSnap.docs.map(function (d) { return Object.assign({ id: d.id, _token: d.id + "_" + Date.now() + "_" + Math.random().toString(36).slice(2) }, d.data()); }));
      setEmplacements(emplSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).sort(function (a, b) { return qseTsMs(b.date) - qseTsMs(a.date); }));
      setCommandesType(cmdSnap ? cmdSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }) : []);
    } catch (e) {
      setErreur("Erreur de chargement : " + e.message);
    } finally {
      setCharge(false);
    }
  }, [paletteId]);

  React.useEffect(() => { charger(); }, [charger]);

  if (charge) {
    return (
      <div className="btp-modal-overlay" onClick={onClose}>
        <div className="btp-modal" style={{ maxWidth: 260 }} onClick={(e) => e.stopPropagation()}>Chargement de la palette…</div>
      </div>
    );
  }
  if (erreur || !palette) {
    return (
      <div className="btp-modal-overlay" onClick={onClose}>
        <div className="btp-modal" onClick={(e) => e.stopPropagation()}>
          <div className="btp-alert alert-error">⚠️ {erreur || "Palette introuvable."}</div>
          <button className="btn btn-ghost btn-full" onClick={onClose}>Fermer</button>
        </div>
      </div>
    );
  }

  const produit = getProduit(palette.typeBTC);
  const stockPalette = calculerStockPalette(paletteId, mouvements);
  const disponible = palette.disponibleCache != null ? palette.disponibleCache : 0;
  const reserveActif = allocations.filter(function (a) { return a.statut === "Reservee" || a.statut === "PartiellementLivree"; })
    .reduce(function (a, al) { return a + Math.max(0, (al.quantiteReservee || 0) - (al.quantiteLivree || 0)); }, 0);
  const livreTotal = allocations.reduce(function (a, al) { return a + (al.quantiteLivree || 0); }, 0);
  const statutLot = lot ? qseStatutLot(lot, controles, ncs) : null;
  const lotBloque = !!(lot && (lot.annule || (statutLot && statutLot.code === "bloque")));

  // Point 19 : etat compose — bloque prime sur tout (point 27, jamais utilisable meme partiellement).
  var etat;
  if (lotBloque) etat = { label: "Bloquée — lot non conforme", classe: "statut-bloque", icone: "🔴" };
  else if (stockPalette.restant <= 0) etat = { label: "Vide / livrée", classe: "statut-conforme", icone: "⚪" };
  else if (reserveActif >= stockPalette.restant) etat = { label: "Réservée", classe: "statut-attention", icone: "📌" };
  else if (reserveActif > 0) etat = { label: "Partielle (partiellement réservée)", classe: "statut-attention", icone: "🟡" };
  else etat = { label: "Disponible", classe: "statut-conforme", icone: "🟢" };

  const allocationsActives = allocations.filter(function (a) { return a.statut !== "Annulee"; });
  const timeline = mouvements.slice().sort(function (a, b) { return qseTsMs(a.dateCreation) - qseTsMs(b.dateCreation); });

  const soumettreDeplacement = async () => {
    if (!formDeplacer) return;
    try {
      await deplacerPalette(paletteId, formDeplacer.emplacement || null, user, userData);
      setFormDeplacer(null);
      setMsgAction("Emplacement mis à jour.");
      await charger();
    } catch (e) { setMsgAction("Erreur : " + e.message); }
  };

  const soumettrePerte = async () => {
    if (!formPerte || formPerte.envoi) return;
    var qte = parseInt(formPerte.quantite, 10);
    if (!qte || qte <= 0) { setFormPerte(Object.assign({}, formPerte, { erreur: "Quantité invalide." })); return; }
    setFormPerte(Object.assign({}, formPerte, { envoi: true, erreur: "" }));
    try {
      await declarerPerteLot(palette.numeroLot, palette.typeBTC, qte, formPerte.motif || "", formPerte.token, user, userData, paletteId);
      setFormPerte(null);
      setMsgAction("Perte de " + qte + " u enregistrée sur la palette.");
      await charger();
    } catch (e) { setFormPerte(Object.assign({}, formPerte, { envoi: false, erreur: e.message })); }
  };

  const soumettreReservation = async () => {
    if (!formReserver || formReserver.envoi) return;
    var cmd = commandesType.find(function (c) { return c.id === formReserver.commandeId; });
    if (!cmd) { setFormReserver(Object.assign({}, formReserver, { erreur: "Choisissez une commande." })); return; }
    var qte = parseInt(formReserver.quantite, 10);
    if (!qte || qte <= 0 || qte > disponible) { setFormReserver(Object.assign({}, formReserver, { erreur: "Quantité invalide." })); return; }
    setFormReserver(Object.assign({}, formReserver, { envoi: true, erreur: "" }));
    try {
      await reserverCommandeStock(cmd, [{ numeroLot: palette.numeroLot, paletteId: paletteId, quantite: qte }], formReserver.token, user, userData);
      setFormReserver(null);
      setMsgAction("Réservation enregistrée pour la commande " + (cmd.numBC || cmd.id) + ".");
      await charger();
    } catch (e) { setFormReserver(Object.assign({}, formReserver, { envoi: false, erreur: e.message })); }
  };

  const livrerAlloc = async (alloc) => {
    var etatForm = formsLivraison[alloc.id] || {};
    var reste = (alloc.quantiteReservee || 0) - (alloc.quantiteLivree || 0);
    var qte = parseInt(etatForm.qte, 10) || reste;
    if (qte > reste) qte = reste;
    setFormsLivraison(function (prev) { return Object.assign({}, prev, { [alloc.id]: Object.assign({}, etatForm, { envoi: true }) }); });
    try {
      await livrerReservation(alloc, qte, alloc._token, user, userData);
      setFormsLivraison(function (prev) { return Object.assign({}, prev, { [alloc.id]: { envoi: false, msg: "✅ Livré." } }); });
      await charger();
    } catch (e) {
      setFormsLivraison(function (prev) { return Object.assign({}, prev, { [alloc.id]: Object.assign({}, etatForm, { envoi: false, msg: "❌ " + e.message }) }); });
    }
  };

  return (
    <div className="btp-modal-overlay" onClick={onClose}>
      <div className="btp-modal" style={{ maxWidth: 720, maxHeight: "88vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
        <div className="fichelot-header">
          <div>
            <div className="btp-modal-title" style={{ marginBottom: 4 }}>📦 Palette {palette.paletteId}</div>
            <div style={{ fontSize: 13, color: "var(--btp-text2)" }}>{produit.nom} <span style={{ color: "var(--btp-orange)" }}>({produit.dim})</span></div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <span className={"fichelot-statut " + etat.classe}>{etat.icone} {etat.label}</span>
            <button className="btn btn-sm btn-ghost" onClick={() => setShowQR(true)}>📱 QR / Étiquette</button>
            <button className="btn btn-sm btn-ghost" onClick={onClose}>✕ Fermer</button>
          </div>
        </div>

        {lotBloque && (
          <div className="fichelot-anomalies">
            <h4>🚫 Palette non utilisable — lot bloqué (non conforme ou non-conformité ouverte)</h4>
          </div>
        )}

        <div className="fichelot-grid">
          <div className="fichelot-fait"><div className="fichelot-fait-label">Quantité initiale</div><div className="fichelot-fait-valeur">{(palette.quantiteInitiale || 0).toLocaleString()} u</div></div>
          <div className="fichelot-fait"><div className="fichelot-fait-label">Restante (physique)</div><div className="fichelot-fait-valeur">{stockPalette.restant.toLocaleString()} u</div></div>
          <div className="fichelot-fait"><div className="fichelot-fait-label">Réservée</div><div className="fichelot-fait-valeur" style={{ color: "#5DADE2" }}>{reserveActif.toLocaleString()} u</div></div>
          <div className="fichelot-fait"><div className="fichelot-fait-label">Livrée</div><div className="fichelot-fait-valeur">{livreTotal.toLocaleString()} u</div></div>
          <div className="fichelot-fait"><div className="fichelot-fait-label">Disponible à réserver</div><div className="fichelot-fait-valeur" style={{ color: "#2ecc71" }}>{disponible.toLocaleString()} u</div></div>
          <div className="fichelot-fait"><div className="fichelot-fait-label">Lot</div><div className="fichelot-fait-valeur"><button className="btn btn-sm btn-ghost" onClick={() => setLotOuvert(palette.numeroLot)}>🏷️ {palette.numeroLot}</button></div></div>
          <div className="fichelot-fait"><div className="fichelot-fait-label">Qualité (statut du lot)</div><div className="fichelot-fait-valeur">{statutLot ? (statutLot.icone + " " + statutLot.label) : "—"}</div></div>
          <div className="fichelot-fait"><div className="fichelot-fait-label">Emplacement</div><div className="fichelot-fait-valeur">{palette.emplacement || "Non renseigné"}</div></div>
        </div>

        {/* Actions contextuelles (point 7) : seulement celles reellement possibles */}
        <div className="fichelot-action" style={{ flexWrap: "wrap", gap: 8 }}>
          {!lotBloque && disponible > 0 && !formReserver && (
            <button className="btn btn-sm btn-primary" onClick={() => setFormReserver({ commandeId: "", quantite: String(disponible), token: paletteId + "_res_" + Date.now() + "_" + Math.random().toString(36).slice(2), erreur: "" })}>📌 Réserver</button>
          )}
          {!lotBloque && disponible > 0 && !formPerte && (
            <button className="btn btn-sm btn-ghost" onClick={() => setFormPerte({ quantite: "", motif: "", token: paletteId + "_" + Date.now() + "_" + Math.random().toString(36).slice(2) })}>📉 Déclarer une perte</button>
          )}
          <button className="btn btn-sm btn-ghost" onClick={() => setFormDeplacer({ emplacement: palette.emplacement || "" })}>📍 Déplacer</button>
          <button className="btn btn-sm btn-ghost" onClick={() => setLotOuvert(palette.numeroLot)}>👁️ Voir le lot</button>
          {msgAction && <div style={{ width: "100%", fontSize: 12, color: "var(--btp-green)", marginTop: 6 }}>{msgAction}</div>}
        </div>

        {formDeplacer && (
          <div className="fichelot-action" style={{ borderLeftColor: "var(--btp-blue)", flexDirection: "column", alignItems: "stretch" }}>
            <strong style={{ marginBottom: 6 }}>📍 Déplacer la palette</strong>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
              <input className="btp-input" style={{ flex: 1, minWidth: 180 }} placeholder="Ex: Zone A, Rack B-03, Extérieur 2"
                value={formDeplacer.emplacement} onChange={(e) => setFormDeplacer({ emplacement: e.target.value })} />
              <button className="btn btn-sm btn-success" onClick={soumettreDeplacement}>Enregistrer</button>
              <button className="btn btn-sm btn-ghost" onClick={() => setFormDeplacer(null)}>Annuler</button>
            </div>
          </div>
        )}

        {formPerte && (
          <div className="fichelot-action" style={{ borderLeftColor: "var(--btp-red)", flexDirection: "column", alignItems: "stretch" }}>
            <strong style={{ marginBottom: 6 }}>📉 Déclarer une perte sur cette palette (max {disponible.toLocaleString()} u)</strong>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
              <div>
                <label className="btp-label">Quantité perdue</label>
                <input type="number" min="1" max={disponible} className="btp-input" style={{ width: 120 }} value={formPerte.quantite} onChange={(e) => setFormPerte(Object.assign({}, formPerte, { quantite: e.target.value }))} />
              </div>
              <div style={{ flex: 1, minWidth: 180 }}>
                <label className="btp-label">Motif</label>
                <input className="btp-input" placeholder="Ex: casse au déchargement" value={formPerte.motif} onChange={(e) => setFormPerte(Object.assign({}, formPerte, { motif: e.target.value }))} />
              </div>
              <button className="btn btn-sm btn-danger" onClick={soumettrePerte} disabled={formPerte.envoi}>{formPerte.envoi ? "Enregistrement…" : "Confirmer la perte"}</button>
              <button className="btn btn-sm btn-ghost" onClick={() => setFormPerte(null)}>Annuler</button>
            </div>
            {formPerte.erreur && <div style={{ color: "#F1948A", fontSize: 12, marginTop: 6 }}>⚠️ {formPerte.erreur}</div>}
          </div>
        )}

        {formReserver && (
          <div className="fichelot-action" style={{ borderLeftColor: "var(--btp-blue)", flexDirection: "column", alignItems: "stretch" }}>
            <strong style={{ marginBottom: 6 }}>📌 Réserver cette palette pour une commande</strong>
            {commandesType.length === 0 ? <div style={{ fontSize: 12, color: "var(--btp-text2)" }}>Aucune commande validée en attente pour ce type de BTC.</div> : (
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
                <div style={{ flex: 1, minWidth: 200 }}>
                  <label className="btp-label">Commande</label>
                  <select className="btp-input" value={formReserver.commandeId} onChange={(e) => setFormReserver(Object.assign({}, formReserver, { commandeId: e.target.value }))}>
                    <option value="">— Choisir —</option>
                    {commandesType.map(function (c) { return <option key={c.id} value={c.id}>{(c.numBC || c.id) + " · " + (c.chantierNom || c.client || "-")}</option>; })}
                  </select>
                </div>
                <div>
                  <label className="btp-label">Quantité</label>
                  <input type="number" min="1" max={disponible} className="btp-input" style={{ width: 100 }} value={formReserver.quantite} onChange={(e) => setFormReserver(Object.assign({}, formReserver, { quantite: e.target.value }))} />
                </div>
                <button className="btn btn-sm btn-success" onClick={soumettreReservation} disabled={formReserver.envoi}>{formReserver.envoi ? "…" : "Confirmer"}</button>
                <button className="btn btn-sm btn-ghost" onClick={() => setFormReserver(null)}>Annuler</button>
              </div>
            )}
            {formReserver.erreur && <div style={{ color: "#F1948A", fontSize: 12, marginTop: 6 }}>⚠️ {formReserver.erreur}</div>}
          </div>
        )}

        {allocationsActives.length > 0 && (
          <div className="fichelot-section">
            <h4>Commande{allocationsActives.length > 1 ? "s" : ""} ({allocationsActives.length})</h4>
            {allocationsActives.map(function (a) {
              var reste = (a.quantiteReservee || 0) - (a.quantiteLivree || 0);
              var etatForm = formsLivraison[a.id] || {};
              var libelles = { Reservee: "📌 Réservée", PartiellementLivree: "🚚 Partiellement livrée", Livree: "✅ Livrée" };
              return (
                <div key={a.id} style={{ background: "var(--btp-card2)", borderRadius: 8, padding: 10, marginBottom: 8, fontSize: 13 }}>
                  <div>{a.chantierNom || "—"} — réservé {(a.quantiteReservee || 0).toLocaleString()} u, livré {(a.quantiteLivree || 0).toLocaleString()} u ({libelles[a.statut] || a.statut})</div>
                  {reste > 0 && !lotBloque && (
                    <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 6, flexWrap: "wrap" }}>
                      <span style={{ fontSize: 12, color: "var(--btp-text2)" }}>Préparer livraison :</span>
                      <input type="number" min="1" max={reste} placeholder={String(reste)} style={{ width: 80, padding: "4px 8px", borderRadius: 6, border: "1px solid var(--btp-border)", textAlign: "right" }}
                        value={etatForm.qte || ""} onChange={(e) => setFormsLivraison(function (prev) { return Object.assign({}, prev, { [a.id]: Object.assign({}, etatForm, { qte: e.target.value }) }); })} />
                      <button className="btn btn-sm" style={{ background: "#1E8449", color: "white" }} onClick={() => livrerAlloc(a)} disabled={etatForm.envoi}>🚚 Confirmer livraison</button>
                      {etatForm.msg && <span style={{ fontSize: 11 }}>{etatForm.msg}</span>}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        <div className="fichelot-section">
          <h4>Historique ({timeline.length + emplacements.length + 1})</h4>
          <div className="fichelot-timeline">
            <div className="fichelot-tl-item tl-ok"><div><div className="fichelot-tl-titre">📦 Création de la palette</div><div className="fichelot-tl-detail">{palette.dateCreation && qseTsMs(palette.dateCreation) ? new Date(qseTsMs(palette.dateCreation)).toLocaleDateString("fr-FR") : "—"} · {(palette.quantiteInitiale || 0).toLocaleString()} u · {palette.creePar || "—"}</div></div></div>
            {timeline.map(function (m) {
              var cls = m.quantite >= 0 ? "tl-ok" : "tl-bad";
              var libelles = { SORTIE_LIVRAISON: "🚚 Livraison", PERTE: "📉 Perte", ANNULATION_LIVRAISON: "↩️ Annulation livraison" };
              return (
                <div key={m.id} className={"fichelot-tl-item " + cls}>
                  <div>
                    <div className="fichelot-tl-titre">{libelles[m.type] || m.type} — {m.quantite > 0 ? "+" : ""}{m.quantite.toLocaleString()} u</div>
                    <div className="fichelot-tl-detail">{qseTsMs(m.dateCreation) ? new Date(qseTsMs(m.dateCreation)).toLocaleDateString("fr-FR") : "—"} · {m.utilisateur || "—"}{m.commentaire ? (" · " + m.commentaire) : ""}</div>
                  </div>
                </div>
              );
            })}
            {emplacements.map(function (e) {
              return (
                <div key={e.id} className="fichelot-tl-item tl-ok">
                  <div>
                    <div className="fichelot-tl-titre">📍 Déplacement : {e.ancienEmplacement || "(non renseigné)"} → {e.nouvelEmplacement || "(non renseigné)"}</div>
                    <div className="fichelot-tl-detail">{qseTsMs(e.date) ? new Date(qseTsMs(e.date)).toLocaleDateString("fr-FR") : "—"} · {e.utilisateur || "—"}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
      {showQR && (
        <ModaleQREtiquette titre={"Palette " + palette.paletteId} type="palette" id={palette.paletteId}
          lignes={[
            { label: "Lot", valeur: palette.numeroLot },
            { label: "Type", valeur: produit.nom },
            { label: "Quantité", valeur: (palette.quantiteInitiale || 0).toLocaleString() + " u" }
          ]}
          onClose={() => setShowQR(false)} />
      )}
      {lotOuvert && (
        <FicheLot numeroLot={lotOuvert} user={user} userData={userData} onClose={() => { setLotOuvert(null); charger(); }} />
      )}
    </div>
  );
}

function QseTracabiliteLots(props) {
  const onOuvrirLot = props.onOuvrirLot; // ouvre la fiche 360 du lot (centralisee dans ModuleQSE)
  const [lots, setLots] = React.useState([]);

  React.useEffect(() => {
    const unsub = db.collection("qse_lots")
      .orderBy("dateCreation", "desc")
      .limit(100)
      .onSnapshot((snap) => {
        const arr = [];
        snap.forEach((doc) => arr.push(Object.assign({ id: doc.id }, doc.data())));
        setLots(arr);
      });
    return () => unsub();
  }, []);

  return (
    <div className="qse-tracabilite">
      <h3>Traçabilité des lots</h3>
      <table className="qse-table">
        <thead>
          <tr><th>N° de lot</th><th>Type</th><th>Quantité</th><th>Date</th><th></th></tr>
        </thead>
        <tbody>
          {lots.map((l) => (
            <tr key={l.id}>
              <td>{l.numeroLot}</td>
              <td>{l.type}</td>
              <td>{l.quantite}</td>
              <td>{l.date}</td>
              <td><button className="btn btn-sm" onClick={() => onOuvrirLot && onOuvrirLot(l.numeroLot)}>📋 Fiche du lot</button></td>
            </tr>
          ))}
          {lots.length === 0 && (
            <tr><td colSpan="5">Aucun lot enregistré.</td></tr>
          )}
        </tbody>
      </table>
    </div>
  );
}

function ModuleQSE(props) {
  const user = props.user;
  const userData = props.userData;
  const [ongletQSE, setOngletQSE] = React.useState("tableau");
  const [lotOuvert, setLotOuvert] = React.useState(null); // numeroLot en cours d'affichage dans la fiche 360
  const [prefillNCLot, setPrefillNCLot] = React.useState(null);

  const ouvrirLot = (numeroLot) => setLotOuvert(numeroLot);
  const demanderNCPourLot = (numeroLot) => {
    setLotOuvert(null);
    setPrefillNCLot(numeroLot);
    setOngletQSE("nc");
  };

  // Permet a un appelant externe (bandeau "A faire", recherche globale) de deep-linker
  // directement vers un sous-onglet QSE precis a l'ouverture du module.
  React.useEffect(() => {
    if (props.ongletDemande) {
      setOngletQSE(props.ongletDemande);
      if (props.onOngletConsomme) props.onOngletConsomme();
    }
  }, [props.ongletDemande]);

  const onglets = [
    { key: "tableau", label: "Tableau de bord" },
    { key: "controles", label: "Contrôles qualité" },
    { key: "tracabilite", label: "Traçabilité lots" },
    { key: "nc", label: "Non-conformités & actions" },
    { key: "environnement", label: "Environnement" },
    { key: "risques", label: "Risques & opportunités" },
    { key: "aspects", label: "Aspects environnementaux" },
    { key: "objectifs", label: "Objectifs QSE" }
  ];

  return (
    <div className="qse-module">
      {lotOuvert && <FicheLot numeroLot={lotOuvert} user={user} userData={userData} onClose={() => setLotOuvert(null)} onDeclarerNC={demanderNCPourLot} />}
      <div className="qse-nav">
        {onglets.map((o) => (
          <button
            key={o.key}
            className={"qse-nav-btn" + (ongletQSE === o.key ? " actif" : "")}
            onClick={() => setOngletQSE(o.key)}
          >
            {o.label}
          </button>
        ))}
      </div>
      <div className="qse-contenu">
        {ongletQSE === "tableau" && <QseTableauDeBord user={user} userData={userData} />}
        {ongletQSE === "controles" && <QseControlesAFaire user={user} userData={userData} onOuvrirLot={ouvrirLot} />}
        {ongletQSE === "tracabilite" && <QseTracabiliteLots user={user} userData={userData} onOuvrirLot={ouvrirLot} />}
        {ongletQSE === "nc" && <QseNonConformites user={user} userData={userData} onOuvrirLot={ouvrirLot} prefillLot={prefillNCLot} onPrefillConsumed={() => setPrefillNCLot(null)} />}
        {ongletQSE === "environnement" && <QseIndicateursEnvironnement user={user} userData={userData} />}
        {ongletQSE === "risques" && <QseRisquesOpportunites user={user} userData={userData} />}
        {ongletQSE === "aspects" && <QseAspectsEnvironnementaux user={user} userData={userData} />}
        {ongletQSE === "objectifs" && <QseObjectifs user={user} userData={userData} />}
      </div>
    </div>
  );
}


function App() {
  const [user, setUser] = useState(null);
  const [userData, setUserData] = useState(null);
  const [loading, setLoading] = useState(true);
  // Phase 7 (point 18) : capture la destination demandee par l'URL (?lot=... ou ?palette=...) UNE
  // SEULE FOIS au chargement, avant toute authentification. Comme ce state n'est jamais recalcule
  // depuis l'URL ensuite, il survit intact a l'ecran de connexion : apres login, App() se re-rend
  // avec user/userData renseignes et deepLink toujours present -> la fiche s'ouvre automatiquement.
  const [deepLink, setDeepLink] = React.useState(function () {
    try {
      var params = new URLSearchParams(window.location.search);
      var lot = params.get("lot");
      var palette = params.get("palette");
      if (lot) return { type: "lot", id: lot };
      if (palette) return { type: "palette", id: palette };
    } catch (e) {}
    return null;
  });
  const fermerDeepLink = function () {
    setDeepLink(null);
    try {
      var url = new URL(window.location.href);
      url.searchParams.delete("lot"); url.searchParams.delete("palette");
      window.history.replaceState({}, "", url.pathname + (url.search || "") + url.hash);
    } catch (e) {}
  };

  useEffect(() => {
    var unsub = auth.onAuthStateChanged(async (u) => {
      if (u) {
        try {
          var doc = await db.collection("users").doc(u.uid).get();
          setUserData(doc.exists ? doc.data() : { role:"inconnu" });
        } catch(e) { setUserData({ role:"inconnu" }); }
        setUser(u);
      } else {
        setUser(null); setUserData(null);
      }
      setLoading(false);
    });
    return unsub;
  }, []);

  if (loading) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,var(--btp-dark),var(--btp-navy))"}}>
      <div style={{textAlign:"center",color:"white"}}>
        <div style={{width:64,height:64,background:"linear-gradient(135deg,var(--btp-orange),var(--btp-gold))",borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",fontSize:32,margin:"0 auto 16px",boxShadow:"0 8px 24px rgba(232,96,28,.4)"}}>🧱</div>
        <div style={{fontSize:20,fontWeight:900,marginBottom:4}}>BTC Manager</div>
        <div style={{fontSize:12,color:"var(--btp-text2)",letterSpacing:2,textTransform:"uppercase",marginBottom:20}}>Terre et Eau · Mamoudzou</div>
        <div style={{width:40,height:40,border:"3px solid rgba(255,255,255,.2)",borderTopColor:"var(--btp-orange)",borderRadius:"50%",animation:"spin .7s linear infinite",margin:"0 auto"}}></div>
      </div>
    </div>
  );

    if (!user) return <Login destinationEnAttente={deepLink} />;
  if (!userData) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center",color:"var(--btp-text2)"}}><div style={{fontSize:40}}>⏳</div><p>Chargement...</p></div>
    </div>
  );

  var role = userData.role ? userData.role.trim().toLowerCase() : "";
  // Phase 7 (point 18) : la fiche demandee par l'URL s'affiche par-dessus le tableau de bord du
  // role, quel qu'il soit, une fois l'utilisateur authentifie et son role connu.
  var ficheDeepLink = deepLink && (
    deepLink.type === "lot"
      ? <FicheLot numeroLot={deepLink.id} user={user} userData={userData} onClose={fermerDeepLink} />
      : <FichePalette paletteId={deepLink.id} user={user} userData={userData} onClose={fermerDeepLink} onOuvrirLot={function (numeroLot) { setDeepLink({ type: "lot", id: numeroLot }); }} />
  );

  if (role==="direction") return <React.Fragment><DashboardDirection user={user} userData={userData} />{ficheDeepLink}</React.Fragment>;
  if (role==="chef_chantier") return <React.Fragment><DashboardChef user={user} userData={userData} />{ficheDeepLink}</React.Fragment>;
  if (role==="resp_stock") return <React.Fragment><DashboardStock user={user} userData={userData} />{ficheDeepLink}</React.Fragment>;
  if (role==="resp_production") return <React.Fragment><DashboardProduction user={user} userData={userData} />{ficheDeepLink}</React.Fragment>;
  if (role==="comptable") return <React.Fragment><DashboardComptable user={user} userData={userData} />{ficheDeepLink}</React.Fragment>;

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,var(--btp-dark),var(--btp-navy))"}}>
      <div style={{textAlign:"center",padding:40,background:"var(--btp-card)",borderRadius:16,boxShadow:"0 4px 20px rgba(0,0,0,0.1)"}}>
        <div style={{fontSize:40,marginBottom:12}}>⚠️</div>
        <h3 style={{color:"#EC7063",marginBottom:8}}>Role non reconnu</h3>
        <p style={{color:"var(--btp-text2)",marginBottom:4}}>Role detecte: "{role}"</p>
        <p style={{color:"var(--btp-text2)",fontSize:13}}>Contactez l'administrateur.</p>
        <button onClick={()=>auth.signOut()} style={{marginTop:16,padding:"8px 20px",background:"#C0392B",color:"white",border:"none",borderRadius:8,cursor:"pointer",fontWeight:700}}>Deconnexion</button>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
  </html>
