// se declencher, mais jamais sans ses matieres. ID deterministe (token) -> idempotence totale.
// ============================================================================================
async function enregistrerProductionAvecConsommation(champs, parametres, token, user, userData) {
  var auteur = champs.responsableOverride || (userData && userData.nom) || (user && user.email) || "inconnu";
  var qte = champs.quantite;
  // Point CO/non-regression : le suivi matiere n'est ACTIF que si densiteTerreSecheKgM3 est
  // configure (signal volontaire explicite). Sans cela, l'application se comporte exactement comme
  // avant Phase 10B (production + stock BTC uniquement) — jamais un blocage sur une donnee jamais
  // renseignee.
  var suiviMatiereActif = parametres.densiteTerreSecheKgM3 != null;
  var conso = suiviMatiereActif ? calculerConsommationMatieresProduction(qte, parametres) : { calculable: false, terreM3: null, cimentKg: null, sableKg: null, eauLitres: null };
  var prodRef = db.collection("productions").doc(token);
  var stockRef = db.collection("stocks").doc(champs.type);
  var matieresLignes = !suiviMatiereActif ? [] : (conso.calculable ? [
    { id: "terre", quantite: conso.terreM3, unite: "m3" },
    { id: "ciment", quantite: conso.cimentKg, unite: "kg" },
    { id: "sable", quantite: conso.sableKg, unite: "kg" },
    { id: "eau", quantite: conso.eauLitres, unite: "L" }
  ] : [{ id: "terre", quantite: conso.terreM3, unite: "m3" }]);
  var matieresRefs = matieresLignes.map(function (l) { return db.collection("matieres_stock").doc(l.id); });

  var coutMatieresProduction = null, coutMatiereParBTC = null;
  await db.runTransaction(async function (tx) {
    var prodSnap = await tx.get(prodRef);
    if (prodSnap.exists) return; // idempotence totale (double-clic) : rien a rejouer
    var stockSnap = await tx.get(stockRef);
    var matSnaps = [];
    for (var i = 0; i < matieresRefs.length; i++) matSnaps.push(await tx.get(matieresRefs[i]));

    var manques = [];
    var etatsMatieres = matieresLignes.map(function (l, i) {
      var s = matSnaps[i].exists ? matSnaps[i].data() : { quantite: 0, coutMoyenPondere: 0 };
      if ((s.quantite || 0) < l.quantite) manques.push({ id: l.id, manque: l.quantite - (s.quantite || 0), unite: l.unite });
      return s;
    });
    if (manques.length > 0) {
      var msg = manques.map(function (m) { return m.id + " : manque " + m.manque.toFixed(1) + " " + m.unite; }).join(" · ");
      throw new Error("Production impossible — matières insuffisantes (" + msg + ").");
    }

    var matieresConsommeesDoc = null;
    if (suiviMatiereActif) {
      coutMatieresProduction = 0;
      matieresLignes.forEach(function (l, i) {
        var s = etatsMatieres[i];
        coutMatieresProduction += (s.coutMoyenPondere || 0) * l.quantite;
        var mvtId = idMouvementMatiere("production", token, l.id);
        tx.set(db.collection("matiere_mouvements").doc(mvtId), {
          matiereId: l.id, type: "CONSOMMATION_PRODUCTION", quantite: -l.quantite, unite: l.unite,
          prixUnitaire: s.coutMoyenPondere || 0, sourceType: "production", sourceId: token, utilisateur: auteur,
          commentaire: "", dateCreation: firebase.firestore.FieldValue.serverTimestamp()
        });
        tx.set(matieresRefs[i], { quantite: (s.quantite || 0) - l.quantite, unite: l.unite, coutMoyenPondere: s.coutMoyenPondere || 0 }, { merge: true });
      });
      coutMatiereParBTC = (coutMatieresProduction != null && qte > 0) ? coutMatieresProduction / qte : null;
      matieresConsommeesDoc = conso.calculable ? { terreM3: conso.terreM3, cimentKg: conso.cimentKg, sableKg: conso.sableKg, eauLitres: conso.eauLitres } : { terreM3: conso.terreM3 };
    }

    tx.set(prodRef, {
      type: champs.type, quantite: qte, phase: champs.phase, date: champs.date,
      responsable: auteur, responsableUid: user.uid, statut: "Valide",
      coutMatieresProduction: coutMatieresProduction, coutMatiereParBTC: coutMatiereParBTC,
      matieresConsommees: matieresConsommeesDoc,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    var s2 = stockSnap.exists ? stockSnap.data() : {};
    var upd = { sec: s2.sec || 0, sechage: s2.sechage || 0 };
    var champStock = champs.phase === "sec" ? "sec" : "sechage";
    upd[champStock] = (upd[champStock] || 0) + qte;
    tx.set(stockRef, upd, { merge: true });
  });

  return { productionId: token, coutMatieresProduction: coutMatieresProduction, coutMatiereParBTC: coutMatiereParBTC, matieresSuivies: suiviMatiereActif, matieresCalculables: conso.calculable };
}

// Point AW : matiere limitante — quel volume de production les stocks matiere permettent au maximum,
// matiere par matiere, sans jamais inventer de rendement (eau volontairement exclue, comme dans
// l'exemple du cahier des charges : jamais une contrainte logistique reelle a Terre et Eau).
function calculerCapaciteProductionParMatieres(matieresStock, parametres) {
  if (parametres.densiteTerreSecheKgM3 == null) {
    var terreDispo = (matieresStock.terre && matieresStock.terre.quantite) || 0;
    var capaciteTerre = parametres.recetteTerreM3Pour100BTC > 0 ? Math.floor(terreDispo / parametres.recetteTerreM3Pour100BTC * 100) : null;
    return { calculable: false, capaciteBTC: capaciteTerre, matiereLimitante: "terre", parMatiere: { terre: capaciteTerre }, avertissement: "Densité de la terre sèche non configurée — capacité ciment/sable non calculable." };
  }
  var conso100 = {
    terre: parametres.recetteTerreM3Pour100BTC,
    ciment: parametres.recetteTerreM3Pour100BTC * parametres.densiteTerreSecheKgM3 * parametres.recetteTauxCimentPct,
    sable: parametres.recetteTerreM3Pour100BTC * parametres.densiteTerreSecheKgM3 * parametres.recetteTauxSablePct
  };
  var parMatiere = {};
  Object.keys(conso100).forEach(function (id) {
    var dispo = (matieresStock[id] && matieresStock[id].quantite) || 0;
    parMatiere[id] = conso100[id] > 0 ? Math.floor(dispo / conso100[id] * 100) : null;
  });
  var matiereLimitante = null, capaciteBTC = null;
  Object.keys(parMatiere).forEach(function (id) {
    if (parMatiere[id] == null) return;
    if (capaciteBTC == null || parMatiere[id] < capaciteBTC) { capaciteBTC = parMatiere[id]; matiereLimitante = id; }
  });
  return { calculable: true, capaciteBTC: capaciteBTC, matiereLimitante: matiereLimitante, parMatiere: parMatiere };
}
// Point AU/AV : besoin logistique de terre pour un manque donne, arrondi au camion SUPERIEUR — le
// stock et la consommation matiere restent exacts en m³, seul le nombre de camions a commander l'est.
function calculerBesoinCamionsTerre(manqueM3, capaciteCamionM3) {
  if (manqueM3 <= 0 || !capaciteCamionM3) return 0;
  return Math.ceil(manqueM3 / capaciteCamionM3);
}
// Point AX/AY : besoins d'approvisionnement matieres pour couvrir un besoin total de production (en
// BTC, deja calcule par le moteur de planification) — jamais un delai fournisseur invente.
function calculerApprovisionnementPlan(besoinTotalBTC, matieresStock, parametres) {
  var conso = calculerConsommationMatieresProduction(besoinTotalBTC, parametres);
  var capaciteCamion = parametres.capaciteBenneDefautM3;
  var lignes = [
    { id: "terre", unite: "m3", besoin: conso.terreM3 },
    { id: "ciment", unite: "kg", besoin: conso.cimentKg },
    { id: "sable", unite: "kg", besoin: conso.sableKg }
  ].filter(function (l) { return l.besoin != null; });
  var resultats = lignes.map(function (l) {
    var dispo = (matieresStock[l.id] && matieresStock[l.id].quantite) || 0;
    var manque = Math.max(0, l.besoin - dispo);
    var res = { id: l.id, unite: l.unite, besoin: l.besoin, disponible: dispo, manque: manque };
    if (l.id === "terre" && manque > 0) res.camionsNecessaires = calculerBesoinCamionsTerre(manque, capaciteCamion);
    return res;
  });
  return { calculable: conso.calculable, lignes: resultats, capaciteCamionM3: capaciteCamion };
}

// ============================================================================================
// PHASE 10B — Allocation JOUR PAR JOUR avec capacite REELLE (heures − arrets) et preference de
// campagne (points R-Z, BA, BB). Utilisee UNIQUEMENT si heuresTravailJour est configure ; sinon
// repli integral sur allouerCapacitePlanification (comportement Phase 10 d'origine INCHANGE — non-
// regression garantie tant que ce nouveau parametre n'est pas explicitement renseigne). Regle
// deliberement simple et conservatrice (point Z) : au plus un changement de moule par jour, jamais
// deux types differents produits le meme jour sauf le jour du changement lui-meme.
function allouerCapaciteAvecCampagnes(lignesPrioritaires, joursTravailles, parametres, activitesParJourISO) {
  var restant = {}, ordreTypes = [], ligneParType = {};
  lignesPrioritaires.forEach(function (l) {
    restant[l.typeBTC] = l.besoin.besoin; ligneParType[l.typeBTC] = l;
    if (ordreTypes.indexOf(l.typeBTC) === -1) ordreTypes.push(l.typeBTC);
  });
  var typeCourant = parametres.mouleActuel || null;
  // Le moule est deja en place depuis un temps inconnu -> pas de contrainte artificielle le 1er jour.
  var joursConsecutifs = typeCourant ? parametres.dureeCampagnePrefereeJours : 0;
  var planLignes = [], capaciteInfoParJour = {}, changementsProposes = [];

  joursTravailles.forEach(function (jourMs) {
    var jourISO = dateLocaleISO(jourMs);
    var activitesJour = (activitesParJourISO && activitesParJourISO[jourISO]) || [];
    var capaciteInfo = calculerCapaciteReelleJour(parametres.capaciteJournaliere, parametres.heuresTravailJour, activitesJour);
    capaciteInfoParJour[jourMs] = capaciteInfo;
    var capaciteRestante = capaciteInfo.capaciteReelle || 0;

    var typesAvecBesoin = ordreTypes.filter(function (t) { return restant[t] > 0; });
    if (typesAvecBesoin.length === 0) return;
    var typePrioritaire = typesAvecBesoin[0];
    var typeDuJour = typePrioritaire;
    if (typeCourant && restant[typeCourant] > 0 && typeCourant !== typePrioritaire) {
      var tierCourant = ligneParType[typeCourant] ? ligneParType[typeCourant].score.tier : 4;
      var tierPrioritaire = ligneParType[typePrioritaire] ? ligneParType[typePrioritaire].score.tier : 4;
      // Preference de campagne (point R/U) : on continue le meme moule tant que la campagne n'est
      // pas terminee ET que rien de plus urgent (tier plus bas = plus prioritaire) ne l'impose.
      if (joursConsecutifs < parametres.dureeCampagnePrefereeJours && tierPrioritaire >= tierCourant) {
        typeDuJour = typeCourant;
      }
    }

    var changement = typeCourant != null && typeDuJour !== typeCourant;
    if (changement) {
      var unitesPerdues = capaciteInfo.cadenceHoraire ? Math.round(capaciteInfo.cadenceHoraire * parametres.dureeChangementMoulHeures) : 0;
      capaciteRestante = Math.max(0, capaciteRestante - unitesPerdues);
      // Point V : signale une urgence commerciale si le changement est declenche par un tier1 avant
      // la fin de la campagne preferee (plutot que de la masquer derriere une simple ligne de plan).
      var urgence = ligneParType[typeDuJour] && ligneParType[typeDuJour].score.tier === 1 && joursConsecutifs < parametres.dureeCampagnePrefereeJours;
      changementsProposes.push({ dateMs: jourMs, ancienMoule: typeCourant, nouveauMoule: typeDuJour, dureeHeures: parametres.dureeChangementMoulHeures, unitesPerdues: unitesPerdues, urgence: !!urgence });
    }

    var aAllouer = Math.min(restant[typeDuJour], capaciteRestante);
    if (aAllouer > 0) {
      var l = ligneParType[typeDuJour];
      planLignes.push({
        dateMs: jourMs, typeBTC: typeDuJour, quantite: aAllouer, tier: l.score.tier, libelleTier: l.score.libelleTier,
        motif: l.motif, dateMaturiteTheorique: jourMs + parametres.dureeSechageJours * MS_PAR_JOUR, changementMoule: changement
      });
      restant[typeDuJour] -= aAllouer;
    }
    joursConsecutifs = (typeDuJour === typeCourant) ? (joursConsecutifs + 1) : 1;
    typeCourant = typeDuJour;
  });

  var resteNonPlanifie = {};
  Object.keys(restant).forEach(function (t) { if (restant[t] > 0) resteNonPlanifie[t] = restant[t]; });
  return {
    planLignes: planLignes, resteNonPlanifie: resteNonPlanifie,
    calendrierPossible: parametres.capaciteJournaliere != null && parametres.heuresTravailJour != null,
    capaciteInfoParJour: capaciteInfoParJour, changementsMouleProposes: changementsProposes, mouleFinal: typeCourant
  };
}

// Navigation centrale : un seul point d'entree pour ouvrir n'importe quel objet metier depuis
// n'importe ou (recherche globale, bandeau "A faire", et plus tard alertes/notifications).
// ouvrirObjet("lot", "BTC-2026-09-001") -> FicheLot ; ouvrirObjet("chantier", id) -> fiche chantier ; etc.
// Reutilise les ecrans/etats existants, ne cree pas de nouvelles fiches en double.
function creerOuvreurObjet({ setLotOuvert, setPaletteOuvert, setFicheChantierOuverte, setTab, setQseOnglet, chantiers, commandes }) {
  return function ouvrirObjet(type, idOuObjet) {
    if (type === "lot") { setLotOuvert(idOuObjet); return; }
    if (type === "palette" && setPaletteOuvert) { setPaletteOuvert(idOuObjet); return; }
    if (type === "chantier") {
      var ch = chantiers.find(function (c) { return c.id === idOuObjet; });
      if (ch) { setFicheChantierOuverte(ch); setTab("chantiers"); }
      return;
    }
    if (type === "commande") {
      var cmd = commandes.find(function (c) { return c.id === idOuObjet; });
      if (cmd && cmd.chantierId) {
        var chC = chantiers.find(function (c) { return c.id === cmd.chantierId; });
        if (chC) { setFicheChantierOuverte(chC); setTab("chantiers"); return; }
      }
      setTab("commandes");
      return;
    }
    if (type === "nc") {
      // idOuObjet est ici l'objet NC complet (fourni par la recherche) : on ouvre sa fiche lot
      // si elle est connue, seule vue qui centralise deja tout le detail d'une NC (Phase 2).
      var nc = idOuObjet;
      if (nc && nc.numeroLot) { setLotOuvert(nc.numeroLot); }
      else { setQseOnglet("nc"); setTab("qse"); }
      return;
    }
    if (type === "produit") { setTab("catalogue"); return; }
    if (type === "qse_onglet") { setQseOnglet(idOuObjet); setTab("qse"); return; }
    if (type === "tab") { setTab(idOuObjet); return; }
  };
}

// ============================================================================================
// PHASE 7 — QR codes (points 1/2/3/19/29). Principe directeur : le QR ne contient JAMAIS de donnee
// metier, uniquement une URL stable qui permet a BTC Manager de retrouver l'objet (?lot=... ou
// ?palette=...). Ouvrable par n'importe quel appareil photo standard sans avoir l'app deja ouverte,
// et reconnue au chargement par le routeur de App() (point 18). C'est la solution la plus robuste
// compte tenu de l'hebergement statique sur GitHub Pages : aucune app dediee a installer, aucun
// schema d'URL personnalise a enregistrer, ca fonctionne meme si l'utilisateur n'a jamais ouvert
// BTC Manager sur ce telephone.
// ============================================================================================
function urlPourObjet(type, id) {
  try { return window.location.origin + window.location.pathname + "?" + type + "=" + encodeURIComponent(id); }
  catch (e) { return "?" + type + "=" + encodeURIComponent(id); }
}

// Dessine un QR (bibliotheque QRCode.js, chargee en tete de page) dans un <div>. Se degrade
// proprement si la bibliotheque n'a pas pu se charger (reseau coupe, CDN indisponible) — n'affiche
// jamais une erreur bloquante, juste un message explicite (point 12) ; le numero reste de toute
// facon lisible a cote (point 3), donc l'objet reste identifiable meme sans QR.
function QRCodeAffichage({ valeur, taille }) {
  const ref = React.useRef(null);
  const [indisponible, setIndisponible] = React.useState(false);
  React.useEffect(() => {
    if (!ref.current) return;
    ref.current.innerHTML = "";
    if (typeof QRCode === "undefined") { setIndisponible(true); return; }
    try {
      new QRCode(ref.current, { text: valeur, width: taille || 160, height: taille || 160, correctLevel: QRCode.CorrectLevel.M });
      setIndisponible(false);
    } catch (e) { setIndisponible(true); }
  }, [valeur, taille]);
  if (indisponible) {
    return <div style={{ width: taille || 160, height: taille || 160, display: "flex", alignItems: "center", justifyContent: "center", background: "#f5f5f5", color: "#888", fontSize: 11, textAlign: "center", padding: 8, borderRadius: 8 }}>QR indisponible<br />(connexion requise)</div>;
  }
  return <div ref={ref} style={{ display: "inline-block", background: "white", padding: 8, borderRadius: 8 }} />;
}

// Modale "Afficher QR" + "Imprimer étiquette" (points 2/3/19), reutilisable pour un lot ou une
// palette. "lignes" = tableau de {label, valeur} affiche sous le QR sur l'etiquette (type, date,
// quantite, statut...) : le numero reste gros et lisible independamment du QR (point 3).
function ModaleQREtiquette({ titre, type, id, lignes, onClose }) {
  const url = urlPourObjet(type, id);
  const imprimer = () => {
    document.body.classList.add("impression-etiquette");
    window.print();
    setTimeout(function () { document.body.classList.remove("impression-etiquette"); }, 300);
  };
  return (
    <div className="btp-modal-overlay" onClick={onClose}>
      <div className="btp-modal etiquette-print-zone" style={{ maxWidth: 360, textAlign: "center" }} onClick={(e) => e.stopPropagation()}>
        <div className="btp-modal-title no-print" style={{ marginBottom: 12 }}>📱 {titre}</div>
        <div className="etiquette-carte" style={{ width: "auto", margin: "0 auto" }}>
          <QRCodeAffichage valeur={url} taille={180} />
          <div className="etiquette-numero">{id}</div>
          {(lignes || []).map(function (l, i) { return (<div key={i} className="etiquette-ligne"><span>{l.label}</span><strong>{l.valeur}</strong></div>); })}
        </div>
        <div className="no-print" style={{ fontSize: 11, color: "var(--btp-text2)", marginTop: 10, wordBreak: "break-all" }}>{url}</div>
        <div className="no-print" style={{ display: "flex", gap: 10, marginTop: 16 }}>
          <button className="btn btn-full" style={{ background: "#1E8449", color: "white" }} onClick={imprimer}>🖨️ Imprimer étiquette</button>
          <button className="btn btn-ghost btn-full" onClick={onClose}>Fermer</button>
        </div>
      </div>
    </div>
  );
}

// Impression en lot (point 29) : plusieurs etiquettes palette a la fois, meme mecanique d'impression
// (visibility, pas de PDF genere — le navigateur suffit et reste utilisable avec une imprimante
// standard A4 ou etiquettes). "items" = [{ id, lignes }].
function ModaleQREtiquettesLot({ titre, type, items, onClose }) {

    document.body.classList.add("impression-etiquette");

  };
  return (

          {(items || []).map(function (it) {

                {(it.lignes || []).map(function (l, i) { return (<div key={i} className="etiquette-ligne"><span>{l.label}</span><strong>{l.valeur}</strong></div>); })}
              </div>
            );
          })}
        </div>
        <div className="no-print" style={{ display: "flex", gap: 10, marginTop: 16 }}>
          <button className="btn btn-full" style={{ background: "#1E8449", color: "white" }} onClick={imprimer}>🖨️ Imprimer {(items || []).length} étiquette(s)</button>
          <button className="btn btn-ghost btn-full" onClick={onClose}>Fermer</button>
        </div>
      </div>
    </div>
  );
}

// Recherche globale : filtre cote client les donnees deja chargees par l'application (aucune
// lecture Firestore supplementaire declenchee par la frappe). Tolerante a la casse/aux accents/
// a la saisie partielle via normTxt, avec une correspondance "tous les mots tapes doivent se
// retrouver quelque part dans le texte de l'objet" (pas besoin de moteur de recherche externe).
// ============================================================================================
// PHASE 7 — Mode scan (points 10-12, 24-25). Reconnaissance automatique du type d'objet scanne par
// le prefixe/URL decode (pas besoin de choisir "scanner lot" vs "scanner palette", point 10).
// Decodage 100% local (jsQR, aucune image envoyee a un service externe — point 43 "pas d'IA
// externe, pas de reconnaissance d'image [distante]"). Repli clavier systematique si la camera est
// refusee/indisponible/HTTPS manquant (points 11/12) : l'utilisateur n'est jamais bloque.
// ============================================================================================
function decoderTexteScan(texte) {
  if (!texte) return null;
  var t = ("" + texte).trim();
  try {
    var url = new URL(t);
    var lot = url.searchParams.get("lot");
    var palette = url.searchParams.get("palette");
    if (lot) return { type: "lot", id: lot };
    if (palette) return { type: "palette", id: palette };
  } catch (e) {}
  if (/^LOT:/i.test(t)) return { type: "lot", id: t.slice(4).trim() };
  if (/^PAL:/i.test(t)) return { type: "palette", id: t.slice(4).trim() };
  if (/^PAL-/i.test(t)) return { type: "palette", id: t };
  if (/^BTC-/i.test(t)) return { type: "lot", id: t };
  return null; // code inconnu : ni URL de l'app, ni prefixe reconnu
}

// "continu" (utilise par l'inventaire, point 22/23) : n'appelle PAS onFermer apres un scan reussi,
// permet d'enchainer les scans sans revenir a l'ecran precedent. "dejaVus" (optionnel) : ensemble de
// codes deja traites par l'appelant, pour afficher "Palette déjà scannée" au lieu de la retraiter
// (point 25 — anti-double-scan, complementaire a la dedup locale sur images video consecutives).
function ModaleScanner({ onFermer, onObjetReconnu, continu, dejaVus, titre }) {
  const videoRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const [etat, setEtat] = React.useState("init"); // init | camera | refuse | indisponible | https
  const [dernierCode, setDernierCode] = React.useState("");
  const [saisie, setSaisie] = React.useState("");
  const [msg, setMsg] = React.useState("");

  const traiterCode = React.useCallback((texte) => {
    if (texte === dernierCode) return; // anti-rebond : meme image lue plusieurs fois de suite
    setDernierCode(texte);
    var objet = decoderTexteScan(texte);
    if (!objet) { setMsg("❌ Code inconnu"); if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} } return; }
    if (dejaVus && dejaVus[objet.type + ":" + objet.id]) {
      setMsg("⚠️ " + (objet.type === "lot" ? "Lot" : "Palette") + " " + objet.id + " déjà scanné(e)");
      if (navigator.vibrate) { try { navigator.vibrate([30, 30, 30]); } catch (e) {} }
      return;
    }
    setMsg("✓ " + (objet.type === "lot" ? "Lot" : "Palette") + " " + objet.id + " reconnu(e)");
    if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
    onObjetReconnu(objet);
    if (!continu) { setTimeout(onFermer, 400); }
    else { setTimeout(function () { setDernierCode(""); }, 1200); } // permet de re-scanner un AUTRE code juste apres
  }, [dernierCode, dejaVus, continu, onObjetReconnu, onFermer]);

  React.useEffect(() => {
    var annule = false;
    function boucleScan() {
      if (annule) return;
      if (!videoRef.current || !canvasRef.current || typeof jsQR === "undefined") { rafRef.current = requestAnimationFrame(boucleScan); return; }
      var video = videoRef.current, canvas = canvasRef.current;
      if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        try {
          var image = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var code = jsQR(image.data, image.width, image.height);
          if (code && code.data) { traiterCode(code.data); }
        } catch (e) {}
      }
      rafRef.current = requestAnimationFrame(boucleScan);
    }
    async function demarrer() {
      if (!window.isSecureContext) { setEtat("https"); return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setEtat("indisponible"); return; }
      if (typeof jsQR === "undefined") { setEtat("indisponible"); return; }
      try {
        var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        if (annule) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
        streamRef.current = stream;
        if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play(); }
        setEtat("camera");
        boucleScan();
      } catch (e) {
        setEtat(e && e.name === "NotAllowedError" ? "refuse" : "indisponible");
      }
    }
    demarrer();
    return function () {
      annule = true;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (streamRef.current) { streamRef.current.getTracks().forEach(function (t) { t.stop(); }); }
    };
  }, [traiterCode]);

  const soumettreSaisie = (e) => {
    e.preventDefault();
    var objet = decoderTexteScan(saisie.trim());
    if (!objet) { setMsg("❌ Code inconnu — vérifiez le numéro (ex: BTC-2026-09-001 ou PAL-2026-000123)."); return; }
    if (dejaVus && dejaVus[objet.type + ":" + objet.id]) { setMsg("⚠️ Déjà scanné(e)."); return; }
    setMsg("✓ " + (objet.type === "lot" ? "Lot" : "Palette") + " " + objet.id + " reconnu(e)");
    onObjetReconnu(objet);
    setSaisie("");
    if (!continu) onFermer();
  };

  return (
    <div className="btp-modal-overlay" onClick={onFermer}>
      <div className="btp-modal" style={{ maxWidth: 420 }} onClick={(e) => e.stopPropagation()}>
        <div className="btp-modal-title" style={{ marginBottom: 12 }}>📷 {titre || "Scanner"}</div>
        {etat === "camera" && (
          <div style={{ position: "relative", background: "#000", borderRadius: 10, overflow: "hidden" }}>
            <video ref={videoRef} playsInline muted style={{ width: "100%", display: "block", maxHeight: 320, objectFit: "cover" }} />
            <div style={{ position: "absolute", inset: 0, border: "3px solid rgba(255,255,255,.5)", margin: 30, borderRadius: 12, pointerEvents: "none" }} />
          </div>
        )}
        {etat === "init" && <div style={{ padding: 20, textAlign: "center", color: "var(--btp-text2)" }}>Activation de la caméra…</div>}
        <canvas ref={canvasRef} style={{ display: "none" }} />
        {(etat === "refuse" || etat === "indisponible" || etat === "https") && (
          <div className="btp-alert alert-error" style={{ marginBottom: 12 }}>
            {etat === "refuse" && "⚠️ Accès à la caméra refusé. Autorisez la caméra dans les paramètres du navigateur, ou saisissez le code ci-dessous."}
            {etat === "indisponible" && "⚠️ Caméra indisponible sur cet appareil ou navigateur. Saisissez le code ci-dessous."}
            {etat === "https" && "⚠️ Le scan caméra nécessite une connexion sécurisée (HTTPS). Saisissez le code ci-dessous."}
          </div>
        )}
        {msg && <div style={{ marginTop: 10, marginBottom: 6, fontWeight: 700, color: msg.indexOf("❌") >= 0 ? "#EC7063" : (msg.indexOf("⚠️") >= 0 ? "#F39C12" : "#2ECC71") }}>{msg}</div>}
        <form onSubmit={soumettreSaisie} style={{ marginTop: 14 }}>
          <label className="btp-label">Saisir le code (si la caméra ne fonctionne pas)</label>
          <div style={{ display: "flex", gap: 8 }}>
            <input className="btp-input" placeholder="Ex: BTC-2026-09-001 ou PAL-2026-000123" value={saisie} onChange={(e) => setSaisie(e.target.value)} style={{ flex: 1 }} />
            <button className="btn btn-primary" type="submit">Valider</button>
          </div>
        </form>
        <button className="btn btn-ghost btn-full" style={{ marginTop: 14 }} onClick={onFermer}>Fermer</button>
      </div>
    </div>
  );
}

// Bouton "Scanner" pret a l'emploi (point 10) : ouvre la modale, route automatiquement vers
// FicheLot ou FichePalette selon le type reconnu. A deposer dans n'importe quel tableau de bord ;
// "user"/"userData" sont transmis normalement par le composant appelant (memes props que partout
// ailleurs dans l'application, pas d'etat global).
function BoutonScanner({ user, userData, style, libelle }) {
  const [ouvert, setOuvert] = React.useState(false);
  const [cible, setCible] = React.useState(null); // { type, id }
  return (
    <React.Fragment>
      <button className="btn btn-primary btn-lg" style={Object.assign({ fontSize: 16, fontWeight: 800 }, style)} onClick={() => setOuvert(true)}>📷 {libelle || "Scanner"}</button>
      {ouvert && <ModaleScanner onFermer={() => setOuvert(false)} onObjetReconnu={(o) => setCible(o)} />}
      {cible && cible.type === "lot" && <FicheLot numeroLot={cible.id} user={user} userData={userData} onClose={() => setCible(null)} />}
      {cible && cible.type === "palette" && <FichePalette paletteId={cible.id} user={user} userData={userData} onClose={() => setCible(null)} />}
    </React.Fragment>
  );
}

// Phase 7 (points 22/23/25) : premier workflow d'inventaire terrain. L'utilisateur demarre un
// inventaire (optionnellement filtre sur un emplacement), scanne les palettes presentes en serie
// (anti-double-scan integre a ModaleScanner via "dejaVus"), puis obtient une comparaison
// attendues/scannees. NE CORRIGE JAMAIS le stock automatiquement (point 22) : produit une
// proposition d'ecart a examiner et traiter manuellement (ex: via le diagnostic Direction).
function InventaireParScan({ user, userData, onFermer }) {
  const [etape, setEtape] = React.useState("configuration"); // configuration | scan | resultat
  const [emplacement, setEmplacement] = React.useState("");
  const [attendues, setAttendues] = React.useState([]);
  const [scannees, setScannees] = React.useState([]); // [{paletteId, ts}]
  const [showScanner, setShowScanner] = React.useState(false);
  const [chargement, setChargement] = React.useState(false);

  const dejaVus = {};
  scannees.forEach(function (s) { dejaVus["palette:" + s.paletteId] = true; });

  const demarrer = async () => {
    setChargement(true);
    try {
      var query = db.collection("stock_palettes");
      if (emplacement.trim()) query = query.where("emplacement", "==", emplacement.trim());
      var snap = await query.limit(1000).get();
      var liste = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })
        .filter(function (p) { return (p.disponibleCache || 0) > 0; });
      setAttendues(liste);
      setScannees([]);
      setEtape("scan");
    } catch (e) {
      window.alert("Erreur : " + e.message);
    } finally {
      setChargement(false);
    }
  };

  const surObjetScanne = (objet) => {
    if (objet.type !== "palette") return; // l'inventaire ne porte que sur les palettes (point 22)
    setScannees(function (prev) { return prev.concat([{ paletteId: objet.id, ts: Date.now() }]); });
  };

  const idsAttendus = {}; attendues.forEach(function (p) { idsAttendus[p.paletteId] = p; });
  const idsScannes = {}; scannees.forEach(function (s) { idsScannes[s.paletteId] = true; });
  const manquantes = attendues.filter(function (p) { return !idsScannes[p.paletteId]; });
  const inattendues = scannees.filter(function (s) { return !idsAttendus[s.paletteId]; });

  return (
    <div className="btp-modal-overlay" onClick={onFermer}>
      <div className="btp-modal" style={{ maxWidth: 520, maxHeight: "88vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
        <div className="btp-modal-title" style={{ marginBottom: 12 }}>📋 Inventaire par scan</div>

        {etape === "configuration" && (
          <React.Fragment>
            <label className="btp-label">Emplacement à inventorier (facultatif — laisser vide pour tout)</label>
            <input className="btp-input" placeholder="Ex: Zone A" value={emplacement} onChange={(e) => setEmplacement(e.target.value)} style={{ marginBottom: 14 }} />
            <button className="btn btn-primary btn-full" onClick={demarrer} disabled={chargement}>{chargement ? "Chargement…" : ("▶️ Démarrer l'inventaire" + (emplacement.trim() ? (" — " + emplacement.trim()) : ""))}</button>
            <button className="btn btn-ghost btn-full" style={{ marginTop: 10 }} onClick={onFermer}>Annuler</button>
          </React.Fragment>
        )}

        {etape === "scan" && (
          <React.Fragment>
            <div style={{ fontSize: 13, color: "var(--btp-text2)", marginBottom: 10 }}>{attendues.length} palette(s) attendue(s){emplacement.trim() ? (" en " + emplacement.trim()) : ""}.</div>
            <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 14 }}>
              <button className="btn btn-primary" onClick={() => setShowScanner(true)}>📷 Scanner</button>
              <strong style={{ fontSize: 15 }}>{scannees.length} palette{scannees.length > 1 ? "s" : ""} scannée{scannees.length > 1 ? "s" : ""}</strong>
            </div>
            {scannees.length > 0 && (
              <div style={{ maxHeight: 160, overflowY: "auto", marginBottom: 14, fontSize: 12 }}>
                {scannees.slice().reverse().map(function (s, i) {
                  var ok = !!idsAttendus[s.paletteId];
                  return <div key={i} style={{ color: ok ? "#2ECC71" : "#F39C12" }}>{ok ? "✓" : "⚠️"} {s.paletteId}{!ok ? " (inattendue)" : ""}</div>;
                })}
              </div>
            )}
            <button className="btn btn-success btn-full" onClick={() => setEtape("resultat")}>✅ Terminer l'inventaire</button>
            <button className="btn btn-ghost btn-full" style={{ marginTop: 10 }} onClick={onFermer}>Annuler</button>
          </React.Fragment>
        )}

        {etape === "resultat" && (
          <React.Fragment>
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 13, marginBottom: 4 }}>Attendues : <strong>{attendues.length}</strong> · Scannées : <strong>{scannees.length}</strong></div>
              <div style={{ fontSize: 13, color: manquantes.length > 0 ? "#EC7063" : "#2ECC71" }}>Manquantes : <strong>{manquantes.length}</strong></div>
              <div style={{ fontSize: 13, color: inattendues.length > 0 ? "#F39C12" : "#2ECC71" }}>Inattendues : <strong>{inattendues.length}</strong></div>
            </div>
            {manquantes.length > 0 && (
              <div style={{ marginBottom: 12 }}>
                <strong style={{ fontSize: 12, color: "#EC7063" }}>Palettes attendues non trouvées</strong>
                <ul style={{ margin: "6px 0 0 18px", fontSize: 12 }}>
                  {manquantes.map(function (p) { return <li key={p.paletteId}>{p.paletteId} — lot {p.numeroLot} · {(p.disponibleCache || 0).toLocaleString()} u</li>; })}
                </ul>
              </div>
            )}
            {inattendues.length > 0 && (
              <div style={{ marginBottom: 12 }}>
                <strong style={{ fontSize: 12, color: "#F39C12" }}>Palettes scannées non attendues ici</strong>
                <ul style={{ margin: "6px 0 0 18px", fontSize: 12 }}>
                  {inattendues.map(function (s) { return <li key={s.paletteId}>{s.paletteId}</li>; })}
                </ul>
              </div>
            )}
            {manquantes.length === 0 && inattendues.length === 0 && <div style={{ color: "#2ECC71", fontWeight: 700 }}>🟢 Inventaire conforme : rien à signaler.</div>}
            <p style={{ fontSize: 11, color: "var(--btp-text2)", marginTop: 10 }}>Cet écart est une proposition à vérifier — aucune correction automatique du stock n'a été effectuée.</p>
            <button className="btn btn-ghost btn-full" style={{ marginTop: 10 }} onClick={onFermer}>Fermer</button>
          </React.Fragment>
        )}
      </div>
      {showScanner && (
        <ModaleScanner titre="Scanner les palettes" continu={true} dejaVus={dejaVus}
          onFermer={() => setShowScanner(false)} onObjetReconnu={surObjetScanne} />
      )}
    </div>
  );
}

function GlobalSearch(props) {
  const [ouverte, setOuverte] = React.useState(false);
  const [requete, setRequete] = React.useState("");
  const [recents, setRecents] = React.useState([]);
  const inputRef = React.useRef(null);
  const CLE_RECENTS = "btcmanager_recherche_recents";

  React.useEffect(() => {
    function onKeyDown(e) {
      var k = e.key ? e.key.toLowerCase() : "";
      if ((e.ctrlKey || e.metaKey) && k === "k") {
        e.preventDefault();
        setOuverte(true);
      } else if (e.key === "Escape") {
        setOuverte(false);
      }
    }
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, []);

  React.useEffect(() => {
    if (ouverte) {
      try {
        var raw = localStorage.getItem(CLE_RECENTS);
        setRecents(raw ? JSON.parse(raw) : []);
      } catch (e) { setRecents([]); }
      setTimeout(function () { if (inputRef.current) inputRef.current.focus(); }, 30);
    } else {
      setRequete("");
    }
  }, [ouverte]);

  function memoriserRecent(item) {
    try {
      var raw = localStorage.getItem(CLE_RECENTS);
      var liste = raw ? JSON.parse(raw) : [];
      liste = liste.filter(function (x) { return !(x.type === item.type && x.label === item.label); });
      liste.unshift({ type: item.type, id: item.id, label: item.label, subtitle: item.subtitle });
      localStorage.setItem(CLE_RECENTS, JSON.stringify(liste.slice(0, 6)));
    } catch (e) { /* confort seulement : on ignore si localStorage est indisponible */ }
  }

  function ouvrir(item) {
    memoriserRecent(item);
    setOuverte(false);
    props.ouvrirObjet(item.type, item.type === "nc" ? item.ncData : item.id);
  }

  var tokens = normTxt(requete).split(/\s+/).filter(Boolean);
  function correspond(texte) {
    if (tokens.length === 0) return false;
    var n = normTxt(texte);
    return tokens.every(function (t) { return n.indexOf(t) !== -1; });
  }

  var resLots = [], resPalettes = [], resCommandes = [], resChantiers = [], resNC = [], resProduits = [];
  if (tokens.length > 0) {
    resLots = (props.lots || []).filter(function (l) { return correspond((l.numeroLot || "") + " " + (l.type || "")); }).slice(0, 6);
    resPalettes = (props.palettes || []).filter(function (p) { return correspond((p.paletteId || "") + " " + (p.numeroLot || "") + " " + (p.typeBTC || "")); }).slice(0, 6);
    resCommandes = (props.commandes || []).filter(function (c) { return correspond((c.numBC || "") + " " + (c.client || "") + " " + (c.chantierNom || "") + " " + (c.typNom || c.type || "")); }).slice(0, 6);
    resChantiers = (props.chantiers || []).filter(function (ch) { return correspond((ch.nom || "") + " " + (ch.client || "")); }).slice(0, 6);
    resNC = (props.ncs || []).filter(function (nc) { return correspond((nc.numeroLot || "") + " " + (nc.description || "") + " " + (nc.responsable || "")); }).slice(0, 6);
    resProduits = CATALOGUE.filter(function (p) { return correspond(p.nom + " " + p.id + " " + p.dim); }).slice(0, 6);
  }
  var total = resLots.length + resPalettes.length + resCommandes.length + resChantiers.length + resNC.length + resProduits.length;

  if (!ouverte) {
    return (
      <button className="gsearch-trigger" onClick={() => setOuverte(true)}>
        🔍 <span className="gsearch-trigger-texte">Rechercher</span> <span className="gsearch-kbd">Ctrl+K</span>
      </button>
    );
  }

  return (
    <div className="gsearch-overlay" onClick={() => setOuverte(false)}>
      <div className="gsearch-box" onClick={(e) => e.stopPropagation()}>
        <div className="gsearch-input-row">
          <span>🔍</span>
          <input ref={inputRef} className="gsearch-input"
            placeholder="Lot, palette, commande, chantier, non-conformité, produit…"
            value={requete} onChange={(e) => setRequete(e.target.value)} />
          <button className="gsearch-close" onClick={() => setOuverte(false)}>✕</button>
        </div>
        <div className="gsearch-results">
          {tokens.length === 0 && (
            <div className="gsearch-groupe">
              <div className="gsearch-groupe-titre">Récents</div>
              {recents.length === 0 && <div className="gsearch-vide-inline">Aucune recherche récente.</div>}
              {recents.map(function (r, i) {
                return (
                  <div key={i} className="gsearch-item" onClick={() => ouvrir(r)}>
                    <div className="gsearch-item-titre">{r.label}</div>
                    <div className="gsearch-item-sub">{r.subtitle}</div>
                  </div>
                );
              })}
            </div>
          )}
          {tokens.length > 0 && total === 0 && (
            <div className="gsearch-vide">
              <div>Aucun résultat pour « {requete} »</div>
              <div className="gsearch-suggestions">
                <button className="btn btn-sm btn-ghost" onClick={() => { props.onNavigate("qse"); setOuverte(false); }}>Voir les lots</button>
                <button className="btn btn-sm btn-ghost" onClick={() => { props.onNavigate("chantiers"); setOuverte(false); }}>Voir les chantiers</button>
              </div>
            </div>
          )}
          {resLots.length > 0 && (
            <div className="gsearch-groupe">
              <div className="gsearch-groupe-titre">Lots</div>
              {resLots.map(function (l) {
                return (
                  <div key={l.numeroLot} className="gsearch-item" onClick={() => ouvrir({ type: "lot", id: l.numeroLot, label: l.numeroLot, subtitle: getProduit(l.type).nom })}>
                    <div className="gsearch-item-titre">🏷️ {l.numeroLot}</div>
                    <div className="gsearch-item-sub">{getProduit(l.type).nom} · {(l.quantite || 0).toLocaleString()} u</div>
                  </div>
                );
              })}
            </div>
          )}
          {resPalettes.length > 0 && (
            <div className="gsearch-groupe">
              <div className="gsearch-groupe-titre">Palettes</div>
              {resPalettes.map(function (p) {
                return (
                  <div key={p.paletteId} className="gsearch-item" onClick={() => ouvrir({ type: "palette", id: p.paletteId, label: p.paletteId, subtitle: "Lot " + p.numeroLot })}>
                    <div className="gsearch-item-titre">📦 {p.paletteId}</div>
                    <div className="gsearch-item-sub">Lot {p.numeroLot} · {getProduit(p.typeBTC).nom} · {(p.disponibleCache || 0).toLocaleString()} u dispo.</div>
                  </div>
                );
              })}
            </div>
          )}
          {resChantiers.length > 0 && (
            <div className="gsearch-groupe">
              <div className="gsearch-groupe-titre">Chantiers</div>
              {resChantiers.map(function (ch) {
                return (
                  <div key={ch.id} className="gsearch-item" onClick={() => ouvrir({ type: "chantier", id: ch.id, label: ch.nom, subtitle: "Client : " + (ch.client || "-") })}>
                    <div className="gsearch-item-titre">🏗️ {ch.nom}</div>
                    <div className="gsearch-item-sub">Client : {ch.client || "-"}</div>
                  </div>
                );
              })}
            </div>
          )}
          {resCommandes.length > 0 && (
            <div className="gsearch-groupe">
              <div className="gsearch-groupe-titre">Commandes</div>
              {resCommandes.map(function (c) {
                return (
                  <div key={c.id} className="gsearch-item" onClick={() => ouvrir({ type: "commande", id: c.id, label: c.numBC || "(sans n°)", subtitle: c.chantierNom || c.client || "-" })}>
                    <div className="gsearch-item-titre">📋 {c.numBC || "(sans n°)"}</div>
                    <div className="gsearch-item-sub">{c.chantierNom || c.client || "-"} · {(c.quantite || 0).toLocaleString()} u demandé{(c.quantiteReservee || 0) > 0 ? (" · " + c.quantiteReservee.toLocaleString() + " réservé") : ""}{(c.quantiteLivree || 0) > 0 ? (" · " + c.quantiteLivree.toLocaleString() + " livré") : ""} · reste {Math.max(0, (c.quantite || 0) - (c.quantiteLivree || 0)).toLocaleString()}</div>
                  </div>
                );
              })}
            </div>
          )}
          {resNC.length > 0 && (
            <div className="gsearch-groupe">
              <div className="gsearch-groupe-titre">Non-conformités</div>
              {resNC.map(function (nc) {
                return (
                  <div key={nc.id} className="gsearch-item" onClick={() => ouvrir({ type: "nc", id: nc.id, ncData: nc, label: nc.description, subtitle: (nc.numeroLot || "lot inconnu") + " · " + nc.statut })}>
                    <div className="gsearch-item-titre">🚫 {nc.description}</div>
                    <div className="gsearch-item-sub">{nc.numeroLot || "Lot inconnu"} · {nc.statut}</div>
                  </div>
                );
              })}
            </div>
          )}
          {resProduits.length > 0 && (
            <div className="gsearch-groupe">
              <div className="gsearch-groupe-titre">Produits</div>
              {resProduits.map(function (p) {
                return (
                  <div key={p.id} className="gsearch-item" onClick={() => ouvrir({ type: "produit", id: p.id, label: p.nom, subtitle: p.dim })}>
                    <div className="gsearch-item-titre">🧱 {p.nom}</div>
                    <div className="gsearch-item-sub">{p.dim} · {p.prix.toFixed(2)} €</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// Panneau de diagnostic Phase 5 (Direction uniquement) : compare le compteur agrege existant au
// grand livre de mouvements, et permet d'initialiser le suivi par lot pour les lots anciens.
// Requetes a la demande (bouton), pas d'ecouteur permanent — c'est un outil de transition, pas un
// ecran consulte en continu (point 22).
function DiagnosticStockPhase5({ stocks, user, userData }) {
  const { enLigne, derniereSync } = useConnexion();
  const [ecarts, setEcarts] = React.useState(null);
  const [anomalies, setAnomalies] = React.useState(null);
  const [chargement, setChargement] = React.useState(false);
  const [msgMigration, setMsgMigration] = React.useState("");
  const [migrationEnCours, setMigrationEnCours] = React.useState(false);
  const [msgReparation, setMsgReparation] = React.useState({}); // lot -> message

  // Point 19 : donnees deja chargees une fois (pas d'ecouteur permanent), reutilisees pour le
  // tableau de reconciliation ET pour le diagnostic d'anomalies — un seul jeu de requetes ciblees.
  const calculerDiagnostic = async () => {
    setChargement(true);
    try {
      const [mvtSnap, lotsSnap, allocSnap, cmdSnap, paletteSnap, controlesSnap, ncSnap] = await Promise.all([
        db.collection("stock_mouvements").limit(3000).get(),
        db.collection("qse_lots").limit(1000).get(),
        db.collection("stock_allocations").limit(2000).get(),
        db.collection("commandes").limit(1000).get(),
        db.collection("stock_palettes").limit(2000).get(),
        db.collection("qse_controles").limit(2000).get(),
        db.collection("qse_nc").limit(2000).get()
      ]);
      const mouvements = mvtSnap.docs.map((d) => d.data());
      const lots = lotsSnap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      const allocations = allocSnap.docs.map((d) => d.data());
      const commandes = cmdSnap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      const palettes = paletteSnap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      const controles = controlesSnap.docs.map((d) => d.data());
      const ncs = ncSnap.docs.map((d) => d.data());
      const res = CATALOGUE.map((prod) => reconcilierStockType(prod.id, stocks, mouvements, lots, allocations))
        .filter((r) => r.ancien > 0 || r.calculeDepuisMouvements !== 0 || r.reserve > 0);
      setEcarts(res);
      const controlesParLot = {}; controles.forEach((c) => { if (c.numeroLot) (controlesParLot[c.numeroLot] = controlesParLot[c.numeroLot] || []).push(c); });
      const ncParLot = {}; ncs.forEach((n) => { if (n.numeroLot) (ncParLot[n.numeroLot] = ncParLot[n.numeroLot] || []).push(n); });
      const lotsBloques = lots.filter((l) => l.annule || qseStatutLot(l, controlesParLot[l.numeroLot] || [], ncParLot[l.numeroLot] || []).code === "bloque").map((l) => l.numeroLot);
      setAnomalies(diagnostiquerCoherenceStock(lots, mouvements, allocations, commandes, stocks, palettes, lotsBloques));
    } catch (e) {
      setEcarts([]); setAnomalies([]);
    } finally {
      setChargement(false);
    }
  };

  const lancerMigration = async () => {
    if (!enLigne) { setMsgMigration("🚫 Connexion requise — migration impossible hors connexion."); return; }
    setMigrationEnCours(true);
    setMsgMigration("");
    try {
      const res = await initialiserDisponibleCachePourLotsExistants(user, userData);
      setMsgMigration("✅ " + res.traites + " lot(s) initialisé(s), " + res.ignores + " déjà à jour.");
    } catch (e) {
      setMsgMigration("❌ Erreur : " + e.message);
    } finally {
      setMigrationEnCours(false);
    }
  };

  // Point 20 : reparation controlee — ne touche QUE le cache, avec confirmation et tracabilite.
  const reparerCache = async (a) => {
    if (!window.confirm("Recalculer le cache du lot " + a.lot + " à " + a.attendu.toLocaleString() + " u (valeur déduite du grand livre) ?")) return;
    if (!enLigne) { setMsgReparation(function (prev) { return Object.assign({}, prev, { [a.lot]: "🚫 Connexion requise — réparation impossible hors connexion." }); }); return; }
    try {
      await reparerCacheLot(a.lot, a.attendu, user, userData);
      setMsgReparation(function (prev) { return Object.assign({}, prev, { [a.lot]: "✅ Cache recalculé." }); });
    } catch (e) {
      setMsgReparation(function (prev) { return Object.assign({}, prev, { [a.lot]: "❌ Erreur : " + e.message }); });
    }
  };

  const libellesAnomalie = {
    cache_incoherent: "Cache de disponibilité incohérent avec le grand livre",
    stock_negatif: "Stock physique négatif sur le lot",
    reservation_superieure_au_disponible: "Réservations actives supérieures au stock physique",
    mouvement_sans_allocation_correspondante: "Mouvements de livraison sans allocation correspondante",
    commande_livree_sans_mouvement: "Commande livrée sans mouvement de stock",
    commande_livraison_incoherente: "Quantité livrée de la commande incohérente avec ses allocations",
    compteur_negatif: "Compteur agrégé négatif",
    palette_lot_inexistant: "Palette liée à un lot inexistant",
    palette_type_different: "Type BTC de la palette différent de celui du lot",
    palette_quantite_negative: "Quantité disponible négative sur la palette",
    palette_disponible_sur_lot_bloque: "Palette disponible alors que le lot est bloqué",
    palettes_superieures_au_stock_lot: "Somme des palettes supérieure au stock physique du lot",
    palette_livree_sans_allocation: "Mouvement de livraison sur une palette sans allocation correspondante"
  };

  return (
    <div style={{ background: "var(--btp-card)", borderRadius: 12, padding: 16, marginTop: 20, boxShadow: "0 2px 8px rgba(0,0,0,0.08)" }}>
      {/* Phase 8 (point 33) : panneau support/diagnostic — version, connexion, utilisateur, role,
          derniere synchro reelle (jamais de secret Firebase affiche). Simplifie enormement le
          depannage terrain sans avoir a ouvrir la console du navigateur. */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: "6px 18px", fontSize: 11, color: "var(--btp-text2)", marginBottom: 14, padding: "8px 12px", background: "var(--btp-card2)", borderRadius: 8 }}>
        <span>🏷️ Version <strong>{APP_VERSION}</strong></span>
        <span>{enLigne ? "🟢 En ligne" : "🔴 Hors connexion"}</span>
        <span>👤 {userData.nom || user.email} ({userData.role})</span>
        <span>🔄 Dernière synchro : {derniereSync ? derniereSync.toLocaleTimeString("fr-FR") : "—"}</span>
      </div>
      <h4 style={{ marginBottom: 6, color: "var(--btp-gold)" }}>🔎 Diagnostic stock (grand livre de traçabilité par lot)</h4>
      <p style={{ fontSize: 12, color: "var(--btp-text2)", marginBottom: 12 }}>
        Outil de transition, réservé à la Direction. Un écart n'est pas forcément une anomalie : il correspond souvent au stock antérieur à l'activation du suivi par lot, jamais individuellement journalisé.
      </p>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
        <button className="btn btn-sm btn-gold" onClick={calculerDiagnostic} disabled={chargement}>{chargement ? "Calcul…" : "Calculer l'écart compteur / grand livre"}</button>
        <button className="btn btn-sm btn-ghost" onClick={lancerMigration} disabled={migrationEnCours || !enLigne}>{migrationEnCours ? "Initialisation…" : (!enLigne ? "🚫 Hors connexion" : "Initialiser le suivi par lot (lots existants)")}</button>
      </div>
      {msgMigration && <div style={{ fontSize: 12, marginBottom: 12, color: msgMigration.indexOf("❌") >= 0 ? "#EC7063" : "#2ECC71" }}>{msgMigration}</div>}
      <p style={{ fontSize: 11, color: "var(--btp-text2)", marginBottom: 12, fontStyle: "italic" }}>
        "Initialiser le suivi par lot" fixe, pour chaque lot QSE déjà existant qui n'a pas encore de suivi précis, sa disponibilité de départ = sa quantité produite. Aucun mouvement n'a jamais pu réduire un lot avant cette fonctionnalité, donc cette valeur est fiable. Action idempotente : cliquer plusieurs fois ne modifie pas les lots déjà initialisés, et ne touche à aucune donnée de production ou de qualité.
      </p>

      {anomalies != null && (
        <div style={{ marginBottom: 16, padding: "8px 12px", borderRadius: 8, background: anomalies.length === 0 ? "rgba(46,204,113,.12)" : "rgba(243,156,18,.12)", border: "1px solid " + (anomalies.length === 0 ? "#2ecc71" : "#F39C12") }}>
          <strong>{anomalies.length === 0 ? "🟢 Santé du stock : cohérent" : ("🟠 Santé du stock : " + anomalies.length + " anomalie(s) à vérifier")}</strong>
        </div>
      )}
      {anomalies != null && anomalies.length > 0 && (
        <table className="btp-table" style={{ marginBottom: 16 }}>
          <thead><tr><th>Lot / Commande</th><th>Type d'écart</th><th>Attendu</th><th>Trouvé</th><th></th></tr></thead>
          <tbody>
            {anomalies.map(function (a, i) {
              return (
                <tr key={i}>
                  <td>{a.palette ? (a.palette + (a.lot ? (" (" + a.lot + ")") : "")) : (a.lot || a.numBC || a.typeBTC || "—")}</td>
                  <td>{libellesAnomalie[a.type] || a.type}</td>
                  <td>{a.attendu != null ? a.attendu.toLocaleString() : "—"}</td>
                  <td>{a.trouve != null ? a.trouve.toLocaleString() : "—"}</td>
                  <td>
                    {a.type === "cache_incoherent"
                      ? <button className="btn btn-sm btn-ghost" onClick={() => reparerCache(a)} disabled={!enLigne}>{!enLigne ? "🚫 Hors connexion" : "Recalculer le cache"}</button>
                      : <span style={{ fontSize: 11, color: "var(--btp-text2)" }}>{a.action}</span>}
                    {msgReparation[a.lot] && <div style={{ fontSize: 11, marginTop: 4, color: msgReparation[a.lot].indexOf("❌") >= 0 ? "#EC7063" : "#2ECC71" }}>{msgReparation[a.lot]}</div>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}

      {ecarts && ecarts.length === 0 && <p style={{ fontSize: 12, color: "var(--btp-text2)" }}>Aucun écart notable détecté.</p>}
      {ecarts && ecarts.length > 0 && (
        <table className="btp-table">
          <thead><tr><th>Type BTC</th><th>Physique</th><th>Traçable</th><th>Historique non traçable</th><th>Réservé</th><th>Disponible</th></tr></thead>
          <tbody>
            {ecarts.map((r) => (
              <tr key={r.type}>
                <td>{getProduit(r.type).nom}</td>
                <td>{r.physique.toLocaleString()} u</td>
                <td>{r.tracable.toLocaleString()} u</td>
                <td>{r.historiqueNonTracable.toLocaleString()} u</td>
                <td style={{ color: "#5DADE2" }}>{r.reserve.toLocaleString()} u</td>
                <td style={{ fontWeight: 700, color: "#2ecc71" }}>{r.disponible.toLocaleString()} u</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

  async function handleLogin(e) {

// Barres verticales simples (CSS pur) — production/pertes par type (point 26).
function GraphiqueBarres({ donnees, hauteur }) {
  var max = Math.max.apply(null, donnees.map(function (d) { return d.valeur; }).concat([1]));
  return (
    <div className="pilotage-barres" style={{ height: (hauteur || 130) + "px" }}>
      {donnees.map(function (d, i) {
        return (
          <div key={i} className={"pilotage-barre-col" + (d.onClick ? " cliquable" : "")} title={d.label + " : " + Math.round(d.valeur).toLocaleString()} onClick={d.onClick}>
            <div className="pilotage-barre" style={{ height: Math.max(2, (d.valeur / max) * 100) + "%", background: d.couleur || "var(--btp-orange)" }}></div>
            <div className="pilotage-barre-label">{d.labelCourt || d.label}</div>
          </div>
        );
      })}
      {donnees.length === 0 && <div className="pilotage-vide">Aucune donnée sur cette période.</div>}
    </div>
  );
}
// Courbe SVG minimaliste (aucune librairie) — production quotidienne / evolution NC (point 26).
function GraphiqueLigne({ points, hauteur, couleur }) {
  hauteur = hauteur || 90;
  var largeur = 320;
  if (!points || points.length === 0) return <div className="pilotage-vide">Aucune donnée sur cette période.</div>;
  var max = Math.max.apply(null, points.map(function (p) { return p.y; }).concat([1]));
  var n = points.length;
  var coords = points.map(function (p, i) {
    var x = n > 1 ? (i / (n - 1)) * largeur : largeur / 2;
    var y = hauteur - (p.y / max) * (hauteur - 8) - 4;
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  return (
    <svg viewBox={"0 0 " + largeur + " " + hauteur} className="pilotage-ligne" preserveAspectRatio="none">
      <polyline points={coords} fill="none" stroke={couleur || "var(--btp-blue)"} strokeWidth="2" />
    </svg>
  );
}
// Export CSV generique (point 41) : liste d'objets -> fichier telecharge. Pas de generateur de
// rapport complexe, juste les donnees detaillees derriere un indicateur.
function exporterCSV(nomFichier, lignes, colonnes) {
  var entete = colonnes.map(function (c) { return '"' + c.label.replace(/"/g, '""') + '"'; }).join(";");
  var corps = lignes.map(function (l) {
    return colonnes.map(function (c) {
      var v = typeof c.valeur === "function" ? c.valeur(l) : l[c.champ];
      return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    }).join(";");
  }).join("\n");
  var blob = new Blob(["﻿" + entete + "\n" + corps], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = nomFichier;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}
