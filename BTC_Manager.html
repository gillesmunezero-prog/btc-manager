// Phase 10 — panneau de planification (point 22/24). Desktop : rangee horizontale de cartes-jour.
// Mobile : memes cartes, empilees verticalement (CSS, point 23/48) — jamais un Gantt.
function PanneauPlanification({ indicateurs, commandes, productions, parametres, maintenant, enLigne, user, userData, ouvrirObjet, onFermer }) {
  const [horizon, setHorizon] = React.useState(parametres.horizonPlanificationDefaut || 7);
  const [dernierPlan, setDernierPlan] = React.useState(null);
  const [chargementDernierPlan, setChargementDernierPlan] = React.useState(true);
  const [simulation, setSimulation] = React.useState(null); // null = reel ; sinon overrides temporaires
  const [showSimForm, setShowSimForm] = React.useState(false);
  const [formSim, setFormSim] = React.useState(null);
  const [statutValidation, setStatutValidation] = React.useState({ etat: "idle", texte: "" });
  // Phase 10B : matieres (petite collection, 4 docs — meme cout qu'un ecouteur "stocks") et activites
  // industrielles deja PLANIFIEES sur l'horizon (requete ciblee, point 49 — jamais tout l'historique).
  const [matieresStockPlan, setMatieresStockPlan] = React.useState({});
  const [activitesHorizon, setActivitesHorizon] = React.useState([]);
  React.useEffect(function () {
    var u = db.collection("matieres_stock").onSnapshot(function (snap) {
      var m = {}; snap.docs.forEach(function (d) { m[d.id] = d.data(); }); setMatieresStockPlan(m);
    });
    return u;
  }, []);
  React.useEffect(function () {
    var debutISO = dateLocaleISO(maintenant);
    db.collection("activites_industrielles").where("date", ">=", debutISO).limit(500).get()
      .then(function (snap) { setActivitesHorizon(snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })); })
      .catch(function () { setActivitesHorizon([]); });
  }, [maintenant]);
  const activitesParJourISO = React.useMemo(function () {
    var m = {};
    activitesHorizon.forEach(function (a) { (m[a.date] = m[a.date] || []).push(a); });
    return m;
  }, [activitesHorizon]);

  React.useEffect(function () {
    chargerDernierPlanProduction().then(function (p) { setDernierPlan(p); setChargementDernierPlan(false); }).catch(function () { setChargementDernierPlan(false); });
  }, []);

  const parametresEffectifs = React.useMemo(function () {
    return simulation ? Object.assign({}, parametres, simulation) : parametres;
  }, [parametres, simulation]);

  // Point BO : simulation "camions supplementaires" — n'affecte QUE le calcul en memoire du plan
  // simule, jamais matieres_stock reellement lu/ecrit en base.
  const matieresStockEffectif = React.useMemo(function () {
    var camionsSup = simulation && simulation.terreSupplementaireCamions;
    if (!camionsSup) return matieresStockPlan;
    var volumeSup = camionsSup * (parametres.capaciteBenneDefautM3 || 15);
    var terreActuelle = matieresStockPlan.terre || { quantite: 0, unite: "m3", coutMoyenPondere: 0 };
    return Object.assign({}, matieresStockPlan, { terre: Object.assign({}, terreActuelle, { quantite: (terreActuelle.quantite || 0) + volumeSup }) });
  }, [matieresStockPlan, simulation, parametres.capaciteBenneDefautM3]);

  const planCalcule = React.useMemo(function () {
    return calculerPlanProduction(indicateurs, { commandes: commandes, productions: productions, matieresStock: matieresStockEffectif, activitesParJourISO: activitesParJourISO }, parametresEffectifs, horizon, maintenant);
  }, [indicateurs, commandes, productions, matieresStockEffectif, activitesParJourISO, parametresEffectifs, horizon, maintenant]);

  // Jamais de diff / de bouton de validation actif en mode simulation (point 17 : aucune donnee
  // reelle n'est modifiee ; comparer une simulation au plan reel serait trompeur).
  const diff = React.useMemo(function () {
    if (!dernierPlan || simulation) return null;
    return calculerDiffPlan(dernierPlan.lignes, planCalcule.planLignes);
  }, [dernierPlan, planCalcule, simulation]);

  // Points 8/9 : projection jour par jour du stock, pour reveler une rupture TEMPORAIRE meme quand
  // le plan produit globalement assez sur l'horizon (ex : commande a echeance avant que la
  // production planifiee pour la couvrir ait fini de secher). Desactivee tant qu'aucun calendrier
  // n'est possible (pas de date de maturite fiable sans capacite configuree).
  const projectionStock = React.useMemo(function () {
    if (!planCalcule.calendrierPossible) return null;
    return calculerProjectionStock(planCalcule, indicateurs.parType, commandes, horizon, maintenant);
  }, [planCalcule, indicateurs, commandes, horizon, maintenant]);
  const typesEnRuptureTemporaire = React.useMemo(function () {
    if (!projectionStock) return [];
    return Object.keys(projectionStock.parType).map(function (t) { return projectionStock.parType[t]; }).filter(function (p) { return p.ruptureTemporaire; });
  }, [projectionStock]);
  const [voirCalendrierStock, setVoirCalendrierStock] = React.useState(false);

  const joursCartes = React.useMemo(function () {
    var parJour = {};
    planCalcule.joursTravailles.forEach(function (ms) { parJour[ms] = []; });
    planCalcule.planLignes.forEach(function (l) { (parJour[l.dateMs] = parJour[l.dateMs] || []).push(l); });
    return Object.keys(parJour).map(Number).sort(function (a, b) { return a - b; }).map(function (ms) { return { dateMs: ms, lignes: parJour[ms] }; });
  }, [planCalcule]);

  const valider = async function () {
    if (simulation) return;
    var token = "plan_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    await executerOperationCritique({
      cle: "valider_plan_production", enLigne: enLigne, setStatut: setStatutValidation,
      texteEnCours: "Enregistrement du plan...", texteSucces: "✓ Plan de production validé (v" + ((dernierPlan ? (dernierPlan.version || 0) : 0) + 1) + ").",
      texteHorsLigne: "🚫 Connexion requise — validation du plan impossible hors connexion.",
      operation: function () { return validerPlanProduction(planCalcule, token, user, userData); },
      onSuccess: function () { chargerDernierPlanProduction().then(setDernierPlan); }
    }).catch(function () {});
  };

  var tierCouleur = { 1: "#EC7063", 2: "#F39C12", 3: "#5DADE2", 4: "#2ECC71" };

  return (
    <div className="btp-modal-overlay" onClick={onFermer}>
      <div className="btp-modal plan-panneau" onClick={(e) => e.stopPropagation()}>
        <div className="btp-modal-title" style={{ marginBottom: 4 }}>📅 Planification de la production</div>
        <div style={{ fontSize: 12, color: "var(--btp-text2)", marginBottom: 14 }}>Plan calculé à partir du stock, des commandes et de la capacité — jamais une décision automatique, toujours soumis à validation humaine.</div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", marginBottom: 14 }}>
          <div className="pilotage-selecteur-periode">
            {[7, 14, 30].map(function (h) { return <button key={h} className={"pilotage-periode-btn" + (horizon === h ? " active" : "")} onClick={() => setHorizon(h)}>{h} jours</button>; })}
          </div>
          <button className="btn btn-sm btn-ghost" onClick={() => { setFormSim(simulation || Object.assign({}, parametres)); setShowSimForm(true); }}>{simulation ? "🧪 Modifier la simulation" : "🧪 Et si… (simulation)"}</button>
          {simulation && <button className="btn btn-sm btn-danger" onClick={() => setSimulation(null)}>Quitter la simulation</button>}
        </div>

        {simulation && (
          <div className="btp-alert" style={{ background: "rgba(93,173,226,.12)", border: "1px solid rgba(93,173,226,.4)", color: "#5DADE2", marginBottom: 14, fontSize: 12, fontWeight: 700 }}>
            🧪 Mode simulation actif — aucune donnée réelle n'est modifiée. Validation désactivée tant que la simulation est active.
          </div>
        )}

        {planCalcule.echeancesImpossibles.length > 0 && (
          <div className="btp-alert alert-error" style={{ marginBottom: 14 }}>
            <strong>⚠️ Échéance(s) impossible(s) à tenir</strong>
            <ul style={{ margin: "6px 0 0 18px", fontSize: 12 }}>
              {planCalcule.echeancesImpossibles.map(function (e, i) {
                return <li key={i}>{getProduit(e.commande.type).nom} — {e.commande.numBC || e.commande.id} : {e.message}</li>;
              })}
            </ul>
          </div>
        )}

        {/* Points 8/9 : rupture temporaire de stock reveleee par la projection jour-par-jour, meme
            si le total planifie sur l'horizon suffit — jamais masquee derriere le plan. */}
        {typesEnRuptureTemporaire.length > 0 && (
          <div className="btp-alert alert-error" style={{ marginBottom: 14 }}>
            <strong>⚠️ Rupture temporaire de stock malgré le plan</strong>
            <div style={{ fontSize: 12, marginTop: 4, color: "var(--btp-text2)" }}>La production planifiée suffit sur l'ensemble de l'horizon, mais certaines commandes arrivent à échéance avant que la production correspondante ait fini de sécher.</div>
            <ul style={{ margin: "6px 0 0 18px", fontSize: 12 }}>
              {typesEnRuptureTemporaire.map(function (p, i) {
                return <li key={i}>{p.produit.nom} : rupture prévue le {new Date(p.premiereRuptureMs).toLocaleDateString("fr-FR")}</li>;
              })}
            </ul>
            <button className="btn btn-sm btn-ghost" style={{ marginTop: 8 }} onClick={() => setVoirCalendrierStock(!voirCalendrierStock)}>{voirCalendrierStock ? "Masquer" : "Voir"} le calendrier de stock projeté</button>
          </div>
        )}
        {voirCalendrierStock && projectionStock && (
          <div style={{ overflowX: "auto", marginBottom: 14 }}>
            <table className="btp-table">
              <thead><tr><th>Type BTC</th>{projectionStock.jours.map(function (j, i) { return <th key={i}>{new Date(j).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" })}</th>; })}</tr></thead>
              <tbody>
                {typesEnRuptureTemporaire.map(function (p, i) {
                  return (
                    <tr key={i}>
                      <td>{p.produit.nom}</td>
                      {p.points.map(function (pt, j) { return <td key={j} style={{ color: pt.rupture ? "#EC7063" : "var(--btp-text)", fontWeight: pt.rupture ? 800 : 400 }}>{pt.stock.toLocaleString()}</td>; })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

        {!planCalcule.calendrierPossible ? (
          <div>
            <div className="btp-alert" style={{ background: "rgba(240,165,0,.12)", border: "1px solid rgba(240,165,0,.35)", color: "#F0A500", marginBottom: 14, fontSize: 13 }}>
              ℹ️ {planCalcule.messageSiPasDeCalendrier}
            </div>
            <table className="btp-table">
              <thead><tr><th>Priorité</th><th>Type BTC</th><th>Besoin</th><th>Motif</th></tr></thead>
              <tbody>
                {planCalcule.lignesPrioritaires.filter(function (l) { return l.besoin.besoin > 0; }).map(function (l, i) {
                  return (<tr key={i}><td style={{ color: tierCouleur[l.score.tier] }}>{l.score.libelleTier}</td><td>{l.produit.nom}</td><td>{l.besoin.besoin.toLocaleString()} u</td><td style={{ fontSize: 11 }}>{l.motif}</td></tr>);
                })}
              </tbody>
            </table>
          </div>
        ) : (
          <div className="plan-jours-rangee">
            {joursCartes.map(function (jc) {
              var d = new Date(jc.dateMs);
              return (
                <div key={jc.dateMs} className="plan-jour-carte">
                  <div className="plan-jour-date">{d.toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit" })}</div>
                  {jc.lignes.length === 0 && <div className="pilotage-vide" style={{ padding: "10px 0" }}>—</div>}
                  {jc.lignes.map(function (l, i) {
                    return (
                      <div key={i} className="plan-ligne" style={{ borderLeftColor: tierCouleur[l.tier] }} title={l.motif}>
                        <div className="plan-ligne-type">{getProduit(l.typeBTC).nom}</div>
                        <div className="plan-ligne-qte">{l.quantite.toLocaleString()} u</div>
                        <div className="plan-ligne-tier" style={{ color: tierCouleur[l.tier] }}>{l.libelleTier}</div>
                        <div className="plan-ligne-maturite">Maturité prévue : {new Date(l.dateMaturiteTheorique).toLocaleDateString("fr-FR")}</div>
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        )}

        {Object.keys(planCalcule.resteNonPlanifie).length > 0 && (
          <div style={{ fontSize: 12, color: "#F39C12", marginTop: 10 }}>
            ⚠️ Au-delà de {horizon} jours à cette capacité, il reste à planifier : {Object.keys(planCalcule.resteNonPlanifie).map(function (t) { return getProduit(t).nom + " (" + planCalcule.resteNonPlanifie[t].toLocaleString() + " u)"; }).join(", ")}.
          </div>
        )}

        {/* Phase 10B (parties R-V) : changements de moule proposes par le moteur — jamais decides
            silencieusement, toujours expliques (echeance, duree, unites perdues). */}
        {planCalcule.changementsMouleProposes && planCalcule.changementsMouleProposes.length > 0 && (
          <div className="pilotage-section" style={{ marginTop: 16 }}>
            <div className="pilotage-section-titre">🔧 Changements de moule proposés</div>
            <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13 }}>
              {planCalcule.changementsMouleProposes.map(function (c, i) {
                return (
                  <li key={i}>
                    {new Date(c.dateMs).toLocaleDateString("fr-FR")} : {getProduit(c.ancienMoule).nom} → {getProduit(c.nouveauMoule).nom} ({c.dureeHeures} h, ≈{c.unitesPerdues.toLocaleString()} u de capacité perdue){c.urgence ? " — ⚠️ changement anticipé recommandé pour sécuriser une commande urgente" : ""}
                  </li>
                );
              })}
            </ul>
          </div>
        )}

        {/* Points AW/AX : matiere limitante et approvisionnement necessaire pour ce plan — n'apparait
            que si un stock matieres a ete charge (jamais une valeur fabriquee). */}
        {planCalcule.capaciteMatieres && (
          <div className="pilotage-section" style={{ marginTop: 16 }}>
            <div className="pilotage-section-titre">🧱 Matières premières</div>
            {!planCalcule.capaciteMatieres.calculable && <div style={{ fontSize: 12, color: "var(--btp-text2)", marginBottom: 6 }}>{planCalcule.capaciteMatieres.avertissement}</div>}
            <div style={{ fontSize: 13, marginBottom: 6 }}>Capacité de production permise par les matières : <strong>{planCalcule.capaciteMatieres.capaciteBTC != null ? planCalcule.capaciteMatieres.capaciteBTC.toLocaleString() + " u" : "—"}</strong>{planCalcule.capaciteMatieres.matiereLimitante ? (" — matière limitante : " + getLibelleMatiere(planCalcule.capaciteMatieres.matiereLimitante)) : ""}</div>
            {planCalcule.approvisionnement && planCalcule.approvisionnement.lignes.some(function (l) { return l.manque > 0; }) && (
              <div>
                <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 4 }}>À approvisionner pour ce plan ({planCalcule.totalPlanifieBTC.toLocaleString()} u planifiés) :</div>
                <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13 }}>
                  {planCalcule.approvisionnement.lignes.filter(function (l) { return l.manque > 0; }).map(function (l, i) {
                    return <li key={i}>{getLibelleMatiere(l.id)} : manque {l.manque.toFixed(1)} {l.unite}{l.camionsNecessaires ? (" — soit " + l.camionsNecessaires + " camion(s) de " + planCalcule.approvisionnement.capaciteCamionM3 + " m³") : ""}</li>;
                  })}
                </ul>
              </div>
            )}
          </div>
        )}

        {diff && diff.length > 0 && (
          <div className="pilotage-section" style={{ marginTop: 16 }}>
            <div className="pilotage-section-titre">Différences par rapport au dernier plan validé (v{dernierPlan.version})</div>
            <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13 }}>
              {diff.map(function (d, i) {
                return (
                  <li key={i}>{getProduit(d.typeBTC).nom} : {d.deltaQuantite !== 0 ? ((d.deltaQuantite > 0 ? "+" : "") + d.deltaQuantite.toLocaleString() + " u") : "quantité inchangée"}
                    {d.deltaJours ? (", " + (d.deltaJours < 0 ? ("avancé de " + Math.abs(d.deltaJours) + " j") : ("reporté de " + d.deltaJours + " j"))) : ""}
                  </li>
                );
              })}
            </ul>
          </div>
        )}
        {dernierPlan && !chargementDernierPlan && (!diff || diff.length === 0) && !simulation && (
          <div style={{ fontSize: 12, color: "var(--btp-text2)", marginTop: 10 }}>Identique au dernier plan validé (v{dernierPlan.version}).</div>
        )}

        {statutValidation.texte && <div style={{ marginTop: 12, fontSize: 13, fontWeight: 700, color: statutValidation.etat === "echec" ? "#EC7063" : "#2ECC71" }}>{statutValidation.texte}</div>}

        <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
          <button className="btn btn-full" style={{ background: "#1E8449", color: "white" }} disabled={!!simulation || !planCalcule.calendrierPossible || statutValidation.etat === "encours" || !enLigne}
            onClick={valider}>
            {statutValidation.etat === "encours" ? "Enregistrement…" : (!enLigne ? "🚫 Hors connexion" : "✓ Valider le plan")}
          </button>
          <button className="btn btn-ghost btn-full" onClick={onFermer}>Fermer</button>
        </div>
      </div>

      {showSimForm && formSim && (
        <div className="btp-modal-overlay" onClick={() => setShowSimForm(false)}>
          <div className="btp-modal" style={{ maxWidth: 400 }} onClick={(e) => e.stopPropagation()}>
            <div className="btp-modal-title" style={{ marginBottom: 4 }}>🧪 Scénario "Et si…"</div>
            <div style={{ fontSize: 12, color: "var(--btp-text2)", marginBottom: 12 }}>Modifie temporairement les hypothèses pour voir l'impact — aucune donnée réelle n'est touchée.</div>
            <label className="btp-label">Capacité journalière (u/j)</label>
            <input type="number" className="btp-input" style={{ width: "100%", marginBottom: 10 }} value={formSim.capaciteJournaliere || ""} onChange={(e) => setFormSim(Object.assign({}, formSim, { capaciteJournaliere: e.target.value ? parseInt(e.target.value, 10) : null }))} />
            <label className="btp-label">Stock cible par défaut (u)</label>
            <input type="number" className="btp-input" style={{ width: "100%", marginBottom: 10 }} value={formSim.stockCibleDefaut || ""} onChange={(e) => setFormSim(Object.assign({}, formSim, { stockCibleDefaut: parseInt(e.target.value, 10) || 0 }))} />
            <label className="btp-label">Durée de séchage (jours)</label>
            <input type="number" className="btp-input" style={{ width: "100%", marginBottom: 10 }} value={formSim.dureeSechageJours || ""} onChange={(e) => setFormSim(Object.assign({}, formSim, { dureeSechageJours: parseInt(e.target.value, 10) || parametres.dureeSechageJours }))} />
            <label className="btp-label">Heures de travail / jour (point BX-CA)</label>
            <input type="number" className="btp-input" style={{ width: "100%", marginBottom: 10 }} value={formSim.heuresTravailJour || ""} onChange={(e) => setFormSim(Object.assign({}, formSim, { heuresTravailJour: e.target.value ? parseFloat(e.target.value) : null }))} />
            <label className="btp-label">🚚 Camions de terre supplémentaires (point BO)</label>
            <input type="number" className="btp-input" style={{ width: "100%", marginBottom: 14 }} value={formSim.terreSupplementaireCamions || ""} onChange={(e) => setFormSim(Object.assign({}, formSim, { terreSupplementaireCamions: e.target.value ? parseInt(e.target.value, 10) : 0 }))} />
            <div style={{ display: "flex", gap: 10 }}>
              <button className="btn btn-full" style={{ background: "#5DADE2", color: "white" }} onClick={() => { setSimulation(formSim); setShowSimForm(false); }}>Appliquer la simulation</button>
              <button className="btn btn-ghost btn-full" onClick={() => setShowSimForm(false)}>Annuler</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// Le cockpit lui-meme. 5 lignes (point 24) : chiffres cles / production dans le temps / stock-
// couverture-besoins / qualite-NC / priorites decisionnelles. Chaque donnee affichee provient du
// moteur d'indicateurs (calculerIndicateursIndustriels) — aucun calcul propre au composant.
function PilotageDirection({ user, userData, stocks, commandes, productions, lots, controles, ncs, chantiers, ouvrirObjet }) {
  const { enLigne } = useConnexion();
  const [showPlanification, setShowPlanification] = React.useState(false);
  const [periodeCle, setPeriodeCle] = React.useState("30j");
  const [customDebut, setCustomDebut] = React.useState("");
  const [customFin, setCustomFin] = React.useState("");
  const [mouvements, setMouvements] = React.useState([]);
  const [allocations, setAllocations] = React.useState([]);
  const [chargement, setChargement] = React.useState(true);
  const [parametres, setParametres] = React.useState(PARAMETRES_INDUSTRIELS_DEFAUT);
  const [showParametres, setShowParametres] = React.useState(false);
  const [formParametres, setFormParametres] = React.useState(null);
  const [msgParametres, setMsgParametres] = React.useState("");
  const [detail, setDetail] = React.useState(null); // { titre, colonnes, lignes, onLigneClick?, nomExportCSV? }

  // Instant de reference fige a l'ouverture de l'ecran : coherent pendant toute la session de
  // consultation, evite qu'un recalcul de "maintenant" a chaque rendu ne fasse glisser les bornes.
  const maintenant = React.useMemo(function () { return Date.now(); }, []);
  const periode = React.useMemo(function () {
    return calculerPeriode(periodeCle, maintenant, periodeCle === "custom" ? { debut: customDebut, fin: customFin } : null);
  }, [periodeCle, maintenant, customDebut, customFin]);
  const periodeAvant = React.useMemo(function () { return periodePrecedente(periode); }, [periode]);

  React.useEffect(function () { chargerParametresIndustriels().then(setParametres); }, []);

  // Point 37/38 : requetes filtrees par periode (une seule inegalite sur dateCreation, aucun index
  // composite necessaire), rechargees uniquement quand la periode change — jamais tout l'historique.
  React.useEffect(function () {
    var annule = false;
    setChargement(true);
    (async function () {
      var debutGlobal = Math.min(periode.debut, periodeAvant.debut);
      try {
        var mvtSnap = await db.collection("stock_mouvements").where("dateCreation", ">=", new Date(debutGlobal)).limit(3000).get();
        var allocSnap = await db.collection("stock_allocations").limit(2000).get();
        if (annule) return;
        setMouvements(mvtSnap.docs.map(function (d) { return d.data(); }));
        setAllocations(allocSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
      } catch (e) { if (!annule) { setMouvements([]); setAllocations([]); } }
      finally { if (!annule) setChargement(false); }
    })();
    return function () { annule = true; };
  }, [periode.debut, periodeAvant.debut]);

  const indicateurs = React.useMemo(function () {
    return calculerIndicateursIndustriels({
      productions: productions, lots: lots, controles: controles, ncs: ncs,
      mouvements: mouvements, allocations: allocations, commandes: commandes, stocks: stocks, maintenant: maintenant
    }, periode, parametres);
  }, [productions, lots, controles, ncs, mouvements, allocations, commandes, stocks, periode, parametres, maintenant]);

  const lotsParNumero = React.useMemo(function () { return indexerParNumeroLot(lots); }, [lots]);
  const prioriteDonneesPilotage = React.useMemo(function () {
    return { stocks: stocks, commandes: commandes, lots: lots, controlesEnAttente: controles.filter(function (c) { return !c.resultat || c.resultat === "Non mesuré"; }), numerosAvecControleRecent: {}, ncs: ncs, mouvements: mouvements, maintenant: maintenant };
  }, [stocks, commandes, lots, controles, ncs, mouvements, maintenant]);

  // Point 34 : synthese "Besoin total / Planifié / Capacité disponible" visible directement dans le
  // cockpit, sans ouvrir le panneau de planification. Reutilise integralement les agregats deja
  // charges (indicateurs/commandes/productions/parametres) — aucune requete Firestore supplementaire
  // (point 49). Horizon fixe a la valeur par defaut (7 j, point 16) pour rester une vue "aujourd'hui",
  // coherente avec la valeur par defaut du panneau de planification lui-meme.
  const resumePlanCockpit = React.useMemo(function () {
    var horizon = parametres.horizonPlanificationDefaut || 7;
    var plan = calculerPlanProduction(indicateurs, { commandes: commandes, productions: productions }, parametres, horizon, maintenant);
    var besoinTotal = indicateurs.parType.reduce(function (s, x) { return s + x.besoin.besoin; }, 0);
    var planifieTotal = plan.planLignes.reduce(function (s, l) { return s + l.quantite; }, 0);
    var joursOuvres = plan.joursTravailles.length;
    var capaciteDisponible = parametres.capaciteJournaliere != null ? parametres.capaciteJournaliere * joursOuvres : null;
    // Risques de rupture (etat != "indetermine", besoin reel) que ce plan couvre effectivement par
    // une quantite planifiee sur l'horizon — jamais une affirmation causale plus forte que ca.
    var rupturesCouvertes = indicateurs.parType.filter(function (x) {
      if (x.rupture.etat === "indetermine" || !(x.besoin.besoin > 0)) return false;
      return plan.planLignes.some(function (l) { return l.typeBTC === x.produit.id; });
    }).length;
    return { horizon: horizon, besoinTotal: besoinTotal, planifieTotal: planifieTotal, capaciteDisponible: capaciteDisponible, calendrierPossible: plan.calendrierPossible, rupturesCouvertes: rupturesCouvertes };
  }, [indicateurs, commandes, productions, parametres, maintenant]);

  const enregistrerParametres = async function () {
    setMsgParametres("Enregistrement...");
    try {
      await enregistrerParametresIndustriels(formParametres, user, userData);
      var frais = await chargerParametresIndustriels();
      setParametres(frais); setMsgParametres("✓ Paramètres enregistrés."); setShowParametres(false);
    } catch (e) { setMsgParametres("❌ Échec de l'enregistrement — aucune modification confirmée. (" + e.message + ")"); }
  };

  var couleurVar = function (variationPct, sensPositifSiHausse) {
    if (variationPct == null) return "var(--btp-text2)";
    var favorable = sensPositifSiHausse ? variationPct >= 0 : variationPct <= 0;
    return favorable ? "#2ECC71" : "#EC7063";
  };

  var pointsProductionQuotidienne = React.useMemo(function () {
    var parJour = {};
    productions.forEach(function (p) {
      var t = qseTsMs(p.timestamp);
      if (!dansPeriode(t, periode)) return;
      var d = new Date(t);
      var cle = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
      parJour[cle] = (parJour[cle] || 0) + (p.quantite || 0);
    });
    return Object.keys(parJour).sort().map(function (k) { return { x: k, y: parJour[k] }; });
  }, [productions, periode]);

  var pointsEvolutionNC = React.useMemo(function () {
    var parSemaine = {};
    ncs.forEach(function (n) {
      var t = qseTsMs(n.dateCreation);

  function exportCSV(rows, colonnes, nomFichier){
    try{
      var sep=";";
      var esc=function(val){ if(val===null||val===undefined) return ""; var sVal=String(val); if(sVal.indexOf(String.fromCharCode(34))>=0||sVal.indexOf(sep)>=0||sVal.indexOf("\n")>=0){ sVal=String.fromCharCode(34)+sVal.split(String.fromCharCode(34)).join(String.fromCharCode(34)+String.fromCharCode(34))+String.fromCharCode(34); } return sVal; };
      var entete=colonnes.map(function(c){return esc(c.titre);}).join(sep);
      var lignes=rows.map(function(r){ return colonnes.map(function(c){ var v=(typeof c.valeur==="function")?c.valeur(r):r[c.cle]; return esc(v); }).join(sep); });
      var contenu=[entete].concat(lignes).join("\r\n");
      var blob=new Blob(["\uFEFF"+contenu],{type:"text/csv;charset=utf-8;"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      var d=new Date(); var ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      a.href=url; a.download=nomFichier+"_"+ds+".csv";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
    }catch(e){ alert("Erreur export : "+e.message); }
  }

<div style={{fontSize:26,fontWeight:800,color:coul,lineHeight:1.1}}>{qte===null?"—":qte.toLocaleString()} <span style={{fontSize:13,fontWeight:600,color:"var(--btp-text2)"}}>{m.unite}</span></div>
<div style={{fontSize:11,color:"var(--btp-text2)",marginTop:6}}>Seuil d'alerte : {seuil===null?"—":seuil.toLocaleString()+" "+m.unite}</div>
<div style={{fontSize:11,color:"var(--btp-text2)"}}>Dernier inventaire : {d.dateInventaire||"—"}{d.responsable?(" · "+d.responsable):""}</div>
{rupture&&<div style={{marginTop:6,fontSize:12,fontWeight:700,color:"#E74C3C"}}>⛔ Stock critique — risque d'arrêt de production</div>}
</div>
);
})}
</div>
<div style={{textAlign:"right"}}>

  setMatInv(init); setMatInvMsg("");
}}>📋 Faire l'inventaire</button>
</div>
</div>
);
})()}

<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000}} onClick={function(e){if(e.target===e.currentTarget)setMatInv(null);}}>
<div style={{background:"var(--btp-card)",borderRadius:14,padding:22,width:"92%",maxWidth:480,maxHeight:"90vh",overflowY:"auto"}}>

{[{id:"ciment",nom:"Ciment",unite:"sacs"},{id:"mortier",nom:"Mortier de pose BTC",unite:"sacs"},{id:"sable",nom:"Sable",unite:"m³"},{id:"terre",nom:"Terre",unite:"m³"}].map(function(m){
return(

<input type="number" value={matInv[m.id]?matInv[m.id].seuil:""} onChange={function(e){var v=e.target.value;setMatInv(function(prev){var n=Object.assign({},prev);n[m.id]=Object.assign({},n[m.id],{seuil:v});return n;});}} style={{width:"100%",padding:"8px",borderRadius:8,border:"1px solid #CCC"}} placeholder="0"/>
</div>
</div>
</div>
);
})}
{matInvMsg&&<div style={{fontSize:12,color:matInvMsg.indexOf("✅")>=0?"#1DB954":"#E74C3C",marginBottom:8}}>{matInvMsg}</div>}

<button className="btn btn-sm btn-gold" onClick={async function(){
  setMatInvMsg("Enregistrement...");
  try{
    var today=new Date().toLocaleDateString("fr-FR");
    var resp=(userData&&(userData.nom||userData.email))||(user&&user.email)||"Direction";
    var defs=[{id:"ciment",nom:"Ciment",unite:"sacs"},{id:"mortier",nom:"Mortier de pose BTC",unite:"sacs"},{id:"sable",nom:"Sable",unite:"m³"},{id:"terre",nom:"Terre",unite:"m³"}];
    for(var i=0;i<defs.length;i++){
      var m=defs[i]; var v=matInv[m.id]||{};
      var data={nom:m.nom,unite:m.unite,dateInventaire:today,responsable:resp,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
      if(v.quantite!=="" && v.quantite!=null) data.quantite=Number(v.quantite);
      if(v.seuil!=="" && v.seuil!=null) data.seuil=Number(v.seuil);
      await db.collection("matieres").doc(m.id).set(data,{merge:true});
    }
    setMatInvMsg("✅ Inventaire enregistré !");
    setTimeout(function(){setMatInv(null);},900);
  }catch(err){ setMatInvMsg("Erreur : "+err.message); }
}}>💾 Enregistrer l'inventaire</button>

function FicheChantierChef({ chantier, commandes, onClose, user, userData }) {
  const [tabFiche, setTabFiche] = useState("suivi");
  const [cmdType, setCmdType] = useState("");
  const [cmdQte, setCmdQte] = useState("");
  const [cmdNotes, setCmdNotes] = useState("");
  const [cmdDateBesoin, setCmdDateBesoin] = useState(""); // Phase 10 (point 11/19) : echeance optionnelle, jamais inventee si absente
  const [msgCmd, setMsgCmd] = useState("");
  const [qteNonConformeInput, setQteNonConformeInput] = React.useState({});

  var cmdCh = commandes.filter(function(c){ return c.chantierId === chantier.id; });
  var besoins = chantier.besoins || {};
  var typesChantier = CATALOGUE.filter(function(p){ return (besoins[p.id]||0) > 0; });

  // Résumé par type
  var lignes = typesChantier.map(function(prod) {
    var besoin = besoins[prod.id] || 0;
    var cmdTotal = cmdCh.filter(function(c){ return c.type===prod.id; }).reduce(function(a,c){ return a+(c.quantite||0); }, 0);
    var recu = cmdCh.filter(function(c){ return c.type===prod.id; }).reduce(function(a,c){ return a+(c.quantiteLivree||0); }, 0);
    var reste = Math.max(0, besoin - recu);
    return { prod:prod, besoin:besoin, cmdTotal:cmdTotal, recu:recu, reste:reste };
  });

  var passerCommande = async function() {
    if (!cmdType||!cmdQte) { setMsgCmd("Choisissez un type et entrez la quantite"); return; }
    try {
      // Générer numéro BC unique
      var now = new Date();
      var yyyy = now.getFullYear();
      var mm = String(now.getMonth()+1).padStart(2,"0");
      var rand = Math.floor(1000+Math.random()*9000);
      var numBC = "BC-"+yyyy+mm+"-"+rand;
      var catItem = CATALOGUE.find(function(p){return p.id===cmdType;})||{};
      await db.collection("commandes").add({
        numBC: numBC,
        type: cmdType, typNom: catItem.nom||cmdType, quantite: parseInt(cmdQte), notes: cmdNotes,
        dateBesoin: cmdDateBesoin || null,
        chantierId: chantier.id, chantierNom: chantier.nom, client: chantier.client,
        chefUid: user.uid, chefEmail: user.email, chefNom: userData.nom||user.email,
        status: "EnAttente", quantiteLivree: 0,
        prixUnit: catItem.prix||0,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      try { await db.collection("evenements").add({ numBC: numBC, chantier: chantier.nom||"", action: "Commande créée", acteur: userData.nom||user.email, role: "chef_chantier", details: "N°"+numBC+" | BTC: "+cmdType+" | Qté: "+cmdQte+" | Chantier: "+(chantier.nom||""), statut: "En attente validation Direction", timestamp: firebase.firestore.FieldValue.serverTimestamp() }); } catch(e) {}
      setMsgCmd("Commande envoyée ! Bon de commande "+numBC+" créé. En attente de validation Direction.");
      setCmdQte(""); setCmdNotes(""); setCmdType(""); setCmdDateBesoin("");
      setTabFiche("suivi");
    } catch(e) { setMsgCmd("Erreur: "+e.message); }
  };

  var validerReception = async function(cmdId, qteRecue, nonConforme) {
    var cmd = cmdCh.find(function(c){return c.id===cmdId;});
    if (!cmd) return;
    var cmdQteTotal = (cmd.quantite||0);
    var deja = (cmd.quantiteConfirmeeChef||0);
    var nouveauTotal = Math.min(deja + qteRecue, cmdQteTotal);
    var newStatus = (nouveauTotal >= cmdQteTotal) ? "Livree" : cmd.status;
    var nc = parseInt(nonConforme)||0;
    var prix = 0;
    var catItem = CATALOGUE.find(function(p){return p.id===cmd.type;});
    if(catItem) prix = catItem.prix||0;
    var updateObj = { quantiteConfirmeeChef:nouveauTotal, chefConfirmeAt:firebase.firestore.FieldValue.serverTimestamp(), status:newStatus };
    if(nc>0){ updateObj.qteNonConforme=(cmd.qteNonConforme||0)+nc; updateObj.montantNonConforme=((cmd.qteNonConforme||0)+nc)*prix; }
    await db.collection("commandes").doc(cmdId).update(updateObj);
    if(nc>0){
      try{
        await db.collection("pertes").add({
          type:cmd.type, quantite:nc, raison:"retour_nc",
          responsable:userData.nom||user.email, responsableUid:user.uid,
          source:"chantier", chantierNom:chantier.nom, cmdId:cmdId,
          timestamp:firebase.firestore.FieldValue.serverTimestamp()
        });
      try { await db.collection("evenements").add({ numBC: cmd.numBC||cmdId, chantier: chantier.nom||"", action: "Réception confirmée par chef", acteur: userData.nom||user.email, role: "chef_chantier", details: "N°"+(cmd.numBC||cmdId)+" | Qté reçue: "+(cmd.quantiteLivree||0)+" BTC | NC: "+nc, statut: "Réception confirmée", timestamp: firebase.firestore.FieldValue.serverTimestamp() }); } catch(e) {}
      }catch(ep){}
    }
    var v={...qteNonConformeInput}; delete v[cmdId]; setQteNonConformeInput(v);
    setMsgCmd("Reception confirmee !");
  };

  var ts = function(t) { return { padding:"7px 14px", border:"none", cursor:"pointer", borderRadius:8, marginRight:6,
    background:tabFiche===t?"#2980B9":"#D6EAF8", color:tabFiche===t?"white":"#1A5276", fontWeight:tabFiche===t?700:500, fontSize:13 }; };

  return (
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.55)",zIndex:1000,overflowY:"auto",padding:16}}>
      <div style={{background:"var(--btp-card)",borderRadius:16,maxWidth:720,margin:"0 auto",boxShadow:"0 8px 40px rgba(0,0,0,0.3)"}}>
        <div style={{background:"linear-gradient(90deg,#1A5276,#2980B9)",color:"white",padding:"16px 20px",borderRadius:"16px 16px 0 0",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <h2 style={{marginBottom:4,fontSize:18}}>{chantier.nom}</h2>
            <div style={{fontSize:13,opacity:.9}}>Client: {chantier.client}</div>
            {chantier.adresse&&<div style={{fontSize:12,opacity:.8}}>{chantier.adresse}</div>}
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"white",padding:"6px 14px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:14}}>✕ Fermer</button>
        </div>
        <div style={{padding:"12px 16px 0",display:"flex",flexWrap:"wrap"}}>
          <button style={ts("suivi")} onClick={()=>setTabFiche("suivi")}>📊 Suivi</button>
          <button style={ts("commande")} onClick={()=>setTabFiche("commande")}>+ Passer une commande</button>
          {(function(){var hasLiv=cmdCh.some(function(c){return (c.quantiteLivree||0)>0;});return(<button style={ts("reception")} onClick={()=>{if(hasLiv)setTabFiche("reception");}} disabled={!hasLiv} title={hasLiv?"":"En attente de livraison par le stock"} >{hasLiv?"✅ Valider réception":"🔒 Valider réception (en attente livraison)"}</button>);})()}
        </div>

        <div style={{padding:20}}>
          {msgCmd&&<div style={{padding:"8px 12px",borderRadius:8,marginBottom:12,fontSize:13,background:msgCmd.includes("envoyee")||msgCmd.includes("confirme")?"#EAFAF1":"#FFECEC",color:msgCmd.includes("envoyee")||msgCmd.includes("confirme")?"#1E8449":"#C0392B"}}>{msgCmd}</div>}

          {tabFiche==="suivi"&&(
            <div className="fade-in">
              <h4 style={{marginBottom:12,color:"var(--btp-blue)"}}>Besoins et etat des livraisons</h4>
              {lignes.length===0?<p style={{color:"var(--btp-text2)"}}>Aucun type de BTC renseigne dans ce chantier.</p>:(
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                    <thead><tr style={{background:"#1A5276",color:"white"}}>
                      <th style={{padding:"8px 10px",textAlign:"left"}}>BTC</th>
                      <th style={{padding:"8px 10px",textAlign:"left"}}>Dim.</th>
                      <th style={{padding:"8px 10px",textAlign:"right"}}>Besoin</th>
                      <th style={{padding:"8px 10px",textAlign:"right"}}>Commande</th>
                      <th style={{padding:"8px 10px",textAlign:"right"}}>Recu</th>
                      <th style={{padding:"8px 10px",textAlign:"right",color:"#FFD700"}}>Reste</th>
                    </tr></thead>
                    <tbody>{lignes.map(function(l,i){
                      var pct=l.besoin>0?Math.min(100,Math.round(l.recu/l.besoin*100)):0;
                      return(
                        <tr key={l.prod.id} style={{background:i%2===0?"var(--btp-card)":"var(--btp-card2)",borderBottom:"1px solid var(--btp-border)"}}>
                          <td style={{padding:"8px 10px",fontWeight:600}}>{l.prod.nom}</td>
                          <td style={{padding:"8px 10px",fontSize:11,color:"#BDC3C7"}}>{l.prod.dim}</td>
                          <td style={{padding:"8px 10px",textAlign:"right"}}>{l.besoin.toLocaleString()}</td>
                          <td style={{padding:"8px 10px",textAlign:"right",color:"var(--btp-blue)"}}>{l.cmdTotal.toLocaleString()}</td>
                          <td style={{padding:"8px 10px",textAlign:"right"}}>
                            <div>{l.recu.toLocaleString()}</div>
                            <div style={{background:"#EEE",borderRadius:3,height:4,marginTop:3}}>
                              <div style={{height:4,borderRadius:3,background:pct===100?"#27AE60":"#2980B9",width:pct+"%"}}></div>
                            </div>
                          </td>
                          <td style={{padding:"8px 10px",textAlign:"right",fontWeight:700,color:l.reste===0?"#2ECC71":"#EC7063"}}>{l.reste.toLocaleString()}</td>
                        </tr>
                      );
                    })}</tbody>
                    <tfoot><tr style={{background:"var(--btp-steel)",fontWeight:700}}>
                      <td colSpan={2} style={{padding:"8px 10px"}}>TOTAL</td>
                      <td style={{padding:"8px 10px",textAlign:"right"}}>{lignes.reduce(function(a,l){return a+l.besoin;},0).toLocaleString()}</td>
                      <td style={{padding:"8px 10px",textAlign:"right",color:"var(--btp-blue)"}}>{lignes.reduce(function(a,l){return a+l.cmdTotal;},0).toLocaleString()}</td>
                      <td style={{padding:"8px 10px",textAlign:"right"}}>{lignes.reduce(function(a,l){return a+l.recu;},0).toLocaleString()}</td>
                      <td style={{padding:"8px 10px",textAlign:"right",color:"#EC7063"}}>{lignes.reduce(function(a,l){return a+l.reste;},0).toLocaleString()}</td>
                    </tr></tfoot>
                  </table>
                </div>
              )}
              <h4 style={{marginTop:20,marginBottom:10,color:"var(--btp-blue)"}}>Historique des commandes ({cmdCh.length})</h4>
              {cmdCh.length===0?<p style={{color:"var(--btp-text2)"}}>Aucune commande passee.</p>:
                cmdCh.map(function(c,i){
                  var livree=c.quantiteLivree||0; var tot=c.quantite||0; var reste=Math.max(0,tot-livree);
                  var confirme=c.quantiteConfirmeeChef||0;
                  var couleur=c.status==="Livree"?"#27AE60":c.status==="Validee"?"#2980B9":c.status==="Refusee"?"#E74C3C":"#E67E22";
                  return(
                    <div key={c.id} style={{borderRadius:10,padding:"10px 14px",marginBottom:8,background:i%2===0?"var(--btp-card2)":"var(--btp-card)",border:"1px solid #EEE",borderLeft:"4px solid "+couleur}}>
                      <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4}}>
                        <div style={{fontWeight:600,fontSize:13}}>{getProduit(c.type).nom} — {tot.toLocaleString()} u</div>
                        <span style={{fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:10,background:couleur,color:"white"}}>{c.status}</span>
                      </div>
                      <div style={{fontSize:12,color:"var(--btp-text2)",marginTop:3}}>Réservé: {(c.quantiteReservee||0).toLocaleString()} | Livré: {livree.toLocaleString()} | Reste à livrer: <strong style={{color:reste===0?"#2ECC71":"#EC7063"}}>{reste.toLocaleString()}</strong> | Confirmé par chef: {confirme.toLocaleString()}</div>
                    </div>
                  );
                })
              }
            </div>
          )}

          {tabFiche==="commande"&&(
            <div className="fade-in">
              <h4 style={{marginBottom:14,color:"var(--btp-blue)"}}>Nouvelle commande pour ce chantier</h4>
              {typesChantier.length===0?
                <p style={{color:"var(--btp-text2)",padding:12,background:"#FFF3CD",borderRadius:8}}>Aucun type de BTC renseigne. Modifiez la fiche chantier d'abord.</p>:
                <div style={{maxWidth:440}}>
                  <label style={{fontSize:13,fontWeight:600,color:"var(--btp-blue)",display:"block",marginBottom:4}}>Type de BTC du chantier</label>
                  <select value={cmdType} onChange={e=>setCmdType(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid #2980B9",background:"var(--btp-card)",fontSize:14,marginBottom:12}}>
                    <option value="">-- Choisir le type --</option>
                    {typesChantier.map(function(p){
                      var l = lignes.find(function(x){return x.prod.id===p.id;});
                      var reste = l ? l.reste : (besoins[p.id]||0);
                      return <option key={p.id} value={p.id}>{p.nom} ({p.dim}) — reste a livrer: {reste.toLocaleString()}</option>;
                    })}
                  </select>
                  <label style={{fontSize:13,fontWeight:600,color:"var(--btp-blue)",display:"block",marginBottom:4}}>Quantite a commander</label>
                  <input type="number" placeholder="Quantite" value={cmdQte} onChange={e=>setCmdQte(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid var(--btp-border)",fontSize:14,marginBottom:12}} />
                  <label style={{display:"block",fontSize:12,color:"var(--btp-text2)",marginBottom:4}}>Date de besoin sur chantier (optionnel)</label>
                  <input type="date" value={cmdDateBesoin} onChange={e=>setCmdDateBesoin(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid var(--btp-border)",fontSize:14,marginBottom:12,boxSizing:"border-box"}} />
                  <textarea placeholder="Notes pour la Direction (optionnel)" value={cmdNotes} onChange={e=>setCmdNotes(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid var(--btp-border)",fontSize:14,resize:"vertical",minHeight:50,marginBottom:12}} />
                  <button onClick={passerCommande} style={{width:"100%",padding:"11px",background:"#2980B9",color:"white",border:"none",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:14}}>Envoyer la commande a la Direction ↗</button>
                </div>
              }
            </div>
          )}

          {tabFiche==="reception"&&(
            <div className="fade-in">
              <h4 style={{marginBottom:12,color:"var(--btp-blue)"}}>Confirmer la reception des BTC sur le chantier</h4>
              {cmdCh.filter(function(c){return c.status==="Livree"||(c.quantiteLivree||0)>0;}).length===0?
                <p style={{color:"var(--btp-text2)"}}>Aucune livraison a confirmer pour l'instant.</p>:
                cmdCh.filter(function(c){return (c.quantiteLivree||0)>0;}).map(function(c){
                  var livree = c.quantiteLivree||0;
                  var confirme = c.quantiteConfirmeeChef||0;
                  var aConfirmer = Math.max(0, livree - confirme);
                  return(
                    <div key={c.id} style={{background:"var(--btp-card)",borderRadius:10,padding:14,marginBottom:10,border:"1px solid #EEE",borderLeft:"4px solid #27AE60"}}>
                      <div style={{fontWeight:700,fontSize:14}}>{getProduit(c.type).nom}</div>
                      <div style={{fontSize:12,color:"var(--btp-text2)",marginTop:4}}>Commande: {(c.quantite||0).toLocaleString()} u | Livre par stock: <strong>{livree.toLocaleString()}</strong> u | Deja confirme: {confirme.toLocaleString()} u</div>
                      {aConfirmer > 0 ? (
                        <div style={{marginTop:10,padding:"10px 14px",background:"#EAFAF1",borderRadius:8}}>
                          <div style={{fontSize:13,color:"#1E8449",fontWeight:600,marginBottom:8}}>A confirmer: {aConfirmer.toLocaleString()} u</div>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
                            <label style={{fontSize:12,color:"#EC7063",fontWeight:700}}>⚠️ BTC non conformes :</label>
                            <input type="number" min="0" placeholder="0" value={qteNonConformeInput[c.id]||""} onChange={e=>{var v={...qteNonConformeInput};v[c.id]=e.target.value;setQteNonConformeInput(v);}} style={{width:80,padding:"4px 8px",border:"2px solid #C0392B",borderRadius:6,fontSize:13,textAlign:"center"}} />
                            <span style={{fontSize:11,color:"var(--btp-text2)"}}>(laisser vide si aucun)</span>
                          </div>
                          {(parseInt(qteNonConformeInput[c.id])||0)>0&&<div style={{fontSize:11,color:"#EC7063",marginBottom:6,background:"#FDEBD0",padding:"4px 8px",borderRadius:6}}>⚠️ {parseInt(qteNonConformeInput[c.id])} BTC non conformes signalés pour ristourne.</div>}
                          <button onClick={()=>validerReception(c.id,aConfirmer,qteNonConformeInput[c.id]||0)} style={{padding:"8px 16px",background:"#27AE60",color:"white",border:"none",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13}}>✅ Confirmer la réception</button>
                        </div>
                      ):(
                        <div style={{marginTop:8,fontSize:12,color:"var(--btp-green)",fontWeight:600}}>✅ Reception confirmee</div>
                      )}
                    </div>
                  );
                })
              }
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

      if (!annule) setLotsUtilises(snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
    }).catch(function () { if (!annule) setLotsUtilises([]); });
    return () => { annule = true; };

  var cmdCh = commandes.filter(function(c){ return c.chantierId === chantier.id; });

    var cmdTotal = cmdsProd.reduce(function(a,c){ return a+(c.quantite||0); }, 0);
    var livre = cmdsProd.reduce(function(a,c){ return a+(c.quantiteLivree||0); }, 0);
    var confirme = cmdsProd.reduce(function(a,c){ return a+(c.quantiteConfirmeeChef||0); }, 0);
    var reste = Math.max(0, besoin - livre);
    var montantLivre = livre * prod.prix;
    var montantBesoin = besoin * prod.prix;
    return { prod:prod, besoin:besoin, cmdTotal:cmdTotal, livre:livre, confirme:confirme, reste:reste, montantLivre:montantLivre, montantBesoin:montantBesoin };
  });

          </div>
          <div style={{display:"flex",gap:16,marginTop:12,flexWrap:"wrap"}}>

  );
}


function DashboardComptable({ user, userData }) {
  const [tab, setTab] = React.useState("facturation");
  const [commandes, setCommandes] = React.useState([]);
  const [chantiers, setChantiers] = React.useState([]);
  const [pertes, setPertes] = React.useState([]);
  const [ristourneInput, setRistourneInput] = React.useState({});
  const [factureCourante, setFactureCourante] = React.useState(null);
  const [msg, setMsg] = React.useState("");

  React.useEffect(() => {
    const u1 = db.collection("commandes").orderBy("timestamp","desc").onSnapshot(snap => {
      setCommandes(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    const u2 = db.collection("chantiers").onSnapshot(snap => {
      setChantiers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    const u3 = db.collection("pertes").orderBy("timestamp","desc").onSnapshot(snap => {
      setPertes(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    return () => { u1(); u2(); u3(); };
  }, []);

  const getChantier = (id) => chantiers.find(c => c.id === id) || {};

  const toggleRistourne = async (cmd) => {
    const montant = parseFloat(ristourneInput[cmd.id] || 0);
    if (cmd.ristourneValidee !== undefined && cmd.ristourneValidee !== null) {
      // Désactiver la ristourne
      await db.collection("commandes").doc(cmd.id).update({ ristourneValidee: null, ristourneValideeAt: null });
      setMsg("Ristourne désactivée pour BC " + (cmd.numBC || cmd.id));
    } else {
      // Activer la ristourne
      if (isNaN(montant) || montant < 0) { setMsg("Montant ristourne invalide"); return; }
      await db.collection("commandes").doc(cmd.id).update({
        ristourneValidee: montant,
        ristourneValideeAt: new Date().toISOString()
      });
      try { await db.collection("evenements").add({ numBC: cmd.numBC||cmd.id, chantier: cmd.chantierNom||"", action: "Ristourne validée", acteur: userData.nom||user.email, role: "comptable", details: "N°"+(cmd.numBC||cmd.id)+" | Ristourne: "+montant.toFixed(2)+"€ validée", statut: "Ristourne active", timestamp: firebase.firestore.FieldValue.serverTimestamp() }); } catch(e) {}
      setMsg("Ristourne de " + montant.toFixed(2) + "€ validée pour BC " + (cmd.numBC || cmd.id));
    }
    setTimeout(() => setMsg(""), 3000);
  };

  // Fix: les statuts reels stockes sont "EnAttente"/"Validee"/"Livree"/"Refusee" (voir DashboardStock/DashboardDirection),
  // jamais "confirmee". "Confirme" cote comptabilite correspond en realite a quantiteConfirmeeChef > 0 (reception validee
  // par le chef de chantier). Comparaison normalisee (normTxt) pour tolerer toute variation de casse/accent des statuts.
  const statutCommandeAffichage = (cmd) => {
    if ((cmd.quantiteConfirmeeChef || 0) > 0) return { bg: "#27ae60", label: "✅ Confirmé" };
    const s = normTxt(cmd.status);
    if (s === normTxt("Livree")) return { bg: "#f39c12", label: "🚚 Livré" };
    if (s === normTxt("Validee")) return { bg: "#2980b9", label: "✔ Validé" };
    if (s === normTxt("EnAttente")) return { bg: "#bbb", label: "⏳ En attente" };
    if (s === normTxt("Refusee")) return { bg: "#c0392b", label: "❌ Refusée" };
    return { bg: "#bbb", label: cmd.status || "-" };
  };

      if (cmd && cmd.chantierId) { var chC = chantiers.find(function (c) { return c.id === cmd.chantierId; }); if (chC) { setFicheOuverte(chC); setTabChef("chantiers"); return; } }
      setTabChef("chantiers");
    }
  };

  // Quand chantier sélectionné change -> reset type BTC
  useEffect(() => {
    if (cmdChantierId) {
      var ch = chantiers.find(function(c){return c.id===cmdChantierId;});
      if (ch && ch.besoins) {
        var premiers = Object.keys(ch.besoins).filter(function(k){ return (ch.besoins[k]||0)>0; });
        setCmdType(premiers[0] || "");
      }
    }
  }, [cmdChantierId]);

  const ouvrirNouveauChantier = () => {
    setEditChantier(null);
    setNomChantier(""); setClientChantier(""); setAdresseChantier(""); setBesoins({});
    setMsgChantier(""); setTabChef("nouveau");
  };

  const ouvrirModifChantier = (ch) => {
    setEditChantier(ch);
    setNomChantier(ch.nom||""); setClientChantier(ch.client||""); setAdresseChantier(ch.adresse||"");
    setBesoins(Object.assign({}, ch.besoins||{}));
    setMsgChantier(""); setTabChef("nouveau");
  };

  const sauvegarderChantier = async () => {
    if (!nomChantier||!clientChantier) { setMsgChantier("Remplissez le nom et le client"); return; }
    var besoinsValides = {};
    CATALOGUE.forEach(function(prod) {
      var v = parseInt(besoins[prod.id]||0);
      if (v > 0) besoinsValides[prod.id] = v;
    });
    try {
      if (editChantier) {
        await db.collection("chantiers").doc(editChantier.id).update({
          nom: nomChantier, client: clientChantier, adresse: adresseChantier, besoins: besoinsValides
        });
        setMsgChantier("Chantier mis a jour !");
      } else {
        await db.collection("chantiers").add({
          nom: nomChantier, client: clientChantier, adresse: adresseChantier,
          besoins: besoinsValides, statut: "en_cours",
          chefUid: user.uid, chefNom: userData.nom||user.email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        setMsgChantier("Chantier cree avec succes !");

      setNomChantier(""); setClientChantier(""); setAdresseChantier(""); setBesoins({});

  };

  const demanderSuppression = (ch) => {

  const confirmerSuppression = async () => {
    if (!deleteTarget) return;

  const passerCommande = async () => {

      setMsgCmd("Commande envoyee ! Bon de commande "+numBC+" créé. En attente de validation Direction.");
      setCmdQte(""); setCmdNotes(""); setCmdDateBesoin("");

  const ts = (t) => ({ padding:"8px 14px", border:"none", cursor:"pointer", borderRadius:8, marginRight:6, marginBottom:6,
    background:tabChef===t?"#2980B9":"#D6EAF8", color:tabChef===t?"white":"#1A5276", fontWeight:tabChef===t?700:500, fontSize:13 });

  if (cmdChantierId) {
    var chSel = chantiers.find(function(c){return c.id===cmdChantierId;});

    }

  return (
    <div className="btp-app">

      {deleteTarget && (

          <div style={{background:"var(--btp-card)",borderRadius:16,padding:28,maxWidth:380,width:"100%",boxShadow:"0 8px 40px rgba(0,0,0,0.3)"}}>
            <div style={{fontSize:36,textAlign:"center",marginBottom:12}}>🔒</div>
            <h3 style={{color:"#EC7063",textAlign:"center",marginBottom:8}}>Confirmer la suppression</h3>
            <p style={{fontSize:13,color:"var(--btp-text2)",textAlign:"center",marginBottom:16}}>Vous allez supprimer le chantier <strong>"{deleteTarget.nom}"</strong>. Entrez votre mot de passe pour confirmer.</p>
            <input type="password" placeholder="Votre mot de passe" value={deletePassword} onChange={e=>{setDeletePassword(e.target.value);setDeleteError("");}} style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"2px solid #C0392B",marginBottom:8,fontSize:14}} />
            {deleteError && <div style={{color:"#EC7063",fontSize:13,marginBottom:8,textAlign:"center"}}>{deleteError}</div>}
            <div style={{display:"flex",gap:10,marginTop:8}}>
              <button onClick={()=>setDeleteTarget(null)} style={{flex:1,padding:"9px",background:"#EEE",border:"none",borderRadius:8,cursor:"pointer",fontWeight:600}}>Annuler</button>
              <button onClick={confirmerSuppression} style={{flex:1,padding:"9px",background:"#C0392B",color:"white",border:"none",borderRadius:8,cursor:"pointer",fontWeight:700}}>Supprimer</button>
            </div>
          </div>
        </div>
      )}
      {ficheOuverte && <FicheChantierChef chantier={ficheOuverte} commandes={commandes} user={user} userData={userData} onClose={()=>setFicheOuverte(null)} />}
      <div className="btp-header">

          <button className="btn btn-sm btn-danger" onClick={()=>auth.signOut()}>⏻ Déco.</button>

      <div className="btp-nav">

                var besoinTotal = Object.values(ch.besoins||{}).reduce(function(a,v){return a+v;},0);

                      <div style={{display:"flex",flexDirection:"column",gap:6}}>
                        <button onClick={()=>setFicheOuverte(ch)} style={{background:"#2980B9",color:"white",border:"none",padding:"7px 12px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:12}}>📋 Fiche</button>
                        <button onClick={()=>ouvrirModifChantier(ch)} style={{background:"#E67E22",color:"white",border:"none",padding:"7px 12px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:12}}>✏️ Modifier</button>
                        <button onClick={()=>demanderSuppression(ch)} style={{background:"#E74C3C",color:"white",border:"none",padding:"7px 12px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:12}}>🗑️ Supprimer</button>
                      </div>

          </div>
        )}

        {tabChef==="nouveau"&&(
          <div className="fade-in">
            <h3 style={{marginBottom:14,color:"var(--btp-blue)"}}>{editChantier ? "Modifier le chantier" : "Creer un nouveau chantier"}</h3>
            <div style={{background:"var(--btp-card)",borderRadius:12,padding:20,boxShadow:"0 2px 8px rgba(0,0,0,0.08)",maxWidth:560}}>
              <div style={{marginBottom:12}}>
                <label style={{fontSize:13,fontWeight:600,color:"var(--btp-blue)",display:"block",marginBottom:4}}>Nom du chantier</label>
                <input placeholder="Ex: Construction villa Mamoudzou" value={nomChantier} onChange={e=>setNomChantier(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid var(--btp-border)",fontSize:14}} />

              <div style={{marginBottom:12}}>
                <label style={{fontSize:13,fontWeight:600,color:"var(--btp-blue)",display:"block",marginBottom:4}}>Nom du client</label>
                <input placeholder="Nom du client" value={clientChantier} onChange={e=>setClientChantier(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid var(--btp-border)",fontSize:14}} />
              </div>
              <div style={{marginBottom:16}}>
                <label style={{fontSize:13,fontWeight:600,color:"var(--btp-blue)",display:"block",marginBottom:4}}>Adresse</label>
                <input placeholder="Adresse (optionnel)" value={adresseChantier} onChange={e=>setAdresseChantier(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid var(--btp-border)",fontSize:14}} />

                          <div style={{fontSize:13,fontWeight:600}}>{prod.nom}</div>
                          <div style={{fontSize:11,color:"#BDC3C7"}}>{prod.dim}</div>

                        <input type="number" min="0" placeholder="0" value={besoins[prod.id]||""}

              {msgChantier&&<div style={{padding:"8px 12px",borderRadius:8,marginBottom:10,fontSize:13,background:msgChantier.includes("succes")||msgChantier.includes("jour")?"#EAFAF1":"#FFECEC",color:msgChantier.includes("succes")||msgChantier.includes("jour")?"#1E8449":"#C0392B"}}>{msgChantier}</div>}

                    <option value="">-- Choisir un chantier --</option>
                    {chantiers.map(ch=><option key={ch.id} value={ch.id}>{ch.nom} - {ch.client}</option>)}
                  </select>
                </div>
                {cmdChantierId && typesChantier.length === 0 && (
                  <div style={{padding:"10px 14px",background:"#FFF3CD",borderRadius:8,marginBottom:12,fontSize:13,color:"#856404"}}>Aucun type de BTC renseigne dans ce chantier. Modifiez d'abord la fiche chantier.</div>
                )}
                {cmdChantierId && typesChantier.length > 0 && (
                  <div>
                    <div style={{marginBottom:12}}>
                      <label style={{fontSize:13,fontWeight:600,color:"var(--btp-blue)",display:"block",marginBottom:4}}>Type de BTC <span style={{fontSize:11,color:"var(--btp-text2)",fontWeight:400}}>(uniquement les types renseignes dans ce chantier)</span></label>
                      <select value={cmdType} onChange={e=>setCmdType(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid #2980B9",background:"var(--btp-card)",fontSize:14}}>
                        <option value="">-- Choisir le type --</option>
                        {typesChantier.map(function(p){
                          var ch = chantiers.find(function(c){return c.id===cmdChantierId;});
                          var besoin = ch && ch.besoins ? (ch.besoins[p.id]||0) : 0;
                          var dejaCmde = commandes.filter(function(c){return c.chantierId===cmdChantierId&&c.type===p.id;}).reduce(function(a,c){return a+(c.quantite||0);},0);
                          var dejaRecu = commandes.filter(function(c){return c.chantierId===cmdChantierId&&c.type===p.id;}).reduce(function(a,c){return a+(c.quantiteLivree||0);},0);
                          var reste = Math.max(0, besoin - dejaRecu);
                          return <option key={p.id} value={p.id}>{p.nom} ({p.dim}) | besoin: {besoin.toLocaleString()} | reste: {reste.toLocaleString()}</option>;
                        })}
                      </select>
                    </div>
                    <div style={{marginBottom:12}}>
                      <label style={{fontSize:13,fontWeight:600,color:"var(--btp-blue)",display:"block",marginBottom:4}}>Quantite a commander</label>
                      <input type="number" placeholder="Quantite" value={cmdQte} onChange={e=>setCmdQte(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid var(--btp-border)",fontSize:14}} />
                    </div>
                    <label style={{display:"block",fontSize:12,color:"var(--btp-text2)",marginBottom:4}}>Date de besoin sur chantier (optionnel)</label>
                    <input type="date" value={cmdDateBesoin} onChange={e=>setCmdDateBesoin(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid var(--btp-border)",marginBottom:12,fontSize:14,boxSizing:"border-box"}} />
                    <textarea placeholder="Notes (optionnel)" value={cmdNotes} onChange={e=>setCmdNotes(e.target.value)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"1px solid var(--btp-border)",marginBottom:12,fontSize:14,resize:"vertical",minHeight:50}} />
                    {msgCmd&&<div style={{padding:"8px 12px",borderRadius:8,marginBottom:10,fontSize:13,background:msgCmd.includes("envoyee")?"#EBF5FB":"#FFECEC",color:msgCmd.includes("envoyee")?"#1A5276":"#C0392B"}}>{msgCmd}</div>}
                    <button onClick={passerCommande} style={{width:"100%",padding:"10px",background:"#2980B9",color:"white",border:"none",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:14}}>Envoyer la commande</button>
                  </div>
                )}
              </div>
            }
          </div>
        )}
      </div>
      {showScanChef && (
        <ModaleScanner titre="Scanner un lot reçu" onFermer={() => setShowScanChef(false)} onObjetReconnu={surObjetScanneChef} continu={false} />
      )}
    </div>
  );
}


function DashboardStock({ user, userData }) {

  const [msgLivraison, setMsgLivraison] = React.useState({}); // cmdId -> message (reservation)
  const [allocationsParCmd, setAllocationsParCmd] = React.useState({}); // cmdId -> [allocation]
  const [msgAllocLivraison, setMsgAllocLivraison] = React.useState({}); // allocId -> message
