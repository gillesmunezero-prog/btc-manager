<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BTC Manager - Terre et Eau</title>
<meta name="description" content="Gestion de stock, production et QSE — Terre et Eau">
<meta name="theme-color" content="#0D1B2A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BTC Manager">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<style>
:root{
  --btp-dark:#0D1B2A;
  --btp-navy:#1B2838;
  --btp-steel:#243447;
  --btp-orange:#FF8C42;
  --btp-orange2:#FF7A3D;
  --btp-gold:#F0A500;
  --btp-green:#1DB954;
  --btp-red:#E74C3C;
  --btp-blue:#5DADE2;
  --btp-purple:#8E44AD;
  --btp-text:#ECF0F1;
  --btp-text2:#BDC3C7;
  --btp-card:#1E2D3D;
  --btp-card2:#253545;
  --btp-border:#2C3E50;
  --btp-shadow:0 8px 32px rgba(0,0,0,.45);
  --btp-shadow2:0 4px 16px rgba(0,0,0,.3);
  --btp-radius:12px;
  --btp-radius2:8px;
  --btp-font:"Segoe UI",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--btp-font);background:var(--btp-dark);color:var(--btp-text);min-height:100vh;}
input,select,textarea,button{font-family:inherit;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--btp-dark);}
::-webkit-scrollbar-thumb{background:var(--btp-orange);border-radius:3px;}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px);}to{opacity:1;transform:translateX(0);}}
@keyframes glow{0%,100%{box-shadow:0 0 8px var(--btp-orange);}50%{box-shadow:0 0 24px var(--btp-orange2),0 0 48px rgba(232,96,28,.3);}}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
@keyframes spin{to{transform:rotate(360deg);}}
.fade-up{animation:fadeUp .3s ease both;}
.slide-in{animation:slideIn .25s ease both;}
.pulse{animation:pulse 2s ease-in-out infinite;}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;}

/* APP SHELL */
.btp-app{min-height:100vh;background:linear-gradient(135deg,var(--btp-dark) 0%,var(--btp-navy) 100%);}

/* HEADER */
.btp-header{
  background:linear-gradient(90deg,var(--btp-steel) 0%,var(--btp-navy) 100%);
  border-bottom:2px solid var(--btp-orange);
  padding:0 20px;
  height:64px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  box-shadow:0 4px 24px rgba(0,0,0,.5);
}
.btp-header-logo{display:flex;align-items:center;gap:12px;}
.btp-header-logo-icon{
  width:40px;height:40px;
  background:linear-gradient(135deg,var(--btp-orange),var(--btp-gold));
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;box-shadow:0 4px 12px rgba(232,96,28,.4);
}
.btp-header-title{font-size:18px;font-weight:800;letter-spacing:.5px;color:white;}
.btp-header-sub{font-size:11px;color:var(--btp-text2);letter-spacing:1px;text-transform:uppercase;}
.btp-header-right{display:flex;align-items:center;gap:12px;}
.btp-user-chip{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;padding:6px 14px;
  font-size:13px;color:var(--btp-text2);
}
.btp-user-chip strong{color:white;}

/* MODE BADGE */
.mode-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;cursor:pointer;
  transition:all .2s;border:2px solid;
}
.mode-badge-demo{
  background:rgba(240,165,0,.15);border-color:var(--btp-gold);
  color:var(--btp-gold);animation:glow 2s ease-in-out infinite;
}
.mode-badge-real{
  background:rgba(29,185,84,.12);border-color:var(--btp-green);
  color:var(--btp-green);
}
.mode-badge-dot{width:8px;height:8px;border-radius:50%;}
.mode-badge-demo .mode-badge-dot{background:var(--btp-gold);}
.mode-badge-real .mode-badge-dot{background:var(--btp-green);}

/* NAV TABS */
.btp-nav{
  background:var(--btp-navy);
  border-bottom:1px solid var(--btp-border);
  padding:0 20px;
  display:flex;overflow-x:auto;gap:2px;
}
.btp-nav::-webkit-scrollbar{height:0;}
.btp-nav-btn{
  background:none;border:none;
  color:var(--btp-text2);font-size:13px;font-weight:600;
  padding:14px 18px;cursor:pointer;
  border-bottom:3px solid transparent;
  transition:all .2s;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.btp-nav-btn:hover{color:white;background:rgba(255,255,255,.05);}
.btp-nav-btn.active{
  color:var(--btp-orange2);
  border-bottom-color:var(--btp-orange);
  background:rgba(232,96,28,.08);
}

/* CARDS */
.btp-card{
  background:var(--btp-card);
  border:1px solid var(--btp-border);
  border-radius:var(--btp-radius);
  padding:20px;
  box-shadow:var(--btp-shadow2);
  transition:transform .2s,box-shadow .2s;
}
.btp-card:hover{box-shadow:var(--btp-shadow);}
.btp-card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;padding-bottom:14px;
  border-bottom:1px solid var(--btp-border);
}
.btp-card-title{font-size:15px;font-weight:700;color:white;}
.btp-card-subtitle{font-size:12px;color:var(--btp-text2);margin-top:2px;}

/* KPI CARDS */
.kpi-card{
  background:linear-gradient(135deg,var(--btp-card) 0%,var(--btp-card2) 100%);
  border:1px solid var(--btp-border);
  border-radius:var(--btp-radius);
  padding:20px 22px;
  position:relative;overflow:hidden;
}
.kpi-card::before{
  content:'';position:absolute;top:0;right:0;
  width:80px;height:80px;border-radius:50%;
  opacity:.08;transform:translate(20px,-20px);
}
.kpi-card-icon{font-size:28px;margin-bottom:8px;}
.kpi-card-value{font-size:28px;font-weight:900;color:white;line-height:1.1;}
.kpi-card-label{font-size:12px;color:var(--btp-text2);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;}
.kpi-card-trend{
  position:absolute;top:16px;right:16px;
  font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;
}
.kpi-card-orange{border-top:3px solid var(--btp-orange);}
.kpi-card-green{border-top:3px solid var(--btp-green);}
.kpi-card-blue{border-top:3px solid var(--btp-blue);}
.kpi-card-gold{border-top:3px solid var(--btp-gold);}
.kpi-card-red{border-top:3px solid var(--btp-red);}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:var(--btp-radius2);
  font-size:13px;font-weight:700;cursor:pointer;
  border:none;transition:all .2s;letter-spacing:.3px;
  text-decoration:none;outline:none;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(135deg,var(--btp-orange),var(--btp-orange2));
  color:white;box-shadow:0 4px 12px rgba(232,96,28,.35);
}
.btn-primary:hover{box-shadow:0 6px 20px rgba(232,96,28,.5);transform:translateY(-1px);}
.btn-success{
  background:linear-gradient(135deg,#147a38,#159445);
  color:white;box-shadow:0 4px 12px rgba(29,185,84,.3);
}
.btn-success:hover{box-shadow:0 6px 20px rgba(29,185,84,.45);transform:translateY(-1px);}
.btn-danger{
  background:linear-gradient(135deg,#c0392b,var(--btp-red));
  color:white;box-shadow:0 4px 12px rgba(231,76,60,.3);
}
.btn-danger:hover{box-shadow:0 6px 20px rgba(231,76,60,.45);transform:translateY(-1px);}
.btn-ghost{
  background:rgba(255,255,255,.06);border:1px solid var(--btp-border);
  color:var(--btp-text2);
}
.btn-ghost:hover{background:rgba(255,255,255,.12);color:white;}
.btn-gold{
  background:linear-gradient(135deg,#b8860b,var(--btp-gold));
  color:#0D1B2A;
}
.btn-gold:hover{box-shadow:0 6px 20px rgba(240,165,0,.4);transform:translateY(-1px);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-lg{padding:13px 24px;font-size:15px;}
.btn-full{width:100%;}
.btn-icon{padding:8px;border-radius:8px;}
.btn-reset-demo{
  background:linear-gradient(135deg,#7d3c98,var(--btp-purple));
  color:white;box-shadow:0 4px 12px rgba(142,68,173,.35);
  animation:pulse 2s ease-in-out infinite;
}
.btn-reset-demo:hover{box-shadow:0 6px 20px rgba(142,68,173,.5);transform:translateY(-1px);animation:none;}

/* INPUTS */
.btp-input{
  width:100%;background:var(--btp-steel);
  border:1.5px solid var(--btp-border);border-radius:var(--btp-radius2);
  padding:10px 14px;color:white;font-size:14px;
  transition:border-color .2s,box-shadow .2s;outline:none;
}
.btp-input:focus{border-color:var(--btp-orange);box-shadow:0 0 0 3px rgba(232,96,28,.15);}
.btp-input::placeholder{color:rgba(189,195,199,.4);}
.btp-label{font-size:12px;font-weight:700;color:var(--btp-text2);margin-bottom:6px;
  display:block;text-transform:uppercase;letter-spacing:.5px;}

/* SELECT */
.btp-select{
  width:100%;background:var(--btp-steel);
  border:1.5px solid var(--btp-border);border-radius:var(--btp-radius2);
  padding:10px 14px;color:white;font-size:14px;
  transition:border-color .2s;outline:none;cursor:pointer;
}
.btp-select:focus{border-color:var(--btp-orange);box-shadow:0 0 0 3px rgba(232,96,28,.15);}
.btp-select option{background:var(--btp-steel);}

/* TABLES */
.btp-table-wrap{overflow-x:auto;border-radius:var(--btp-radius);border:1px solid var(--btp-border);}
.btp-table{width:100%;border-collapse:collapse;font-size:13px;}
.btp-table th{
  background:var(--btp-steel);color:var(--btp-text2);
  padding:12px 14px;text-align:left;font-size:11px;
  font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  border-bottom:2px solid var(--btp-border);white-space:nowrap;
}
.btp-table td{
  padding:12px 14px;border-bottom:1px solid rgba(44,62,80,.6);
  color:var(--btp-text);vertical-align:middle;
}
.btp-table tr:last-child td{border-bottom:none;}
.btp-table tbody tr:hover{background:rgba(255,255,255,.04);}
.btp-table tr.demo-row{background:rgba(240,165,0,.06)!important;}

/* BADGES */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:700;letter-spacing:.3px;
}
.badge-orange{background:rgba(232,96,28,.15);color:var(--btp-orange2);border:1px solid rgba(232,96,28,.25);}
.badge-green{background:rgba(29,185,84,.12);color:#2ecc71;border:1px solid rgba(29,185,84,.25);}
.badge-red{background:rgba(231,76,60,.12);color:#F1948A;border:1px solid rgba(231,76,60,.25);}
.badge-blue{background:rgba(41,128,185,.12);color:#5dade2;border:1px solid rgba(41,128,185,.25);}
.badge-gold{background:rgba(240,165,0,.12);color:var(--btp-gold);border:1px solid rgba(240,165,0,.25);}
.badge-purple{background:rgba(142,68,173,.12);color:#bb8fce;border:1px solid rgba(142,68,173,.25);}
.badge-gray{background:rgba(255,255,255,.06);color:var(--btp-text2);border:1px solid var(--btp-border);}
.badge-demo{background:rgba(240,165,0,.2);color:var(--btp-gold);border:1px solid var(--btp-gold);}

/* PROGRESS BAR */
.btp-progress{height:8px;background:var(--btp-border);border-radius:4px;overflow:hidden;}
.btp-progress-bar{height:100%;border-radius:4px;transition:width .4s ease;}

/* STOCK INDICATOR */
.stock-level-ok .btp-progress-bar{background:linear-gradient(90deg,var(--btp-green),#58d68d);}
.stock-level-warn .btp-progress-bar{background:linear-gradient(90deg,var(--btp-gold),#f8c471);}
.stock-level-low .btp-progress-bar{background:linear-gradient(90deg,var(--btp-red),#f1948a);}

/* DEMO BANNER */
.demo-banner{
  background:linear-gradient(90deg,rgba(240,165,0,.15),rgba(232,96,28,.1),rgba(240,165,0,.15));
  border-top:1px solid var(--btp-gold);border-bottom:1px solid var(--btp-gold);
  padding:10px 20px;display:flex;align-items:center;justify-content:space-between;
  background-size:200% 100%;animation:shimmer 3s linear infinite;
}
.demo-banner-text{font-size:13px;color:var(--btp-gold);font-weight:700;letter-spacing:.5px;}

/* MODAL */
.btp-modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  z-index:1000;display:flex;align-items:center;justify-content:center;
  animation:fadeUp .2s ease;backdrop-filter:blur(4px);
}
.btp-modal{
  background:var(--btp-card);border:1px solid var(--btp-border);
  border-radius:16px;padding:28px;width:90%;max-width:520px;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
  animation:fadeUp .25s ease;
}
.btp-modal-title{font-size:18px;font-weight:800;color:white;margin-bottom:20px;
  display:flex;align-items:center;gap:10px;}

/* FORM GROUP */
.form-group{margin-bottom:16px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* SECTION HEADER */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;
}
.section-title{font-size:20px;font-weight:900;color:white;
  display:flex;align-items:center;gap:10px;}
.section-title-icon{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--btp-orange),var(--btp-gold));
  display:flex;align-items:center;justify-content:center;font-size:18px;
}

/* CONTENT AREA */
.btp-content{padding:24px;max-width:1400px;margin:0 auto;}

/* GRID */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}

/* STATUS COLORS */
.text-orange{color:var(--btp-orange2);}
.text-green{color:#2ecc71;}
.text-red{color:var(--btp-red);}
.text-gold{color:var(--btp-gold);}
.text-blue{color:#5dade2;}
.text-gray{color:var(--btp-text2);}

/* LOGIN SCREEN */
.login-screen{
  min-height:100vh;
  background:linear-gradient(135deg,#0D1B2A 0%,#1B2838 50%,#0D1B2A 100%);
  display:flex;align-items:center;justify-content:center;
}
.login-card{
  background:var(--btp-card);border:1px solid var(--btp-border);
  border-radius:20px;padding:40px;width:90%;max-width:420px;
  box-shadow:0 32px 80px rgba(0,0,0,.6);animation:fadeUp .4s ease;
  position:relative;overflow:hidden;
}
.login-card::before{
  content:'';position:absolute;top:-60px;right:-60px;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,96,28,.15),transparent);
}
.login-logo{
  width:64px;height:64px;border-radius:16px;
  background:linear-gradient(135deg,var(--btp-orange),var(--btp-gold));
  display:flex;align-items:center;justify-content:center;font-size:32px;
  margin:0 auto 20px;box-shadow:0 8px 24px rgba(232,96,28,.4);
}
.login-title{text-align:center;font-size:24px;font-weight:900;color:white;margin-bottom:4px;}
.login-sub{text-align:center;font-size:13px;color:var(--btp-text2);margin-bottom:28px;}

/* ALERT */
.btp-alert{
  padding:12px 16px;border-radius:var(--btp-radius2);
  font-size:13px;font-weight:600;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.alert-error{background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.3);color:#e74c3c;}
.alert-success{background:rgba(29,185,84,.12);border:1px solid rgba(29,185,84,.3);color:#2ecc71;}
.alert-warning{background:rgba(240,165,0,.12);border:1px solid rgba(240,165,0,.3);color:var(--btp-gold);}
.alert-info{background:rgba(41,128,185,.12);border:1px solid rgba(41,128,185,.3);color:#5dade2;}

/* TOGGLE SWITCH */
.toggle-wrap{display:flex;align-items:center;gap:10px;}
.toggle{position:relative;width:48px;height:26px;cursor:pointer;}
.toggle input{display:none;}
.toggle-track{
  position:absolute;inset:0;border-radius:13px;
  background:var(--btp-border);transition:background .2s;
}
.toggle input:checked+.toggle-track{background:var(--btp-green);}
.toggle-thumb{
  position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;
  background:white;transition:transform .2s;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.toggle input:checked~.toggle-thumb{transform:translateX(22px);}

/* EMPTY STATE */
.empty-state{
  text-align:center;padding:48px 20px;
  color:var(--btp-text2);
}
.empty-state-icon{font-size:48px;margin-bottom:12px;opacity:.5;}
.empty-state-text{font-size:15px;font-weight:600;color:var(--btp-text);}
.empty-state-sub{font-size:13px;margin-top:4px;}

/* SEPARATOR */
.btp-sep{height:1px;background:var(--btp-border);margin:16px 0;}

/* PRINT STYLES */
@media print{
  .btp-header,.btp-nav,.no-print{display:none!important;}
  body{background:white!important;color:black!important;}
  .btp-content{padding:0!important;}
}
/* Impression d'etiquette (Phase 7) : masque tout SAUF la zone .etiquette-print-zone, qui devient
   seule visible et repositionnee en pleine page — technique standard "n'imprimer qu'un element". */
@media print{
  body.impression-etiquette *{visibility:hidden;}
  body.impression-etiquette .etiquette-print-zone,
  body.impression-etiquette .etiquette-print-zone *{visibility:visible;}
  body.impression-etiquette .etiquette-print-zone{position:fixed;top:0;left:0;width:100%;padding:16px;}
}
.etiquette-carte{background:white;color:#111;border:2px solid #111;border-radius:8px;padding:14px;width:280px;
  display:inline-block;margin:8px;vertical-align:top;page-break-inside:avoid;font-family:Arial,sans-serif;}
.etiquette-numero{font-size:20px;font-weight:900;letter-spacing:1px;margin-top:8px;text-align:center;}
.etiquette-ligne{font-size:12px;color:#333;display:flex;justify-content:space-between;margin-top:3px;}

/* RESPONSIVE */
@media(max-width:900px){
  .grid-4{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr;}
}
@media(max-width:600px){
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr;}
  .btp-content{padding:14px;}
  .btp-header{height:56px;}
  .btp-header-title{font-size:15px;}
}

/* ============ PRIORITE DU JOUR (bandeau "a faire") ============ */
.priorite-jour{background:var(--btp-card);border:1px solid var(--btp-border);border-left:4px solid var(--btp-gold);
  border-radius:var(--btp-radius);padding:16px 20px;margin-bottom:20px;box-shadow:var(--btp-shadow2);}
.priorite-jour-titre{font-size:13px;font-weight:800;color:var(--btp-gold);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;}
.priorite-jour-liste{display:flex;flex-wrap:wrap;gap:8px;}
.priorite-jour-item{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;
  border:1px solid var(--btp-border);background:rgba(255,255,255,.05);color:var(--btp-text);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .2s;}
.priorite-jour-item:hover{background:rgba(255,255,255,.1);transform:translateY(-1px);}
.priorite-jour-critique{border-color:rgba(231,76,60,.4);background:rgba(231,76,60,.1);}
.priorite-jour-important{border-color:rgba(240,165,0,.4);background:rgba(240,165,0,.1);}
.priorite-jour-info{border-color:rgba(240,200,0,.35);background:rgba(240,200,0,.08);}
.priorite-jour-voirtout{margin-top:10px;background:none;border:none;color:var(--btp-blue);font-size:12px;font-weight:700;cursor:pointer;padding:4px 2px;}
.priorite-jour-voirtout:hover{text-decoration:underline;}
.priorite-jour-ok{display:flex;align-items:center;gap:8px;background:rgba(29,185,84,.1);
  border:1px solid rgba(29,185,84,.3);border-left:4px solid var(--btp-green);border-radius:var(--btp-radius);
  padding:14px 20px;margin-bottom:20px;color:#2ecc71;font-weight:700;font-size:13px;}
/* Phase 8 (point 25) : "Mode Aujourd'hui" — mêmes puces que priorite-jour-item, regroupées par niveau. */
.mode-aujourdhui{display:flex;flex-direction:column;gap:14px;}
.mode-aujourdhui-groupe{display:flex;flex-direction:column;gap:6px;}
.mode-aujourdhui-titre{font-size:12px;font-weight:800;color:var(--btp-text2);text-transform:uppercase;letter-spacing:.5px;}
.mode-aujourdhui .priorite-jour-item{width:100%;box-sizing:border-box;text-align:left;justify-content:flex-start;}
.mode-aujourdhui-plus{font-size:12px;color:var(--btp-text2);font-style:italic;}

/* Phase 8 — indicateur de connexion (point 6) : petit badge discret, coin superieur droit, jamais
   une grosse banniere. Reste visible en permanence (etat "En ligne" compris), change juste de ton. */
.btp-indicateur-connexion{position:fixed;top:8px;right:10px;z-index:2000;display:flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:14px;font-size:11px;font-weight:700;pointer-events:none;
  background:rgba(13,27,42,.72);color:var(--btp-text2);backdrop-filter:blur(2px);
  transition:background .3s,color .3s;}
.btp-indicateur-connexion.en-ligne{color:#9fd8b0;}
.btp-indicateur-connexion.hors-ligne{background:rgba(192,57,43,.85);color:#fff;}
.btp-indicateur-point{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;}
.btp-indicateur-connexion.en-ligne .btp-indicateur-point{box-shadow:0 0 4px #2ECC71;background:#2ECC71;}
.btp-indicateur-connexion.hors-ligne .btp-indicateur-point{background:#fff;}
@media (max-width:480px){ .btp-indicateur-connexion{top:auto;bottom:8px;right:8px;font-size:10px;} }

/* Bandeau mise a jour (point 4) et invitation installation PWA (point 34) : discrets, en haut,
   n'empechent jamais l'usage du reste de l'ecran en dessous. */
.btp-bandeau-maj{position:fixed;top:0;left:0;right:0;z-index:2100;display:flex;align-items:center;
  justify-content:center;gap:14px;background:var(--btp-gold);color:#1a1200;font-weight:700;font-size:13px;
  padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.25);}
.btp-bandeau-maj button{background:#1a1200;color:#fff;border:none;padding:6px 14px;border-radius:8px;
  font-weight:800;cursor:pointer;font-size:12px;}
.btp-bandeau-install{position:fixed;left:12px;right:12px;bottom:12px;z-index:1900;display:flex;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--btp-card);border:1px solid var(--btp-border);border-left:4px solid var(--btp-orange);
  border-radius:12px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:13px;color:var(--btp-text);}
.btp-bandeau-install button{background:var(--btp-orange);color:#1a1200;border:none;padding:7px 16px;
  border-radius:8px;font-weight:800;cursor:pointer;font-size:12px;}
.btp-bandeau-install-plustard{background:transparent!important;color:var(--btp-text2)!important;font-weight:600!important;}

/* Phase 8 — barre de navigation basse (point 17), mobile uniquement. */
.btp-bottomnav{display:none;}
@media (max-width:640px){
  .btp-bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1500;
    background:var(--btp-navy);border-top:1px solid var(--btp-border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.3);}
  .btp-bottomnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:none;border:none;color:var(--btp-text2);padding:6px 4px;cursor:pointer;font-family:inherit;}
  .btp-bottomnav-icone{font-size:20px;}
  .btp-bottomnav-label{font-size:10px;font-weight:700;}
  .btp-content{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));}

  /* Phase 8 (point 41) : le header desktop suppose que tout tient sur une seule ligne de 64px —
     avec la recherche universelle desormais presente sur tous les roles (point 22), ca deborde sur
     petit ecran. On autorise le passage a la ligne uniquement en dessous de 640px, sans toucher au
     rendu desktop/Direction. */
  .btp-header{height:auto;flex-wrap:wrap;row-gap:8px;padding:10px 14px;}
  .btp-header-right{flex-wrap:wrap;justify-content:flex-end;row-gap:8px;}
}

/* Compteur de notifications (point 24) — pastille discrete a cote de l'action principale. */
.btp-badge-compteur{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
  padding:0 6px;border-radius:11px;background:var(--btp-red);color:#fff;font-size:12px;font-weight:800;}

/* ============ PHASE 9 — Cockpit "Pilotage" (points 24/26/39/40) ============ */
.pilotage-barre-periode{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:6px;}
.pilotage-selecteur-periode{display:flex;flex-wrap:wrap;gap:6px;}
.pilotage-periode-btn{background:var(--btp-card2);border:1px solid var(--btp-border);color:var(--btp-text2);
  padding:6px 12px;border-radius:16px;font-size:12px;font-weight:700;cursor:pointer;}
.pilotage-periode-btn.active{background:var(--btp-orange);border-color:var(--btp-orange);color:#1a1200;}
.pilotage-qualite-donnees{background:rgba(240,165,0,.1);border:1px solid rgba(240,165,0,.35);color:#F0A500;
  border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;margin-bottom:16px;cursor:pointer;}
.pilotage-grid{display:grid;gap:12px;margin-bottom:22px;}
.pilotage-grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.pilotage-grid-4{grid-template-columns:repeat(2,1fr);}}
@media (max-width:480px){.pilotage-grid-4{grid-template-columns:1fr;}}
.pilotage-tile{background:var(--btp-card);border:1px solid var(--btp-border);border-left:4px solid var(--btp-border);
  border-radius:10px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.pilotage-tile.cliquable{cursor:pointer;transition:transform .15s;}
.pilotage-tile.cliquable:hover{transform:translateY(-2px);}
.pilotage-tile-label{font-size:11px;color:var(--btp-text2);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:6px;}
.pilotage-tile-valeur{font-size:24px;font-weight:800;color:var(--btp-text);}
.pilotage-tile-sousligne{font-size:11px;color:var(--btp-text2);margin-top:4px;}
.pilotage-tile-var{font-size:12px;font-weight:800;margin-top:6px;}
.pilotage-tile-var.hausse{color:#2ECC71;}
.pilotage-tile-var.baisse{color:#EC7063;}
.pilotage-section{background:var(--btp-card);border:1px solid var(--btp-border);border-radius:12px;
  padding:16px 18px;margin-bottom:20px;}
.pilotage-section-titre{font-size:13px;font-weight:800;color:var(--btp-gold);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:14px;}
.pilotage-souscadre-titre{font-size:12px;font-weight:700;color:var(--btp-text2);margin-bottom:8px;}
.pilotage-2col{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media (max-width:760px){.pilotage-2col{grid-template-columns:1fr;}}
.pilotage-barres{display:flex;align-items:flex-end;gap:8px;padding-top:8px;}
.pilotage-barre-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.pilotage-barre-col.cliquable{cursor:pointer;}
.pilotage-barre{width:70%;border-radius:4px 4px 0 0;min-height:2px;}
.pilotage-barre-label{font-size:10px;color:var(--btp-text2);margin-top:6px;text-align:center;word-break:break-word;}
.pilotage-ligne{width:100%;height:90px;}
.pilotage-mini-stats{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--btp-text2);margin-top:14px;}
.pilotage-table-scroll{overflow-x:auto;}
.pilotage-vide{color:var(--btp-text2);font-size:12px;padding:20px 0;text-align:center;}
.pilotage tr.cliquable{cursor:pointer;}
.pilotage tr.cliquable:hover{background:rgba(255,255,255,.04);}
@media (max-width:640px){
  .pilotage-tile-valeur{font-size:20px;}
  .pilotage-barre-periode{flex-direction:column;align-items:stretch;}
}

/* ============ PHASE 10 — Planification (points 22/23/48) ============ */
.plan-panneau{max-width:900px;max-height:88vh;overflow-y:auto;}
.plan-jours-rangee{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;}
.plan-jour-carte{flex:0 0 200px;background:var(--btp-card2);border:1px solid var(--btp-border);
  border-radius:10px;padding:10px;}
.plan-jour-date{font-size:12px;font-weight:800;color:var(--btp-orange);text-transform:capitalize;
  margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--btp-border);}
.plan-ligne{border-left:3px solid var(--btp-border);padding:6px 8px;margin-bottom:8px;
  background:rgba(255,255,255,.03);border-radius:0 6px 6px 0;}
.plan-ligne-type{font-size:12px;font-weight:700;color:var(--btp-text);}
.plan-ligne-qte{font-size:15px;font-weight:800;}
.plan-ligne-tier{font-size:10px;font-weight:700;text-transform:uppercase;margin-top:2px;}
.plan-ligne-maturite{font-size:10px;color:var(--btp-text2);margin-top:4px;}
/* Mobile (point 23/48) : cartes empilees verticalement plutot qu'en rangee horizontale scrollable —
   plus naturel au pouce qu'un scroll horizontal sur un planning. */
@media (max-width:640px){
  .plan-jours-rangee{flex-direction:column;overflow-x:visible;}
  .plan-jour-carte{flex:none;width:100%;box-sizing:border-box;}
}

/* ============ MODULE QSE (homogeneisation visuelle avec le reste de l'appli) ============ */
.qse-module{display:flex;flex-direction:column;gap:18px;}
.qse-nav{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--btp-border);padding-bottom:10px;}
.qse-nav-btn{background:rgba(255,255,255,.05);border:1px solid var(--btp-border);color:var(--btp-text2);
  font-size:13px;font-weight:600;padding:9px 14px;border-radius:20px;cursor:pointer;transition:all .2s;}
.qse-nav-btn:hover{background:rgba(255,255,255,.1);color:white;}
.qse-nav-btn.actif{background:linear-gradient(135deg,var(--btp-orange),var(--btp-orange2));color:white;border-color:transparent;}
.qse-contenu{background:var(--btp-card);border:1px solid var(--btp-border);border-radius:var(--btp-radius);padding:22px;box-shadow:var(--btp-shadow2);}
.qse-contenu h3{color:white;font-size:18px;font-weight:800;margin-bottom:16px;}
.qse-contenu h4{color:var(--btp-orange2);font-size:14px;font-weight:700;margin:16px 0 10px;}
.qse-contenu h5{color:var(--btp-text2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px;}

.qse-msg{padding:10px 14px;border-radius:8px;background:rgba(29,185,84,.12);border:1px solid rgba(29,185,84,.3);color:#2ecc71;font-size:13px;font-weight:600;margin-bottom:14px;}
.qse-lot-recap{padding:8px 14px;border-radius:8px;background:rgba(93,173,226,.1);border:1px solid rgba(93,173,226,.3);
  color:#5dade2;font-size:12px;font-weight:600;margin-bottom:14px;}

.qse-form-nc,.qse-form-env,.qse-form-aspect,.qse-form-risque,.qse-form-objectif{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  background:var(--btp-card2);border:1px solid var(--btp-border);border-radius:var(--btp-radius2);
  padding:16px;margin-bottom:18px;
}
.qse-form-env label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--btp-text2);
  text-transform:uppercase;letter-spacing:.5px;font-weight:700;flex:1 1 150px;}
.qse-form-nc input,.qse-form-risque input,.qse-form-objectif input,.qse-form-aspect input{flex:1 1 160px;min-width:120px;}

.qse-module input[type=text],
.qse-module input[type=number],
.qse-module input[type=date],
.qse-module input:not([type]),
.qse-module select,
.qse-module textarea{
  background:var(--btp-steel);border:1.5px solid var(--btp-border);border-radius:var(--btp-radius2);
  padding:9px 12px;color:white;font-size:13px;outline:none;transition:border-color .2s;
}
.qse-module input:focus,.qse-module select:focus,.qse-module textarea:focus{border-color:var(--btp-orange);box-shadow:0 0 0 3px rgba(232,96,28,.15);}
.qse-module input::placeholder{color:rgba(189,195,199,.4);}
.qse-module select option{background:var(--btp-steel);}

.qse-module button.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
  border:none;background:linear-gradient(135deg,var(--btp-orange),var(--btp-orange2));color:white;
  box-shadow:0 4px 12px rgba(232,96,28,.3);transition:all .2s;
}
.qse-module button.btn:hover{box-shadow:0 6px 18px rgba(232,96,28,.45);transform:translateY(-1px);}
.qse-module button.btn-sm{padding:5px 10px;font-size:11px;box-shadow:none;}

.qse-table{width:100%;border-collapse:collapse;font-size:13px;border-radius:var(--btp-radius2);overflow:hidden;}
.qse-table thead tr{background:var(--btp-steel);}
.qse-table th{color:var(--btp-text2);padding:10px 12px;text-align:left;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;border-bottom:2px solid var(--btp-border);white-space:nowrap;}
.qse-table td{padding:9px 12px;border-bottom:1px solid rgba(44,62,80,.6);color:var(--btp-text);vertical-align:middle;}
.qse-table tbody tr:hover{background:rgba(255,255,255,.04);}
.qse-table td input,.qse-table td select{width:100%;min-width:90px;padding:6px 8px;font-size:12px;}

.qse-dashboard{display:flex;flex-direction:column;gap:16px;}
.qse-bloc-afaire,.qse-bloc-qualite,.qse-bloc-environnement{
  background:var(--btp-card2);border:1px solid var(--btp-border);border-radius:var(--btp-radius);
  padding:16px 20px;
}
.qse-bloc-afaire{border-left:4px solid var(--btp-gold);}
.qse-bloc-qualite{border-left:4px solid var(--btp-blue);}
.qse-bloc-environnement{border-left:4px solid var(--btp-green);}
.qse-dashboard ul{list-style:none;display:flex;flex-direction:column;gap:6px;}
.qse-dashboard li{font-size:13px;color:var(--btp-text);}
.qse-dashboard li ul{margin-top:8px;padding-left:14px;border-left:2px solid var(--btp-border);gap:6px;}
.qse-bloc-afaire button.btn-sm{margin-left:10px;}

.qse-controles-afaire{background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.25);border-radius:var(--btp-radius);padding:16px 20px;}

.qse-crit-critique{color:#F1948A;font-weight:800;}
.qse-crit-important{color:var(--btp-gold);font-weight:700;}
.qse-crit-modere{color:var(--btp-blue);font-weight:600;}
.qse-crit-faible{color:var(--btp-text2);}
.qse-ligne-alerte{background:rgba(231,76,60,.08)!important;}

.qse-detail-lot{margin-top:18px;padding-top:16px;border-top:1px solid var(--btp-border);}
.qse-detail-lot ul{list-style:none;display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.qse-detail-lot li{font-size:13px;color:var(--btp-text2);}

@media(max-width:700px){
  .qse-form-nc,.qse-form-env,.qse-form-aspect,.qse-form-risque,.qse-form-objectif{flex-direction:column;align-items:stretch;}
  .qse-table{display:block;overflow-x:auto;}
}

/* ============ FICHE LOT 360 (modal reutilisable partout) ============ */
.fichelot-header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:16px;
  margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--btp-border);}
.fichelot-statut{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:800;white-space:nowrap;}
.fichelot-statut-sechage{background:rgba(240,165,0,.15);color:var(--btp-gold);border:1px solid rgba(240,165,0,.4);}
.fichelot-statut-pret_controle{background:rgba(93,173,226,.15);color:#5dade2;border:1px solid rgba(93,173,226,.4);}
.fichelot-statut-conforme{background:rgba(29,185,84,.15);color:#2ecc71;border:1px solid rgba(29,185,84,.4);}
.fichelot-statut-non_conforme{background:rgba(240,165,0,.15);color:var(--btp-gold);border:1px solid rgba(240,165,0,.4);}
.fichelot-statut-bloque{background:rgba(231,76,60,.15);color:#F1948A;border:1px solid rgba(231,76,60,.4);}
.fichelot-action{background:var(--btp-card2);border-left:4px solid var(--btp-orange);border-radius:var(--btp-radius2);
  padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--btp-text);display:flex;align-items:center;
  justify-content:space-between;gap:12px;flex-wrap:wrap;}
.fichelot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px;}
.fichelot-fait{background:var(--btp-card2);border-radius:var(--btp-radius2);padding:10px 12px;}
.fichelot-fait-label{font-size:10px;color:var(--btp-text2);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:3px;}
.fichelot-fait-valeur{font-size:14px;color:white;font-weight:700;}
.fichelot-caveat{font-size:11px;color:var(--btp-text2);font-style:italic;margin:6px 0 0;}
.fichelot-section{margin-top:22px;}
.fichelot-section h4{font-size:13px;color:var(--btp-orange2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;font-weight:800;}
.fichelot-timeline{display:flex;flex-direction:column;gap:2px;}
.fichelot-tl-item{display:flex;gap:12px;padding:8px 0 8px 16px;border-left:2px solid var(--btp-border);margin-left:8px;position:relative;}
.fichelot-tl-item:last-child{border-left-color:transparent;}
.fichelot-tl-item::before{content:'';position:absolute;left:-7px;top:12px;width:12px;height:12px;border-radius:50%;
  background:var(--btp-border);border:2px solid var(--btp-card);}
.fichelot-tl-item.tl-ok::before{background:var(--btp-green);}
.fichelot-tl-item.tl-warn::before{background:var(--btp-gold);}
.fichelot-tl-item.tl-bad::before{background:var(--btp-red);}
.fichelot-tl-item.tl-pending::before{background:var(--btp-text2);}
.fichelot-tl-titre{font-size:13px;font-weight:700;color:white;}
.fichelot-tl-detail{font-size:12px;color:var(--btp-text2);margin-top:2px;}
.fichelot-anomalies{background:rgba(231,76,60,.08);border:1px solid rgba(231,76,60,.3);border-radius:var(--btp-radius2);
  padding:12px 16px;margin-bottom:16px;}
.fichelot-anomalies h4{color:#F1948A;font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.fichelot-anomalies ul{list-style:none;display:flex;flex-direction:column;gap:4px;}
.fichelot-anomalies li{font-size:12px;color:#F1948A;}

/* ============ RECHERCHE GLOBALE (Ctrl+K) ============ */
.gsearch-trigger{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.06);border:1px solid var(--btp-border);color:var(--btp-text2);
  border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;
}
.gsearch-trigger:hover{background:rgba(255,255,255,.12);color:white;}
.gsearch-kbd{background:rgba(0,0,0,.3);border:1px solid var(--btp-border);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--btp-text2);}
.gsearch-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;
  display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;
  backdrop-filter:blur(4px);
}

// depuis le cache local quand le reseau est coupe, y compris apres un rechargement/relance de la
// PWA — c'est le mecanisme natif qui rend la "consultation hors ligne" (Phase 8, points 8/9)
// possible sans construire de couche de cache maison. Echoue silencieusement si plusieurs onglets
// sont ouverts ou si le navigateur ne supporte pas IndexedDB : dans ce cas, l'app continue de

// PHASE 8 — Infrastructure partagee : version d'app, etat de connexion reel, execution harmonisee
// des operations critiques (jamais de confirmation avant que Firestore ait reellement repondu),
// mise a jour du service worker, invite d'installation PWA, "recents" locaux. Regroupe ici pour que
// chaque composant du reste du fichier puisse s'y brancher sans dupliquer de logique.
// ============================================================================================
const APP_VERSION = "8.0.0";

// Verrou anti-double-declenchement partage entre TOUS les composants (module-level, pas de state
// React) : protege meme si deux boutons/chemins UI differents tentaient la meme operation logique
// en meme temps (ex: clic + touche Entree). Cle libre, choisie par l'appelant (point 12).
var VERROUS_OPERATIONS_EN_COURS = {};

// Contexte de connectivite (point 6/9) : navigator.onLine donne l'etat de l'interface reseau
// (rapide mais peu fiable — un wifi capture, par exemple, reste "online"), affine par un vrai
// signal Firestore : le document utilisateur courant est ecoute avec includeMetadataChanges, et
// snapshot.metadata.fromCache indique si la derniere reponse vient reellement du serveur ou du
// cache local. Un seul listener leger, mutualise pour toute l'application (pas un ecouteur de plus
// par composant), qui alimente aussi "derniere synchro" pour le panneau diagnostic (point 33).
const ConnexionContext = React.createContext({ enLigne: true, firestoreOK: true, derniereSync: null });
function useConnexion() { return React.useContext(ConnexionContext); }

function ConnexionProvider({ children }) {
  const [enLigneBrut, setEnLigneBrut] = React.useState(typeof navigator !== "undefined" ? navigator.onLine : true);
  const [firestoreOK, setFirestoreOK] = React.useState(true);
  const [derniereSync, setDerniereSync] = React.useState(null);
  const [uid, setUid] = React.useState(auth.currentUser ? auth.currentUser.uid : null);

  React.useEffect(() => {
    const surEnLigne = () => setEnLigneBrut(true);
    const surHorsLigne = () => setEnLigneBrut(false);
    window.addEventListener("online", surEnLigne);
    window.addEventListener("offline", surHorsLigne);
    return () => { window.removeEventListener("online", surEnLigne); window.removeEventListener("offline", surHorsLigne); };
  }, []);

  React.useEffect(() => auth.onAuthStateChanged(function (u) { setUid(u ? u.uid : null); }), []);

  React.useEffect(() => {
    if (!uid) { setFirestoreOK(true); return; }
    var annule = false;
    var unsub = db.collection("users").doc(uid).onSnapshot({ includeMetadataChanges: true }, function (snap) {
      if (annule) return;
      var depuisCache = snap.metadata.fromCache;
      setFirestoreOK(!depuisCache);
      if (!depuisCache) setDerniereSync(new Date());
    }, function () { if (!annule) setFirestoreOK(false); });
    return function () { annule = true; unsub(); };
  }, [uid]);

  // "Reellement joignable" = les deux signaux d'accord ; si l'un des deux dit non, on prefere le
  // faux negatif (indicateur "hors ligne" affiche a tort) au faux positif (jamais de "en ligne"
  // affiche a tort — c'est la propriete qui protege des confirmations d'ecriture erronees).
  var enLigne = enLigneBrut && firestoreOK;
  var valeur = React.useMemo(function () {
    return { enLigne: enLigne, enLigneBrut: enLigneBrut, firestoreOK: firestoreOK, derniereSync: derniereSync };
  }, [enLigne, enLigneBrut, firestoreOK, derniereSync]);
  return <ConnexionContext.Provider value={valeur}>{children}</ConnexionContext.Provider>;
}

// Execution harmonisee d'une operation Firestore critique (points 7/8/11/12/13). N'affiche JAMAIS
// de succes avant que la promesse ait reellement abouti ; refuse immediatement et clairement si
// hors ligne (aucune tentative) ; signale une connexion lente sans jamais relancer l'operation tout
// seul ; protege contre le double-declenchement via VERROUS_OPERATIONS_EN_COURS.
// options: { cle, enLigne, setStatut(fn), operation:()=>Promise, texteEnCours, texteSucces(res)|string, texteHorsLigne, onSuccess, onError }
// setStatut recoit toujours un objet { etat: 'encours'|'succes'|'echec', texte }.
function executerOperationCritique(options) {
  var cle = options.cle || ("op_" + Math.random());
  var setStatut = options.setStatut || function () {};
  if (VERROUS_OPERATIONS_EN_COURS[cle]) {
    return Promise.reject(new Error("Une opération est déjà en cours pour cette action."));
  }
  if (options.enLigne === false) {
    setStatut({ etat: "echec", texte: options.texteHorsLigne || "🚫 Connexion requise — action impossible hors connexion." });
    return Promise.reject(new Error("hors_ligne"));
  }
  VERROUS_OPERATIONS_EN_COURS[cle] = true;
  var texteBase = options.texteEnCours || "Enregistrement...";
  setStatut({ etat: "encours", texte: texteBase });
  var lent = setTimeout(function () {
    setStatut({ etat: "encours", texte: texteBase + " · Connexion lente — toujours en cours." });
  }, 4000);
  function terminer() { delete VERROUS_OPERATIONS_EN_COURS[cle]; clearTimeout(lent); }
  return options.operation().then(function (resultat) {
    terminer();
    var texteSucces = typeof options.texteSucces === "function" ? options.texteSucces(resultat) : (options.texteSucces || "✓ Opération enregistrée.");
    setStatut({ etat: "succes", texte: texteSucces });
    if (options.onSuccess) options.onSuccess(resultat);
    return resultat;
  }, function (e) {
    terminer();
    setStatut({ etat: "echec", texte: "❌ Échec de l'enregistrement — aucune modification confirmée. (" + (e && e.message ? e.message : "erreur") + ")" });
    if (options.onError) options.onError(e);
    throw e;
  });
}

// Enregistrement du service worker + detection de nouvelle version (points 3/4/5). Le service
// worker reste passif tant qu'aucune nouvelle version n'est installee ; des qu'une nouvelle version
// est PRETE (installee, en attente), on le signale via `disponible` sans jamais rafraichir tout
// seul — c'est l'utilisateur qui declenche `actualiser()` (bouton "Nouvelle version — Actualiser"),
// pour ne jamais interrompre une saisie ou une operation en cours.
function useMiseAJourServiceWorker() {
  const [disponible, setDisponible] = React.useState(false);
  const attenteRef = React.useRef(null);
  React.useEffect(() => {
    if (!("serviceWorker" in navigator)) return;
    var annule = false;
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      if (annule || !reg) return;
      function verifierAttente() {
        if (reg.waiting && navigator.serviceWorker.controller) { attenteRef.current = reg.waiting; setDisponible(true); }
      }
      verifierAttente();
      reg.addEventListener("updatefound", function () {
        var nouveau = reg.installing;
        if (!nouveau) return;
        nouveau.addEventListener("statechange", function () {
          if (nouveau.state === "installed" && navigator.serviceWorker.controller) {
            attenteRef.current = nouveau; setDisponible(true);
          }
        });
      });
    }).catch(function () {});
    // Au tout premier chargement (aucun service worker n'a encore jamais controle cette page),
    // clients.claim() dans sw.js declenche AUSSI un "controllerchange" des l'activation initiale —
    // ce n'est pas une nouvelle version qui remplace une version active, juste la toute premiere
    // prise de controle. On ne recharge que si un controleur existait DEJA avant cet evenement,
    // signe qu'un service worker actif vient reellement d'etre remplace par une version plus recente.
    var controleurInitial = navigator.serviceWorker.controller;
    var dejaRecharge = false;
    var surChangementControleur = function () {
      if (!controleurInitial) { controleurInitial = navigator.serviceWorker.controller; return; }
      if (dejaRecharge) return; dejaRecharge = true; window.location.reload();
    };
    navigator.serviceWorker.addEventListener("controllerchange", surChangementControleur);
    return function () { annule = true; navigator.serviceWorker.removeEventListener("controllerchange", surChangementControleur); };
  }, []);
  const actualiser = function () { if (attenteRef.current) attenteRef.current.postMessage({ type: "SKIP_WAITING" }); };
  return { disponible: disponible, actualiser: actualiser };
}

// Invite d'installation PWA (point 34) : Chrome/Edge Android emettent "beforeinstallprompt" ; on le
// capture pour proposer NOTRE bouton discret plutot que le mini-popup natif imprevisible, et on
// respecte un refus (pas de re-proposition avant 7 jours, memorise en localStorage — jamais de
// donnee critique dans ce stockage, juste une preference d'affichage, point 44/19).
function useInvitationInstallationPWA() {
  const [evenement, setEvenement] = React.useState(null);
  const [installee, setInstallee] = React.useState(function () {
    try { return window.matchMedia && window.matchMedia("(display-mode: standalone)").matches; } catch (e) { return false; }
  });
  React.useEffect(() => {
    var surPrompt = function (e) { e.preventDefault(); setEvenement(e); };
    var surInstalle = function () { setInstallee(true); setEvenement(null); };
    window.addEventListener("beforeinstallprompt", surPrompt);
    window.addEventListener("appinstalled", surInstalle);
    return function () { window.removeEventListener("beforeinstallprompt", surPrompt); window.removeEventListener("appinstalled", surInstalle); };
  }, []);
  var refusRecent = function () {
    try {
      var t = localStorage.getItem("btc_install_refuse_le");
      return t && (Date.now() - parseInt(t, 10)) < 7 * 24 * 3600 * 1000;
    } catch (e) { return false; }
  };
  const proposer = !installee && !!evenement && !refusRecent();
  const installer = async function () {
    if (!evenement) return;
    try { await evenement.prompt(); await evenement.userChoice; } catch (e) {}
    setEvenement(null);
  };
  const refuser = function () {
    try { localStorage.setItem("btc_install_refuse_le", String(Date.now())); } catch (e) {}
    setEvenement(null);
  };
  return { proposer: proposer, installer: installer, refuser: refuser };
}

// "Recents" locaux (point 19) : uniquement un confort de navigation, jamais une donnee fiable pour
// une decision de stock — juste des raccourcis vers les dernieres fiches consultees.

    localStorage.setItem("btc_recents", JSON.stringify(liste.slice(0, 8)));

}

const MS_PAR_JOUR = 86400000;

function couleurUrgence(total) {

function dateProductionMs(p) {
if (p && typeof p === "object" && !p.toDate) {
  if (p.date && typeof p.date === "string" && p.date.indexOf("/") !== -1) {
    var parts = p.date.split("/");
    if (parts.length === 3) {
      var jj = parseInt(parts[0],10), mm = parseInt(parts[1],10), aaaa = parseInt(parts[2],10);
      var dt = new Date(aaaa, mm-1, jj);
      if (!isNaN(dt.getTime())) return dt.getTime();
    }
  }
  if (p.timestamp) { return p.timestamp.toDate ? p.timestamp.toDate().getTime() : new Date(p.timestamp).getTime(); }
  return 0;
}
if (!p) return 0;
return p.toDate ? p.toDate().getTime() : new Date(p).getTime();
}
function joursRestants(arg) {
var ms = dateProductionMs(arg);
if (!ms) return 0;
return Math.max(0, DUREE_SECHAGE - Math.floor((Date.now()-ms)/MS_PAR_JOUR));
}
// Convertit un champ de date/heure Firestore heterogene (Timestamp, {seconds}, {_ms} du mock de test, ou Date) en ms epoch. 0 si inconnu.
function qseTsMs(v) {
  if (!v) return 0;
  if (typeof v.toDate === "function") return v.toDate().getTime();
  if (typeof v.seconds === "number") return v.seconds * 1000;
  if (typeof v._ms === "number") return v._ms;
  if (v instanceof Date) return v.getTime();
  return 0;
}
function calcSechageActif(prods, typeId) {
var now28 = Date.now() - DUREE_SECHAGE*MS_PAR_JOUR;
var actif = 0;
prods.forEach(function(p) {
if (p.type!==typeId||p.phase!=='sechage') return;
var d = dateProductionMs(p);
if (d && d>now28) actif += (p.quantite||0);
});
return actif;
}

// Normalisation centralisee (minuscules + sans accents + espaces superflus retires).
// Utilisee pour comparer des statuts de facon fiable quelle que soit la casse saisie,
// et pour la recherche globale (Phase 3) afin de tolerer casse/accents/saisie partielle.
function normTxt(s) {
  if (s === null || s === undefined) return "";
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
}

// ============================================================================================
// MOTEUR DE PRIORITES OPERATIONNELLES (Phase 4)
// Fonction pure et deterministe : mêmes donnees en entree -> memes priorites en sortie, jamais
// d'appel Firestore ici. Toutes les priorites disparaissent d'elles-memes des que leur condition
// n'est plus vraie (la fonction est rappelee a chaque nouveau snapshot, rien n'est memorise "en
// dur" cote etat), donc aucune priorite ne doit jamais etre fermee/masquee manuellement.
//
// Convention du champ "urgence" (usage interne, jamais affiche) : nombre de jours avant que la
// situation devienne critique. Negatif = deja en retard / deficit immediat (plus negatif = plus
// urgent). 0 = aujourd'hui. Positif = echeance a venir dans N jours. Sert uniquement au tri.
//
// Regle de regroupement (evite de noyer l'utilisateur, cf. point 10 de la demande) : quand une
// categorie de probleme concerne un seul objet, la priorite pointe directement dessus (ouvrirObjet
// precis). Des qu'elle en concerne plusieurs, on affiche UNE seule ligne de synthese qui renvoie
// vers la liste pertinente plutot que N lignes individuelles.
// ============================================================================================

// Difference en jours entre deux dates ISO "yyyy-mm-dd" (dateA - dateB). Retourne null si l'une
// des deux dates est absente ou invalide (jamais de fausse echeance calculee sur donnee manquante).
function joursEntreDatesISO(dateA, dateB) {
  if (!dateA || !dateB) return null;
  var a = new Date(dateA + "T00:00:00");
  var b = new Date(dateB + "T00:00:00");
  if (isNaN(a.getTime()) || isNaN(b.getTime())) return null;
  return Math.round((a.getTime() - b.getTime()) / MS_PAR_JOUR);
}

// Tri deterministe : 1) criticite (critique > important > info), 2) urgence (le plus urgent
// d'abord), 3) anciennete (le plus ancien d'abord a egalite). Aucune ponderation aleatoire.
function trierPriorites(liste) {
  var poidsNiveau = { critique: 0, important: 1, info: 2 };
  return liste.slice().sort(function (a, b) {
    var pa = poidsNiveau[a.niveau] != null ? poidsNiveau[a.niveau] : 3;
    var pb = poidsNiveau[b.niveau] != null ? poidsNiveau[b.niveau] : 3;
    if (pa !== pb) return pa - pb;
    if (a.urgence !== b.urgence) return a.urgence - b.urgence;
    return (b.anciennete || 0) - (a.anciennete || 0);
  });
}

  // Phase 8 (point 21) : le Responsable Stock voit son propre perimetre operationnel — l'etat du
  // stock et les commandes a reserver/livrer — jamais les alertes QSE/production qui ne le concernent pas.
  resp_stock: ["stock_bas", "stock_bas_groupe", "stock_incoherent", "stock_proche_seuil", "stock_proche_seuil_groupe", "commande_reservation_insuffisante", "commande_reservation_insuffisante_groupe", "commande_validee_sans_reservation", "commande_validee_sans_reservation_groupe", "commande_prete_a_livrer", "commande_prete_a_livrer_groupe", "rupture_probable"]
};
function filtrerPrioritesParRole(liste, role) {
  var autorises = PRIORITES_PAR_ROLE[role];
  if (!autorises) return liste;
  return liste.filter(function (p) { return autorises.indexOf(p.type) !== -1; });
}

function calculerPrioritesOperationnelles(donnees) {
  var stocks = donnees.stocks || {};
  var commandes = donnees.commandes || [];
  var lots = donnees.lots || [];
  var controlesEnAttente = donnees.controlesEnAttente || []; // deja filtre "Non mesure" cote Firestore
  var numerosAvecControleRecent = donnees.numerosAvecControleRecent || {}; // best-effort (voir commentaire au niveau de l'ecouteur)
  var ncs = donnees.ncs || [];
  var maintenant = donnees.maintenant || Date.now();
  var priorites = [];

  // --- STOCK : sous seuil, rupture, incoherence. Une classification max par produit (jamais
  // plusieurs alertes empilees pour le meme produit). Si plus de 3 produits sont simultanement en
  // alerte, on condense en une seule ligne de synthese plutot que d'empiler une ligne par produit
  // (point 10 : eviter les alertes repetitives) ; en dessous de ce seuil, chaque ligne reste
  // individuelle et actionnable, conformement a l'exemple donne dans la demande. ---
  var stockAlertes = [], stockProchesSeuil = [];
  CATALOGUE.forEach(function (prod) {
    var s = stocks[prod.id] || {};
    var total = (s.sec || 0) + (s.sechage || 0);
    if (total < 0) {
      priorites.push({
        type: "stock_incoherent", niveau: "critique",
        titre: prod.nom + " : quantité en stock négative (" + total + ")",
        explication: "Incohérence de donnée détectée sur ce stock.",
        urgence: -999, objet: { type: "tab", id: "stock" }, action: "Vérifier l'inventaire"
      });
      return;
    }
    if (total < STOCK_ALERTE) stockAlertes.push({ prod: prod, total: total });
    else if (total < STOCK_ALERTE * 1.2) stockProchesSeuil.push({ prod: prod, total: total });
  });
  if (stockAlertes.length > 0 && stockAlertes.length <= 3) {
    stockAlertes.forEach(function (a) {
      priorites.push({
        type: "stock_bas", niveau: a.total <= 0 ? "critique" : "important",
        titre: a.prod.nom + " : " + a.total.toLocaleString() + " u disponibles — seuil minimum " + STOCK_ALERTE.toLocaleString(),
        explication: "Stock sous le seuil d'alerte.",
        urgence: a.total <= 0 ? -50 : -Math.round((STOCK_ALERTE - a.total) / 200),
        objet: { type: "tab", id: "stock" }, action: "Planifier une production"
      });
    });
  } else if (stockAlertes.length > 3) {
    var nbRupture = stockAlertes.filter(function (a) { return a.total <= 0; }).length;
    priorites.push({
      type: "stock_bas_groupe", niveau: nbRupture > 0 ? "critique" : "important",
      titre: stockAlertes.length + " références sous le seuil de stock minimum" + (nbRupture > 0 ? " (dont " + nbRupture + " en rupture)" : ""),
      explication: "Plusieurs références nécessitent une production.",
      urgence: nbRupture > 0 ? -50 : -10, objet: { type: "tab", id: "stock" }, action: "Voir le stock"
    });
  }
  if (stockProchesSeuil.length === 1) {
    priorites.push({
      type: "stock_proche_seuil", niveau: "info",
      titre: stockProchesSeuil[0].prod.nom + " : stock proche du seuil (" + stockProchesSeuil[0].total.toLocaleString() + " u)",
      explication: "À surveiller dans les prochains jours.",
      urgence: 3, objet: { type: "tab", id: "stock" }, action: "Voir le stock"
    });
  } else if (stockProchesSeuil.length > 1) {
    priorites.push({
      type: "stock_proche_seuil_groupe", niveau: "info",
      titre: stockProchesSeuil.length + " références proches du seuil de stock",
      explication: "À surveiller dans les prochains jours.",
      urgence: 3, objet: { type: "tab", id: "stock" }, action: "Voir le stock"
    });
  }

  // --- COMMANDES validees non livrees (Phase 6, point 23) : comparees par TYPE, mais desormais en
  // tenant compte des RESERVATIONS deja posees (commande.quantiteReservee, cache tenu a jour par
  // reserverCommandeStock/livrerReservation/annulerReservation — aucune lecture Firestore
  // supplementaire ici, tout vient de "commandes"/"stocks" deja charges : discipline de performance,
  // point 34). "stock physique != stock reellement disponible" : le moteur distingue maintenant les
  // deux, sans dupliquer les anciennes alertes de deficit (elles sont remplacees, pas ajoutees). ---
  var commandesValidees = commandes.filter(function (c) { return normTxt(c.status) === normTxt("Validee") && (c.quantite || 0) > (c.quantiteLivree || 0); });
  var parType = {};
  commandesValidees.forEach(function (c) {
    var resteACouvrir = Math.max(0, (c.quantite || 0) - (c.quantiteLivree || 0) - (c.quantiteReservee || 0));
    var pretALivrer = resteACouvrir === 0 && (c.quantiteReservee || 0) > 0; // reservation active, plus rien a reserver, en attente du depart camion
    (parType[c.type] = parType[c.type] || []).push({ cmd: c, resteACouvrir: resteACouvrir, pretALivrer: pretALivrer, reserve: c.quantiteReservee || 0 });
  });
  Object.keys(parType).forEach(function (type) {
    var lignes = parType[type];
    var reserveType = lignes.reduce(function (a, l) { return a + l.reserve; }, 0);
    var disponibleAReserverType = Math.max(0, ((stocks[type] || {}).sec || 0) - reserveType);
    var totalACouvrirType = lignes.reduce(function (a, l) { return a + l.resteACouvrir; }, 0);

    if (totalACouvrirType > disponibleAReserverType) {
      var deficit = totalACouvrirType - disponibleAReserverType;
      var lignesADeficit = lignes.filter(function (l) { return l.resteACouvrir > 0; });
      if (lignesADeficit.length === 1) {
        priorites.push({
          type: "commande_reservation_insuffisante", niveau: "critique",
          titre: "Commande " + (lignesADeficit[0].cmd.numBC || lignesADeficit[0].cmd.id) + " (" + (lignesADeficit[0].cmd.chantierNom || lignesADeficit[0].cmd.client || "-") + ") : à réserver " + lignesADeficit[0].resteACouvrir.toLocaleString() + ", disponible à réserver " + disponibleAReserverType.toLocaleString() + ", déficit " + deficit.toLocaleString(),
          explication: "Le stock disponible à réserver ne couvre pas cette commande validée (stock physique moins réservations déjà posées).",
          urgence: -100 - deficit, objet: { type: "commande", id: lignesADeficit[0].cmd.id }, action: "Voir la commande"
        });
      } else {
        priorites.push({
          type: "commande_reservation_insuffisante_groupe", niveau: "critique",
          titre: lignesADeficit.length + " commandes validées de " + getProduit(type).nom + " dépassent le stock disponible à réserver (déficit total " + deficit.toLocaleString() + " u)",
          explication: "Demande cumulée " + totalACouvrirType.toLocaleString() + " u pour " + disponibleAReserverType.toLocaleString() + " u disponibles à réserver.",
          urgence: -100 - deficit, objet: { type: "tab", id: "stock" }, action: "Voir le stock"
        });
      }
    } else {
      var lignesAReserver = lignes.filter(function (l) { return l.resteACouvrir > 0; });
      if (lignesAReserver.length === 1) {
        priorites.push({
          type: "commande_validee_sans_reservation", niveau: "important",
          titre: "Commande " + (lignesAReserver[0].cmd.numBC || lignesAReserver[0].cmd.id) + " validée, sans réservation suffisante",
          explication: (lignesAReserver[0].cmd.chantierNom || lignesAReserver[0].cmd.client || "-") + " · " + lignesAReserver[0].resteACouvrir.toLocaleString() + " u encore à réserver",
          urgence: 1, objet: { type: "commande", id: lignesAReserver[0].cmd.id }, action: "Réserver le stock"
        });
      } else if (lignesAReserver.length > 1) {
        priorites.push({
          type: "commande_validee_sans_reservation_groupe", niveau: "important",
          titre: lignesAReserver.length + " commandes validées de " + getProduit(type).nom + " sans réservation suffisante",
          explication: "", urgence: 1, objet: { type: "tab", id: "stock" }, action: "Réserver le stock"
        });
      }
    }

    var lignesPretes = lignes.filter(function (l) { return l.pretALivrer; });
    if (lignesPretes.length === 1) {
      priorites.push({
        type: "commande_prete_a_livrer", niveau: "info",
        titre: "Commande " + (lignesPretes[0].cmd.numBC || lignesPretes[0].cmd.id) + " : réservation prête pour livraison",
        explication: (lignesPretes[0].cmd.chantierNom || lignesPretes[0].cmd.client || "-") + " · " + lignesPretes[0].reserve.toLocaleString() + " u réservées",
        urgence: 5, objet: { type: "commande", id: lignesPretes[0].cmd.id }, action: "Voir la commande"
      });
    } else if (lignesPretes.length > 1) {
      priorites.push({
        type: "commande_prete_a_livrer_groupe", niveau: "info",
        titre: lignesPretes.length + " commandes de " + getProduit(type).nom + " prêtes pour livraison",
        explication: "", urgence: 5, objet: { type: "tab", id: "stock" }, action: "Voir le stock"
      });
    }
  });

  // --- Commandes en attente de validation Direction ---
  var commandesEnAttente = commandes.filter(function (c) { return normTxt(c.status) === normTxt("EnAttente"); });
  if (commandesEnAttente.length === 1) {
    priorites.push({
      type: "commande_a_valider", niveau: "important",
      titre: "Commande " + (commandesEnAttente[0].numBC || commandesEnAttente[0].id) + " en attente de validation",
      explication: commandesEnAttente[0].chantierNom || commandesEnAttente[0].client || "-",
      urgence: 1, objet: { type: "commande", id: commandesEnAttente[0].id }, action: "Voir la commande"
    });
  } else if (commandesEnAttente.length > 1) {
    priorites.push({
      type: "commande_a_valider_groupe", niveau: "important",
      titre: commandesEnAttente.length + " commande(s) en attente de validation",
      explication: "", urgence: 1, objet: { type: "tab", id: "commandes" }, action: "Voir les commandes"
    });
  }

  // --- SECHAGE / CONTROLES : deduits des controles encore "Non mesuré" (pas de decision qualite
  // automatique - la conformite reste toujours une validation humaine). ---
  var ncParLotBloquant = {}; // NC ouvertes SANS echeance (les NC avec echeance sont couvertes plus loin, plus precisement)
  ncs.forEach(function (nc) {
    if (nc.statut === "Cloturee" || !nc.numeroLot || nc.echeanceAction) return;
    (ncParLotBloquant[nc.numeroLot] = ncParLotBloquant[nc.numeroLot] || []).push(nc);
  });

  var lotsEnRetard = [], lotsMatures = [], lotsBientotMatures = [];
  controlesEnAttente.forEach(function (ctrl) {
    if (!ctrl.numeroLot || ncParLotBloquant[ctrl.numeroLot]) return; // deja remonte comme NC bloquante
    var lot = lots.find(function (l) { return l.numeroLot === ctrl.numeroLot; }) || ctrl;
    var ageMs = dateProductionMs(lot);
    if (!ageMs) return;
    var joursDepuisProd = Math.floor((maintenant - ageMs) / MS_PAR_JOUR);
    var retard = joursDepuisProd - DUREE_SECHAGE;
    if (retard > 0) lotsEnRetard.push({ lot: lot, retard: retard });
    else if (retard === 0) lotsMatures.push({ lot: lot });
    else if (retard >= -3) lotsBientotMatures.push({ lot: lot, joursRestants: -retard });
  });

  if (lotsEnRetard.length === 1) {
    var lr = lotsEnRetard[0];
    priorites.push({
      type: "controle_retard", niveau: "critique",
      titre: "Lot " + lr.lot.numeroLot + " — contrôle en retard de " + lr.retard + " jour" + (lr.retard > 1 ? "s" : ""),
      explication: "Séchage terminé depuis " + lr.retard + " jour(s) sans contrôle enregistré.",
      urgence: -lr.retard, objet: { type: "lot", id: lr.lot.numeroLot }, action: "Effectuer le contrôle"
    });
  } else if (lotsEnRetard.length > 1) {
    var pireRetard = lotsEnRetard.reduce(function (m, x) { return Math.max(m, x.retard); }, 0);
    priorites.push({
      type: "controle_retard_groupe", niveau: "critique",
      titre: lotsEnRetard.length + " lots en retard de contrôle (jusqu'à " + pireRetard + " j)",
      explication: "Plusieurs lots ont dépassé leur durée de séchage sans contrôle.",
      urgence: -pireRetard, objet: { type: "qse_onglet", id: "controles" }, action: "Voir les contrôles"
    });
  }
  if (lotsMatures.length === 1) {
    priorites.push({
      type: "lot_pret", niveau: "important",
      titre: "Lot " + lotsMatures[0].lot.numeroLot + " prêt à contrôler",
      explication: "Séchage terminé aujourd'hui.",
      urgence: 0, objet: { type: "lot", id: lotsMatures[0].lot.numeroLot }, action: "Effectuer le contrôle"
    });
  } else if (lotsMatures.length > 1) {
    priorites.push({
      type: "lot_pret_groupe", niveau: "important",
      titre: lotsMatures.length + " lots prêts à contrôler",
      explication: "Séchage terminé, contrôle qualité nécessaire.",
      urgence: 0, objet: { type: "qse_onglet", id: "controles" }, action: "Voir les contrôles"
    });
  }
  if (lotsBientotMatures.length > 0) {
    var prochain = lotsBientotMatures.slice().sort(function (a, b) { return a.joursRestants - b.joursRestants; })[0];
    priorites.push({
      type: "lot_bientot_mature", niveau: "info",
      titre: lotsBientotMatures.length + " lot(s) bientôt mature(s) (dès " + prochain.joursRestants + " j)",
      explication: "Séchage bientôt terminé.",
      urgence: prochain.joursRestants,
      objet: lotsBientotMatures.length === 1 ? { type: "lot", id: prochain.lot.numeroLot } : { type: "qse_onglet", id: "tracabilite" },
      action: "Voir les lots"
    });
  }

  // --- Lots sans AUCUN controle enregistre (different de "Non mesure" : ici zero enregistrement
  // du tout). Ne cree jamais rien silencieusement, se contente de signaler. ---
  var lotsSansControle = lots.filter(function (l) { return l.numeroLot && !numerosAvecControleRecent[l.numeroLot]; });
  if (lotsSansControle.length === 1) {
    priorites.push({
      type: "lot_sans_controle", niveau: "important",
      titre: "Lot " + lotsSansControle[0].numeroLot + " — contrôle attendu mais absent",
      explication: "Aucun enregistrement de contrôle qualité trouvé pour ce lot.",
      urgence: -5, objet: { type: "lot", id: lotsSansControle[0].numeroLot }, action: "Vérifier ce lot"
    });
  } else if (lotsSansControle.length > 1) {
    priorites.push({
      type: "lot_sans_controle_groupe", niveau: "important",
      titre: lotsSansControle.length + " lots sans aucun contrôle qualité enregistré",
      explication: "", urgence: -5, objet: { type: "qse_onglet", id: "tracabilite" }, action: "Voir les lots"
    });
  }

  // --- NC bloquantes sans echeance (celles avec echeance sont traitees ci-dessous, message plus precis) ---
  var lotsNCBloquantes = Object.keys(ncParLotBloquant);
  if (lotsNCBloquantes.length === 1) {
    priorites.push({
      type: "nc_bloquante", niveau: "critique",
      titre: "Lot " + lotsNCBloquantes[0] + " — non-conformité ouverte",
      explication: ncParLotBloquant[lotsNCBloquantes[0]][0].description || "",
      urgence: -10, objet: { type: "lot", id: lotsNCBloquantes[0] }, action: "Traiter la NC"
    });
  } else if (lotsNCBloquantes.length > 1) {
    priorites.push({
      type: "nc_bloquante_groupe", niveau: "critique",
      titre: lotsNCBloquantes.length + " lots bloqués par une non-conformité ouverte",
      explication: "", urgence: -10, objet: { type: "qse_onglet", id: "nc" }, action: "Voir les non-conformités"
    });
  }

  // --- Echeances des actions correctives NC (point 8). Jamais de retard invente : une NC sans
  // echeanceAction n'est jamais consideree en retard. ---
  var aujourdHuiISO = new Date(maintenant).toISOString().slice(0, 10);
  var ncEnRetard = [], ncEcheanceAuj = [], ncEcheanceProche = [];
  ncs.forEach(function (nc) {
    if (nc.statut === "Cloturee" || !nc.echeanceAction) return;
    var diff = joursEntreDatesISO(nc.echeanceAction, aujourdHuiISO);
    if (diff === null) return;
    if (diff < 0) ncEnRetard.push({ nc: nc, retard: -diff });
    else if (diff === 0) ncEcheanceAuj.push({ nc: nc });
    else if (diff <= 3) ncEcheanceProche.push({ nc: nc, joursRestants: diff });
  });
  function objetPourNC(nc) { return nc.numeroLot ? { type: "lot", id: nc.numeroLot } : { type: "qse_onglet", id: "nc" }; }
  function ajouterPrioriteEcheanceNC(liste, niveau, texteUnique, texteGroupe, urgenceFn) {
    if (liste.length === 1) {
      var item = liste[0], nc = item.nc || item;
      priorites.push({ type: "nc_echeance", niveau: niveau, titre: texteUnique(item), explication: nc.description || "", urgence: urgenceFn(item), objet: objetPourNC(nc), action: "Traiter la NC" });
    } else if (liste.length > 1) {
      priorites.push({ type: "nc_echeance_groupe", niveau: niveau, titre: texteGroupe(liste.length), explication: "", urgence: urgenceFn(liste[0]), objet: { type: "qse_onglet", id: "nc" }, action: "Voir les non-conformités" });
    }
  }
  ajouterPrioriteEcheanceNC(ncEnRetard, "critique",
    function (item) { return "NC " + (item.nc.numeroLot || "(lot inconnu)") + " — action corrective en retard de " + item.retard + " jour" + (item.retard > 1 ? "s" : ""); },
    function (n) { return n + " actions correctives NC en retard"; },
    function (item) { return -item.retard; });
  ajouterPrioriteEcheanceNC(ncEcheanceAuj, "important",
    function (item) { return "NC " + (item.nc.numeroLot || "(lot inconnu)") + " — action corrective à traiter aujourd'hui"; },
    function (n) { return n + " actions correctives NC à traiter aujourd'hui"; },
    function () { return 0; });
  ajouterPrioriteEcheanceNC(ncEcheanceProche, "info",
    function (item) { return "NC " + (item.nc.numeroLot || "(lot inconnu)") + " — échéance dans " + item.joursRestants + " jour" + (item.joursRestants > 1 ? "s" : ""); },
    function (n) { return n + " actions correctives NC arrivent bientôt à échéance"; },
    function (item) { return item.joursRestants; });

  // --- NC recurrentes : signal de repetition, jamais une conclusion de cause racine (point 7). ---
  var ncRecentes = ncs.filter(function (nc) { var d = qseTsMs(nc.dateCreation); return d && (maintenant - d) <= 30 * MS_PAR_JOUR; });
  var ncParTypeRecent = {};
  ncRecentes.forEach(function (nc) {
    var lot = lots.find(function (l) { return l.numeroLot === nc.numeroLot; });
    if (!lot) return;
    (ncParTypeRecent[lot.type] = ncParTypeRecent[lot.type] || []).push(nc);
  });
  Object.keys(ncParTypeRecent).forEach(function (type) {
    if (ncParTypeRecent[type].length >= 3) {
      priorites.push({
        type: "nc_recurrente", niveau: "important",
        titre: ncParTypeRecent[type].length + " NC sur " + getProduit(type).nom + " au cours des 30 derniers jours",
        explication: "Signal de répétition à analyser (cause racine potentielle, à confirmer humainement).",
        urgence: 2, objet: { type: "qse_onglet", id: "nc" }, action: "Analyser la cause récurrente"
      });
    }
  });

  // --- Phase 9 (point 36) : rupture probable a court terme, alimentee par le MEME calcul que le
  // cockpit industriel (calculerCouvertureStock/calculerDeficitReservationParType) — jamais une
  // deuxieme logique de detection. Optionnel : n'agit que si "mouvements" est fourni (uniquement le
  // cockpit Direction en a besoin ; les autres appelants de calculerPrioritesOperationnelles ne
  // passent pas ce champ et ne sont donc pas impactes par cette extension, zero regression). Seuil
  // volontairement resserre (<3 jours) pour eviter une alerte sur une variation mineure (point 35).
  if (donnees.mouvements) {
    var periodeRecenteRupture = calculerPeriode("7j", maintenant);
    CATALOGUE.forEach(function (prod) {
      var deficitProd = calculerDeficitReservationParType(prod.id, stocks, commandes);
      var couvertureProd = calculerCouvertureStock(prod.id, deficitProd.disponibleAReserverType, donnees.mouvements, periodeRecenteRupture);
      if (couvertureProd.calculable && couvertureProd.couvertureJours != null && couvertureProd.couvertureJours < 3) {
        priorites.push({
          type: "rupture_probable", niveau: "critique",
          titre: getProduit(prod.id).nom + " : risque de rupture dans ~" + Math.round(couvertureProd.couvertureJours) + " jour(s)",
          explication: "Projection sur la consommation moyenne des 7 derniers jours (" + Math.round(couvertureProd.consommationMoyenneJour).toLocaleString() + " u/j).",
          urgence: -80 - (3 - couvertureProd.couvertureJours), objet: { type: "tab", id: "pilotage" }, action: "Voir le pilotage"
        });
      }
    });
  }

  // --- Phase 10 (point 36) : une ligne de plan validee dont la date est deja passee sans avoir ete
  // demarree ("Termine") ni reportee/annulee -> alimente le MEME moteur de priorites (jamais un
  // second systeme d'alerte). Optionnel : n'agit que si "planLignes" est fourni (seul le Responsable
  // Production / la Direction en ont besoin ; zero impact sur les autres appelants).
  if (donnees.planLignes) {
    var aujourdHuiDebutMs = new Date(maintenant); aujourdHuiDebutMs.setHours(0, 0, 0, 0);
    donnees.planLignes.forEach(function (l) {
      if (l.statut !== "Valide" || l.dateMs >= aujourdHuiDebutMs.getTime()) return;
      priorites.push({
        type: "production_retard", niveau: "important",
        titre: "Production " + getProduit(l.typeBTC).nom + " en retard — " + (l.quantitePrevue || 0).toLocaleString() + " u",
        explication: "Planifiée le " + new Date(l.dateMs).toLocaleDateString("fr-FR") + ", toujours non démarrée." + (l.motif ? (" (" + l.motif + ")") : ""),
        urgence: -60, objet: { type: "tab", id: "production" }, action: "Démarrer ou reporter", ligne: l
      });
    });
  }

  return trierPriorites(priorites);
}

// Bandeau "A faire aujourd'hui" : affiche les priorites les plus importantes calculees par
// calculerPrioritesOperationnelles, limitees a 5 par defaut avec un "Voir tout" pour le reste.
function PrioriteDuJour({ donnees, ouvrirObjet, role }) {
  var toutes = React.useMemo(function () {
    return filtrerPrioritesParRole(calculerPrioritesOperationnelles(donnees), role);
  }, [donnees, role]);
  var [voirTout, setVoirTout] = React.useState(false);

  if (toutes.length === 0) {

  }
  var iconeNiveau = { critique: "🔴", important: "🟠", info: "🟡" };
  return (
    <div className="priorite-jour">
      <div className="priorite-jour-titre">À faire aujourd'hui</div>

}

// Hook partage : nombre de priorites pertinentes pour un role, pour alimenter un badge de

// ============================================================================================
// PHASE 9 — MOTEUR CENTRAL D'INDICATEURS INDUSTRIELS.
//
// Principe directeur (cf. cahier des charges) : chaque fonction ci-dessous repond a UNE question
// metier precise, avec une formule explicite et deterministe (jamais d'IA, jamais de constante
// cachee). Aucune fonction ne fabrique de donnee manquante : quand le calcul n'est pas fiable, elle
// retourne calculable:false / une valeur null plutot qu'un chiffre invente. Toute la logique vit ICI
// (jamais dispersee dans un composant React) pour rester testable independamment de l'UI.
//
// Sources de donnees retenues (voir audit complet en tete de session) :
//  - Production  -> collection "productions" (champ timestamp, reel, fiable pour les periodes).
//  - Pertes      -> stock_mouvements ou type==="PERTE" (SEULE source complete : la collection
//    "pertes" est incomplete — elle ne capture pas les pertes declarees par lot/palette depuis
//    FicheLot/FichePalette — et melange par ailleurs des non-conformites de reception chantier qui
//    ne sont pas des pertes physiques. Jamais utilisee ici pour ne pas fausser le taux de pertes.
//  - Cout NC     -> collection "qse_nc" (quantiteConcernee x prix catalogue), jamais melange aux pertes.
//  - Stock       -> "stocks" (compteur agrege, non historise : pas de vraie "rotation sur stock
//    moyen" possible, cf. point 14 du cahier des charges -> on utilise la "couverture" a la place).
// ============================================================================================

  objectifProductionMensuelle: null,

  // retombe integralement sur son comportement Phase 10 d'origine (non-regression garantie).
  heuresTravailJour: null,
  dureeCampagnePrefereeJours: 3,   // point R : ~3 jours consecutifs sur le meme moule avant changement, preference pas obligation
  dureeChangementMoulHeures: 4,    // point S
  mouleActuel: null,               // point T : type BTC actuellement installe sur la presse (id du CATALOGUE), null tant que non renseigne

  recetteTerreM3Pour100BTC: 2,
  recetteTauxCimentPct: 0.08,
  recetteTauxSablePct: 0.04,
  recetteHumiditeInitialePct: 0.06,
  recetteHumiditeCiblePct: 0.12,

async function chargerParametresIndustriels() {
  try {
    var snap = await db.collection("parametres_industriels").doc("global").get();
    return snap.exists ? Object.assign({}, PARAMETRES_INDUSTRIELS_DEFAUT, snap.data()) : Object.assign({}, PARAMETRES_INDUSTRIELS_DEFAUT);
  } catch (e) { return Object.assign({}, PARAMETRES_INDUSTRIELS_DEFAUT); }

async function enregistrerParametresIndustriels(champs, user, userData) {

  await db.collection("parametres_industriels").doc("global").set(Object.assign({}, champs, {

// --- B. Periodes (point 3) : DEFINITION UNIQUE, reutilisee partout — jamais de calcul de date
// concurrent ailleurs. Bornes en heure LOCALE (minuit local), coherent avec dateProductionMs/
// joursRestants deja utilises dans le reste de l'application (Mayotte n'observe pas de changement
// d'heure, donc "local" est stable ; point 45).
function calculerPeriode(cle, referenceMs, custom) {
  var ref = referenceMs || Date.now();
  var d = new Date(ref);
  var debutJour = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0, 0).getTime();
  var finJour = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999).getTime();
  if (cle === "aujourdhui") return { cle: cle, debut: debutJour, fin: finJour, label: "Aujourd'hui", jours: 1 };
