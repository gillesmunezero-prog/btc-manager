  return manquants;
}

async function qseProchainNumeroLot(mois) {
  const compteurRef = db.collection("qse_lots_index").doc("_compteur_" + mois);
  return db.runTransaction(async (tx) => {
    const snap = await tx.get(compteurRef);
    const dernier = (snap.exists && snap.data().dernier) || 0;
    const suivant = dernier + 1;
    tx.set(compteurRef, { dernier: suivant });
    return "BTC-" + mois + "-" + String(suivant).padStart(3, "0");
  });
}

// ============================================================================================
// GRAND LIVRE DE STOCK (Phase 5) — tracabilite reelle par lot, en parallele du compteur agrege
// existant, sans rien casser.
//
// Principes directeurs :
//  - stock_mouvements est la SEULE source de verite des quantites physiques (entree production,
//    sortie livraison, perte, ajustement d'inventaire, annulation). Chaque ligne est SIGNEE
//    (positif = entree, negatif = sortie) : la situation d'un lot se calcule en sommant simplement
//    ses mouvements (calculerStockLot), jamais via un second compteur qui pourrait diverger.
//  - stocks/{type} reste le compteur agrege existant, ecrit exactement comme avant par les memes
//    fonctions (compatibilite totale avec les ecrans deja en place). reconcilierStockType() permet
//    de detecter un ecart pendant la periode de transition, sans jamais le corriger seul.
//  - qse_lots/{numeroLot}.disponibleCache est un CACHE, mais un cache qui compte : c'est le seul
//    champ directement adressable par tx.get()/tx.update() (donc protege par les transactions
//    Firestore contre les acces concurrents) utilise pour DECIDER si une allocation est possible.
//    Une requete filtree (where().get()) a l'interieur d'une transaction ne protege PAS contre les
//    "phantom reads" (un document cree par une autre transaction pendant la nôtre) ; un tx.get()
//    direct sur un document precis, si. C'est pourquoi ce cache existe et doit toujours etre tenu a
//    jour dans la MEME transaction que le mouvement correspondant. calculerStockLot() (a partir du
//    grand livre) reste la source d'audit/affichage ; reconcilierStockType() peut aussi detecter un
//    ecart entre ce cache et le grand livre.
//  - stock_allocations est un INDEX de tracabilite ("quelle commande/quel chantier a consomme quel
//    lot"), jamais une source de quantites : chaque livraison ecrit a la fois un mouvement (compte)
//    et une allocation (qui/quoi), dans la meme transaction.
//  - Idempotence : l'id d'un mouvement est derive deterministiquement de sa source
//    (sourceType_sourceId_numeroLot_type). Un double clic/retry ne cree donc jamais deux fois le
//    meme mouvement (verifierMouvementExistant/ecrireMouvementStock).
//  - Contrainte Firestore stricte respectee partout ci-dessous : dans une transaction, TOUTES les
//    lectures (tx.get) precedent TOUTES les ecritures (tx.set/update). Ne jamais intercaler.
//  - Le stock historique non trace (anterieur a cette phase) n'est JAMAIS rattache a un faux
//    numero de lot : un mouvement qui le concerne porte numeroLot: null et reste signale comme tel
//    a l'utilisateur (voir proposerAllocationFIFO/DashboardStock).
// ============================================================================================

function idMouvementStock(sourceType, sourceId, numeroLot, type) {
  var lot = numeroLot || "NA";
  return (sourceType + "_" + sourceId + "_" + lot + "_" + type).replace(/[\/\s]/g, "-").slice(0, 400);
}
// Lecture seule (a appeler pendant la phase "lecture" d'une transaction) : ce mouvement existe-t-il deja ?
async function verifierMouvementExistant(tx, mouvement) {
  var id = idMouvementStock(mouvement.sourceType, mouvement.sourceId, mouvement.numeroLot, mouvement.type);
  var snap = await tx.get(db.collection("stock_mouvements").doc(id));
  return { id: id, existe: snap.exists };
}
// Ecriture pure, aucune lecture : a appeler uniquement apres verifierMouvementExistant()===false,
// et uniquement pendant la phase "ecriture" (apres toutes les lectures de la transaction).
function ecrireMouvementStock(tx, id, mouvement) {
  tx.set(db.collection("stock_mouvements").doc(id), {
    type: mouvement.type,
    numeroLot: mouvement.numeroLot || null,
    paletteId: mouvement.paletteId || null, // Phase 7 : tag optionnel, la palette est une SUBDIVISION du lot, pas une source de verite distincte
    typeBTC: mouvement.typeBTC || "",
    quantite: mouvement.quantite,
    date: mouvement.date || new Date().toLocaleDateString("fr-FR"),
    sourceType: mouvement.sourceType,
    sourceId: mouvement.sourceId,
    utilisateur: mouvement.utilisateur || "inconnu",
    commentaire: mouvement.commentaire || "",
    dateCreation: firebase.firestore.FieldValue.serverTimestamp()
  });
}

// Calcule la situation d'un lot a partir d'une liste de mouvements DEJA CHARGEE (aucune lecture
// Firestore ici). Convention de signe : ENTREE_PRODUCTION et ANNULATION_LIVRAISON sont positifs ;
// PERTE et SORTIE_LIVRAISON sont negatifs ; AJUSTEMENT_INVENTAIRE/CORRECTION portent leur propre
// signe. "disponible" = somme signee brute de tous les mouvements du lot : aucune ambiguite.
// AFFECTATION_PALETTE (Phase 7) est EXCLU de cette somme : ce type ne represente pas un changement
// de quantite physique du lot, seulement son affectation a une palette precise (sinon double compte).
function calculerStockLot(numeroLot, mouvements) {
  var mvts = (mouvements || []).filter(function (m) { return m.numeroLot === numeroLot; });
  var produit = 0, perdu = 0, livre = 0, ajustements = 0;
  mvts.forEach(function (m) {
    if (m.type === "ENTREE_PRODUCTION") produit += m.quantite;
    else if (m.type === "PERTE") perdu += -m.quantite;
    else if (m.type === "SORTIE_LIVRAISON" || m.type === "ANNULATION_LIVRAISON") livre += -m.quantite; // SORTIE (negatif) ajoute au livre affiche, ANNULATION (positif) le retranche
    else if (m.type === "AJUSTEMENT_INVENTAIRE" || m.type === "CORRECTION") ajustements += m.quantite;
  });
  var disponible = mvts.reduce(function (a, m) { return m.type === "AFFECTATION_PALETTE" ? a : a + m.quantite; }, 0);
  mvts.sort(function (a, b) { return qseTsMs(a.dateCreation) - qseTsMs(b.dateCreation); });
  return { produit: produit, perdu: perdu, livre: livre, ajustements: ajustements, disponible: Math.max(0, disponible), mouvements: mvts };
}

// Equivalent de calculerStockLot, mais a la granularite d'une palette (Phase 7, point 31) : la
// palette n'introduit PAS une nouvelle source de verite, elle lit le MEME grand livre filtre par
// paletteId. AFFECTATION_PALETTE est ici la seule entree positive (creation de la palette) ; PERTE
// et SORTIE_LIVRAISON tagges de ce paletteId la diminuent, symetriquement a calculerStockLot.
function calculerStockPalette(paletteId, mouvements) {
  var mvts = (mouvements || []).filter(function (m) { return m.paletteId === paletteId; });
  var perdu = 0, livre = 0;
  mvts.forEach(function (m) {
    if (m.type === "PERTE") perdu += -m.quantite;
    else if (m.type === "SORTIE_LIVRAISON" || m.type === "ANNULATION_LIVRAISON") livre += -m.quantite;
  });
  var restant = mvts.reduce(function (a, m) { return a + m.quantite; }, 0);
  mvts.sort(function (a, b) { return qseTsMs(a.dateCreation) - qseTsMs(b.dateCreation); });
  return { perdu: perdu, livre: livre, restant: Math.max(0, restant), mouvements: mvts };
}

// Propose une allocation FIFO (lots les plus anciens d'abord) parmi des lots DEJA FILTRES comme
// eligibles par chargerLotsDisponiblesPourType (conformes, disponibilite reelle > 0). Fonction
// pure, aucun acces Firestore. Si les lots traçables ne suffisent pas, complete avec le stock
// historique non traçable (stockHistoriqueDisponible) en le signalant explicitement — jamais de
// faux numero de lot invente.
function proposerAllocationFIFO(lotsEligibles, besoin, stockHistoriqueDisponible) {
  var tries = (lotsEligibles || []).slice().sort(function (a, b) { return dateProductionMs(a) - dateProductionMs(b); });
  var lignes = [];
  var reste = besoin;
  tries.forEach(function (l) {
    if (reste <= 0) return;
    var pris = Math.min(l.disponible, reste);
    if (pris <= 0) return;
    lignes.push({ numeroLot: l.numeroLot, quantite: pris, date: l.date, historique: false, disponibleMax: l.disponible });
    reste -= pris;
  });
  var utiliseHistorique = 0;
  if (reste > 0 && stockHistoriqueDisponible > 0) {
    utiliseHistorique = Math.min(reste, stockHistoriqueDisponible);
    if (utiliseHistorique > 0) {
      lignes.push({ numeroLot: null, quantite: utiliseHistorique, date: null, historique: true, disponibleMax: stockHistoriqueDisponible });
      reste -= utiliseHistorique;
    }
  }
  return { lignes: lignes, couvert: besoin - reste, deficit: Math.max(0, reste), utiliseHistorique: utiliseHistorique };
}

// Charge, pour un type BTC donne, les lots eligibles a une allocation (conformes — donc ni en
// sechage, ni bloques par une NC, cf. qseStatutLot — et disponibilite reelle > 0 via le cache
// transactionnel). Requetes CIBLEES (pas d'ecouteur permanent), appelees uniquement au moment de
// preparer une livraison — coherent avec la discipline de performance des phases precedentes.
async function chargerLotsDisponiblesPourType(typeBTC) {
  var [lotsSnap, controlesSnap, ncSnap] = await Promise.all([
    db.collection("qse_lots").where("type", "==", typeBTC).limit(500).get(),
    db.collection("qse_controles").where("type", "==", typeBTC).limit(500).get(),
    db.collection("qse_nc").limit(500).get()
  ]);
  var lots = lotsSnap.docs.map(function (d) { return d.data(); });
  var controles = controlesSnap.docs.map(function (d) { return d.data(); });
  var ncs = ncSnap.docs.map(function (d) { return d.data(); });
  var ncParLot = {};
  ncs.forEach(function (nc) { if (nc.numeroLot) (ncParLot[nc.numeroLot] = ncParLot[nc.numeroLot] || []).push(nc); });
  var controlesParLot = {};
  controles.forEach(function (c) { if (c.numeroLot) (controlesParLot[c.numeroLot] = controlesParLot[c.numeroLot] || []).push(c); });

  var eligibles = [];
  lots.forEach(function (lot) {
    var statut = qseStatutLot(lot, controlesParLot[lot.numeroLot] || [], ncParLot[lot.numeroLot] || []);
    if (statut.code !== "conforme") return; // exclut sechage / pret_controle / non_conforme / bloque (point 25)
    var dispo = lot.disponibleCache != null ? lot.disponibleCache : 0; // lot non encore initialise (cf. migration) -> 0, jamais devine
    if (dispo <= 0) return;
    eligibles.push(Object.assign({}, lot, { disponible: dispo }));
  });
  return eligibles;
}

// Migration explicite, idempotente et sans risque (point 30) : initialise disponibleCache = quantite
// produite pour les lots crees AVANT la Phase 5 (qui n'ont pas encore ce champ). Aucun mouvement
// n'a jamais pu decrementer un lot avant l'existence de cette fonctionnalite, donc quantite produite
// = disponibilite reelle actuelle avec une tres haute confiance. Ne touche jamais un lot deja
// initialise (safe a relancer plusieurs fois). Ecrit egalement le mouvement ENTREE_PRODUCTION
// correspondant s'il n'existait pas encore (lots crees avant l'introduction du grand livre).
async function initialiserDisponibleCachePourLotsExistants(user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var tousLesLots = (await db.collection("qse_lots").limit(1000).get()).docs;
  var aTraiter = tousLesLots.filter(function (d) { return d.data().disponibleCache === undefined; });
  var traites = 0, ignores = 0;
  for (var i = 0; i < aTraiter.length; i++) {
    var lotDoc = aTraiter[i];
    var lot = lotDoc.data();
    if (lot.disponibleCache !== undefined && lot.disponibleCache !== null) { ignores++; continue; }
    var lotRef = db.collection("qse_lots").doc(lotDoc.id);
    var mvt = { type: "ENTREE_PRODUCTION", numeroLot: lot.numeroLot, typeBTC: lot.type || "", quantite: lot.quantite || 0, date: lot.date || "", sourceType: "migration_phase5", sourceId: lotDoc.id, utilisateur: auteur, commentaire: "Initialisation retroactive (Phase 5)" };
    await db.runTransaction(async function (tx) {
      var freshSnap = await tx.get(lotRef);
      var chk = await verifierMouvementExistant(tx, mvt);
      if (!freshSnap.exists) return;
      var freshLot = freshSnap.data();
      if (freshLot.disponibleCache !== undefined && freshLot.disponibleCache !== null) return; // deja migre entre-temps
      if (!chk.existe) ecrireMouvementStock(tx, chk.id, mvt);
      tx.update(lotRef, { disponibleCache: lot.quantite || 0 });
    });
    traites++;
  }
  return { traites: traites, ignores: ignores };
}

// Compare le compteur agrege existant (stocks/{type}) a la somme des mouvements du grand livre
// pour ce type, ET (Phase 6, point 17) calcule la vue complete : part traçable, part reservee,
// disponible reel, part historique non traçable expliquee par la difference. Un ecart n'est pas
// forcement une anomalie : il correspond notamment au stock historique anterieur a la Phase 5,
// jamais individuellement journalise. Fonction pure et diagnostique uniquement — ne corrige jamais
// rien automatiquement (point 21).
function reconcilierStockType(typeBTC, stocksCache, mouvements, lots, allocations) {
  var s = (stocksCache || {})[typeBTC] || {};
  var physique = (s.sec || 0) + (s.sechage || 0);
  var mvtsType = (mouvements || []).filter(function (m) { return m.typeBTC === typeBTC; });
  var calculeDepuisMouvements = mvtsType.reduce(function (a, m) { return a + m.quantite; }, 0);
  var lotsDuType = (lots || []).filter(function (l) { return l.type === typeBTC && l.disponibleCache != null; });
  var tracable = lotsDuType.reduce(function (a, l) { return a + calculerStockLot(l.numeroLot, mvtsType).disponible; }, 0);
  var historiqueNonTracable = Math.max(0, physique - tracable);
  var reserveTracable = (allocations || []).filter(function (a) { return a.typeBTC === typeBTC && a.numeroLot; })
    .reduce(function (a, al) { return a + Math.max(0, (al.quantiteReservee || 0) - (al.quantiteLivree || 0)); }, 0);
  var reserveHistorique = s.historiqueReserve || 0;
  var reserveTotal = reserveTracable + reserveHistorique;
  var disponible = Math.max(0, physique - reserveTotal);
  return {
    type: typeBTC, ancien: physique, calculeDepuisMouvements: calculeDepuisMouvements, ecart: physique - calculeDepuisMouvements,
    physique: physique, tracable: tracable, historiqueNonTracable: historiqueNonTracable, reserve: reserveTotal, disponible: disponible
  };
}

// Detecte des incoherences structurelles (point 18) sans jamais rien corriger automatiquement.
// Prend des donnees DEJA CHARGEES (aucun acces Firestore ici) pour rester rapide et testable —
// n'est appele qu'a la demande depuis le panneau de diagnostic (point 19), jamais en continu.
function diagnostiquerCoherenceStock(lots, mouvements, allocations, commandes, stocksCache, palettes, lotsBloques) {
  var anomalies = [];
  var mvtsParLot = {};
  (mouvements || []).forEach(function (m) { if (m.numeroLot) (mvtsParLot[m.numeroLot] = mvtsParLot[m.numeroLot] || []).push(m); });
  var allocsParLot = {};
  (allocations || []).forEach(function (a) { if (a.numeroLot) (allocsParLot[a.numeroLot] = allocsParLot[a.numeroLot] || []).push(a); });

  (lots || []).forEach(function (lot) {
    if (lot.disponibleCache == null) return; // lot non trace : hors perimetre du diagnostic
    var stockLot = calculerStockLot(lot.numeroLot, mvtsParLot[lot.numeroLot] || []);
    var reserveActif = (allocsParLot[lot.numeroLot] || []).reduce(function (a, al) { return a + Math.max(0, (al.quantiteReservee || 0) - (al.quantiteLivree || 0)); }, 0);
    var disponibleAttendu = stockLot.disponible - reserveActif;
    if (disponibleAttendu !== lot.disponibleCache) {
      anomalies.push({ lot: lot.numeroLot, type: "cache_incoherent", attendu: disponibleAttendu, trouve: lot.disponibleCache, action: "Recalculer le cache depuis le grand livre" });
    }
    if (stockLot.disponible < 0) {
      anomalies.push({ lot: lot.numeroLot, type: "stock_negatif", attendu: 0, trouve: stockLot.disponible, action: "Vérification manuelle requise" });
    }
    if (reserveActif > stockLot.disponible) {
      anomalies.push({ lot: lot.numeroLot, type: "reservation_superieure_au_disponible", attendu: stockLot.disponible, trouve: reserveActif, action: "Vérification manuelle requise" });
    }
  });

  var sortiesParLot = {};
  (mouvements || []).forEach(function (m) { if (m.type === "SORTIE_LIVRAISON" && m.numeroLot) { sortiesParLot[m.numeroLot] = (sortiesParLot[m.numeroLot] || 0) + (-m.quantite); } });
  Object.keys(sortiesParLot).forEach(function (numeroLot) {
    var totalSorti = sortiesParLot[numeroLot];
    var totalLivreAlloc = (allocsParLot[numeroLot] || []).reduce(function (a, al) { return a + (al.quantiteLivree || 0); }, 0);
    if (Math.abs(totalSorti - totalLivreAlloc) > 0) {
      anomalies.push({ lot: numeroLot, type: "mouvement_sans_allocation_correspondante", attendu: totalLivreAlloc, trouve: totalSorti, action: "Vérification manuelle requise" });
    }
  });

  (commandes || []).forEach(function (cmd) {
    var allocsCmd = (allocations || []).filter(function (a) { return a.commandeId === cmd.id; });
    var livreAllocs = allocsCmd.reduce(function (a, al) { return a + (al.quantiteLivree || 0); }, 0);
    if (allocsCmd.length === 0 && (cmd.quantiteLivree || 0) > 0) {
      anomalies.push({ lot: null, type: "commande_livree_sans_mouvement", attendu: cmd.quantiteLivree, trouve: 0, action: "Vérification manuelle requise", commandeId: cmd.id, numBC: cmd.numBC });
    } else if (allocsCmd.length > 0 && Math.abs(livreAllocs - (cmd.quantiteLivree || 0)) > 0) {
      anomalies.push({ lot: null, type: "commande_livraison_incoherente", attendu: livreAllocs, trouve: cmd.quantiteLivree || 0, action: "Vérification manuelle requise", commandeId: cmd.id, numBC: cmd.numBC });
    }
  });

  Object.keys(stocksCache || {}).forEach(function (type) {
    var s = stocksCache[type] || {};
    if ((s.sec || 0) < 0 || (s.sechage || 0) < 0) {
      anomalies.push({ lot: null, type: "compteur_negatif", attendu: 0, trouve: Math.min(s.sec || 0, s.sechage || 0), action: "Vérification manuelle requise", typeBTC: type });
    }
  });

  // --- Phase 7 (point 32) : coherence lot / palettes. lotsBloques est une liste de numeroLot
  // calculee par l'appelant (qseStatutLot, deja charge ailleurs) — cette fonction reste pure et ne
  // recalcule pas la conformite qualite elle-meme. ---
  var lotsParNumero = {};
  (lots || []).forEach(function (l) { lotsParNumero[l.numeroLot] = l; });
  var lotsBloquesSet = {};
  (lotsBloques || []).forEach(function (n) { lotsBloquesSet[n] = true; });
  var palettesParLot = {};
  (palettes || []).forEach(function (p) { (palettesParLot[p.numeroLot] = palettesParLot[p.numeroLot] || []).push(p); });

  (palettes || []).forEach(function (p) {
    var lot = lotsParNumero[p.numeroLot];
    var dispoPalette = p.disponibleCache != null ? p.disponibleCache : 0;
    if (!lot) {
      anomalies.push({ lot: p.numeroLot, palette: p.paletteId, type: "palette_lot_inexistant", attendu: null, trouve: p.paletteId, action: "Vérification manuelle requise" });
      return;
    }
    if (lot.type !== p.typeBTC) {
      anomalies.push({ lot: p.numeroLot, palette: p.paletteId, type: "palette_type_different", attendu: lot.type, trouve: p.typeBTC, action: "Vérification manuelle requise" });
    }
    if (dispoPalette < 0) {
      anomalies.push({ lot: p.numeroLot, palette: p.paletteId, type: "palette_quantite_negative", attendu: 0, trouve: dispoPalette, action: "Vérification manuelle requise" });
    }
    if (lotsBloquesSet[p.numeroLot] && dispoPalette > 0) {
      anomalies.push({ lot: p.numeroLot, palette: p.paletteId, type: "palette_disponible_sur_lot_bloque", attendu: 0, trouve: dispoPalette, action: "Vérification manuelle requise" });
    }
  });

  Object.keys(palettesParLot).forEach(function (numeroLot) {
    if (!lotsParNumero[numeroLot]) return; // deja signale ci-dessus (palette_lot_inexistant)
    var sommePalettes = palettesParLot[numeroLot].reduce(function (a, p) { return a + (p.disponibleCache != null ? p.disponibleCache : 0); }, 0);
    var stockLot = calculerStockLot(numeroLot, mvtsParLot[numeroLot] || []);
    if (sommePalettes > stockLot.disponible) {
      anomalies.push({ lot: numeroLot, type: "palettes_superieures_au_stock_lot", attendu: stockLot.disponible, trouve: sommePalettes, action: "Vérification manuelle requise" });
    }
  });

  var sortiesParPalette = {};
  (mouvements || []).forEach(function (m) { if (m.type === "SORTIE_LIVRAISON" && m.paletteId) { sortiesParPalette[m.paletteId] = (sortiesParPalette[m.paletteId] || 0) + (-m.quantite); } });
  var allocsParPalette = {};
  (allocations || []).forEach(function (a) { if (a.paletteId) (allocsParPalette[a.paletteId] = allocsParPalette[a.paletteId] || []).push(a); });
  Object.keys(sortiesParPalette).forEach(function (paletteId) {
    var totalSorti = sortiesParPalette[paletteId];
    var totalLivreAlloc = (allocsParPalette[paletteId] || []).reduce(function (a, al) { return a + (al.quantiteLivree || 0); }, 0);
    if (Math.abs(totalSorti - totalLivreAlloc) > 0) {
      anomalies.push({ lot: null, palette: paletteId, type: "palette_livree_sans_allocation", attendu: totalLivreAlloc, trouve: totalSorti, action: "Vérification manuelle requise" });
    }
  });

  return anomalies;
}

// Action de reparation controlee (point 20) : recalcule UNIQUEMENT disponibleCache depuis le grand
// livre, jamais une donnee physique ambigue. La valeur attendue est calculee juste avant par
// diagnostiquerCoherenceStock et transmise explicitement (pas de recalcul silencieux a l'interieur
// de la transaction) ; trace l'utilisateur et la date de la reparation sur le lot.
async function reparerCacheLot(numeroLot, valeurAttendue, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var lotRef = db.collection("qse_lots").doc(numeroLot);
  await db.runTransaction(async function (tx) {
    var lotSnap = await tx.get(lotRef);
    if (!lotSnap.exists) throw new Error("Lot introuvable.");
    tx.update(lotRef, { disponibleCache: valeurAttendue, cacheReparePar: auteur, cacheRepareAt: firebase.firestore.FieldValue.serverTimestamp() });
  });
}

// ============================================================================================
// PHASE 6 — corrections/annulations de production et vraie reservation, pour fermer les derniers
// trous ouverts par la Phase 5.
//
// Redefinition importante : disponibleCache represente desormais la DISPONIBILITE A RESERVER d'un
// lot (stock physique du lot moins ses reservations actives), pas seulement le stock physique brut.
// Invariant maintenu par CHAQUE fonction ci-dessous :
//   disponibleCache = (produit + corrections − pertes − livraisons physiques) − reserve_active
// Une reservation DECREMENTE disponibleCache (elle retire de la disponibilite a reserver, sans
// toucher au stock physique ni au grand livre : une reservation n'est PAS un mouvement physique).
// Une livraison qui consomme une reservation existante NE TOUCHE PAS disponibleCache une deuxieme
// fois : le stock physique et le reserve baissent tous les deux de la meme quantite, la difference
// (donc disponibleCache) ne bouge pas. Une annulation de reservation RESTITUE disponibleCache. Une
// perte ou une correction negative de production diminue directement disponibleCache et est refusee
// si cela le ferait passer sous zero — ce qui protege AUTOMATIQUEMENT aussi bien le stock deja
// livre/perdu que le stock deja reserve pour une autre commande (point 3).
// stocks/{type}.historiqueReserve joue le meme role que disponibleCache, mais pour le stock
// historique non tracable d'un type (qui n'a pas de document de lot individuel adressable) : la
// portion actuellement engagee dans une reservation. C'est un champ transactionnel supplementaire
// sur le document stocks/{type}, deja tx.get()-able comme un seul document.
// ============================================================================================

// Corrige la quantite (et eventuellement la phase/date) d'une production DEJA ENREGISTREE, sans
// jamais reecrire ni supprimer le mouvement ENTREE_PRODUCTION d'origine (point 2). Le changement de
// quantite est trace par un mouvement CORRECTION_PRODUCTION signe. Refuse toute correction qui
// ferait passer la disponibilite du lot sous zero (point 3) : le meme garde-fou protege a la fois
// contre "on corrige sous ce qui a deja ete livre/perdu" ET "sous ce qui est deja reserve" (voir
// redefinition de disponibleCache ci-dessus). Bloque tout changement de TYPE de BTC une fois le lot
// trace (risque commande=typeA / allocation=typeB) : dans ce cas, l'appelant doit passer par
// annulerProductionLot + une nouvelle saisie. "token" = identifiant stable de ce geste de correction
// (genere une fois a l'ouverture du formulaire), pour l'idempotence (double clic/retry).
async function corrigerProductionLot(production, nouveauType, nouvelleQuantite, nouvellePhase, nouvelleDate, token, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var qte = parseInt(nouvelleQuantite, 10);
  if (!(qte > 0)) throw new Error("Quantité invalide.");
  var prodRef = db.collection("productions").doc(production.id);
  var lotSnapInit = await db.collection("qse_lots").where("productionId", "==", production.id).limit(1).get();
  var lotDoc = lotSnapInit.docs[0] || null;
  var estTracable = !!(lotDoc && lotDoc.data().disponibleCache != null);

  if (estTracable && nouveauType !== production.type) {
    throw new Error("Impossible de changer le type de BTC d'une production déjà suivie par lot. Annulez cette production puis ressaisissez-la avec le type correct.");
  }

  if (!estTracable) {
    // Pas de grand livre pour ce lot (anterieur a la Phase 5, ou lot introuvable) : ancien
    // comportement (ajustement direct du compteur agrege uniquement), limite deja documentee.
    await db.runTransaction(async function (tx) {
      var prodSnap = await tx.get(prodRef);
      if (!prodSnap.exists) throw new Error("Production introuvable.");
      var ancienneProd = prodSnap.data();
      var memeType = ancienneProd.type === nouveauType;
      var refAncien = db.collection("stocks").doc(ancienneProd.type);
      var refNouveau = memeType ? refAncien : db.collection("stocks").doc(nouveauType);
      var snapAncien = await tx.get(refAncien);
      var snapNouveau = memeType ? snapAncien : await tx.get(refNouveau);

      var champAncien = ancienneProd.phase === "sec" ? "sec" : "sechage";
      var champNouveau = nouvellePhase === "sec" ? "sec" : "sechage";
      var sA = snapAncien.exists ? snapAncien.data() : {};
      if (memeType) {
        var upd = { sec: sA.sec || 0, sechage: sA.sechage || 0 };
        upd[champAncien] = Math.max(0, (upd[champAncien] || 0) - (ancienneProd.quantite || 0));
        upd[champNouveau] = Math.max(0, (upd[champNouveau] || 0) + qte);
        tx.set(refAncien, upd, { merge: true });
      } else {
        var updA = {}; updA[champAncien] = Math.max(0, (sA[champAncien] || 0) - (ancienneProd.quantite || 0));
        tx.set(refAncien, updA, { merge: true });
        var sN = snapNouveau.exists ? snapNouveau.data() : {};
        var updN = {}; updN[champNouveau] = Math.max(0, (sN[champNouveau] || 0) + qte);
        tx.set(refNouveau, updN, { merge: true });
      }
      tx.update(prodRef, { type: nouveauType, quantite: qte, phase: nouvellePhase, date: nouvelleDate });
    });
    return { tracable: false };
  }

  var lotRef = lotDoc.ref;
  var typeBTC = lotDoc.data().type;
  var stockRef = db.collection("stocks").doc(typeBTC);

  await db.runTransaction(async function (tx) {
    var lotSnap = await tx.get(lotRef);
    if (!lotSnap.exists) throw new Error("Lot introuvable.");
    var prodSnap = await tx.get(prodRef);
    if (!prodSnap.exists) throw new Error("Production introuvable.");
    var stockSnap = await tx.get(stockRef);
    var chk = await verifierMouvementExistant(tx, { type: "CORRECTION_PRODUCTION", numeroLot: lotRef.id, sourceType: "correction_production", sourceId: token });
    if (chk.existe) return; // deja applique (double clic/retry)

    var ancienneProd = prodSnap.data();
    var delta = qte - (ancienneProd.quantite || 0);
    var lot = lotSnap.data();
    var dispoAvant = lot.disponibleCache != null ? lot.disponibleCache : 0;
    var dispoApres = dispoAvant + delta;
    if (dispoApres < 0) {
      var consomme = (lot.quantite || 0) - dispoAvant;
      throw new Error("Impossible : " + consomme.toLocaleString() + " unités ont déjà été consommées, livrées, réservées ou déclarées perdues sur ce lot. Vous ne pouvez pas corriger la production en dessous de ce seuil.");
    }

    if (delta !== 0) {
      ecrireMouvementStock(tx, chk.id, { type: "CORRECTION_PRODUCTION", numeroLot: lotRef.id, typeBTC: typeBTC, quantite: delta, sourceType: "correction_production", sourceId: token, utilisateur: auteur, commentaire: "Correction : " + (ancienneProd.quantite || 0) + " → " + qte + " u" });
    }
    tx.update(lotRef, { disponibleCache: dispoApres, quantite: (lot.quantite || 0) + delta });
    tx.update(prodRef, { quantite: qte, phase: nouvellePhase, date: nouvelleDate });

    var s = stockSnap.exists ? stockSnap.data() : {};
    var champAncien = ancienneProd.phase === "sec" ? "sec" : "sechage";
    var champNouveau = nouvellePhase === "sec" ? "sec" : "sechage";
    var upd = { sec: s.sec || 0, sechage: s.sechage || 0 };
    if (champAncien === champNouveau) {
      upd[champAncien] = Math.max(0, (upd[champAncien] || 0) + delta);
    } else {
      upd[champAncien] = Math.max(0, (upd[champAncien] || 0) - (ancienneProd.quantite || 0));
      upd[champNouveau] = Math.max(0, (upd[champNouveau] || 0) + qte);
    }
    tx.set(stockRef, upd, { merge: true });
  });
  return { tracable: true };
}

// Annule une production (point 4). Si le lot est trace et RIEN n'a encore ete consomme dessus
// (aucune livraison, reservation ni perte : disponibleCache === quantite produite), cree un
// mouvement ANNULATION_PRODUCTION qui ramene le lot a zero, marque le lot comme annule (jamais
// supprime : le mouvement ENTREE_PRODUCTION d'origine et l'historique restent visibles dans le
// grand livre), puis supprime le document de production (coherent avec le bouton "Supprimer" deja
// existant). Si une partie du lot a deja ete utilisee, l'annulation est refusee et explique pourquoi.
async function annulerProductionLot(production, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var prodRef = db.collection("productions").doc(production.id);
  var lotSnapInit = await db.collection("qse_lots").where("productionId", "==", production.id).limit(1).get();
  var lotDoc = lotSnapInit.docs[0] || null;

  if (!lotDoc || lotDoc.data().disponibleCache == null) {
    // Pas de grand livre : ancien comportement (retrait direct du compteur agrege), limite connue.
    await db.runTransaction(async function (tx) {
      var stockRef = db.collection("stocks").doc(production.type);
      var sSnap = await tx.get(stockRef);
      var sd = sSnap.exists ? sSnap.data() : {};
      var champ = production.phase === "sec" ? "sec" : "sechage";
      var upd = { sec: sd.sec || 0, sechage: sd.sechage || 0 };
      upd[champ] = Math.max(0, (upd[champ] || 0) - (production.quantite || 0));
      tx.set(stockRef, upd, { merge: true });
      tx.delete(prodRef);
    });
    return { tracable: false };
  }

  var lotRef = lotDoc.ref;
  var typeBTC = lotDoc.data().type;
  var stockRef = db.collection("stocks").doc(typeBTC);

  await db.runTransaction(async function (tx) {
    var lotSnap = await tx.get(lotRef);
    if (!lotSnap.exists) throw new Error("Lot introuvable.");
    var stockSnap = await tx.get(stockRef);
    var chk = await verifierMouvementExistant(tx, { type: "ANNULATION_PRODUCTION", numeroLot: lotRef.id, sourceType: "annulation_production", sourceId: production.id });
    if (chk.existe) { tx.delete(prodRef); return; } // deja annule cote grand livre : on finit juste la suppression

    var lot = lotSnap.data();
    var dispo = lot.disponibleCache != null ? lot.disponibleCache : 0;
    var quantiteProduite = lot.quantite || 0;
    if (dispo < quantiteProduite) {
      var consomme = quantiteProduite - dispo;
      throw new Error("Impossible d'annuler cette production : " + consomme.toLocaleString() + " unités de ce lot ont déjà été livrées, réservées ou déclarées perdues. Consultez l'historique du lot " + lotRef.id + ".");
    }

    ecrireMouvementStock(tx, chk.id, { type: "ANNULATION_PRODUCTION", numeroLot: lotRef.id, typeBTC: typeBTC, quantite: -quantiteProduite, sourceType: "annulation_production", sourceId: production.id, utilisateur: auteur, commentaire: "Annulation de la production" });
    tx.update(lotRef, { disponibleCache: 0, annule: true, annulePar: auteur, annuleAt: firebase.firestore.FieldValue.serverTimestamp() });
    tx.delete(prodRef);

    var s = stockSnap.exists ? stockSnap.data() : {};
    var champ = production.phase === "sec" ? "sec" : "sechage";
    var upd = { sec: s.sec || 0, sechage: s.sechage || 0 };
    upd[champ] = Math.max(0, (upd[champ] || 0) - quantiteProduite);
    tx.set(stockRef, upd, { merge: true });
  });
  return { tracable: true };
}

// ============================================================================================
// PHASE 7 — palettes : subdivision physique detaillee d'un lot, pour le scan et l'ergonomie
// terrain. AUCUNE nouvelle source de verite (point 31) : stock_palettes ne fait que denormaliser
// numeroLot/typeBTC (pour l'affichage et les requetes sans jointure) ; la quantite restante d'une
// palette se lit du MEME grand livre (stock_mouvements, filtre par paletteId — voir
// calculerStockPalette), exactement comme un lot se lit par numeroLot. disponibleCache existe aussi
// au niveau palette, avec le MEME invariant qu'au niveau lot (disponible a reserver = physique
// moins reserve actif), transactionnellement tenu a jour en parallele du lot par les fonctions
// ci-dessus (reserverCommandeStock, livrerReservation, annulerReservation, declarerPerteLot).
// ============================================================================================

// Genere un identifiant de palette unique, court, lisible, non reutilise (point 30) : meme
// mecanique que qseProchainNumeroLot (compteur transactionnel par annee), resistante aux creations
// simultanees — jamais un simple comptage de documents existants (qui collisionnerait sous charge).
async function stockProchainNumeroPalette(annee) {
  const compteurRef = db.collection("stock_palettes_index").doc("_compteur_" + annee);
  return db.runTransaction(async (tx) => {
    const snap = await tx.get(compteurRef);
    const dernier = (snap.exists && snap.data().dernier) || 0;
    const suivant = dernier + 1;
    tx.set(compteurRef, { dernier: suivant });
    return "PAL-" + annee + "-" + String(suivant).padStart(6, "0");
  });
}

// Propose une repartition simple d'un lot en palettes de capacite egale (point 6), en autorisant
// un reliquat plus petit sur la derniere plutot que de forcer une capacite rigide (point 5) —
// Terre & Eau n'utilise pas toujours des palettes standardisees. Fonction pure, aucune ecriture.
function proposerRepartitionPalettes(quantiteTotale, capacitePalette) {
  var cap = parseInt(capacitePalette, 10);
  if (!(quantiteTotale > 0) || !(cap > 0)) return [];
  var lignes = [];
  var reste = quantiteTotale;
  while (reste > 0) {
    var q = Math.min(cap, reste);
    lignes.push(q);
    reste -= q;
  }
  return lignes;
}

// Fonction metier CENTRALE et UNIQUE pour creer des palettes a partir d'un lot (point 6). Ecrit,
// dans UNE SEULE transaction, un mouvement AFFECTATION_PALETTE (quantite positive, exclu du calcul
// du stock physique du lot — voir calculerStockLot) et un document stock_palettes par palette, avec
// disponibleCache initialise a sa quantite. Ne decremente PAS le disponibleCache du lot : une
// palette est une etiquette physique posee sur du stock deja disponible, pas une reservation ni une
// consommation (le lot reste tout aussi disponible a reserver qu'avant). Idempotent par lot de
// creation entier via un document de suivi (stock_palettes_batches/{token}) : un double clic sur
// "Confirmer" renvoie les MEMES identifiants de palette au lieu d'en creer de nouveaux en double.
async function creerPalettesPourLot(lot, repartition, token, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var quantites = (repartition || []).filter(function (q) { return q > 0; });
  var total = quantites.reduce(function (a, q) { return a + q; }, 0);
  if (total <= 0) throw new Error("Répartition invalide.");

  var batchRef = db.collection("stock_palettes_batches").doc(token);
  var batchSnap = await batchRef.get();
  if (batchSnap.exists) return batchSnap.data().paletteIds; // deja cree (double clic/retry)

  var annee = new Date().getFullYear();
  var ids = [];
  for (var i = 0; i < quantites.length; i++) { ids.push(await stockProchainNumeroPalette(annee)); }

  var lotRef = db.collection("qse_lots").doc(lot.numeroLot);
  await db.runTransaction(async function (tx) {
    var lotSnap = await tx.get(lotRef);
    if (!lotSnap.exists) throw new Error("Lot introuvable.");
    var batchCheck = await tx.get(batchRef);
    if (batchCheck.exists) return; // cree entre-temps par une tentative concurrente avec le meme token
    var lotData = lotSnap.data();
    var dispo = lotData.disponibleCache != null ? lotData.disponibleCache : 0;
    if (total > dispo) throw new Error("Quantité à répartir (" + total.toLocaleString() + " u) supérieure à la disponibilité du lot (" + dispo.toLocaleString() + " u).");

    for (var j = 0; j < ids.length; j++) {
      tx.set(db.collection("stock_palettes").doc(ids[j]), {
        paletteId: ids[j], numeroLot: lot.numeroLot, typeBTC: lot.type,
        quantiteInitiale: quantites[j], disponibleCache: quantites[j],
        emplacement: null, dateCreation: firebase.firestore.FieldValue.serverTimestamp(), creePar: auteur
      });
      ecrireMouvementStock(tx, idMouvementStock("creation_palette", ids[j], lot.numeroLot, "AFFECTATION_PALETTE"), {
        type: "AFFECTATION_PALETTE", numeroLot: lot.numeroLot, paletteId: ids[j], typeBTC: lot.type, quantite: quantites[j],
        sourceType: "creation_palette", sourceId: ids[j], utilisateur: auteur, commentaire: "Création de palette"
      });
    }
    tx.set(batchRef, { paletteIds: ids, numeroLot: lot.numeroLot, total: total, utilisateur: auteur, dateCreation: firebase.firestore.FieldValue.serverTimestamp() });
  });
  return ids;
}

// Charge les palettes d'un lot (requete CIBLEE, point 34 — jamais tout le grand livre). Utilisee par
// FicheLot (liste des palettes issues du lot, point 28) et par la preparation de livraison.
async function chargerPalettesDuLot(numeroLot) {
  var snap = await db.collection("stock_palettes").where("numeroLot", "==", numeroLot).get();
  return snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
}

// Point 8/9 : une fois le lot choisi par le FIFO (proposerAllocationFIFO), propose comment couvrir
// le besoin AVEC les palettes de ce lot — entieres si possible, une derniere partielle sinon, sans
// jamais forcer une palette a etre consommee entierement (point 9). Fonction pure ; les palettes
// donnees en entree doivent deja avoir ete filtrees a disponibleCache > 0.
function proposerPalettesPourLot(palettesDuLot, besoin) {
  var tries = (palettesDuLot || []).filter(function (p) { return (p.disponibleCache || 0) > 0; })
    .slice().sort(function (a, b) { return qseTsMs(a.dateCreation) - qseTsMs(b.dateCreation); });
  var lignes = [];
  var reste = besoin;
  tries.forEach(function (p) {
    if (reste <= 0) return;
    var pris = Math.min(p.disponibleCache, reste);
    lignes.push({ paletteId: p.paletteId, quantite: pris, disponibleMax: p.disponibleCache, emplacement: p.emplacement || null });
    reste -= pris;
  });
  return { lignes: lignes, couvert: besoin - reste, deficit: Math.max(0, reste) };
}

// Deplace une palette vers un nouvel emplacement (point 20). Enregistre l'historique dans une
// collection dediee (stock_palette_emplacements), coherente avec le style du reste de l'app (pas de
// sous-collection) plutot qu'un tableau qui grossirait indefiniment sur le document palette.
async function deplacerPalette(paletteId, nouvelEmplacement, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var paletteRef = db.collection("stock_palettes").doc(paletteId);
  var ancienEmplacement = null;
  await db.runTransaction(async function (tx) {
    var snap = await tx.get(paletteRef);
    if (!snap.exists) throw new Error("Palette introuvable.");
    ancienEmplacement = snap.data().emplacement || null;
    tx.update(paletteRef, { emplacement: nouvelEmplacement || null });
  });
  try {
    await db.collection("stock_palette_emplacements").add({
      paletteId: paletteId, ancienEmplacement: ancienEmplacement, nouvelEmplacement: nouvelEmplacement || null,
      utilisateur: auteur, date: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {}
}

// Declare une perte rattachee a un lot precis (depuis FicheLot). Refuse toute quantite superieure
// a la disponibilite reelle du lot (point 12/25). Transaction unique, lectures puis ecritures.
// "token" est un identifiant STABLE genere une seule fois par l'appelant au moment ou l'utilisateur
// ouvre le formulaire (jamais recalcule a chaque clic) : c'est ce qui rend un double clic sur
// "Confirmer" idempotent (meme token -> meme mouvement -> la deuxieme tentative est detectee comme
// deja appliquee et n'a AUCUN effet, ni sur le mouvement ni sur le cache/stock — voir dejaApplique).
// "paletteId" (Phase 7, optionnel, ajoute en dernier parametre pour ne rien casser des appels
// existants) : quand fourni, la perte est aussi imputee a une palette precise — meme garde-fou
// (refus si superieure a la disponibilite), meme mouvement unique (paletteId tagge dessus).
async function declarerPerteLot(numeroLot, typeBTC, quantite, motif, token, user, userData, paletteId) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  if (!(quantite > 0)) throw new Error("Quantité invalide.");
  var lotRef = db.collection("qse_lots").doc(numeroLot);
  var stockRef = db.collection("stocks").doc(typeBTC);
  var paletteRef = paletteId ? db.collection("stock_palettes").doc(paletteId) : null;
  var mvt = { type: "PERTE", numeroLot: numeroLot, paletteId: paletteId || null, typeBTC: typeBTC, quantite: -quantite, sourceType: "perte_lot", sourceId: token, utilisateur: auteur, commentaire: motif || "" };
  await db.runTransaction(async function (tx) {
    var lotSnap = await tx.get(lotRef);
    if (!lotSnap.exists) throw new Error("Lot introuvable.");
    var stockSnap = await tx.get(stockRef);
    var paletteSnap = paletteRef ? await tx.get(paletteRef) : null;
    var chk = await verifierMouvementExistant(tx, mvt);
    if (chk.existe) return; // deja applique (double clic/retry) : aucun effet une deuxieme fois

    var lot = lotSnap.data();
    var dispo = lot.disponibleCache != null ? lot.disponibleCache : (lot.quantite || 0);
    if (quantite > dispo) throw new Error("Quantité perdue (" + quantite + " u) supérieure à la disponibilité du lot (" + dispo + " u).");
    var dispoPalette = 0;
    if (paletteRef) {
      if (!paletteSnap.exists) throw new Error("Palette introuvable.");
      dispoPalette = paletteSnap.data().disponibleCache != null ? paletteSnap.data().disponibleCache : 0;
      if (quantite > dispoPalette) throw new Error("Quantité perdue (" + quantite + " u) supérieure à la disponibilité de la palette (" + dispoPalette + " u).");
    }
    var s = stockSnap.exists ? stockSnap.data() : {};
    var newSec = Math.max(0, (s.sec || 0) - quantite);

    ecrireMouvementStock(tx, chk.id, mvt);
    tx.update(lotRef, { disponibleCache: dispo - quantite });
    if (paletteRef) { tx.update(paletteRef, { disponibleCache: dispoPalette - quantite }); }
    tx.set(stockRef, { sec: newSec, sechage: s.sechage || 0 }, { merge: true });
  });
}

// Fonction metier CENTRALE et UNIQUE pour reserver du stock (point 5/6/8/15) : bloque des lots (ou
// du stock historique) SANS les sortir physiquement. L'UI ne doit jamais creer de document
// stock_allocations directement. Transaction atomique : verifie la disponibilite de chaque lot ET
// du stock historique dans la MEME transaction, decremente disponibleCache/historiqueReserve, cree
// les allocations statut "Reservee". "token" identifie ce geste de reservation de maniere stable
// (genere une seule fois a l'ouverture de l'action "Réserver"), pour l'idempotence — deux
// utilisateurs qui tentent de reserver le meme lot au meme instant se disputent le meme document
// (disponibleCache), donc jamais les deux ne peuvent reussir a reserver la meme unite (point 15).
// "ligne.paletteId" (Phase 7, optionnel) : quand une ligne precise une palette (proposerPalettesPourLot),
// sa disponibilite est verifiee et decrementee EN PLUS de celle du lot, dans la meme transaction —
// le lot reste l'unite d'allocation autoritaire (point 8), la palette n'est qu'une precision physique.
async function reserverCommandeStock(cmd, lignes, token, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var lignesValides = (lignes || []).filter(function (l) { return l.quantite > 0; });
  var totalDemande = lignesValides.reduce(function (a, l) { return a + l.quantite; }, 0);
  if (totalDemande <= 0) throw new Error("Quantité invalide.");

  var cmdRef = db.collection("commandes").doc(cmd.id);
  var stockRef = db.collection("stocks").doc(cmd.type);
  var lotsAvecNumero = lignesValides.filter(function (l) { return l.numeroLot; });
  var lignesAvecPalette = lignesValides.filter(function (l) { return l.paletteId; });
  var ligneHistorique = lignesValides.find(function (l) { return !l.numeroLot; });
  var allocIds = lignesValides.map(function (l) { return { ligne: l, id: (token + "_" + (l.numeroLot || "HIST") + (l.paletteId ? ("_" + l.paletteId) : "")).replace(/[\/\s]/g, "-").slice(0, 400) }; });

  await db.runTransaction(async function (tx) {
    // --- LECTURES (toutes avant toute ecriture) ---
    var cmdSnap = await tx.get(cmdRef);
    if (!cmdSnap.exists) throw new Error("Commande introuvable.");
    var cmdData = cmdSnap.data();
    var stockSnap = await tx.get(stockRef);
    var lotsLus = [];
    for (var i = 0; i < lotsAvecNumero.length; i++) {
      var lref = db.collection("qse_lots").doc(lotsAvecNumero[i].numeroLot);
      lotsLus.push({ ligne: lotsAvecNumero[i], ref: lref, snap: await tx.get(lref) });
    }
    var palettesLues = [];
    for (var k = 0; k < lignesAvecPalette.length; k++) {
      var pref = db.collection("stock_palettes").doc(lignesAvecPalette[k].paletteId);
      palettesLues.push({ ligne: lignesAvecPalette[k], ref: pref, snap: await tx.get(pref) });
    }
    var allocSnaps = [];
    for (var j = 0; j < allocIds.length; j++) {
      allocSnaps.push({ id: allocIds[j].id, ligne: allocIds[j].ligne, snap: await tx.get(db.collection("stock_allocations").doc(allocIds[j].id)) });
    }

    var dejaApplique = allocSnaps.some(function (a) { return a.snap.exists; });
    if (dejaApplique) return; // double clic/retry : cette reservation existe deja, aucun effet

    // --- VALIDATION (aucun acces Firestore, uniquement des verifications) ---
    lotsLus.forEach(function (x) {
      if (!x.snap.exists) throw new Error("Lot " + x.ligne.numeroLot + " introuvable.");
      var lot = x.snap.data();
      var dispo = lot.disponibleCache != null ? lot.disponibleCache : 0;
      if (x.ligne.quantite > dispo) throw new Error("Lot " + x.ligne.numeroLot + " : quantité demandée (" + x.ligne.quantite + ") supérieure à sa disponibilité à réserver (" + dispo + " u).");
    });
    palettesLues.forEach(function (x) {
      if (!x.snap.exists) throw new Error("Palette " + x.ligne.paletteId + " introuvable.");
      var palette = x.snap.data();
      var dispo = palette.disponibleCache != null ? palette.disponibleCache : 0;
      if (x.ligne.quantite > dispo) throw new Error("Palette " + x.ligne.paletteId + " : quantité demandée (" + x.ligne.quantite + ") supérieure à sa disponibilité (" + dispo + " u).");
    });
    var s = stockSnap.exists ? stockSnap.data() : {};
    if (ligneHistorique) {
      // L'estimation du stock historique disponible (disponibleMax) est calculee "au mieux" par
      // l'appelant juste avant la transaction (cf. limite documentee, meme classe que la Phase 5) ;
      // seule la portion deja engagee (historiqueReserve) est verifiee de maniere strictement
      // transactionnelle ici, ce qui empeche deux reservations concurrentes de consommer deux fois
      // le meme reliquat historique.
      var histReserveActuel = s.historiqueReserve || 0;
      if (ligneHistorique.quantite > Math.max(0, (ligneHistorique.disponibleMax || 0) - histReserveActuel)) {
        throw new Error("Stock historique non traçable insuffisant pour couvrir cette réservation (une autre réservation concurrente a peut-être déjà consommé ce reliquat). Rechargez la proposition et réessayez.");
      }
    }

    // --- ECRITURES (toutes apres toutes les lectures) ---
    lotsLus.forEach(function (x) {
      var lot = x.snap.data();
      var dispo = lot.disponibleCache != null ? lot.disponibleCache : 0;
      tx.update(x.ref, { disponibleCache: dispo - x.ligne.quantite });
    });
    palettesLues.forEach(function (x) {
      var palette = x.snap.data();
      var dispo = palette.disponibleCache != null ? palette.disponibleCache : 0;
      tx.update(x.ref, { disponibleCache: dispo - x.ligne.quantite });
    });
    if (ligneHistorique) {
      tx.set(stockRef, { historiqueReserve: (s.historiqueReserve || 0) + ligneHistorique.quantite }, { merge: true });
    }
    allocSnaps.forEach(function (a) {
      tx.set(db.collection("stock_allocations").doc(a.id), {
        commandeId: cmd.id, chantierId: cmd.chantierId || null, chantierNom: cmd.chantierNom || cmd.client || "",
        numeroLot: a.ligne.numeroLot || null, paletteId: a.ligne.paletteId || null, typeBTC: cmd.type,
        quantiteReservee: a.ligne.quantite, quantiteLivree: 0, statut: "Reservee",
        utilisateurReservation: auteur, dateReservation: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    tx.update(cmdRef, { quantiteReservee: (cmdData.quantiteReservee || 0) + totalDemande });
  });

  try {
    await db.collection("evenements").add({
      numBC: cmd.numBC || cmd.id, chantier: cmd.chantierNom || "", action: "Réservation de stock", acteur: auteur, role: "resp_stock",
      details: "N°" + (cmd.numBC || cmd.id) + " | Qté réservée: " + totalDemande + " | Lots: " + lignesValides.map(function (l) { return (l.numeroLot || "stock historique") + ":" + l.quantite; }).join(", "),
      statut: "Réservé", timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {}
}

// Fonction metier CENTRALE et UNIQUE pour transformer (totalement ou partiellement) une reservation
// en sortie physique reelle (point 8/9/10) : ecrit un mouvement SORTIE_LIVRAISON dans le grand
// livre, avance quantiteLivree sur l'allocation (statut "PartiellementLivree" ou "Livree"), et met a
// jour la commande. Ne touche PAS disponibleCache : la quantite avait deja ete retiree de la
// disponibilite a reserver au moment de la reservation ; la livraison transforme une reservation en
// sortie physique (le stock physique ET le reserve diminuent tous les deux de la meme quantite, la
// difference — donc disponibleCache — ne bouge pas). "token" = identifiant stable de CE geste de
// livraison (genere une fois par clic sur "Confirmer" ; deux livraisons reelles successives de la
// meme reservation utilisent deux tokens differents et restent bien deux mouvements distincts).
async function livrerReservation(alloc, quantiteALivrer, token, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var qte = parseInt(quantiteALivrer, 10);
  if (!(qte > 0)) throw new Error("Quantité invalide.");
  var allocRef = db.collection("stock_allocations").doc(alloc.id);

  await db.runTransaction(async function (tx) {
    var allocSnap = await tx.get(allocRef);
    if (!allocSnap.exists) throw new Error("Réservation introuvable.");
    var allocData = allocSnap.data();
    var cmdRef = db.collection("commandes").doc(allocData.commandeId);
    var cmdSnap = await tx.get(cmdRef);
    var stockRef = db.collection("stocks").doc(allocData.typeBTC);
    var stockSnap = await tx.get(stockRef);
    var chk = await verifierMouvementExistant(tx, { type: "SORTIE_LIVRAISON", numeroLot: allocData.numeroLot || null, sourceType: "livraison_reservation", sourceId: alloc.id + "_" + token });
    if (chk.existe) return; // deja applique (double clic/retry)

    if (allocData.statut !== "Reservee" && allocData.statut !== "PartiellementLivree") {
      throw new Error("Cette réservation n'est plus livrable (statut : " + allocData.statut + ").");
    }
    var reste = (allocData.quantiteReservee || 0) - (allocData.quantiteLivree || 0);
    if (qte > reste) throw new Error("Quantité demandée (" + qte + " u) supérieure au reliquat réservé (" + reste + " u).");

    // paletteId (Phase 7) simplement tagge sur le mouvement, comme allocData.numeroLot : le stock
    // physique ET le reserve de la palette baissent tous les deux de qte, disponibleCache de la
    // palette ne bouge donc pas (meme invariant que pour le lot, voir commentaire de tete de fonction).
    ecrireMouvementStock(tx, chk.id, { type: "SORTIE_LIVRAISON", numeroLot: allocData.numeroLot || null, paletteId: allocData.paletteId || null, typeBTC: allocData.typeBTC, quantite: -qte, sourceType: "livraison_reservation", sourceId: alloc.id + "_" + token, utilisateur: auteur, commentaire: "" });

    var nouveauLivre = (allocData.quantiteLivree || 0) + qte;
    var nouveauStatut = nouveauLivre >= (allocData.quantiteReservee || 0) ? "Livree" : "PartiellementLivree";
    tx.update(allocRef, { quantiteLivree: nouveauLivre, statut: nouveauStatut, utilisateurLivraison: auteur, dateLivraison: firebase.firestore.FieldValue.serverTimestamp() });

    var s = stockSnap.exists ? stockSnap.data() : {};
    var updStock = { sec: Math.max(0, (s.sec || 0) - qte), sechage: s.sechage || 0 };
    if (!allocData.numeroLot) { updStock.historiqueReserve = Math.max(0, (s.historiqueReserve || 0) - qte); }
    tx.set(stockRef, updStock, { merge: true });

    if (cmdSnap.exists) {
      var cmdData = cmdSnap.data();
      var nouveauLivreCmd = (cmdData.quantiteLivree || 0) + qte;
      var nouveauReserveCmd = Math.max(0, (cmdData.quantiteReservee || 0) - qte);
      var newStatus = nouveauLivreCmd >= (cmdData.quantite || 0) ? "Livree" : "Validee";
      tx.update(cmdRef, { quantiteLivree: nouveauLivreCmd, quantiteReservee: nouveauReserveCmd, status: newStatus, livrePar: auteur, livreAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
  });

  try {
    await db.collection("evenements").add({
      numBC: alloc.numBC || alloc.commandeId, chantier: alloc.chantierNom || "", action: "Livraison effectuée", acteur: auteur, role: "resp_stock",
      details: "Lot: " + (alloc.numeroLot || "stock historique") + " | Qté livrée: " + qte,
      statut: "Livraison enregistrée", timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {}
}

// Libere tout ou partie du reliquat NON LIVRE d'une reservation (point 11/12) : jamais de
// suppression, l'allocation garde son historique (quantiteReservee/quantiteLivree restent visibles),
// seuls son reliquat et son statut changent. Idempotent par nature : reappliquer sur une allocation
// deja completement liberee est un no-op (le reliquat est deja a zero). "quantiteALiberer" est
// optionnel : omis, libere tout le reliquat (annulation complete) ; fourni, libere une partie
// seulement (utilise par reajusterReservationCommande, point 12).
async function annulerReservation(alloc, quantiteALiberer, motif, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var allocRef = db.collection("stock_allocations").doc(alloc.id);
  await db.runTransaction(async function (tx) {
    var allocSnap = await tx.get(allocRef);
    if (!allocSnap.exists) throw new Error("Réservation introuvable.");
    var allocData = allocSnap.data();
    var resteAvant = (allocData.quantiteReservee || 0) - (allocData.quantiteLivree || 0);
    var aLiberer = quantiteALiberer != null ? Math.min(quantiteALiberer, resteAvant) : resteAvant;
    if (aLiberer <= 0) return; // deja entierement livree/annulee : aucun effet (idempotent)

    var cmdRef = db.collection("commandes").doc(allocData.commandeId);
    var cmdSnap = await tx.get(cmdRef);
    var lotRef = allocData.numeroLot ? db.collection("qse_lots").doc(allocData.numeroLot) : null;
    var lotSnap = lotRef ? await tx.get(lotRef) : null;
    var paletteRef = allocData.paletteId ? db.collection("stock_palettes").doc(allocData.paletteId) : null;
    var paletteSnap = paletteRef ? await tx.get(paletteRef) : null;
    var stockRef = allocData.numeroLot ? null : db.collection("stocks").doc(allocData.typeBTC);
    var stockSnap = stockRef ? await tx.get(stockRef) : null;

    var nouvelleQuantiteReservee = (allocData.quantiteReservee || 0) - aLiberer;
    var nouveauStatut = (allocData.quantiteLivree || 0) > 0
      ? ((allocData.quantiteLivree || 0) >= nouvelleQuantiteReservee ? "Livree" : "PartiellementLivree")
      : "Annulee";
    tx.update(allocRef, { quantiteReservee: nouvelleQuantiteReservee, statut: nouveauStatut, utilisateurAnnulation: auteur, dateAnnulation: firebase.firestore.FieldValue.serverTimestamp(), motifAnnulation: motif || "" });

    if (lotRef && lotSnap && lotSnap.exists) {
      var lot = lotSnap.data();
      var dispo = lot.disponibleCache != null ? lot.disponibleCache : 0;
      tx.update(lotRef, { disponibleCache: dispo + aLiberer });
    } else if (stockRef && stockSnap) {
      var s = stockSnap.exists ? stockSnap.data() : {};
      tx.set(stockRef, { historiqueReserve: Math.max(0, (s.historiqueReserve || 0) - aLiberer) }, { merge: true });
    }
    if (paletteRef && paletteSnap && paletteSnap.exists) {
      var palette = paletteSnap.data();
      var dispoPalette = palette.disponibleCache != null ? palette.disponibleCache : 0;
      tx.update(paletteRef, { disponibleCache: dispoPalette + aLiberer });
    }
    if (cmdSnap.exists) {
      var cmdData = cmdSnap.data();
      tx.update(cmdRef, { quantiteReservee: Math.max(0, (cmdData.quantiteReservee || 0) - aLiberer) });
    }
  });
}

// Annule une livraison DEJA EFFECTUEE (physique) sur une reservation (point 14/31) : cree un
// mouvement inverse ANNULATION_LIVRAISON (jamais de suppression du mouvement d'origine), diminue
// quantiteLivree sur l'allocation (le reliquat redevient livrable), et retire la quantite de la
// commande. Distincte d'annulerReservation, qui ne touche que la partie PAS ENCORE livree. Ne
// touche PAS disponibleCache : symetrique de livrerReservation — le stock physique et le reserve
// remontent tous les deux de la meme quantite, la difference (donc disponibleCache) ne bouge pas.
// "token" = identifiant stable de ce geste d'annulation (idempotence, double clic/retry).
async function annulerLivraisonPhysique(alloc, quantiteAAnnuler, token, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var qte = parseInt(quantiteAAnnuler, 10);
  if (!(qte > 0)) throw new Error("Quantité invalide.");
  var allocRef = db.collection("stock_allocations").doc(alloc.id);

  await db.runTransaction(async function (tx) {
    var allocSnap = await tx.get(allocRef);
    if (!allocSnap.exists) throw new Error("Réservation introuvable.");
    var allocData = allocSnap.data();
    var cmdRef = db.collection("commandes").doc(allocData.commandeId);
    var cmdSnap = await tx.get(cmdRef);
    var stockRef = db.collection("stocks").doc(allocData.typeBTC);
    var stockSnap = await tx.get(stockRef);
    var chk = await verifierMouvementExistant(tx, { type: "ANNULATION_LIVRAISON", numeroLot: allocData.numeroLot || null, sourceType: "annulation_livraison_reservation", sourceId: alloc.id + "_" + token });
    if (chk.existe) return; // deja applique (double clic/retry)

    if ((allocData.quantiteLivree || 0) <= 0) throw new Error("Aucune livraison à annuler sur cette réservation.");
    if (qte > (allocData.quantiteLivree || 0)) throw new Error("Quantité à annuler (" + qte + ") supérieure à la quantité livrée (" + (allocData.quantiteLivree || 0) + ").");

    ecrireMouvementStock(tx, chk.id, { type: "ANNULATION_LIVRAISON", numeroLot: allocData.numeroLot || null, paletteId: allocData.paletteId || null, typeBTC: allocData.typeBTC, quantite: qte, sourceType: "annulation_livraison_reservation", sourceId: alloc.id + "_" + token, utilisateur: auteur, commentaire: "" });

    var nouveauLivre = (allocData.quantiteLivree || 0) - qte;
    var nouveauStatut = nouveauLivre <= 0 ? "Reservee" : "PartiellementLivree";
    tx.update(allocRef, { quantiteLivree: Math.max(0, nouveauLivre), statut: nouveauStatut, utilisateurAnnulationLivraison: auteur, dateAnnulationLivraison: firebase.firestore.FieldValue.serverTimestamp() });

    var s = stockSnap.exists ? stockSnap.data() : {};
    var updStock = { sec: (s.sec || 0) + qte, sechage: s.sechage || 0 };
    if (!allocData.numeroLot) { updStock.historiqueReserve = (s.historiqueReserve || 0) + qte; }
    tx.set(stockRef, updStock, { merge: true });

    if (cmdSnap.exists) {
      var cmdData = cmdSnap.data();
      tx.update(cmdRef, { quantiteLivree: Math.max(0, (cmdData.quantiteLivree || 0) - qte), quantiteReservee: (cmdData.quantiteReservee || 0) + qte, status: "Validee" });
    }
  });
}

// Point 12 : quand la quantite d'une commande diminue en dessous de ce qui est deja reserve, libere
// l'exces en liberant les reservations les plus RECENTES en premier (LIFO) — cela preserve la
// propriete FIFO des lots deja engages (les plus anciens restent reserves en priorite). Chaque
// reservation touchee passe par annulerReservation (jamais de suppression silencieuse). N'est
// appelee qu'apres une confirmation explicite de l'utilisateur cote UI (point 12), jamais
// automatiquement lors d'une simple modification de quantite.
async function reajusterReservationCommande(cmd, allocationsActives, nouvelleQuantiteCommande, user, userData) {
  var reserveTotal = allocationsActives.reduce(function (a, al) { return a + Math.max(0, (al.quantiteReservee || 0) - (al.quantiteLivree || 0)); }, 0);
  var resteACouvrir = Math.max(0, nouvelleQuantiteCommande - (cmd.quantiteLivree || 0));
  var excedent = reserveTotal - resteACouvrir;
  if (excedent <= 0) return { liberes: 0 };
  var tries = allocationsActives.slice().sort(function (a, b) { return qseTsMs(b.dateReservation) - qseTsMs(a.dateReservation); }); // plus recentes d'abord
  var reste = excedent;
  for (var i = 0; i < tries.length && reste > 0; i++) {
    var al = tries[i];
    var dispoAl = (al.quantiteReservee || 0) - (al.quantiteLivree || 0);
    if (dispoAl <= 0) continue;
    var aLiberer = Math.min(dispoAl, reste);
    await annulerReservation(al, aLiberer, "Réajustement suite à la réduction de la commande (" + cmd.quantite + " → " + nouvelleQuantiteCommande + " u)", user, userData);
    reste -= aLiberer;
  }
  return { liberes: excedent - reste };
}

// Modifie la quantite/le type/le chantier d'une commande deja validee (points 12/13/32). Bloque tout
// changement de TYPE de BTC si des reservations ou livraisons actives existent (jamais
// commande=typeA avec une allocation=typeB, point 13). Ne reajuste JAMAIS automatiquement une
// reservation en exces : c'est un geste explicite separe (reajusterReservationCommande), propose a
// l'utilisateur mais jamais declenche silencieusement par cette fonction.
async function modifierCommandeStock(cmd, nouveauType, nouvelleQuantite, nouveauChantierId, nouveauChantierNom, allocationsActives, user, userData) {
  var qte = parseInt(nouvelleQuantite, 10);
  if (!(qte > 0)) throw new Error("Quantité invalide.");
  var aDesAllocations = (allocationsActives || []).some(function (a) { return (a.quantiteReservee || 0) > 0; });
  if (nouveauType !== cmd.type && aDesAllocations) {
    throw new Error("Impossible de changer le type de BTC : cette commande a déjà des réservations ou livraisons associées à " + getProduit(cmd.type).nom + ". Annulez d'abord les réservations concernées.");
  }
  await db.collection("commandes").doc(cmd.id).update({
    type: nouveauType, quantite: qte, chantierId: nouveauChantierId || null, chantierNom: nouveauChantierNom || ""
  });
}

async function qseCreerLotEtControlePourProduction(productionId, production, user, userData) {
  const auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  const now = firebase.firestore.FieldValue.serverTimestamp();
  const indexRef = db.collection("qse_lots_index").doc(productionId);
  const indexSnapPrealable = await indexRef.get();
  if (indexSnapPrealable.exists) return;
  const d = new Date();
  const mois = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  const numeroLot = await qseProchainNumeroLot(mois);
  const mvtEntree = { type: "ENTREE_PRODUCTION", numeroLot: numeroLot, typeBTC: production.type || "", quantite: production.quantite || 0, date: production.date || "", sourceType: "production", sourceId: productionId, utilisateur: auteur, commentaire: "" };
  await db.runTransaction(async (tx) => {
    // --- LECTURES ---
    const indexSnap = await tx.get(indexRef);
    if (indexSnap.exists) return;
    const chkMvt = await verifierMouvementExistant(tx, mvtEntree);
    // --- ECRITURES ---
    const lotRef = db.collection("qse_lots").doc(numeroLot);
    tx.set(lotRef, {
      numeroLot: numeroLot,
      productionId: productionId,
      type: production.type || "",
      quantite: production.quantite || 0,
      phase: production.phase || "",
      date: production.date || "",
      dateCreation: now,
      creePar: auteur,
      disponibleCache: production.quantite || 0 // Phase 5 : source de verite operationnelle pour les allocations, tenue a jour transactionnellement
    });
    tx.set(indexRef, { numeroLot: numeroLot, dateCreation: now });
    const controleRef = db.collection("qse_controles").doc();
    tx.set(controleRef, {
      numeroLot: numeroLot,
      productionId: productionId,
      type: production.type || "",
      date: production.date || "",
      resultat: "Non mesuré",
      dateCreation: now,
      creePar: auteur
    });
    if (!chkMvt.existe) ecrireMouvementStock(tx, chkMvt.id, mvtEntree);
  });
}

async function qseReparerProductionSansLot(production, user, userData) {
  const auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  const now = firebase.firestore.FieldValue.serverTimestamp();
  const indexRef = db.collection("qse_lots_index").doc(production.id);
  await db.runTransaction(async (tx) => {
    const indexSnap = await tx.get(indexRef);
    if (indexSnap.exists) {
      return indexSnap.data().numeroLot;
    }
    const d = new Date();
    const mois = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    const compteurRef = db.collection("qse_lots_index").doc("_compteur_" + mois);
    const compteurSnap = await tx.get(compteurRef);
    const dernier = (compteurSnap.exists && compteurSnap.data().dernier) || 0;
    const suivant = dernier + 1;
    const numeroLot = "BTC-" + mois + "-" + String(suivant).padStart(3, "0");
    // --- derniere LECTURE avant d'entrer en phase ECRITURE (contrainte Firestore) ---
    const chkMvt = await verifierMouvementExistant(tx, { type: "ENTREE_PRODUCTION", numeroLot: numeroLot, sourceType: "production", sourceId: production.id });
    tx.set(compteurRef, { dernier: suivant });
    const lotRef = db.collection("qse_lots").doc(numeroLot);
    tx.set(lotRef, {
      numeroLot: numeroLot,
      productionId: production.id,
      type: production.type || "",
      quantite: production.quantite || 0,
      phase: production.phase || "",
      date: production.date || "",
      dateCreation: now,
      creePar: auteur,
      reparation: true,
      disponibleCache: production.quantite || 0
    });
    tx.set(indexRef, { numeroLot: numeroLot, dateCreation: now });
    // Fix (Phase 4) : la reparation d'un lot manquant doit aussi creer le controle qualite
    // associe, exactement comme la creation normale (qseCreerLotEtControlePourProduction) —
    // sinon le lot repare n'a ni date de production exploitable (phase/date manquaient) ni
    // controle, et n'apparaissait jamais dans "Controles a faire" ni dans le moteur de priorites.
    const controleRef = db.collection("qse_controles").doc();
    tx.set(controleRef, {
      numeroLot: numeroLot,
      productionId: production.id,
      type: production.type || "",
      date: production.date || "",
      resultat: "Non mesuré",
      dateCreation: now,
      creePar: auteur
    });
    if (!chkMvt.existe) ecrireMouvementStock(tx, chkMvt.id, { type: "ENTREE_PRODUCTION", numeroLot: numeroLot, typeBTC: production.type || "", quantite: production.quantite || 0, date: production.date || "", sourceType: "production", sourceId: production.id, utilisateur: auteur, commentaire: "Réparation lot manquant" });
    return numeroLot;
  });
}


function QseTableauDeBord(props) {
  const user = props.user;
  const userData = props.userData;

  const [controlesAFaire, setControlesAFaire] = React.useState(0);
  const [ncOuvertes, setNcOuvertes] = React.useState([]);
  const [risquesCritiques, setRisquesCritiques] = React.useState([]);
  const [productionsSansLot, setProductionsSansLot] = React.useState([]);
  const [qualiteMois, setQualiteMois] = React.useState(null);
  const [envMois, setEnvMois] = React.useState(null);

  React.useEffect(() => {
    const unsub1 = db.collection("qse_controles")
      .where("resultat", "==", "Non mesuré")
      .onSnapshot((snap) => setControlesAFaire(snap.size));

    const unsub2 = db.collection("qse_nc").onSnapshot((snap) => {
      const arr = [];
      snap.forEach((doc) => arr.push(Object.assign({ id: doc.id }, doc.data())));
      setNcOuvertes(arr.filter((nc) => nc.statut !== "Cloturee"));
    });

    const unsub3 = db.collection("qse_risques")
      .where("criticite", ">=", 13)
      .onSnapshot((snap) => {
        const arr = [];
        snap.forEach((doc) => arr.push(Object.assign({ id: doc.id }, doc.data())));
        setRisquesCritiques(arr.filter((r) => !r.action && r.statut !== "Clos"));
      });

    return () => { unsub1(); unsub2(); unsub3(); };
  }, []);

  React.useEffect(() => {
    const d = new Date();
    const mois = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    (async () => {
      const [qualite, productionMois, valeurs, manquants] = await Promise.all([
        qseIndicateursQualiteMois(mois),
        qseProductionDuMois(mois),
        qseValeursEnvMois(mois),
        qseProductionsSansLot()
      ]);
      setQualiteMois(qualite);
      setEnvMois({ productionMois, valeurs });
      setProductionsSansLot(manquants);
    })();
  }, []);

  const actionsEnRetard = React.useMemo(() => {
    const aujourdHui = new Date().toISOString().slice(0, 10);
    return ncOuvertes.filter((nc) => nc.echeanceAction && nc.echeanceAction < aujourdHui);
  }, [ncOuvertes]);

  const reparer = async (p) => {
    await qseReparerProductionSansLot(p, user, userData);
    setProductionsSansLot((liste) => liste.filter((x) => x.id !== p.id));
  };

  const texteRatioEnv = (type, unite) => {
    if (!envMois || envMois.valeurs[type] === undefined) return "Non renseigné";
    if (type === "terresValorisees") {
      return qseFormatNombre(envMois.valeurs[type]) + " " + unite;
    }
    if (!envMois.productionMois) return "Production du mois inconnue";
    const ratio = (envMois.valeurs[type] / envMois.productionMois) * 1000;
    return qseFormatNombre(ratio) + " " + unite + " / 1 000 BTC";
  };

  return (
    <div className="qse-dashboard">
      <h3>Tableau de bord QSE</h3>

      <div className="qse-bloc-afaire">
        <h4>À faire</h4>
        <ul>
          <li>Contrôles à réaliser : {controlesAFaire}</li>
          <li>Non-conformités ouvertes : {ncOuvertes.length}</li>
          <li>Actions en retard : {actionsEnRetard.length}</li>
          <li>Risques critiques sans action : {risquesCritiques.length}</li>
          <li>
            Productions sans lot QSE : {productionsSansLot.length}
            {productionsSansLot.length > 0 && (
              <ul>
                {productionsSansLot.map((p) => (
                  <li key={p.id}>
                    {p.type} - {p.quantite} - {p.date}
                    <button className="btn btn-sm" onClick={() => reparer(p)}>Réparer</button>
                  </li>
                ))}
              </ul>
            )}
          </li>
        </ul>
      </div>

      <div className="qse-bloc-qualite">
        <h4>Qualité</h4>
        {!qualiteMois && <div>Chargement...</div>}
        {qualiteMois && (
          <ul>
            <li>Lots produits : {qualiteMois.lotsProduits}</li>
            <li>Lots contrôlés : {qualiteMois.lotsControles}</li>
            <li>Taux de conformité : {qualiteMois.tauxConformite === null ? "Non mesuré" : qseFormatNombre(qualiteMois.tauxConformite) + " %"}</li>
            <li>Lots non conformes : {qualiteMois.lotsNonConformes}</li>
          </ul>
        )}
      </div>

      <div className="qse-bloc-environnement">
        <h4>Environnement</h4>
        {!envMois && <div>Chargement...</div>}
        {envMois && (
          <ul>
            <li>Terres valorisées : {texteRatioEnv("terresValorisees", "m³")}</li>
            <li>Électricité : {texteRatioEnv("electricite", "kWh")}</li>
            <li>Eau : {texteRatioEnv("eau", "m³")}</li>
            <li>Ciment : {texteRatioEnv("ciment", "kg")}</li>
          </ul>
        )}
      </div>
    </div>
  );
}

function QseControlesAFaire(props) {
  const user = props.user;
  const userData = props.userData;
  const onOuvrirLot = props.onOuvrirLot;
  const [controles, setControles] = React.useState([]);

  React.useEffect(() => {
    const unsub = db.collection("qse_controles")
      .where("resultat", "==", "Non mesuré")
      .onSnapshot((snap) => {
        const arr = [];
        snap.forEach((doc) => arr.push(Object.assign({ id: doc.id }, doc.data())));
        setControles(arr);
      });
    return () => unsub();
  }, []);

  const enregistrerResultat = async (controle, resultat) => {
    const auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
    await db.collection("qse_controles").doc(controle.id).update({
      resultat: resultat,
      controleur: auteur,
      dateControle: firebase.firestore.FieldValue.serverTimestamp()
    });
  };

  if (controles.length === 0) return null;

  return (
    <div className="qse-controles-afaire">
      <h4>Contrôles qualité à réaliser</h4>
      <table className="qse-table">
        <thead>
          <tr><th>Lot</th><th>Type</th><th>Date</th><th>Résultat</th></tr>
        </thead>
        <tbody>
          {controles.map((c) => (
            <tr key={c.id}>
              <td>
                {onOuvrirLot && c.numeroLot
                  ? <a href="#" onClick={(e) => { e.preventDefault(); onOuvrirLot(c.numeroLot); }}>{c.numeroLot}</a>
                  : (c.numeroLot || "—")}

              <td>{c.date}</td>
              <td>
                <button className="btn btn-sm" onClick={() => enregistrerResultat(c, "Conforme")}>Conforme</button>
                <button className="btn btn-sm" onClick={() => enregistrerResultat(c, "Non conforme")}>Non conforme</button>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}


async function qseAjouterNC(data, user, userData) {
  const now = firebase.firestore.FieldValue.serverTimestamp();
  const auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var qteConcernee = (data.quantiteConcernee !== undefined && data.quantiteConcernee !== null && data.quantiteConcernee !== "")
    ? Number(data.quantiteConcernee) : null;
  await db.collection("qse_nc").add({
    numeroLot: data.numeroLot || "",
    description: data.description || "",
    causeProbable: data.causeProbable || "",
    actionCorrective: data.actionCorrective || "",
    responsable: data.responsable || "",
    echeanceAction: data.echeanceAction || "",
    quantiteConcernee: (qteConcernee !== null && !isNaN(qteConcernee)) ? qteConcernee : null,
    statut: "Ouverte",
    efficace: null,
    dateCreation: now,
    creePar: auteur,
    dateModification: now,
    modifiePar: auteur
  });
}

async function qseModifierNC(id, champs, user, userData) {
  const auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  await db.collection("qse_nc").doc(id).update(Object.assign({}, champs, {
    dateModification: firebase.firestore.FieldValue.serverTimestamp(),
    modifiePar: auteur
  }));
}

async function qseStatuerEfficaciteNC(id, efficace, user, userData) {
  if (efficace) {
    await qseModifierNC(id, {
      statut: "Cloturee",
      efficace: true,
      dateCloture: firebase.firestore.FieldValue.serverTimestamp()
    }, user, userData);
  } else {
    await qseModifierNC(id, {
      statut: "Ouverte",
      efficace: false
    }, user, userData);
  }
}
