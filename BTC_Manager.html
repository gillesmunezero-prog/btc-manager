  const [editCmdType, setEditCmdType] = React.useState("");
  const [editCmdQte, setEditCmdQte] = React.useState("");
  const [editCmdChantierId, setEditCmdChantierId] = React.useState("");
  const [msgEditCmd, setMsgEditCmd] = React.useState("");
  // Phase 7 : inventaire par scan (points 22/23/25) et verification par scan a la preparation (points 26/27).
  const [showInventaire, setShowInventaire] = React.useState(false);
  const [scanVerifPourCmd, setScanVerifPourCmd] = React.useState(null); // cmdId en cours de verification
  const [resultatsScanCmd, setResultatsScanCmd] = React.useState({}); // cmdId -> [{texte, ok}]
  // Phase 8 (points 15/21/22) : Stock est une page unique (pas d'onglets comme Direction) — la
  // recherche universelle et le moteur de priorites ouvrent directement une fiche par-dessus.
  const [lotOuvertPrio, setLotOuvertPrio] = React.useState(null);
  const [paletteOuvertePrio, setPaletteOuvertePrio] = React.useState(null);
  const [lots, setLots] = React.useState([]);
  const [palettesList, setPalettesList] = React.useState([]);
  const [showScannerAccueil, setShowScannerAccueil] = React.useState(false); // Phase 8 (point 17) : bouton "Scanner" de la barre basse mobile
  // Phase 10B (parties AM-AS/CQ) : reception de terre par camions-bennes — unite terrain = camion,
  // source de verite matiere = m3.
  const [parametresStock, setParametresStock] = React.useState(PARAMETRES_INDUSTRIELS_DEFAUT);
  const [matieresStockRes, setMatieresStockRes] = React.useState({});
  const [showReceptionTerre, setShowReceptionTerre] = React.useState(false);
  const [formReception, setFormReception] = React.useState(null);
  const [msgReception, setMsgReception] = React.useState("");
  const [receptionEnCours, setReceptionEnCours] = React.useState(false);
  React.useEffect(function () { chargerParametresIndustriels().then(setParametresStock); }, []);
  React.useEffect(function () {
    var u = db.collection("matieres_stock").onSnapshot(function (snap) {
      var m = {}; snap.docs.forEach(function (d) { m[d.id] = d.data(); }); setMatieresStockRes(m);
    });
    return u;
  }, []);
  var ouvrirReceptionTerre = function () {
    setFormReception({ nombreCamions: "", capaciteCamionM3: String(parametresStock.capaciteBenneDefautM3 || 15), volumeReelM3: "", origine: "", fournisseur: "", prixTotal: "" });
    setShowReceptionTerre(true); setMsgReception("");
  };
  var validerReceptionTerre = async function () {
    if (receptionEnCours) return; // anti-double-clic
    var nombreCamions = parseInt(formReception.nombreCamions, 10);
    var capaciteCamionM3 = parseFloat(formReception.capaciteCamionM3);
    if (!(nombreCamions > 0) || !(capaciteCamionM3 > 0)) { setMsgReception("Nombre de camions et capacité de benne requis."); return; }
    if (!enLigne) { setMsgReception("🚫 Connexion requise — réception impossible hors connexion."); return; }
    setReceptionEnCours(true); setMsgReception("Enregistrement...");
    var token = "camion_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    try {
      await receptionnerCamionsTerre({
        nombreCamions: nombreCamions, capaciteCamionM3: capaciteCamionM3,
        volumeReelM3: formReception.volumeReelM3 ? parseFloat(formReception.volumeReelM3) : null,
        origine: formReception.origine, fournisseur: formReception.fournisseur,
        prixTotal: formReception.prixTotal ? parseFloat(formReception.prixTotal) : null
      }, token, user, userData);
      setReceptionEnCours(false);
      setMsgReception("✓ " + (nombreCamions * capaciteCamionM3).toLocaleString() + " m³ ajoutés au stock de terre.");
      setTimeout(function () { setShowReceptionTerre(false); }, 1200);
    } catch (e) {
      setReceptionEnCours(false);
      setMsgReception("❌ Échec de l'enregistrement — aucune modification confirmée. (" + e.message + ")");
    }
  };

  useEffect(() => {
    var u1 = db.collection("commandes").where("status","==","Validee").onSnapshot(snap => {
      setCommandes(snap.docs.map(d => Object.assign({id:d.id}, d.data())));
    });
    var u2 = db.collection("stocks").onSnapshot(snap => {
      var s = {}; snap.docs.forEach(d => { s[d.id] = d.data(); }); setStocks(s);
    });
    var u3 = db.collection("productions").orderBy("timestamp","desc").onSnapshot(snap => {
      setProductions(snap.docs.map(d=>({id:d.id,...d.data()})));
    });
    var u4 = db.collection("chantiers").onSnapshot(snap => {
      setChantiers(snap.docs.map(d => Object.assign({id:d.id}, d.data())));
    });
    // Phase 8 (point 22) : Stock peut chercher palette/lot/commande — bornees (limit), pas un
    // ecouteur sur tout le grand livre ni sur les donnees QSE/Direction (point 30).
    var u5 = db.collection("qse_lots").orderBy("dateCreation", "desc").limit(300).onSnapshot(snap => {
      setLots(snap.docs.map(d => Object.assign({ id: d.id }, d.data())));
    });
    var u6 = db.collection("stock_palettes").orderBy("dateCreation", "desc").limit(300).onSnapshot(snap => {
      setPalettesList(snap.docs.map(d => Object.assign({ id: d.id }, d.data())));
    });
    return () => { u1(); u2(); u3(); u4(); u5(); u6(); };
  }, []);

  var ouvrirObjetStock = function (type, idOuObjet) {
    if (type === "lot") { setLotOuvertPrio(idOuObjet); return; }
    if (type === "palette") { setPaletteOuvertePrio(idOuObjet); return; }
    // "commande"/"tab" : page unique, pas de navigation supplementaire — deja visible plus bas.
  };
  var prioriteDonneesStock = { stocks: stocks, commandes: commandes, maintenant: Date.now() };
  var compteurPrioritesStock = useCompteurPriorites(prioriteDonneesStock, "resp_stock");

  // Charge les reservations d'une commande precise (requete CIBLEE, pas d'ecouteur permanent sur
  // tout le grand livre — discipline de performance, point 34). Regenere un token de livraison
  // stable par allocation a chaque chargement, pour l'idempotence du prochain clic "Confirmer".
  const chargerAllocationsCmd = async (cmdId) => {
    var snap = await db.collection("stock_allocations").where("commandeId","==",cmdId).get();
    var allocs = snap.docs
      .map(function (d) { return Object.assign({ id: d.id, _token: d.id + "_" + Date.now() + "_" + Math.random().toString(36).slice(2), _qte: "" }, d.data()); })
      .filter(function (a) { return a.statut === "Reservee" || a.statut === "PartiellementLivree"; });
    setAllocationsParCmd(function (prev) { return Object.assign({}, prev, { [cmdId]: allocs }); });
  };

  React.useEffect(() => {
    commandes.forEach(function (cmd) {
      if ((cmd.quantiteReservee || 0) > 0 && !allocationsParCmd[cmd.id]) { chargerAllocationsCmd(cmd.id); }
    });
  }, [commandes]);

  // Calcule la proposition FIFO pour une commande des que l'utilisateur saisit une quantite (simple
  // simulation, ne reserve rien). Requetes ciblees a la demande (pas d'ecouteur permanent).
  const calculerPropositionFIFO = async (cmd, qte) => {
    setFifoParCmd(function (prev) { return Object.assign({}, prev, { [cmd.id]: { chargement: true } }); });
    try {
      var lotsEligibles = await chargerLotsDisponiblesPourType(cmd.type);
      var totalTracable = lotsEligibles.reduce(function (a, l) { return a + l.disponible; }, 0);
      var s = stocks[cmd.type] || {};
      var stockHistorique = Math.max(0, (s.sec || 0) - totalTracable - (s.historiqueReserve || 0));
      var proposition = proposerAllocationFIFO(lotsEligibles, qte, stockHistorique);
      var token = cmd.id + "_" + Date.now() + "_" + Math.random().toString(36).slice(2);
      setFifoParCmd(function (prev) { return Object.assign({}, prev, { [cmd.id]: Object.assign({ chargement: false, token: token }, proposition) }); });
    } catch (e) {
      setFifoParCmd(function (prev) { return Object.assign({}, prev, { [cmd.id]: { chargement: false, erreur: e.message } }); });
    }
  };

  const modifierLigneFIFO = (cmdId, idx, nouvelleQte) => {
    setFifoParCmd(function (prev) {
      var etat = prev[cmdId];
      if (!etat || !etat.lignes) return prev;
      var lignes = etat.lignes.slice();
      var max = lignes[idx].historique ? Infinity : lignes[idx].disponibleMax;
      var v = Math.max(0, Math.min(nouvelleQte, max != null ? max : nouvelleQte));
      lignes[idx] = Object.assign({}, lignes[idx], { quantite: v });
      var couvert = lignes.reduce(function (a, l) { return a + l.quantite; }, 0);
      return Object.assign({}, prev, { [cmdId]: Object.assign({}, etat, { lignes: lignes, couvert: couvert }) });
    });
  };

  // Etape "Réserver" (point 8) : bloque le stock sans le sortir physiquement.
  const declencherReservation = async (cmd) => {
    var etat = fifoParCmd[cmd.id];
    if (!etat || !etat.lignes || etat.lignes.length === 0) return;
    if (msgLivraison[cmd.id] === "Réservation...") return; // anti-double-clic (point 12)
    if (!enLigne) { setMsgLivraison(function (prev) { return Object.assign({}, prev, { [cmd.id]: "🚫 Connexion requise — réservation impossible hors connexion." }); }); return; }
    setMsgLivraison(function (prev) { return Object.assign({}, prev, { [cmd.id]: "Réservation..." }); });
    try {
      await reserverCommandeStock(cmd, etat.lignes, etat.token, user, userData);
      var newQte = Object.assign({}, qteEnvoi); delete newQte[cmd.id]; setQteEnvoi(newQte);
      var newFifo = Object.assign({}, fifoParCmd); delete newFifo[cmd.id]; setFifoParCmd(newFifo);
      setMsgLivraison(function (prev) { return Object.assign({}, prev, { [cmd.id]: "✅ Réservation enregistrée." }); });
      await chargerAllocationsCmd(cmd.id);
    } catch (e) {
      setMsgLivraison(function (prev) { return Object.assign({}, prev, { [cmd.id]: "❌ Erreur : " + e.message }); });
    }
  };

  // Etape "Confirmer livraison" (point 8/10) : sortie physique reelle, totale ou partielle, d'une
  // reservation existante.
  const livrerAlloc = async (cmdId, alloc) => {
    if (msgAllocLivraison[alloc.id] === "Enregistrement...") return; // anti-double-clic (point 12)
    var reste = (alloc.quantiteReservee || 0) - (alloc.quantiteLivree || 0);
    var qte = parseInt(alloc._qte, 10);
    if (!qte || qte <= 0) qte = reste;
    if (qte > reste) qte = reste;
    if (!enLigne) { setMsgAllocLivraison(function (prev) { return Object.assign({}, prev, { [alloc.id]: "🚫 Livraison impossible hors connexion." }); }); return; }
    setMsgAllocLivraison(function (prev) { return Object.assign({}, prev, { [alloc.id]: "Enregistrement..." }); });
    try {
      await livrerReservation(alloc, qte, alloc._token, user, userData);
      setMsgAllocLivraison(function (prev) { return Object.assign({}, prev, { [alloc.id]: "✓ " + qte.toLocaleString() + " u livrée(s) — " + (alloc.chantierNom || "chantier") + "." }); });
      await chargerAllocationsCmd(cmdId);
    } catch (e) {
      setMsgAllocLivraison(function (prev) { return Object.assign({}, prev, { [alloc.id]: "❌ Échec de l'enregistrement — aucune modification confirmée. (" + e.message + ")" }); });
    }
  };

  const annulerAlloc = async (cmdId, alloc) => {
    var reste = (alloc.quantiteReservee || 0) - (alloc.quantiteLivree || 0);
    if (!window.confirm("Annuler cette réservation de " + reste.toLocaleString() + " u ? Le stock redeviendra disponible.")) return;
    if (!enLigne) { setMsgAllocLivraison(function (prev) { return Object.assign({}, prev, { [alloc.id]: "🚫 Connexion requise — annulation impossible hors connexion." }); }); return; }
    try {
      await annulerReservation(alloc, null, "Annulation manuelle (Responsable Stock)", user, userData);
      await chargerAllocationsCmd(cmdId);
    } catch (e) {
      setMsgAllocLivraison(function (prev) { return Object.assign({}, prev, { [alloc.id]: "❌ Échec de l'enregistrement — aucune modification confirmée. (" + e.message + ")" }); });
    }
  };

  // Phase 7 (points 26/27) : verifie une palette (ou un lot) scanne au moment du chargement d'une
  // livraison, contre les reservations actives de la commande — bon type, bon lot, palette
  // disponible, lot non bloque. N'AUTOMATISE aucune livraison : c'est une aide a la verification,
  // le clic "Confirmer livraison" (deja existant) reste le geste qui declenche la sortie physique.
  const verifierPaletteScanneePourCmd = async (cmdId, objet) => {
    var allocs = allocationsParCmd[cmdId] || [];
    var resultat;
    try {
      if (objet.type === "palette") {
        var paletteSnap = await db.collection("stock_palettes").doc(objet.id).get();
        if (!paletteSnap.exists) {
          resultat = { texte: "❌ Palette " + objet.id + " introuvable", ok: false };
        } else {
          var p = paletteSnap.data();
          var lotSnap = await db.collection("qse_lots").doc(p.numeroLot).get();
          var lotBloqueVerif = lotSnap.exists && lotSnap.data().annule === true;
          var allocCorrespondante = allocs.find(function (a) { return a.paletteId === objet.id; }) ||
            allocs.find(function (a) { return !a.paletteId && a.numeroLot === p.numeroLot; });
          if (lotBloqueVerif) resultat = { texte: "🚫 Palette " + objet.id + " — lot bloqué, non utilisable pour une livraison normale", ok: false };
          else if (!allocCorrespondante) resultat = { texte: "❌ Palette " + objet.id + " (lot " + p.numeroLot + ") ne correspond à aucune réservation de cette commande", ok: false };
          else resultat = { texte: "✓ Palette " + objet.id + " (lot " + p.numeroLot + ") conforme — " + (p.disponibleCache || 0).toLocaleString() + " u disponibles", ok: true };
        }
      } else {
        var allocLot = allocs.find(function (a) { return a.numeroLot === objet.id; });
        resultat = allocLot ? { texte: "✓ Lot " + objet.id + " conforme pour cette commande", ok: true } : { texte: "❌ Lot " + objet.id + " ne correspond à aucune réservation de cette commande", ok: false };
      }
    } catch (e) {
      resultat = { texte: "❌ Erreur de vérification : " + e.message, ok: false };
    }
    setResultatsScanCmd(function (prev) {
      var liste = (prev[cmdId] || []).slice();
      liste.unshift(resultat);
      return Object.assign({}, prev, { [cmdId]: liste.slice(0, 8) });
    });
  };

  const modifierQteAllocInput = (cmdId, allocId, v) => {
    setAllocationsParCmd(function (prev) {
      var liste = (prev[cmdId] || []).map(function (a) { return a.id === allocId ? Object.assign({}, a, { _qte: v }) : a; });
      return Object.assign({}, prev, { [cmdId]: liste });
    });
  };

  const ouvrirEditCmd = (cmd) => {
    setEditCmd(cmd); setEditCmdType(cmd.type); setEditCmdQte(String(cmd.quantite || "")); setEditCmdChantierId(cmd.chantierId || ""); setMsgEditCmd("");
  };

  // Points 12/13/32 : modifie quantite/type/chantier d'une commande deja validee. Bloque le
  // changement de type si des reservations existent (verifie cote fonction metier centrale).
  const sauvegarderEditCmd = async () => {
    if (!editCmd) return;
    var qte = parseInt(editCmdQte, 10);
    if (!(qte > 0)) { setMsgEditCmd("Quantité invalide"); return; }
    setMsgEditCmd("Enregistrement...");
    try {
      var chantierChoisi = chantiers.find(function (c) { return c.id === editCmdChantierId; });
      var allocsActuelles = allocationsParCmd[editCmd.id] || [];
      await modifierCommandeStock(editCmd, editCmdType, qte, editCmdChantierId || null, chantierChoisi ? chantierChoisi.nom : editCmd.chantierNom, allocsActuelles, user, userData);
      setMsgEditCmd("✅ Commande modifiée.");
      setTimeout(function () { setEditCmd(null); setMsgEditCmd(""); }, 900);
    } catch (e) { setMsgEditCmd("❌ Erreur : " + e.message); }
  };

  // Point 12 : libere explicitement l'exces de reservation apres une reduction de commande.
  const reajusterExces = async (cmd) => {
    try {
      await reajusterReservationCommande(cmd, allocationsParCmd[cmd.id] || [], cmd.quantite, user, userData);
      await chargerAllocationsCmd(cmd.id);
    } catch (e) { window.alert("Erreur : " + e.message); }
  };

  return (
    <div className="btp-app">
      {editCmd && (
        <div className="btp-modal-overlay" onClick={() => setEditCmd(null)}>
          <div className="btp-modal" style={{ maxWidth: 420 }} onClick={(e) => e.stopPropagation()}>
            <div className="btp-modal-title" style={{ marginBottom: 10 }}>✏️ Modifier la commande {editCmd.numBC || ""}</div>
            <label className="btp-label">Type BTC</label>
            <select className="btp-input" value={editCmdType} onChange={(e) => setEditCmdType(e.target.value)} style={{ marginBottom: 10, width: "100%" }}>
              {CATALOGUE.map(function (p) { return <option key={p.id} value={p.id}>{p.nom}</option>; })}
            </select>
            {editCmdType !== editCmd.type && ((allocationsParCmd[editCmd.id] || []).length > 0 || (editCmd.quantiteReservee || 0) > 0 || (editCmd.quantiteLivree || 0) > 0) && (
              <div style={{ fontSize: 12, color: "#F1948A", marginBottom: 10 }}>⚠️ Cette commande a déjà des réservations/livraisons en {getProduit(editCmd.type).nom} : le changement de type sera refusé tant qu'elles ne sont pas annulées.</div>
            )}
            <label className="btp-label">Quantité commandée</label>
            <input type="number" min="1" className="btp-input" value={editCmdQte} onChange={(e) => setEditCmdQte(e.target.value)} style={{ marginBottom: 10, width: "100%" }} />
            <label className="btp-label">Chantier</label>
            <select className="btp-input" value={editCmdChantierId} onChange={(e) => setEditCmdChantierId(e.target.value)} style={{ marginBottom: 14, width: "100%" }}>
              <option value="">{editCmd.chantierNom || "—"}</option>
              {chantiers.map(function (c) { return <option key={c.id} value={c.id}>{c.nom}</option>; })}
            </select>
            {msgEditCmd && <div style={{ fontSize: 12, marginBottom: 10, color: msgEditCmd.indexOf("❌") >= 0 ? "#EC7063" : "#2ECC71" }}>{msgEditCmd}</div>}
            <div style={{ display: "flex", gap: 10 }}>
              <button className="btn btn-full" style={{ background: "#1E8449", color: "white" }} onClick={sauvegarderEditCmd}>Enregistrer</button>
              <button className="btn btn-ghost btn-full" onClick={() => setEditCmd(null)}>Annuler</button>
            </div>
          </div>
        </div>
      )}
      <div className="btp-header">
        <div className="btp-header-logo">
          <div className="btp-header-logo-icon">📦</div>
          <div>
            <div className="btp-header-title">BTC Manager</div>
            <div className="btp-header-sub">Responsable Stock</div>
          </div>
        </div>
        <div className="btp-header-right">
          <GlobalSearch lots={lots} palettes={palettesList} commandes={commandes} ouvrirObjet={ouvrirObjetStock} />
          <div className="btp-user-chip">👤 <strong>{userData.nom||user.email}</strong></div>
          <button className="btn btn-sm btn-danger" onClick={()=>auth.signOut()}>⏻ Déco.</button>
        </div>
      </div>
      <div className="btp-content">

        {/* Phase 7/8 (points 13/16) : mode terrain "ultra simple" — action principale tres visible,
            "Mon travail" juste en dessous (moteur de priorites, point 21/25), avant le detail du
            stock. Rien n'est retire : le reste de l'ecran reste entierement accessible plus bas. */}
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 16, alignItems: "center" }}>
          <BoutonScanner user={user} userData={userData} />
          <button className="btn btn-lg" style={{ background: "#5DADE2", color: "white", fontWeight: 800, fontSize: 16 }} onClick={() => setShowInventaire(true)}>📋 Inventaire</button>
          {compteurPrioritesStock > 0 && <span className="btp-badge-compteur">{compteurPrioritesStock}</span>}
        </div>

        <h3 style={{marginBottom:10,color:"var(--btp-orange)"}}>Mon travail</h3>
        <div style={{ marginBottom: 24 }}>
          <ModeAujourdhui donnees={prioriteDonneesStock} ouvrirObjet={ouvrirObjetStock} role="resp_stock" />
        </div>

        <h3 style={{marginBottom:14,color:"#145A32"}}>Etat du stock</h3>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:10,marginBottom:28}}>
          {CATALOGUE.map(prod=>{
            var s=stocks[prod.id]||{}; var sec=s.sec||0; var sechage=s.sechage||0; var total=sec+sechage;
            var couleur=couleurUrgence(total);
            return(
              <div key={prod.id} style={{background:"var(--btp-card)",borderRadius:12,padding:12,boxShadow:"0 2px 6px rgba(0,0,0,0.08)",borderLeft:"4px solid "+couleur}}>
                <div style={{fontWeight:700,fontSize:12,marginBottom:2}}>{prod.nom}</div>
<div style={{fontSize:11,color:"#BDC3C7",marginBottom:4}}>{prod.dim}</div>
<div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:2}}>
<span style={{color:"var(--btp-green)"}}>Mature: <strong>{sec.toLocaleString()}</strong></span>
<span style={{color:"#E67E22"}}>Sechage: <strong>{sechage.toLocaleString()}</strong></span>
</div>
{calcSechageActif(productions,prod.id)>0&&<div style={{fontSize:10,color:"#B7770D",background:"#FFF3CD",borderRadius:4,padding:"2px 6px",marginBottom:3}}>⏳ {calcSechageActif(productions,prod.id).toLocaleString()} u pas encore matures</div>}
<div style={{fontSize:12,fontWeight:700,color:couleur,marginTop:2}}>Total: {total.toLocaleString()}</div>
{(s.historiqueReserve||0) > 0 && <div style={{fontSize:10,color:"var(--btp-text2)",marginTop:2}}>dont {(s.historiqueReserve||0).toLocaleString()} u historique réservées</div>}
              </div>
            );
          })}
        </div>

        {/* Phase 10B (parties AM-AS/CQ) : reception de terre par camions-bennes — stock theorique
            issu du grand livre matiere_mouvements, DISTINCT de l'inventaire physique periodique
            existant ("Matières 1ères" côté Direction) qui reste un comptage manuel bihebdomadaire. */}
        <h3 style={{marginBottom:10,color:"#145A32"}}>Matières premières (stock théorique)</h3>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10,alignItems:"center"}}>
          <button className="btn btn-lg" style={{background:"#8D6E63",color:"white",fontWeight:800,fontSize:16}} onClick={ouvrirReceptionTerre} disabled={!enLigne}>🚚 Réception terre (camions)</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:10,marginBottom:28}}>
          {["terre","ciment","sable","eau"].map(function(id){
            var m = matieresStockRes[id] || {};
            return (
              <div key={id} style={{background:"var(--btp-card)",borderRadius:12,padding:12,boxShadow:"0 2px 6px rgba(0,0,0,0.08)"}}>
                <div style={{fontWeight:700,fontSize:12,marginBottom:4}}>{getLibelleMatiere(id)}</div>
                <div style={{fontSize:16,fontWeight:800}}>{(m.quantite||0).toLocaleString()} {m.unite||(id==="terre"?"m³":id==="eau"?"L":"kg")}</div>
                {id==="terre" && parametresStock.capaciteBenneDefautM3 && <div style={{fontSize:11,color:"var(--btp-text2)",marginTop:2}}>≈ {((m.quantite||0)/parametresStock.capaciteBenneDefautM3).toFixed(1)} bennes</div>}
                {m.coutMoyenPondere>0 && <div style={{fontSize:11,color:"var(--btp-text2)",marginTop:2}}>Coût moyen : {m.coutMoyenPondere.toFixed(2)} €/{m.unite||"u"}</div>}
              </div>
            );
          })}
        </div>

        {showReceptionTerre && formReception && (
          <div className="btp-modal-overlay" onClick={() => setShowReceptionTerre(false)}>
            <div className="btp-modal" style={{maxWidth:420}} onClick={(e)=>e.stopPropagation()}>
              <div className="btp-modal-title" style={{marginBottom:10}}>🚚 Réception terre</div>
              <label className="btp-label">Nombre de camions</label>
              <input type="number" className="btp-input" style={{width:"100%",marginBottom:10}} value={formReception.nombreCamions} onChange={e=>setFormReception(Object.assign({},formReception,{nombreCamions:e.target.value}))} />
              <label className="btp-label">Capacité de la benne (m³)</label>

    setTimeout(function () { var el = document.getElementById("prod-form-saisie"); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); }, 50);

  // Point 31 : le report est PROPOSE puis VALIDE explicitement par l'utilisateur — jamais deplace
  // automatiquement. Date proposee par defaut : demain (le responsable peut de toute facon
  // reprogrammer une nouvelle ligne au prochain recalcul de plan si besoin).
  var proposerReportLigne = async function (l) {
    if (!enLigne) { window.alert("🚫 Connexion requise — report impossible hors connexion."); return; }
    var demain = new Date(); demain.setDate(demain.getDate() + 1); demain.setHours(0, 0, 0, 0);
    var libelleDate = demain.toLocaleDateString("fr-FR");
    var okc = window.confirm((l.quantitePrevue || 0).toLocaleString() + " u de " + getProduit(l.typeBTC).nom + " non réalisées — proposer un report au " + libelleDate + " ?");
    if (!okc) return;
    try {
      await reporterLigneProductionPlan(l, demain.getTime(), user, userData);
      rafraichirPlan();
    } catch (e) { window.alert("❌ Échec de l'enregistrement — aucune modification confirmée. (" + e.message + ")"); }
  };

  useEffect(() => {
    var u1 = db.collection("stocks").onSnapshot(snap => {
      var s = {}; snap.docs.forEach(d => { s[d.id] = d.data(); }); setStocks(s);
    });
    var u2 = db.collection("productions").onSnapshot(snap => {
      setProductions(snap.docs.map(d => Object.assign({id:d.id}, d.data())));
    });
    var u3 = db.collection("pertes").orderBy("timestamp","desc").onSnapshot(snap => {
      setPertes(snap.docs.map(d=>({id:d.id,...d.data()})));
    });
    var u4 = db.collection("commandes").onSnapshot(snap => {
      setCommandes(snap.docs.map(d=>({id:d.id,...d.data()})));
    });
    var u5 = db.collection("qse_lots").orderBy("dateCreation","desc").limit(300).onSnapshot(snap => {
      var m = {}; var liste = [];
      snap.docs.forEach(function(d){ var data = d.data(); if (data.productionId) m[data.productionId] = data.numeroLot; liste.push(Object.assign({ id: d.id }, data)); });
      setQseLotsParProdId(m);
      setLots(liste);
    });
    // Phase 8 (point 21) : necessaire au moteur de priorites de ce role (lot_pret/controle_retard/
    // lot_sans_controle) — c'est la SEULE donnee QSE supplementaire chargee ici, pas les NC ni
    // l'historique complet (point 30 : pas plus que ce dont ce role a reellement besoin).
    var u6 = db.collection("qse_controles").where("resultat","==","Non mesuré").onSnapshot(snap => {
      setControlesEnAttente(snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }));
    });
    return () => { u1(); u2(); u3(); u4(); u5(); u6(); };
  }, []);

  var typesParUrgence = CATALOGUE.map(function(prod) {
    var s = stocks[prod.id]||{};
    var sec = s.sec||0; var sechage = s.sechage||0; var total = sec+sechage;
    return { prod:prod, sec:sec, sechage:sechage, total:total };
  }).sort(function(a,b) { return a.total - b.total; });

  var prodAujourdHui = productions.filter(function(p) { return p.date === dateAujourdHui; });

  var enregistrer = async function() {
    if (enregistrementEnCours) return; // anti-double-clic (point 12)
    if (!saisieType||!saisieQte) { setMsg("Choisissez un type et entrez la quantite"); return; }
    var qte = parseInt(saisieQte);
    if (isNaN(qte)||qte<=0) { setMsg("Quantite invalide"); return; }
    // Phase 8 (points 7/8) : la production modifie physiquement le stock — jamais de tentative si
    // hors connexion, refus immediat et explicite.
    if (!enLigne) { setMsg("🚫 Connexion requise — production impossible à enregistrer hors connexion."); return; }
    setEnregistrementEnCours(true);
    setMsg("Enregistrement...");
    var alerteLente = setTimeout(function () { setMsg("Enregistrement... · Connexion lente — toujours en cours."); }, 4000);
    try {
      var dateFr = dateAujourdHui;
      if (saisieDate) { var parts = saisieDate.split("-"); if (parts.length === 3) { dateFr = parts[2] + "/" + parts[1] + "/" + parts[0]; } }
      var token = "prod_" + Date.now() + "_" + Math.random().toString(36).slice(2);
      // Phase 10B (points AG/BR) : production + stock BTC + consommation matieres premieres, dans
      // UNE SEULE transaction atomique — refuse explicitement si les matieres sont insuffisantes,
      // AVANT toute ecriture (jamais de production enregistree sans sa consommation matiere).
      var resultatProd = await enregistrerProductionAvecConsommation({ type: saisieType, quantite: qte, phase: saisiePhase, date: dateFr }, parametresProd, token, user, userData);
      qseCreerLotEtControlePourProduction(resultatProd.productionId, {
        type: saisieType, quantite: qte, phase: saisiePhase, date: dateFr
      }, user, userData).catch(function(e){ console.error("Erreur creation lot QSE", e); });
      // Phase 10 (points 28/33) : si cette production demarre une ligne planifiee, on la relie a la
      // production REELLEMENT enregistree (quantite reelle, jamais la quantite prevue) pour que la
      // projection future ne compte jamais planifie + realise en double. Echec de liaison = simple
      // avertissement console (la production, elle, est deja bien enregistree) — jamais un blocage.
      if (planLigneActive) {
        terminerLigneProductionPlan(planLigneActive.id, resultatProd.productionId, qte, user, userData)
          .then(rafraichirPlan)
          .catch(function (e) { console.error("Erreur liaison plan/production", e); });
        setPlanLigneActive(null);
      }
      clearTimeout(alerteLente);
      setEnregistrementEnCours(false);
      setMsg("✓ " + qte.toLocaleString() + " u — production enregistrée, stock mis à jour." + (!resultatProd.matieresSuivies ? "" : (resultatProd.matieresCalculables ? " Matières déduites (" + resultatProd.coutMatieresProduction.toFixed(2) + " € de matières)." : " Densité terre non configurée — seule la terre a été déduite.")));
      setSaisieQte("");
    } catch(e) {
      clearTimeout(alerteLente);
      setEnregistrementEnCours(false);
      setMsg("❌ " + (e.message && e.message.indexOf("matières insuffisantes") !== -1 ? e.message : ("Échec de l'enregistrement — aucune modification confirmée. (" + e.message + ")")));
    }
  };
  // Point AH : apercu matieres avant validation — pur, ne se declenche que si une quantite valide
  // est saisie, ne bloque jamais la saisie elle-meme (juste informatif tant que non enregistre).
  var apercuMatieres = React.useMemo(function () {
    var qte = parseInt(saisieQte, 10);
    if (!(qte > 0)) return null;
    return apercuMatieresProduction(qte, matieresStockProd, parametresProd);
  }, [saisieQte, matieresStockProd, parametresProd]);

  function pFrToInput(frDate){
    if (frDate && typeof frDate === "string" && frDate.indexOf("/") !== -1){
      var pp = frDate.split("/");
      if (pp.length === 3){ return pp[2] + "-" + pp[1].padStart(2,"0") + "-" + pp[0].padStart(2,"0"); }
    }
    var d = new Date(); var m = String(d.getMonth()+1).padStart(2,"0"); var j = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+j;
  }
  function pOuvrirEdit(p){
    setPEdit(p); setPEditType(p.type||CATALOGUE[0].id); setPEditDate(pFrToInput(p.date));
    setPEditQte(String(p.quantite||"")); setPEditPhase(p.phase||"sec"); setPEditMsg("");
    setPEditToken(p.id + "_" + Date.now() + "_" + Math.random().toString(36).slice(2)); // Phase 6
  }
  async function pSauvegarderEdit(){
    if (!pEdit || pEditMsg === "Enregistrement...") return; // anti-double-clic (point 12)
    if (!pEditType || !pEditQte) { setPEditMsg("Choisissez un produit et une quantite"); return; }
    var qte = parseInt(pEditQte);
    if (isNaN(qte) || qte <= 0) { setPEditMsg("Quantite invalide"); return; }
    if (!enLigne) { setPEditMsg("🚫 Connexion requise — correction impossible hors connexion."); return; }
    var dateFr = pEdit.date;
    if (pEditDate) { var parts = pEditDate.split("-"); if (parts.length === 3) { dateFr = parts[2] + "/" + parts[1] + "/" + parts[0]; } }
    setPEditMsg("Enregistrement...");
    try {
      // Phase 6 : idem Direction — fonction metier centrale, jamais de decrementation directe.
      await corrigerProductionLot(pEdit, pEditType, qte, pEditPhase, dateFr, pEditToken, user, userData);
      setPEditMsg("✓ Production modifiée.");
      setTimeout(function(){ setPEdit(null); setPEditMsg(""); }, 900);
    } catch (e) { setPEditMsg("❌ Échec de l'enregistrement — aucune modification confirmée. (" + e.message + ")"); }
  }
  async function pSupprimer(p){
    var okc = window.confirm("Supprimer definitivement cette production (" + getProduit(p.type).nom + ", " + (p.quantite||0) + " u, " + (p.date||"") + ") ?");
    if (!okc) return;
    if (!enLigne) { window.alert("🚫 Connexion requise — suppression impossible hors connexion."); return; }
    var mdp = window.prompt("Pour confirmer, saisissez votre mot de passe :");
    if (!mdp) { return; }
    try {
      var cred = firebase.auth.EmailAuthProvider.credential(user.email, mdp);
      await auth.currentUser.reauthenticateWithCredential(cred);
    } catch (e) { window.alert("Mot de passe incorrect. Suppression annulee."); return; }
    try {
      // Phase 6 : idem Direction — bloque si le lot a deja ete consomme, trace ANNULATION_PRODUCTION.
      await annulerProductionLot(p, user, userData);
      if (pEdit && pEdit.id === p.id) { setPEdit(null); }
    } catch (e) { window.alert("Échec de l'enregistrement — aucune modification confirmée. (" + e.message + ")"); }
  }

  var enregistrerPerte = async function() {
    if (!saisiePerteType||!saisiePerteQte) { setMsgPerte("Choisissez un type et une quantite"); return; }
    if (!enLigne) { setMsgPerte("🚫 Connexion requise — perte impossible à enregistrer hors connexion."); return; }
    try {
      var qte = parseInt(saisiePerteQte);
      if (!(qte > 0)) { setMsgPerte("Quantité invalide"); return; }
      var token = saisiePerteToken;
      // Phase 6 : cette perte n'est pas rattachable a un lot precis (declaree au niveau du type,
      // depuis cet ecran — pour une perte sur un lot connu, utiliser "Déclarer une perte" depuis la
      // Fiche du lot, qui passe par declarerPerteLot). Elle doit neanmoins passer par le grand livre
      // (numeroLot: null, comme un ajustement d'inventaire) pour rester coherente avec
      // reconcilierStockType/diagnostiquerCoherenceStock — jamais de decrementation directe du
      // compteur agrege en dehors du grand livre.
      var mvt = { type: "PERTE", numeroLot: null, typeBTC: saisiePerteType, quantite: -qte, sourceType: "perte_type", sourceId: token, utilisateur: userData.nom||user.email, commentaire: saisiePerteRaison || "" };
      var stockRef = db.collection("stocks").doc(saisiePerteType);

        var stockSnap = await tx.get(stockRef);

        var sd = stockSnap.exists ? stockSnap.data() : {};
        ecrireMouvementStock(tx, chk.id, mvt);

      });
      await db.collection("pertes").add({
        type: saisiePerteType, quantite: qte, raison: saisiePerteRaison,

      });

      setMsgPerte("Perte enregistrée !");
      setSaisiePerteQte(""); setSaisiePerteType(""); setSaisiePerteRaison("production");
      setSaisiePerteToken("perte_" + Date.now() + "_" + Math.random().toString(36).slice(2));
    } catch(e) { setMsgPerte("Erreur: "+e.message); }
  };

  return (

    <div className="btp-app">

      <div className="btp-header">
        <div className="btp-header-logo">
          <div className="btp-header-logo-icon">⚙️</div>
          <div>

            <div className="btp-header-sub">Responsable Production</div>

        </div>
        <div className="btp-header-right">

          <div className="btp-user-chip">👤 <strong>{userData.nom||user.email}</strong></div>
          <button className="btn btn-sm btn-danger" onClick={()=>auth.signOut()}>⏻ Déco.</button>
        </div>
      </div>
      <div className="btp-nav">
        {[

      </div>
      <div className="btp-content">
        { tabProd === 'production' && (
          <div>
<div style={{padding:20}}>

            {capaciteReelleAujourdhui.calculable && (<> · Capacité BTC ajustée aujourd'hui : <strong>≈{capaciteReelleAujourdhui.capaciteReelle.toLocaleString()}</strong> ({capaciteReelleAujourdhui.heuresDisponibles.toFixed(1)} h disponibles sur {parametresProd.heuresTravailJour} h, {capaciteReelleAujourdhui.heuresIndisponibles.toFixed(1)} h mobilisées ailleurs)</>)}

/* ===================== MODULE QSE (ISO 9001 / ISO 14001) ===================== */

function qseFormatNombre(n) {
  const arrondi = Math.round(n * 100) / 100;
  return String(arrondi).replace(".", ",");
}

function qseMoisDeDateFr(dateFr) {
  if (!dateFr || typeof dateFr !== "string") return null;
  const parts = dateFr.split("/");
  if (parts.length !== 3) return null;
  return parts[2] + "-" + parts[1].padStart(2, "0");
}

function qseDebutMois(mois) {
  const p = mois.split("-").map(Number);
  return new Date(p[0], p[1] - 1, 1, 0, 0, 0, 0);
}

function qseDebutMoisSuivant(mois) {
  const p = mois.split("-").map(Number);
  return new Date(p[0], p[1], 1, 0, 0, 0, 0);
}

async function qseProductionDuMois(mois) {
  const debut = qseDebutMois(mois);
  const fin = qseDebutMoisSuivant(mois);
  let total = 0;
  const idsComptes = {};
  const snap = await db.collection("productions")
    .where("timestamp", ">=", debut)
    .where("timestamp", "<", fin)
    .get();
  snap.forEach((doc) => {
    const p = doc.data();
    total += Number(p.quantite) || 0;
    idsComptes[doc.id] = true;
  });
  const fallbackSnap = await db.collection("productions").limit(500).get();
  fallbackSnap.forEach((doc) => {
    if (idsComptes[doc.id]) return;
    const p = doc.data();
    if (p.timestamp) return;
    if (qseMoisDeDateFr(p.date) === mois) {
      total += Number(p.quantite) || 0;
      idsComptes[doc.id] = true;
    }
  });
  return total;
}

async function qseValeursEnvMois(mois) {
  const snap = await db.collection("qse_env").doc(mois).get();
  if (!snap.exists) return {};
  const d = snap.data();
  return {
    terresValorisees: d.terresValorisees,
    electricite: d.electricite,
    eau: d.eau,
    ciment: d.ciment
  };
}

function QseIndicateursEnvironnement(props) {
  const [mois, setMois] = React.useState(() => {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  });
  const [valeurs, setValeurs] = React.useState({});
  const [productionMois, setProductionMois] = React.useState(null);
  const [chargement, setChargement] = React.useState(true);
  const [saisie, setSaisie] = React.useState({ terresValorisees: "", electricite: "", eau: "", ciment: "" });
  const [msg, setMsg] = React.useState("");

  const charger = async (m) => {
    setChargement(true);
    const v = await qseValeursEnvMois(m);
    const p = await qseProductionDuMois(m);
    setValeurs(v);
    setProductionMois(p);
    setSaisie({
      terresValorisees: v.terresValorisees !== undefined ? String(v.terresValorisees) : "",
      electricite: v.electricite !== undefined ? String(v.electricite) : "",
      eau: v.eau !== undefined ? String(v.eau) : "",
      ciment: v.ciment !== undefined ? String(v.ciment) : ""
    });
    setChargement(false);
  };

  React.useEffect(() => { charger(mois); }, [mois]);

  const enregistrer = async () => {
    await db.collection("qse_env").doc(mois).set({
      terresValorisees: Number(saisie.terresValorisees) || 0,
      electricite: Number(saisie.electricite) || 0,
      eau: Number(saisie.eau) || 0,
      ciment: Number(saisie.ciment) || 0,
      dateModification: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    setMsg("Valeurs environnementales enregistrées.");
    charger(mois);
  };

  const lignes = [
    { cle: "terresValorisees", label: "Terres valorisées", unite: "m³", modeRatio: false },
    { cle: "electricite", label: "Électricité", unite: "kWh", modeRatio: true },
    { cle: "eau", label: "Eau", unite: "m³", modeRatio: true },
    { cle: "ciment", label: "Ciment", unite: "kg", modeRatio: true }
  ];

  const texteIndicateur = (l) => {
    const v = valeurs[l.cle];
    if (v === undefined) return "Non renseigné";
    if (!l.modeRatio) {
      return qseFormatNombre(v) + " " + l.unite + " valorisés dans le mois";
    }
    if (!productionMois) return "Production du mois inconnue";
    const ratio = (v / productionMois) * 1000;
    return qseFormatNombre(ratio) + " " + l.unite + " / 1 000 BTC";
  };

  return (
    <div className="qse-environnement">
      <h3>Indicateurs environnementaux</h3>
      {msg && <div className="qse-msg">{msg}</div>}
      {chargement && <div>Chargement...</div>}
      {!chargement && (
        <React.Fragment>
          <ul>
            {lignes.map((l) => (
              <li key={l.cle}>{l.label} : {texteIndicateur(l)}</li>
            ))}
          </ul>
          <div className="qse-form-env">
            <label>Terres valorisées (m³) <input type="number" value={saisie.terresValorisees} onChange={(e) => setSaisie(Object.assign({}, saisie, { terresValorisees: e.target.value }))} /></label>
            <label>Électricité (kWh) <input type="number" value={saisie.electricite} onChange={(e) => setSaisie(Object.assign({}, saisie, { electricite: e.target.value }))} /></label>
            <label>Eau (m³) <input type="number" value={saisie.eau} onChange={(e) => setSaisie(Object.assign({}, saisie, { eau: e.target.value }))} /></label>
            <label>Ciment (kg) <input type="number" value={saisie.ciment} onChange={(e) => setSaisie(Object.assign({}, saisie, { ciment: e.target.value }))} /></label>
            <button className="btn" onClick={enregistrer}>Enregistrer les valeurs du mois</button>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function qseNiveauCriticite(score) {
  if (score >= 13) return { label: "Critique", classe: "qse-crit-critique" };
  if (score >= 9) return { label: "Important", classe: "qse-crit-important" };
  if (score >= 5) return { label: "Modéré", classe: "qse-crit-modere" };
  return { label: "Faible", classe: "qse-crit-faible" };
}

  }, []);

    qseModifierRisque(r.id, { probabilite: probabilite2, impact: impact2, criticite: probabilite2 * impact2 }, user, userData);

        <select value={probabilite} onChange={(e) => setProbabilite(Number(e.target.value))}>
          <option value={1}>Probabilité 1</option>
          <option value={2}>Probabilité 2</option>
          <option value={3}>Probabilité 3</option>
          <option value={4}>Probabilité 4</option>
        </select>
        <select value={impactNiv} onChange={(e) => setImpactNiv(Number(e.target.value))}>
          <option value={1}>Impact 1</option>
          <option value={2}>Impact 2</option>
          <option value={3}>Impact 3</option>

        </select>

      </div>
      <table className="qse-table">
        <thead>
          <tr>
            <th>Type</th>
            <th>Catégorie</th>
            <th>Description</th>
            <th>Probabilité</th>
            <th>Impact</th>
            <th>Criticité</th>
            <th>Maîtrise</th>
            <th>Action</th>
            <th>Responsable</th>
            <th>Échéance</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody>
          {liste.map((r) => {
            const niveau = qseNiveauCriticite(r.criticite);

            return (
