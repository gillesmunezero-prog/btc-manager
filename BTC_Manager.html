                        </div>
                      );
                    })}
                  </div>
                )}

                {resteAReserver > 0 && (
                  <div>
                    <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                      <div style={{flex:1}}>
                        <label style={{fontSize:12,fontWeight:600,color:"#145A32",display:"block",marginBottom:4}}>Quantité à réserver :</label>
                        <input type="number" min="1" max={resteAReserver} placeholder={"Max "+resteAReserver.toLocaleString()}
                          value={qteEnvoi[cmd.id]||""}
                          onChange={e=>{ var v=parseInt(e.target.value)||0; setQteEnvoi(Object.assign({},qteEnvoi,{[cmd.id]:v>resteAReserver?resteAReserver:(v||"")})); }}
                          style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"2px solid #1E8449",fontSize:14}} />
                      </div>
                      <button onClick={()=>calculerPropositionFIFO(cmd, parseInt(qteEnvoi[cmd.id])||0)}
                        disabled={!qteEnvoi[cmd.id]||parseInt(qteEnvoi[cmd.id])<=0}
                        style={{background:"#2980B9",color:"white",border:"none",padding:"10px 18px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13,marginTop:20,opacity:(!qteEnvoi[cmd.id]||parseInt(qteEnvoi[cmd.id])<=0)?0.5:1}}>🔍 Préparer</button>
                    </div>

                    {fifoParCmd[cmd.id] && fifoParCmd[cmd.id].chargement && <div style={{marginTop:10,fontSize:12,color:"var(--btp-text2)"}}>Calcul de la proposition…</div>}
                    {fifoParCmd[cmd.id] && fifoParCmd[cmd.id].erreur && <div style={{marginTop:10,fontSize:12,color:"#EC7063"}}>⚠️ {fifoParCmd[cmd.id].erreur}</div>}
                    {fifoParCmd[cmd.id] && fifoParCmd[cmd.id].lignes && (
                      <div style={{marginTop:12,background:"var(--btp-card2)",borderRadius:8,padding:12}}>
                        <div style={{fontSize:12,fontWeight:700,color:"var(--btp-text2)",marginBottom:8,textTransform:"uppercase",letterSpacing:".5px"}}>Allocation proposée (FIFO)</div>
                        {fifoParCmd[cmd.id].lignes.map(function(l,idx){
                          return (
                            <div key={idx} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,fontSize:13}}>
                              <span style={{flex:1}}>{l.historique ? "📦 Stock historique non traçable" : ("🏷️ "+l.numeroLot+" (produit le "+l.date+")")}</span>
                              <input type="number" min="0" max={l.disponibleMax} value={l.quantite}
                                onChange={e=>modifierLigneFIFO(cmd.id, idx, parseInt(e.target.value)||0)}
                                style={{width:90,padding:"4px 8px",borderRadius:6,border:"1px solid var(--btp-border)",textAlign:"right"}} />
                              <span style={{color:"var(--btp-text2)"}}>u</span>
                            </div>
                          );
                        })}
                        {fifoParCmd[cmd.id].utiliseHistorique > 0 && (
                          <div style={{fontSize:12,color:"var(--btp-gold)",fontWeight:700,marginTop:4}}>⚠️ Cette réservation utilise {fifoParCmd[cmd.id].utiliseHistorique.toLocaleString()} unités de stock historique non traçable.</div>
                        )}
                        {fifoParCmd[cmd.id].deficit > 0 && (
                          <div style={{fontSize:12,color:"#EC7063",fontWeight:700,marginTop:4}}>🔴 Déficit : {fifoParCmd[cmd.id].deficit.toLocaleString()} u non couvertes par le stock disponible à réserver.</div>
                        )}
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
                          <span style={{fontSize:12,color:"var(--btp-text2)"}}>Total : <strong style={{color:"white"}}>{fifoParCmd[cmd.id].lignes.reduce(function(a,l){return a+l.quantite;},0).toLocaleString()} u</strong></span>
                          <button onClick={()=>declencherReservation(cmd)} disabled={msgLivraison[cmd.id]==="Réservation..."} style={{background:"#2980B9",color:"white",border:"none",padding:"9px 18px",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13,opacity:msgLivraison[cmd.id]==="Réservation..."?0.6:1}}>{msgLivraison[cmd.id]==="Réservation..."?"Réservation…":"📌 Réserver"}</button>
                        </div>
                      </div>
                    )}
                    {msgLivraison[cmd.id] && <div style={{marginTop:8,fontSize:12,color:msgLivraison[cmd.id].indexOf("Erreur")>=0?"#EC7063":"#2ECC71"}}>{msgLivraison[cmd.id]}</div>}
                  </div>
                )}
                {resteCmd === 0 && (
                  <div style={{padding:"8px 14px",background:"#EAFAF1",borderRadius:8,color:"#1E8449",fontWeight:700,fontSize:13,textAlign:"center"}}>✅ Commande entierement livree</div>
                )}
              </div>
            );
          })
        }
      </div>
      {scanVerifPourCmd && (
        <ModaleScanner titre="Vérifier une palette chargée" onFermer={() => setScanVerifPourCmd(null)}
          onObjetReconnu={(o) => verifierPaletteScanneePourCmd(scanVerifPourCmd, o)} continu={true} />
      )}
      {showInventaire && <InventaireParScan user={user} userData={userData} onFermer={() => setShowInventaire(false)} />}
    </div>
  );
}
function DashboardProduction({ user, userData }) {
  const [stocks, setStocks] = useState({});
  const [productions, setProductions] = useState([]);
  const [saisieType, setSaisieType] = useState(CATALOGUE[0].id);
  const [saisieQte, setSaisieQte] = useState("");
  const [saisiePhase, setSaisiePhase] = useState("sec");
  const [msg, setMsg] = useState("");
  const dateAujourdHui = new Date().toLocaleDateString("fr-FR");
  const [saisieDate, setSaisieDate] = React.useState(function(){ var d = new Date(); var m = String(d.getMonth()+1).padStart(2,"0"); var j = String(d.getDate()).padStart(2,"0"); return d.getFullYear()+"-"+m+"-"+j; });
  const [pEdit, setPEdit] = React.useState(null);
  const [pEditType, setPEditType] = React.useState("");
  const [pEditDate, setPEditDate] = React.useState("");
  const [pEditQte, setPEditQte] = React.useState("");
  const [pEditPhase, setPEditPhase] = React.useState("sec");
  const [pEditMsg, setPEditMsg] = React.useState("");
  const [pEditToken, setPEditToken] = React.useState(""); // Phase 6 : identifiant stable de correction (idempotence)
  const [pertes, setPertes] = React.useState([]);
  const [commandes, setCommandes] = React.useState([]);
  const [saisiePerteType, setSaisiePerteType] = React.useState("");
  const [saisiePerteQte, setSaisiePerteQte] = React.useState("");
  const [saisiePerteRaison, setSaisiePerteRaison] = React.useState("production");
  const [msgPerte, setMsgPerte] = React.useState("");
  const [saisiePerteToken, setSaisiePerteToken] = React.useState(function(){ return "perte_" + Date.now() + "_" + Math.random().toString(36).slice(2); }); // Phase 6 : idempotence
  const [tabProd, setTabProd] = React.useState("production");
  const [qseLotsParProdId, setQseLotsParProdId] = React.useState({});
  const [lotOuvert, setLotOuvert] = React.useState(null);

  useEffect(() => {
    var u1 = db.collection("stocks").onSnapshot(snap => {
      var s = {}; snap.docs.forEach(d => { s[d.id] = d.data(); }); setStocks(s);
    });
    var u2 = db.collection("productions").onSnapshot(snap => {
      setProductions(snap.docs.map(d => Object.assign({id:d.id}, d.data())));
    });
    var u3 = db.collection("pertes").orderBy("timestamp","desc").onSnapshot(snap => {
      setPertes(snap.docs.map(d=>({id:d.id,...d.data()})));
    });
    var u4 = db.collection("commandes").onSnapshot(snap => {
      setCommandes(snap.docs.map(d=>({id:d.id,...d.data()})));
    });
    var u5 = db.collection("qse_lots").orderBy("dateCreation","desc").limit(300).onSnapshot(snap => {
      var m = {};
      snap.docs.forEach(function(d){ var data = d.data(); if (data.productionId) m[data.productionId] = data.numeroLot; });
      setQseLotsParProdId(m);
    });
    return () => { u1(); u2(); u3(); u4(); u5(); };
  }, []);

  var typesParUrgence = CATALOGUE.map(function(prod) {
    var s = stocks[prod.id]||{};
    var sec = s.sec||0; var sechage = s.sechage||0; var total = sec+sechage;
    return { prod:prod, sec:sec, sechage:sechage, total:total };
  }).sort(function(a,b) { return a.total - b.total; });

  var prodAujourdHui = productions.filter(function(p) { return p.date === dateAujourdHui; });

  var enregistrer = async function() {
    if (!saisieType||!saisieQte) { setMsg("Choisissez un type et entrez la quantite"); return; }
    var qte = parseInt(saisieQte);
    if (isNaN(qte)||qte<=0) { setMsg("Quantite invalide"); return; }
    try {
      var dateFr = dateAujourdHui;
      if (saisieDate) { var parts = saisieDate.split("-"); if (parts.length === 3) { dateFr = parts[2] + "/" + parts[1] + "/" + parts[0]; } }
      const refProductionQSE = await db.collection("productions").add({
        type:saisieType, quantite:qte, phase:saisiePhase,
        date:dateFr, responsable:userData.nom||user.email,
        responsableUid:user.uid, statut:"Valide",
        timestamp:firebase.firestore.FieldValue.serverTimestamp()
      });
      qseCreerLotEtControlePourProduction(refProductionQSE.id, {
        type: saisieType, quantite: qte, phase: saisiePhase, date: dateFr
      }, user, userData).catch(function(e){ console.error("Erreur creation lot QSE", e); });
      var s = stocks[saisieType]||{};
      var upd = {};
      if (saisiePhase==="sec") { upd.sec=(s.sec||0)+qte; } else { upd.sechage=(s.sechage||0)+qte; }
      await db.collection("stocks").doc(saisieType).set(upd, { merge:true });
      setMsg("Production enregistree ! Stock mis a jour.");
      setSaisieQte("");
    } catch(e) { setMsg("Erreur: "+e.message); }
  };

  function pFrToInput(frDate){
    if (frDate && typeof frDate === "string" && frDate.indexOf("/") !== -1){
      var pp = frDate.split("/");
      if (pp.length === 3){ return pp[2] + "-" + pp[1].padStart(2,"0") + "-" + pp[0].padStart(2,"0"); }
    }
    var d = new Date(); var m = String(d.getMonth()+1).padStart(2,"0"); var j = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+j;
  }
  function pOuvrirEdit(p){
    setPEdit(p); setPEditType(p.type||CATALOGUE[0].id); setPEditDate(pFrToInput(p.date));
    setPEditQte(String(p.quantite||"")); setPEditPhase(p.phase||"sec"); setPEditMsg("");
    setPEditToken(p.id + "_" + Date.now() + "_" + Math.random().toString(36).slice(2)); // Phase 6
  }
  async function pSauvegarderEdit(){
    if (!pEdit) return;
    if (!pEditType || !pEditQte) { setPEditMsg("Choisissez un produit et une quantite"); return; }
    var qte = parseInt(pEditQte);
    if (isNaN(qte) || qte <= 0) { setPEditMsg("Quantite invalide"); return; }
    var dateFr = pEdit.date;
    if (pEditDate) { var parts = pEditDate.split("-"); if (parts.length === 3) { dateFr = parts[2] + "/" + parts[1] + "/" + parts[0]; } }
    setPEditMsg("Enregistrement...");
    try {
      // Phase 6 : idem Direction — fonction metier centrale, jamais de decrementation directe.
      await corrigerProductionLot(pEdit, pEditType, qte, pEditPhase, dateFr, pEditToken, user, userData);
      setPEditMsg("✅ Production modifiee.");
      setTimeout(function(){ setPEdit(null); setPEditMsg(""); }, 900);
    } catch (e) { setPEditMsg("❌ Erreur: " + e.message); }
  }
  async function pSupprimer(p){
    var okc = window.confirm("Supprimer definitivement cette production (" + getProduit(p.type).nom + ", " + (p.quantite||0) + " u, " + (p.date||"") + ") ?");
    if (!okc) return;
    var mdp = window.prompt("Pour confirmer, saisissez votre mot de passe :");
    if (!mdp) { return; }
    try {
      var cred = firebase.auth.EmailAuthProvider.credential(user.email, mdp);
      await auth.currentUser.reauthenticateWithCredential(cred);
    } catch (e) { window.alert("Mot de passe incorrect. Suppression annulee."); return; }
    try {
      // Phase 6 : idem Direction — bloque si le lot a deja ete consomme, trace ANNULATION_PRODUCTION.
      await annulerProductionLot(p, user, userData);
      if (pEdit && pEdit.id === p.id) { setPEdit(null); }
    } catch (e) { window.alert("Erreur: " + e.message); }
  }

  var enregistrerPerte = async function() {
    if (!saisiePerteType||!saisiePerteQte) { setMsgPerte("Choisissez un type et une quantite"); return; }
    try {
      var qte = parseInt(saisiePerteQte);
      if (!(qte > 0)) { setMsgPerte("Quantité invalide"); return; }
      var token = saisiePerteToken;
      // Phase 6 : cette perte n'est pas rattachable a un lot precis (declaree au niveau du type,
      // depuis cet ecran — pour une perte sur un lot connu, utiliser "Déclarer une perte" depuis la
      // Fiche du lot, qui passe par declarerPerteLot). Elle doit neanmoins passer par le grand livre
      // (numeroLot: null, comme un ajustement d'inventaire) pour rester coherente avec
      // reconcilierStockType/diagnostiquerCoherenceStock — jamais de decrementation directe du
      // compteur agrege en dehors du grand livre.
      var mvt = { type: "PERTE", numeroLot: null, typeBTC: saisiePerteType, quantite: -qte, sourceType: "perte_type", sourceId: token, utilisateur: userData.nom||user.email, commentaire: saisiePerteRaison || "" };
      var stockRef = db.collection("stocks").doc(saisiePerteType);
      await db.runTransaction(async function (tx) {
        var stockSnap = await tx.get(stockRef);
        var chk = await verifierMouvementExistant(tx, mvt);
        if (chk.existe) return; // deja applique (double clic/retry)
        var sd = stockSnap.exists ? stockSnap.data() : {};
        ecrireMouvementStock(tx, chk.id, mvt);
        tx.set(stockRef, { sec: Math.max(0, (sd.sec || 0) - qte), sechage: sd.sechage || 0 }, { merge: true });
      });
      await db.collection("pertes").add({
        type: saisiePerteType, quantite: qte, raison: saisiePerteRaison,
        responsable: userData.nom||user.email, responsableUid: user.uid,
        source: "production",
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      try { await db.collection("evenements").add({ numBC: "PERTE", chantier: saisiePerteType, action: "Perte enregistrée", acteur: userData.nom||user.email, role: "resp_production", details: "Type: "+saisiePerteType+" | Qté: "+saisiePerteQte+" BTC | Raison: "+saisiePerteRaison, statut: "Perte enregistrée", timestamp: firebase.firestore.FieldValue.serverTimestamp() }); } catch(e) {}
      setMsgPerte("Perte enregistrée !");
      setSaisiePerteQte(""); setSaisiePerteType(""); setSaisiePerteRaison("production");
      setSaisiePerteToken("perte_" + Date.now() + "_" + Math.random().toString(36).slice(2));
    } catch(e) { setMsgPerte("Erreur: "+e.message); }
  };

  return (

    <div className="btp-app">
      {lotOuvert && <FicheLot numeroLot={lotOuvert} user={user} userData={userData} onClose={()=>setLotOuvert(null)} />}
      <div className="btp-header">
        <div className="btp-header-logo">
          <div className="btp-header-logo-icon">⚙️</div>
          <div>
            <div className="btp-header-title">BTC Manager</div>
            <div className="btp-header-sub">Responsable Production</div>
          </div>
        </div>
        <div className="btp-header-right">
          <div className="btp-user-chip">👤 <strong>{userData.nom||user.email}</strong></div>
          <button className="btn btn-sm btn-danger" onClick={()=>auth.signOut()}>⏻ Déco.</button>
        </div>
      </div>
      <div className="btp-nav">
        {[
          {key:"production",icon:"⚙️",label:"Production"},
          {key:"pertes",icon:"📉",label:"Pertes"},
        ].map(({key,icon,label})=>(
          <button key={key} className={"btp-nav-btn " + (tabProd===key?"active":"")}
            onClick={()=>setTabProd(key)}>
            {icon} {label}
          </button>
        ))}
      </div>
      <div className="btp-content">
        { tabProd === 'production' && (
          <div>
<div style={{padding:20}}>
        {/* Phase 7 (point 14) : entree terrain rapide — le reste de l'ecran (deja construit) reste inchange en dessous. */}
        <div style={{ marginBottom: 18 }}>
          <BoutonScanner user={user} userData={userData} libelle="Scanner un lot" />
        </div>
        {(() => {
          var enSechageActif = CATALOGUE.reduce(function (a, p) { return a + calcSechageActif(productions, p.id); }, 0);
          var sousSeuil = typesParUrgence.filter(function (it) { return it.total < STOCK_ALERTE; }).length;
          if (enSechageActif === 0 && sousSeuil === 0) return null;
          return (
            <div style={{ background: "var(--btp-card)", borderRadius: 10, padding: 12, marginBottom: 18, fontSize: 13 }}>
              <strong style={{ color: "var(--btp-orange)" }}>À faire</strong>
              <ul style={{ margin: "6px 0 0 18px", padding: 0 }}>
                {enSechageActif > 0 && <li>{enSechageActif.toLocaleString()} u en séchage, pas encore mature</li>}
                {sousSeuil > 0 && <li>{sousSeuil} référence{sousSeuil > 1 ? "s" : ""} sous le seuil de stock</li>}
              </ul>
            </div>
          );
        })()}
        <h3 style={{marginBottom:6,color:"#4A235A"}}>Priorites du jour - {dateAujourdHui}</h3>
        <p style={{fontSize:12,color:"var(--btp-text2)",marginBottom:14}}>Cible: {STOCK_CIBLE.toLocaleString()} u | Alerte si total inferieur a {STOCK_ALERTE.toLocaleString()} u</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:10,marginBottom:24}}>
          {typesParUrgence.map(function(item, idx) {
            var couleur = couleurUrgence(item.total);
            var pct = Math.min(100, Math.round(item.total/STOCK_CIBLE*100));
            var manque = Math.max(0, STOCK_CIBLE-item.total);
            return (
              <div key={item.prod.id} style={{background:"var(--btp-card)",borderRadius:12,padding:14,boxShadow:"0 2px 8px rgba(0,0,0,0.08)",borderLeft:"4px solid "+couleur,position:"relative"}}>
                <div style={{position:"absolute",top:10,right:10,background:couleur,color:"white",borderRadius:16,padding:"2px 8px",fontSize:11,fontWeight:700}}>{"#"+(idx+1)}</div>
                <div style={{fontWeight:700,fontSize:13,marginBottom:2,paddingRight:40}}>{item.prod.nom}</div>
                <div style={{fontSize:11,color:"#BDC3C7",marginBottom:6}}>{item.prod.dim}</div>
                <div style={{fontSize:12,color:"var(--btp-text2)"}}>Sec: <strong>{item.sec.toLocaleString()}</strong></div>
                <div style={{fontSize:12,color:"var(--btp-text2)"}}>Sechage: <strong>{item.sechage.toLocaleString()}</strong></div>
                <div style={{margin:"6px 0 3px",background:"#EEE",borderRadius:4,height:6}}>
                  <div style={{height:6,borderRadius:4,background:couleur,width:pct+"%"}}></div>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:3}}>
                  <span style={{fontSize:12,fontWeight:700,color:couleur}}>{item.total.toLocaleString()} / {STOCK_CIBLE.toLocaleString()}</span>
                  <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:10,background:couleur,color:"white"}}>{libelleUrgence(item.total)}</span>
                </div>
                {item.total<STOCK_CIBLE&&<div style={{fontSize:11,color:"var(--btp-text2)",marginTop:3}}>A produire: <strong style={{color:couleur}}>{manque.toLocaleString()}</strong></div>}
{(function(){var sa=calcSechageActif(productions,item.prod.id);if(sa>0)return<div style={{fontSize:10,color:"#B7770D",marginTop:2}}>⏳ {sa.toLocaleString()} u en sechage actif</div>;return null;})()}
              </div>

/* ===================== MODULE QSE (ISO 9001 / ISO 14001) ===================== */

function qseFormatNombre(n) {
  const arrondi = Math.round(n * 100) / 100;
  return String(arrondi).replace(".", ",");
}

function qseMoisDeDateFr(dateFr) {
  if (!dateFr || typeof dateFr !== "string") return null;
  const parts = dateFr.split("/");
  if (parts.length !== 3) return null;
  return parts[2] + "-" + parts[1].padStart(2, "0");
}

function qseDebutMois(mois) {
  const p = mois.split("-").map(Number);
  return new Date(p[0], p[1] - 1, 1, 0, 0, 0, 0);
}

function qseDebutMoisSuivant(mois) {
  const p = mois.split("-").map(Number);
  return new Date(p[0], p[1], 1, 0, 0, 0, 0);
}

async function qseProductionDuMois(mois) {
  const debut = qseDebutMois(mois);
  const fin = qseDebutMoisSuivant(mois);
  let total = 0;
  const idsComptes = {};
  const snap = await db.collection("productions")
    .where("timestamp", ">=", debut)
    .where("timestamp", "<", fin)
    .get();
  snap.forEach((doc) => {
    const p = doc.data();
    total += Number(p.quantite) || 0;
    idsComptes[doc.id] = true;
  });
  const fallbackSnap = await db.collection("productions").limit(500).get();
  fallbackSnap.forEach((doc) => {
    if (idsComptes[doc.id]) return;
    const p = doc.data();
    if (p.timestamp) return;
    if (qseMoisDeDateFr(p.date) === mois) {
      total += Number(p.quantite) || 0;
      idsComptes[doc.id] = true;
    }
  });
  return total;
}

async function qseValeursEnvMois(mois) {
  const snap = await db.collection("qse_env").doc(mois).get();
  if (!snap.exists) return {};
  const d = snap.data();
  return {
    terresValorisees: d.terresValorisees,
    electricite: d.electricite,
    eau: d.eau,
    ciment: d.ciment
  };
}

function QseIndicateursEnvironnement(props) {
  const [mois, setMois] = React.useState(() => {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  });
  const [valeurs, setValeurs] = React.useState({});
  const [productionMois, setProductionMois] = React.useState(null);
  const [chargement, setChargement] = React.useState(true);
  const [saisie, setSaisie] = React.useState({ terresValorisees: "", electricite: "", eau: "", ciment: "" });
  const [msg, setMsg] = React.useState("");

  const charger = async (m) => {
    setChargement(true);
    const v = await qseValeursEnvMois(m);
    const p = await qseProductionDuMois(m);
    setValeurs(v);
    setProductionMois(p);
    setSaisie({
      terresValorisees: v.terresValorisees !== undefined ? String(v.terresValorisees) : "",
      electricite: v.electricite !== undefined ? String(v.electricite) : "",
      eau: v.eau !== undefined ? String(v.eau) : "",
      ciment: v.ciment !== undefined ? String(v.ciment) : ""
    });
    setChargement(false);
  };

  React.useEffect(() => { charger(mois); }, [mois]);

  const enregistrer = async () => {
    await db.collection("qse_env").doc(mois).set({
      terresValorisees: Number(saisie.terresValorisees) || 0,
      electricite: Number(saisie.electricite) || 0,
      eau: Number(saisie.eau) || 0,
      ciment: Number(saisie.ciment) || 0,
      dateModification: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    setMsg("Valeurs environnementales enregistrées.");
    charger(mois);
  };

  const lignes = [
    { cle: "terresValorisees", label: "Terres valorisées", unite: "m³", modeRatio: false },
    { cle: "electricite", label: "Électricité", unite: "kWh", modeRatio: true },
    { cle: "eau", label: "Eau", unite: "m³", modeRatio: true },
    { cle: "ciment", label: "Ciment", unite: "kg", modeRatio: true }
  ];

  const texteIndicateur = (l) => {
    const v = valeurs[l.cle];
    if (v === undefined) return "Non renseigné";
    if (!l.modeRatio) {
      return qseFormatNombre(v) + " " + l.unite + " valorisés dans le mois";
    }
    if (!productionMois) return "Production du mois inconnue";
    const ratio = (v / productionMois) * 1000;
    return qseFormatNombre(ratio) + " " + l.unite + " / 1 000 BTC";
  };

  return (
    <div className="qse-environnement">
      <h3>Indicateurs environnementaux</h3>
      {msg && <div className="qse-msg">{msg}</div>}
      {chargement && <div>Chargement...</div>}
      {!chargement && (
        <React.Fragment>
          <ul>
            {lignes.map((l) => (
              <li key={l.cle}>{l.label} : {texteIndicateur(l)}</li>
            ))}
          </ul>
          <div className="qse-form-env">
            <label>Terres valorisées (m³) <input type="number" value={saisie.terresValorisees} onChange={(e) => setSaisie(Object.assign({}, saisie, { terresValorisees: e.target.value }))} /></label>
            <label>Électricité (kWh) <input type="number" value={saisie.electricite} onChange={(e) => setSaisie(Object.assign({}, saisie, { electricite: e.target.value }))} /></label>
            <label>Eau (m³) <input type="number" value={saisie.eau} onChange={(e) => setSaisie(Object.assign({}, saisie, { eau: e.target.value }))} /></label>
            <label>Ciment (kg) <input type="number" value={saisie.ciment} onChange={(e) => setSaisie(Object.assign({}, saisie, { ciment: e.target.value }))} /></label>
            <button className="btn" onClick={enregistrer}>Enregistrer les valeurs du mois</button>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}


async function qseAjouterAspect(data, user, userData) {
  const now = firebase.firestore.FieldValue.serverTimestamp();
  const auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  await db.collection("qse_aspects").add({
    activite: data.activite || "",
    aspect: data.aspect || "",
    impact: data.impact || "",
    importance: data.importance || "Modérée",
    maitrise: data.maitrise || "",
    actif: true,
    dateCreation: now,
    creePar: auteur,
    dateModification: now,
    modifiePar: auteur
  });
}

async function qseModifierAspect(id, champs, user, userData) {

    dateModification: firebase.firestore.FieldValue.serverTimestamp(),
    modifiePar: auteur
  }));
}

  const [activite, setActivite] = React.useState("");
  const [aspect, setAspect] = React.useState("");
  const [impactSaisi, setImpactSaisi] = React.useState("");
  const [importance, setImportance] = React.useState("Modérée");
  const [maitrise, setMaitrise] = React.useState("");
  const [msg, setMsg] = React.useState("");

  React.useEffect(() => {
    const unsub = db.collection("qse_aspects")
      .where("actif", "==", true)
      .onSnapshot((snap) => {
        const liste = [];
        snap.forEach((doc) => liste.push(Object.assign({ id: doc.id }, doc.data())));

function qseNiveauCriticite(score) {
  if (score >= 13) return { label: "Critique", classe: "qse-crit-critique" };
  if (score >= 9) return { label: "Important", classe: "qse-crit-important" };
  if (score >= 5) return { label: "Modéré", classe: "qse-crit-modere" };
  return { label: "Faible", classe: "qse-crit-faible" };
}

async function qseIndicateursQualiteMois(mois) {
  const debut = qseDebutMois(mois);
  const fin = qseDebutMoisSuivant(mois);
  const lotsSnap = await db.collection("qse_lots")
    .where("dateCreation", ">=", debut)
    .where("dateCreation", "<", fin)
    .get();
  const controlesSnap = await db.collection("qse_controles")
    .where("dateCreation", ">=", debut)
    .where("dateCreation", "<", fin)
    .get();
  let conformes = 0, nonConformes = 0, mesures = 0;
  controlesSnap.forEach((doc) => {
    const c = doc.data();
    if (c.resultat === "Conforme") { conformes++; mesures++; }
    else if (c.resultat === "Non conforme") { nonConformes++; mesures++; }
  });
  const tauxConformite = mesures > 0 ? (conformes / mesures) * 100 : null;
  return {
    lotsProduits: lotsSnap.size,
    lotsControles: mesures,
    tauxConformite: tauxConformite,
    lotsNonConformes: nonConformes
  };
}

async function qseProductionsSansLot() {
  const snap = await db.collection("productions").orderBy("timestamp", "desc").limit(50).get();
  const manquants = [];
  for (const doc of snap.docs) {
    const idx = await db.collection("qse_lots_index").doc(doc.id).get();
    if (!idx.exists) {
      manquants.push(Object.assign({ id: doc.id }, doc.data()));
