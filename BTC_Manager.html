  if (cle === "7j") return { cle: cle, debut: debutJour - 6 * MS_PAR_JOUR, fin: finJour, label: "7 derniers jours", jours: 7 };
  if (cle === "30j") return { cle: cle, debut: debutJour - 29 * MS_PAR_JOUR, fin: finJour, label: "30 derniers jours", jours: 30 };
  if (cle === "mois") {
    var debutMois = new Date(d.getFullYear(), d.getMonth(), 1, 0, 0, 0, 0).getTime();
    var joursDansMois = Math.round((finJour - debutMois) / MS_PAR_JOUR);
    return { cle: cle, debut: debutMois, fin: finJour, label: "Mois en cours", jours: joursDansMois };
  }
  if (cle === "custom" && custom && custom.debut && custom.fin) {
    var db1 = new Date(custom.debut), df1 = new Date(custom.fin);
    var debutC = new Date(db1.getFullYear(), db1.getMonth(), db1.getDate(), 0, 0, 0, 0).getTime();
    var finC = new Date(df1.getFullYear(), df1.getMonth(), df1.getDate(), 23, 59, 59, 999).getTime();
    var joursC = Math.max(1, Math.round((finC - debutC) / MS_PAR_JOUR));
    return { cle: "custom", debut: debutC, fin: finC, label: "Période personnalisée", jours: joursC };
  }
  return calculerPeriode("30j", referenceMs);
}
// Periode precedente de MEME DUREE, pour les comparaisons (point 6/27) — jamais une definition
// concurrente ("mois precedent" a une duree differente du mois courant, volontairement evite ici).
function periodePrecedente(periode) {
  var duree = periode.fin - periode.debut + 1;
  return { cle: periode.cle, debut: periode.debut - duree, fin: periode.debut - 1, label: "Période précédente", jours: periode.jours };
}
function dansPeriode(tsMs, periode) { return !!tsMs && tsMs >= periode.debut && tsMs <= periode.fin; }

// --- C. Comparaison generique de deux periodes (point 6/27) : UNE seule fonction, reutilisee pour
// production/pertes/NC/etc. Ne decide jamais si une hausse est "bonne" ou "mauvaise" (point 27 :
// une baisse de pertes est positive) — se contente de renvoyer le chiffre, l'appelant colore.
function calculerComparaisonPeriodes(valeurActuelle, valeurPrecedente) {
  if (!valeurPrecedente) {
    return { actuel: valeurActuelle, precedent: valeurPrecedente || 0, variationPct: (valeurActuelle === 0) ? 0 : null, calculable: valeurActuelle === 0 };
  }
  var variationPct = ((valeurActuelle - valeurPrecedente) / valeurPrecedente) * 100;
  return { actuel: valeurActuelle, precedent: valeurPrecedente, variationPct: variationPct, calculable: true };
}

// --- D. Production (points 4/5/6) ---------------------------------------------------------------
function calculerProductionPeriode(productions, periode) {
  var enPeriode = productions.filter(function (p) { return dansPeriode(qseTsMs(p.timestamp), periode); });
  var total = enPeriode.reduce(function (a, p) { return a + (p.quantite || 0); }, 0);
  var parType = {};
  enPeriode.forEach(function (p) { parType[p.type] = (parType[p.type] || 0) + (p.quantite || 0); });
  var parJour = {};
  enPeriode.forEach(function (p) {
    var ms = qseTsMs(p.timestamp); var d = new Date(ms);
    var cle = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    parJour[cle] = (parJour[cle] || 0) + (p.quantite || 0);
  });
  var joursObserves = Object.keys(parJour).length;
  var moyenneQuotidienne = joursObserves > 0 ? total / joursObserves : 0;
  var meilleureJournee = null;
  Object.keys(parJour).forEach(function (cle) {
    if (!meilleureJournee || parJour[cle] > meilleureJournee.quantite) meilleureJournee = { date: cle, quantite: parJour[cle] };
  });
  // "Jours sans production" n'a de sens que pour une periode entierement passee (jamais projetee
  // dans le futur) : periode.fin <= maintenant est garanti par construction de calculerPeriode.
  var joursSansProduction = Math.max(0, periode.jours - joursObserves);
  return { total: total, parType: parType, joursObserves: joursObserves, moyenneQuotidienne: moyenneQuotidienne, meilleureJournee: meilleureJournee, joursSansProduction: joursSansProduction, nbEnregistrements: enPeriode.length };
}
// Point 5 : cadence reelle. Les seules dates disponibles sont des JOURS (pas d'heure de debut/fin
// de production) -> jamais d'unites/heure inventees. A defaut, unites/jour, compare a une cible
// EXPLICITE (jamais une constante cachee — reste null tant qu'aucun parametre n'a ete saisi).
function calculerCadenceProduction(productionPeriode, cadenceCibleParJour) {
  var cadenceActuelle = productionPeriode.moyenneQuotidienne;
  var calculable = productionPeriode.joursObserves > 0;
  var ecart = (cadenceCibleParJour != null) ? cadenceActuelle - cadenceCibleParJour : null;
  var ecartPct = (cadenceCibleParJour) ? (ecart / cadenceCibleParJour) * 100 : null;
  return { unite: "unités/jour", cadenceActuelle: cadenceActuelle, cadenceCible: cadenceCibleParJour != null ? cadenceCibleParJour : null, ecart: ecart, ecartPct: ecartPct, calculable: calculable };
}

// --- E. Pertes physiques (point 7) — stock_mouvements type=PERTE, jamais la collection "pertes"
// (incomplete, voir audit). Distinct du cout NC (section F) : jamais melange.
function calculerTauxPertes(mouvements, productionTotalePeriode, periode) {
  var pertes = mouvements.filter(function (m) { return m.type === "PERTE" && dansPeriode(qseTsMs(m.dateCreation), periode); });
  var quantitePerdue = pertes.reduce(function (a, m) { return a + Math.abs(m.quantite || 0); }, 0);
  var parType = {}, parLot = {}, parMotif = {};
  pertes.forEach(function (m) {
    var q = Math.abs(m.quantite || 0);
    parType[m.typeBTC] = (parType[m.typeBTC] || 0) + q;
    if (m.numeroLot) parLot[m.numeroLot] = (parLot[m.numeroLot] || 0) + q;
    var motif = m.commentaire || "(motif non renseigné)";
    parMotif[motif] = (parMotif[motif] || 0) + q;
  });
  var valeurEstimee = 0;
  Object.keys(parType).forEach(function (t) { valeurEstimee += parType[t] * getProduit(t).prix; });
  var tauxPertes = productionTotalePeriode > 0 ? (quantitePerdue / productionTotalePeriode) * 100 : null;
  return { quantitePerdue: quantitePerdue, valeurEstimee: valeurEstimee, tauxPertes: tauxPertes, parType: parType, parLot: parLot, parMotif: parMotif, calculable: productionTotalePeriode > 0, nbMouvements: pertes.length };
}

// --- F. Qualite : cout NC, taux de NC, recurrence, performance controle, delai controle ----------
// Point 8 : reutilise EXACTEMENT la notion de "quantite concernee" introduite en Phase 2. Precise
// toujours qu'il s'agit d'une valeur PRODUIT estimee, pas du cout comptable complet (main d'oeuvre,
// retard chantier, etc. non captures par l'application).
function calculerCoutNC(ncs, lotsParNumero, periode) {
  var enPeriode = ncs.filter(function (n) { return dansPeriode(qseTsMs(n.dateCreation), periode); });
  var ouvertes = enPeriode.filter(function (n) { return n.statut !== "Cloturee"; }).length;
  var cloturees = enPeriode.filter(function (n) { return n.statut === "Cloturee"; }).length;
  var quantiteConcernee = 0, valeurTotale = 0, nbChiffrables = 0;
  enPeriode.forEach(function (n) {
    if (n.quantiteConcernee == null) return;
    quantiteConcernee += n.quantiteConcernee;
    var lot = n.numeroLot ? lotsParNumero[n.numeroLot] : null;
    var prix = lot ? getProduit(lot.type).prix : 0;
    valeurTotale += n.quantiteConcernee * prix;
    nbChiffrables++;
  });
  var coutMoyenParNC = nbChiffrables > 0 ? valeurTotale / nbChiffrables : null;
  return { nombreNC: enPeriode.length, ouvertes: ouvertes, cloturees: cloturees, quantiteConcernee: quantiteConcernee, valeurTotale: valeurTotale, coutMoyenParNC: coutMoyenParNC, nbChiffrables: nbChiffrables, nbSansQuantite: enPeriode.length - nbChiffrables };
}
// Point 9 : DEUX indicateurs distincts, jamais melanges (noms explicites imposes par le cahier des charges).
function calculerTauxNC(controles, ncs, lotsParNumero, productionTotalePeriode, periode) {
  var mesuresPeriode = controles.filter(function (c) { return c.resultat && c.resultat !== "Non mesuré" && dansPeriode(qseTsMs(c.dateControle || c.dateCreation), periode); });
  var lotsNC = mesuresPeriode.filter(function (c) { return c.resultat === "Non conforme"; }).length;
  var tauxLotsNonConformes = mesuresPeriode.length > 0 ? (lotsNC / mesuresPeriode.length) * 100 : null;

  var ncsPeriode = ncs.filter(function (n) { return dansPeriode(qseTsMs(n.dateCreation), periode); });
  var quantiteConcernee = ncsPeriode.reduce(function (a, n) { return a + (n.quantiteConcernee || 0); }, 0);
  var partProductionConcernee = productionTotalePeriode > 0 ? (quantiteConcernee / productionTotalePeriode) * 100 : null;

  return {
    tauxLotsNonConformes: tauxLotsNonConformes, lotsControles: mesuresPeriode.length, lotsNC: lotsNC,
    partProductionConcernee: partProductionConcernee, quantiteConcernee: quantiteConcernee, productionTotale: productionTotalePeriode
  };
}
// Point 10 : NC recurrentes en indicateur HISTORIQUE (vs Phase 4 qui ne fait qu'alerter). Les motifs
// (causeProbable/description) sont du texte libre : jamais regroupes automatiquement (ce serait de
// l'IA/du texte-mining deguise) — signale honnetement motifsIndisponibles plutot que d'inventer un
// classement. "Type le plus touche" reste un simple comptage, jamais qualifie de "cause racine".
function calculerNCRecurrentes(ncs, lotsParNumero, periode, periodePrec) {
  function compte(p) {
    var enP = ncs.filter(function (n) { return dansPeriode(qseTsMs(n.dateCreation), p); });
    var parType = {};
    enP.forEach(function (n) {
      var lot = n.numeroLot ? lotsParNumero[n.numeroLot] : null;
      var t = lot ? lot.type : "(lot inconnu)";
      parType[t] = (parType[t] || 0) + 1;
    });
    return { total: enP.length, parType: parType };
  }
  var actuel = compte(periode), precedent = compte(periodePrec);
  var typeLePlusTouche = null, maxN = 0;
  Object.keys(actuel.parType).forEach(function (t) { if (actuel.parType[t] > maxN) { maxN = actuel.parType[t]; typeLePlusTouche = t; } });
  return {
    total: actuel.total, parType: actuel.parType, typeLePlusTouche: typeLePlusTouche, nbTypeLePlusTouche: maxN,
    motifsRecurrents: null, motifsIndisponibles: true,
    evolution: calculerComparaisonPeriodes(actuel.total, precedent.total)
  };
}
// Point 11 : synthese qualite globale (pas bornee a une periode : "etat actuel" du parc de lots).
function calculerPerformanceQualite(controles, lotsParNumero, maintenant) {
  maintenant = maintenant || Date.now();
  var mesures = controles.filter(function (c) { return c.resultat && c.resultat !== "Non mesuré"; });
  var conformes = mesures.filter(function (c) { return c.resultat === "Conforme"; }).length;
  var nonConformes = mesures.filter(function (c) { return c.resultat === "Non conforme"; }).length;
  var enAttente = controles.filter(function (c) { return !c.resultat || c.resultat === "Non mesuré"; });
  var enRetard = enAttente.filter(function (c) {
    var lot = lotsParNumero[c.numeroLot];
    var dateProd = lot ? dateProductionMs(lot) : 0;
    return dateProd && maintenant > dateProd + DUREE_SECHAGE * MS_PAR_JOUR;
  }).length;
  var tauxConformite = mesures.length > 0 ? (conformes / mesures.length) * 100 : null;
  return { lotsControles: mesures.length, lotsConformes: conformes, lotsNonConformes: nonConformes, lotsEnAttente: enAttente.length, controlesEnRetard: enRetard, tauxConformite: tauxConformite };
}
// Point 12 : delai = date controle - date maturite theorique (dateProduction + DUREE_SECHAGE). Un
// delai NEGATIF = controle effectue AVANT maturite theorique -> anomalie potentielle signalee
// explicitement (controlesAvantMaturite), jamais silencieusement moyennee avec les autres.
function calculerDelaiControle(controles, lotsParNumero) {
  var delais = [], avantMaturite = 0, apresMaturite = 0;
  controles.forEach(function (c) {
    if (!c.resultat || c.resultat === "Non mesuré" || !c.dateControle) return;
    var lot = lotsParNumero[c.numeroLot];
    var dateProd = lot ? dateProductionMs(lot) : 0;
    var dateCtrl = qseTsMs(c.dateControle);
    if (!dateProd || !dateCtrl) return;
    var dateMaturite = dateProd + DUREE_SECHAGE * MS_PAR_JOUR;
    var delaiJours = (dateCtrl - dateMaturite) / MS_PAR_JOUR;
    delais.push(delaiJours);
    if (delaiJours < 0) avantMaturite++; else apresMaturite++;
  });
  delais.sort(function (a, b) { return a - b; });
  var moyenneJours = delais.length ? delais.reduce(function (a, d) { return a + d; }, 0) / delais.length : null;
  var medianeJours = delais.length ? (delais.length % 2 === 1 ? delais[(delais.length - 1) / 2] : (delais[delais.length / 2 - 1] + delais[delais.length / 2]) / 2) : null;
  var retards = delais.filter(function (d) { return d > 0; });
  var retardMoyenJours = retards.length ? retards.reduce(function (a, d) { return a + d; }, 0) / retards.length : null;
  return { nombreLots: delais.length, moyenneJours: moyenneJours, medianeJours: medianeJours, retardMoyenJours: retardMoyenJours, controlesATemps: apresMaturite, controlesAvantMaturite: avantMaturite };
}
// Lots deja matures (date de maturite theorique passee) mais sans controle renseigne — reutilise
// TEL QUEL par calculerPerformanceQualite.controlesEnRetard (comptage) et calculerStockSechage
// (quantite), pour ne jamais avoir deux definitions differentes du meme retard (point 20).
function calculerLotsMaturesNonControles(lots, controles, maintenant) {
  maintenant = maintenant || Date.now();
  var controlesParLot = {};
  controles.forEach(function (c) { if (!controlesParLot[c.numeroLot]) controlesParLot[c.numeroLot] = c; });
  return lots.filter(function (l) {
    var dateProd = dateProductionMs(l);
    if (!dateProd || maintenant < dateProd + DUREE_SECHAGE * MS_PAR_JOUR) return false;
    var ctrl = controlesParLot[l.numeroLot];
    return !ctrl || !ctrl.resultat || ctrl.resultat === "Non mesuré";
  });
}

// --- G. Delai production -> livraison (point 13) : UNIQUEMENT les lots traces (disponibleCache
// non null, Phase 5+) — le stock historique non tracable est explicitement exclu, jamais estime.
function calculerDelaiLotLivraison(lots, allocations) {
  var allocParLot = {};
  allocations.forEach(function (a) {
    if (!a.numeroLot || !a.dateLivraison) return;
    (allocParLot[a.numeroLot] = allocParLot[a.numeroLot] || []).push(a);
  });
  var delaisParType = {};
  lots.forEach(function (l) {
    if (l.disponibleCache == null) return; // non trace -> exclu (point 13)
    var dateProd = dateProductionMs(l);
    var allocs = allocParLot[l.numeroLot];
    if (!dateProd || !allocs || allocs.length === 0) return;
    var datesLivraison = allocs.map(function (a) { return qseTsMs(a.dateLivraison); }).filter(Boolean);
    if (datesLivraison.length === 0) return;
    var premiere = Math.min.apply(null, datesLivraison);
    var delaiPremiere = (premiere - dateProd) / MS_PAR_JOUR;
    if (delaiPremiere < 0) return; // incoherent (horloge/donnee) -> exclu plutot que fausse
    (delaisParType[l.type] = delaisParType[l.type] || []).push(delaiPremiere);
  });
  var resultat = {};
  Object.keys(delaisParType).forEach(function (t) {
    var arr = delaisParType[t];
    resultat[t] = { delaiMoyenJours: arr.reduce(function (a, d) { return a + d; }, 0) / arr.length, nombreLots: arr.length };
  });
  return resultat;
}

// --- H. Stock : sechage, couverture, rupture, besoin de production, plan suggere -----------------
// Point 20 : "en sechage" recalcule DIRECTEMENT depuis productions (pas depuis stocks.sechage, qui
// est un compteur agrege ne "promouvant" jamais automatiquement une entree devenue mature — cet
// ecart entre le compteur agrege et la realite est documente dans la qualite des donnees).
function calculerStockSechage(productions, lots, controles, maintenant, fenetreProcheJours) {
  maintenant = maintenant || Date.now();
  fenetreProcheJours = fenetreProcheJours != null ? fenetreProcheJours : 3;
  var actifNonMature = 0, matureProche = 0, matureSous7j = 0, totalDeclare = 0;
  var parType = {};
  productions.forEach(function (p) {
    if (p.phase !== "sechage") return;
    var d = dateProductionMs(p);
    if (!d) return;
    var qte = p.quantite || 0;
    totalDeclare += qte;
    var joursAvantMaturite = DUREE_SECHAGE - (maintenant - d) / MS_PAR_JOUR;
    if (joursAvantMaturite > 0) {
      actifNonMature += qte;
      if (joursAvantMaturite <= fenetreProcheJours) matureProche += qte;
      if (joursAvantMaturite <= 7) matureSous7j += qte;
      parType[p.type] = (parType[p.type] || 0) + qte;
    }
  });
  var lotsMaturesNonControles = calculerLotsMaturesNonControles(lots, controles, maintenant);
  var quantiteMatureNonControlee = lotsMaturesNonControles.reduce(function (a, l) { return a + (l.disponibleCache != null ? l.disponibleCache : (l.quantite || 0)); }, 0);
  return {
    actifNonMature: actifNonMature, matureSousNJours: matureProche, fenetreProcheJours: fenetreProcheJours,
    matureSous7Jours: matureSous7j, quantiteMatureNonControlee: quantiteMatureNonControlee,
    nombreLotsMaturesNonControles: lotsMaturesNonControles.length, parType: parType
  };
}
// Point 21 : ne plus jamais presenter un "stock" unique — decomposer explicitement.
function calculerStockUtilisable(typeBTC, stocks, lotsDuType, controlesParLot, ncsParLot, reserveType) {
  var s = stocks[typeBTC] || {};
  var physique = (s.sec || 0) + (s.sechage || 0);
  var historiqueNonTracable = s.historiqueReserve || 0;
  var bloqueQualite = 0;
  lotsDuType.forEach(function (l) {
    var statut = qseStatutLot(l, controlesParLot[l.numeroLot] || [], ncsParLot[l.numeroLot] || []);
    if (l.annule || statut.code === "bloque") bloqueQualite += Math.max(0, l.disponibleCache != null ? l.disponibleCache : 0);
  });
  var disponible = Math.max(0, (s.sec || 0) - reserveType);
  return { physique: physique, reserve: reserveType, disponible: disponible, bloqueQualite: bloqueQualite, enSechage: s.sechage || 0, historiqueNonTracable: historiqueNonTracable };
}
// Point 14/15 : la "rotation sur stock moyen" (point 14) N'EST PAS calculee — elle demanderait un
// historique de niveau de stock quotidien que l'application ne conserve pas (stocks est un compteur
// ponctuel, jamais historise). Indicateur retenu a la place, plus lisible et honnete : la couverture.
function calculerCouvertureStock(typeBTC, disponible, mouvements, periodeRecente) {
  var sorties = mouvements.filter(function (m) {
    return m.typeBTC === typeBTC && (m.type === "SORTIE_LIVRAISON" || m.type === "PERTE") && dansPeriode(qseTsMs(m.dateCreation), periodeRecente);
  });
  var totalSorties = sorties.reduce(function (a, m) { return a + Math.abs(m.quantite || 0); }, 0);
  var consommationMoyenneJour = periodeRecente.jours > 0 ? totalSorties / periodeRecente.jours : 0;
  var couvertureJours = consommationMoyenneJour > 0 ? disponible / consommationMoyenneJour : null;
  return { disponible: disponible, consommationMoyenneJour: consommationMoyenneJour, couvertureJours: couvertureJours, calculable: consommationMoyenneJour > 0, sortiesTotalPeriode: totalSorties, fenetreJours: periodeRecente.jours };
}
// Point 16 : previsions DETERMINISTES, jamais opaques. "certain" = les commandes validees depassent
// deja le disponible (aucune projection necessaire) ; "projection" = extrapolation lineaire sur la
// consommation recente (couverture). Jamais les deux melanges dans le meme message.
function calculerPrevisionRupture(typeBTC, disponibleAReserver, deficitEngagements, couverture) {
  if (deficitEngagements > 0) {
    return { etat: "certain", message: "Stock déjà insuffisant pour les commandes validées (déficit " + Math.round(deficitEngagements).toLocaleString() + " u).", joursAvantRupture: 0 };
  }
  if (!couverture.calculable || couverture.couvertureJours == null) {
    return { etat: "indetermine", message: "Consommation récente insuffisante pour projeter une échéance de rupture.", joursAvantRupture: null };
  }
  return { etat: "projection", message: "Risque de rupture dans ~" + Math.round(couverture.couvertureJours) + " jour(s) au rythme actuel de consommation (" + Math.round(couverture.consommationMoyenneJour).toLocaleString() + " u/j).", joursAvantRupture: couverture.couvertureJours };
}
// Point 17 — L'INDICATEUR CLE : besoin = (engagements + stock cible) - (disponible + sechage
// bientot mature). Exemple du cahier des charges verifie : 4000 dispo + 3000 sechage, 8000
// engagements, 5000 cible -> (8000+5000)-(4000+3000) = 6000. "engagements" = somme, sur les
// commandes VALIDEES de ce type, de (quantite - quantiteLivree) : inclut la part deja reservee (le
// disponible utilise ici est le stock PHYSIQUE brut, pas encore net de reservation — pas de double
// comptage).
function calculerBesoinProduction(typeBTC, stocks, sechageBientotMatureParType, commandes, parametres) {
  var s = stocks[typeBTC] || {};
  var disponible = s.sec || 0;
  var sechageBientotMature = sechageBientotMatureParType[typeBTC] || 0;
  var engagements = commandes.filter(function (c) { return c.type === typeBTC && normTxt(c.status) === normTxt("Validee"); })
    .reduce(function (a, c) { return a + Math.max(0, (c.quantite || 0) - (c.quantiteLivree || 0)); }, 0);
  var stockCible = (parametres.stockCibleParType && parametres.stockCibleParType[typeBTC] != null) ? parametres.stockCibleParType[typeBTC] : parametres.stockCibleDefaut;
  var besoin = Math.max(0, (engagements + stockCible) - (disponible + sechageBientotMature));
  return {
    typeBTC: typeBTC, disponible: disponible, sechageBientotMature: sechageBientotMature, engagements: engagements,
    stockCible: stockCible, besoin: besoin,
    formule: "(engagements " + engagements.toLocaleString() + " + cible " + stockCible.toLocaleString() + ") − (disponible " + disponible.toLocaleString() + " + séchage proche " + sechageBientotMature.toLocaleString() + ") = " + besoin.toLocaleString()
  };
}
// Point 18 : PROPOSITION, jamais un ordre automatique — trie simplement les besoins reels par ordre
// decroissant. Point 19 : date de besoin uniquement si la commande porte une echeance FIABLE (aucun
// champ de date d'echeance n'existe aujourd'hui sur "commandes" -> jamais d'urgence temporelle inventee).
function calculerPlanProductionSuggere(besoinsParType) {
  return besoinsParType.slice().sort(function (a, b) { return b.besoin - a.besoin; })
    .map(function (b, i) { return Object.assign({ rang: i + 1, suffisant: b.besoin === 0 }, b); });
}

// --- I. Qualite des donnees (point 42) : jamais un faux score scientifique — une liste de
// limitations concretes, chacune cliquable vers son detail.
function calculerQualiteDonnees(lots, productions, commandes) {
  var problemes = [];
  var lotsSansPrix = lots.filter(function (l) { return getProduit(l.type).prix === 0; });
  if (lotsSansPrix.length > 0) problemes.push({ code: "lot_sans_prix", n: lotsSansPrix.length, libelle: lotsSansPrix.length + " lot(s) dont le type ne correspond à aucun prix catalogue", refs: lotsSansPrix.map(function (l) { return l.numeroLot; }) });
  var productionsSansDate = productions.filter(function (p) { return !dateProductionMs(p); });
  if (productionsSansDate.length > 0) problemes.push({ code: "production_sans_date", n: productionsSansDate.length, libelle: productionsSansDate.length + " production(s) sans date exploitable" });
  var commandesSansDate = commandes.filter(function (c) { return !qseTsMs(c.timestamp); });
  if (commandesSansDate.length > 0) problemes.push({ code: "commande_sans_date", n: commandesSansDate.length, libelle: commandesSansDate.length + " commande(s) sans date de création exploitable" });
  var lotsNonInitialises = lots.filter(function (l) { return l.disponibleCache == null; });
  if (lotsNonInitialises.length > 0) problemes.push({ code: "lot_non_initialise", n: lotsNonInitialises.length, libelle: lotsNonInitialises.length + " lot(s) sans suivi de stock initialisé (antérieurs à l'activation du grand livre)" });
  return { nombreLimitations: problemes.length, problemes: problemes };
}

// --- J. Prevision simple par moyenne glissante (points 31/32) : fenetre TOUJOURS visible, jamais
// un modele opaque. Confiance signalee explicitement si l'historique disponible est court.
function calculerPrevisionSimple(mouvements, typeBTC, fenetreJours, maintenant) {
  maintenant = maintenant || Date.now();
  var periode = calculerPeriode("custom", maintenant, { debut: maintenant - (fenetreJours - 1) * MS_PAR_JOUR, fin: maintenant });
  var sorties = mouvements.filter(function (m) { return m.typeBTC === typeBTC && (m.type === "SORTIE_LIVRAISON" || m.type === "PERTE") && dansPeriode(qseTsMs(m.dateCreation), periode); });
  var joursAvecDonnees = {};
  sorties.forEach(function (m) { var t = qseTsMs(m.dateCreation); var d = new Date(t); joursAvecDonnees[d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate()] = true; });
  var nbJoursAvecDonnees = Object.keys(joursAvecDonnees).length;
  var totalSorties = sorties.reduce(function (a, m) { return a + Math.abs(m.quantite || 0); }, 0);
  var moyenneJour = totalSorties / fenetreJours;
  var SEUIL_FIABILITE = 0.5; // au moins la moitie des jours de la fenetre doivent porter un mouvement (documente, pas cache)
  var fiable = nbJoursAvecDonnees >= fenetreJours * SEUIL_FIABILITE;
  return {
    moyenneJour: moyenneJour, fenetreJours: fenetreJours, joursAvecDonnees: nbJoursAvecDonnees, fiable: fiable,
    messageConfiance: fiable ? null : ("Prévision peu fiable — seulement " + nbJoursAvecDonnees + " jour(s) de données sur " + fenetreJours + ".")
  };
}

// --- K. Petits assembleurs de tables (evitent de reparcourir les tableaux a chaque sous-fonction).
function indexerParNumeroLot(liste) { var m = {}; liste.forEach(function (x) { m[x.numeroLot] = x; }); return m; }
function grouperParNumeroLot(liste) { var m = {}; liste.forEach(function (x) { (m[x.numeroLot] = m[x.numeroLot] || []).push(x); }); return m; }
// Deficit "engagements vs disponible a reserver" par type — MEME calcul que celui deja utilise dans
// calculerPrioritesOperationnelles (point 36 : une seule logique, jamais une deuxieme version qui
// pourrait diverger). Isole ici pour etre appelable aussi bien depuis les priorites que le cockpit.
function calculerDeficitReservationParType(typeBTC, stocks, commandes) {
  var commandesValidees = commandes.filter(function (c) { return c.type === typeBTC && normTxt(c.status) === normTxt("Validee") && (c.quantite || 0) > (c.quantiteLivree || 0); });
  var reserveType = commandesValidees.reduce(function (a, c) { return a + (c.quantiteReservee || 0); }, 0);
  var disponibleAReserverType = Math.max(0, ((stocks[typeBTC] || {}).sec || 0) - reserveType);
  var totalACouvrirType = commandesValidees.reduce(function (a, c) { return a + Math.max(0, (c.quantite || 0) - (c.quantiteLivree || 0) - (c.quantiteReservee || 0)); }, 0);
  return { disponibleAReserverType: disponibleAReserverType, totalACouvrirType: totalACouvrirType, deficit: Math.max(0, totalACouvrirType - disponibleAReserverType), reserveType: reserveType };
}

// --- L. ORCHESTRATEUR : calculerIndicateursIndustriels(donnees, periode, parametres). Point
// d'entree UNIQUE du cockpit Direction — assemble tous les calculs ci-dessus, une fois par
// changement de periode/donnees (memoization cote composant via React.useMemo, point 37).
// "donnees" attend : { productions, lots, controles, ncs, mouvements, allocations, commandes, stocks }.
function calculerIndicateursIndustriels(donnees, periode, parametres) {
  var maintenant = donnees.maintenant || Date.now();
  var productions = donnees.productions || [], lots = donnees.lots || [], controles = donnees.controles || [];
  var ncs = donnees.ncs || [], mouvements = donnees.mouvements || [], allocations = donnees.allocations || [];
  var commandes = donnees.commandes || [], stocks = donnees.stocks || {};
  parametres = parametres || PARAMETRES_INDUSTRIELS_DEFAUT;

  var lotsParNumero = indexerParNumeroLot(lots);
  var controlesParLot = grouperParNumeroLot(controles);
  var ncsParLot = grouperParNumeroLot(ncs);
  var periodePrec = periodePrecedente(periode);

  var productionPeriode = calculerProductionPeriode(productions, periode);
  var productionPeriodePrec = calculerProductionPeriode(productions, periodePrec);
  var cadence = calculerCadenceProduction(productionPeriode, parametres.cadenceCibleParJour);
  var evolutionProduction = calculerComparaisonPeriodes(productionPeriode.total, productionPeriodePrec.total);

  var pertes = calculerTauxPertes(mouvements, productionPeriode.total, periode);
  var pertesPrec = calculerTauxPertes(mouvements, productionPeriodePrec.total, periodePrec);
  var evolutionPertes = calculerComparaisonPeriodes(pertes.quantitePerdue, pertesPrec.quantitePerdue);

  var coutNC = calculerCoutNC(ncs, lotsParNumero, periode);
  var tauxNC = calculerTauxNC(controles, ncs, lotsParNumero, productionPeriode.total, periode);
  var ncRecurrentes = calculerNCRecurrentes(ncs, lotsParNumero, periode, periodePrec);
  var performanceQualite = calculerPerformanceQualite(controles, lotsParNumero, maintenant);
  var delaiControle = calculerDelaiControle(controles, lotsParNumero);
  var delaiLivraisonParType = calculerDelaiLotLivraison(lots, allocations);

  var stockSechage = calculerStockSechage(productions, lots, controles, maintenant, parametres.fenetreMaturiteProcheJours);
  var periodeRecenteCouverture = calculerPeriode("7j", maintenant);

  var parType = CATALOGUE.map(function (prod) {
    var lotsDuType = lots.filter(function (l) { return l.type === prod.id; });
    var deficit = calculerDeficitReservationParType(prod.id, stocks, commandes);
    var couverture = calculerCouvertureStock(prod.id, deficit.disponibleAReserverType, mouvements, periodeRecenteCouverture);
    var rupture = calculerPrevisionRupture(prod.id, deficit.disponibleAReserverType, deficit.deficit, couverture);
    var besoin = calculerBesoinProduction(prod.id, stocks, stockSechage.parType, commandes, parametres);
    var utilisable = calculerStockUtilisable(prod.id, stocks, lotsDuType, controlesParLot, ncsParLot, deficit.reserveType);
    var previsionConso = calculerPrevisionSimple(mouvements, prod.id, parametres.fenetrePrevisionJours, maintenant);
    return {
      produit: prod, production: productionPeriode.parType[prod.id] || 0, pertes: pertes.parType[prod.id] || 0,
      valeurPertes: (pertes.parType[prod.id] || 0) * prod.prix, tauxNCType: null,
      stockUtilisable: utilisable, couverture: couverture, rupture: rupture, besoin: besoin,
      delaiLivraison: delaiLivraisonParType[prod.id] || null, previsionConso: previsionConso
    };
  });

  var besoinsTriés = calculerPlanProductionSuggere(parType.map(function (x) { return x.besoin; }));
  var qualiteDonnees = calculerQualiteDonnees(lots, productions, commandes);

  return {
    periode: periode, periodePrecedente: periodePrec, parametres: parametres,
    production: productionPeriode, evolutionProduction: evolutionProduction, cadence: cadence,
    pertes: pertes, evolutionPertes: evolutionPertes,
    coutNC: coutNC, tauxNC: tauxNC, ncRecurrentes: ncRecurrentes, performanceQualite: performanceQualite,
    delaiControle: delaiControle, stockSechage: stockSechage,
    parType: parType, planProductionSuggere: besoinsTriés, qualiteDonnees: qualiteDonnees
  };
}

// ============================================================================================
// PHASE 10 — MOTEUR DE PLANIFICATION/ORDONNANCEMENT. "BTC Manager calcule, explique et propose ;
// le responsable de production decide et valide." calculerPlanProduction() est une fonction PURE :
// elle ne lit ni n'ecrit jamais Firestore elle-meme (l'appelant lui fournit tout, et c'est
// l'appelant — uniquement sur clic explicite "Valider le plan" — qui persiste le resultat).
//
// Audit prealable (point 1) — aucune de ces donnees n'existe dans Firestore avant cette phase :
//   - capacite reelle/theorique par jour : ABSENTE -> parametre capaciteJournaliere (nullable).
//   - jours travailles/horaires/equipes/temps de changement : ABSENTS -> parametre joursTravail
//     (liste de jours de semaine ouvres, valeur de depart modifiable, jamais presentee comme mesuree).
//   - capacite de sechage/de stockage : ABSENTES -> jamais modelisees, signalees explicitement
//     comme telles partout ou elles seraient pertinentes (points 20/21).
//   - commandes avec echeance : ABSENTE avant cette phase -> champ optionnel "dateBesoin" ajoute
//     aux formulaires de commande (Chef) ; les commandes anterieures restent simplement sans
//     echeance connue, jamais une urgence inventee a partir de rien.
//   - cadence historique par type BTC : DISPONIBLE (collection productions), utilisee uniquement a
//     titre informatif (point 13/14), jamais pour re-restreindre la capacite globale configuree.
// ============================================================================================

function dateLocaleISO(ms) {
  var d = new Date(ms);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// Decompose le besoin Phase 9 en deux composantes additives (memes chiffres, juste separes) : ce
// qui manque pour honorer des commandes DEJA VALIDEES (dette certaine) vs ce qui ne sert qu'a
// reconstituer le stock cible. Point 6 : une commande ferme doit toujours passer avant la simple
// reconstitution — cette decomposition est ce qui permet de le garantir sans dupliquer la formule
// du besoin (le total besoinCommandes+besoinStockCible reste toujours egal a besoin.besoin).
function decomposerBesoin(besoin) {
  var couvertureEngagements = besoin.disponible + besoin.sechageBientotMature;
  var besoinCommandes = Math.max(0, besoin.engagements - couvertureEngagements);
  var besoinStockCible = Math.max(0, besoin.besoin - besoinCommandes);
  return { besoinCommandes: besoinCommandes, besoinStockCible: besoinStockCible };
}

// Echeance la plus proche parmi les commandes VALIDEES de ce type qui portent une dateBesoin
// renseignee (point 19 : jamais d'echeance inventee pour les commandes qui n'en ont pas).
function echeanceLaPlusProcheParType(commandes, typeBTC, maintenant) {
  var aujourdHuiISO = dateLocaleISO(maintenant);
  var meilleure = null;
  commandes.forEach(function (c) {
    if (c.type !== typeBTC || normTxt(c.status) !== normTxt("Validee") || !c.dateBesoin) return;
    if ((c.quantite || 0) <= (c.quantiteLivree || 0)) return; // deja entierement livree
    var j = joursEntreDatesISO(c.dateBesoin, aujourdHuiISO);
    if (j == null) return;
    if (meilleure === null || j < meilleure.jours) meilleure = { jours: j, commande: c };
  });
  return meilleure;
}

// Cadence historique d'un type BTC (point 13/14) : moyenne des quantites produites sur les jours
// DISTINCTS ou ce type a ete produit, dans la fenetre recente. A TITRE INFORMATIF SEULEMENT — ne
// restreint jamais la capacite journaliere globale (point 13 : "ne construis pas une
// pseudo-precision à partir de 1 ou 2 journées").
function calculerCadenceHistoriqueParType(productions, typeBTC, fenetreJours, maintenant, seuilJoursConfiance) {
  var periode = calculerPeriode("custom", maintenant, { debut: maintenant - (fenetreJours - 1) * MS_PAR_JOUR, fin: maintenant });
  var parJour = {};
  productions.forEach(function (p) {
    if (p.type !== typeBTC) return;
    var t = qseTsMs(p.timestamp);
    if (!dansPeriode(t, periode)) return;
    var cle = dateLocaleISO(t);
    parJour[cle] = (parJour[cle] || 0) + (p.quantite || 0);
  });
  var jours = Object.keys(parJour);
  var fiable = jours.length >= seuilJoursConfiance;
  var moyenne = jours.length > 0 ? jours.reduce(function (a, k) { return a + parJour[k]; }, 0) / jours.length : null;
  return {
    moyenneParJourProduit: moyenne, joursDistincts: jours.length, fiable: fiable,
    origine: fiable ? ("Cadence basée sur " + jours.length + " jours de données") : "Capacité configurée manuellement (historique insuffisant)"
  };
}

// Score de priorite EXPLICITE, en PALIERS (point 5 : "ne crée pas de score opaque"). Jamais un
// score continu qui pourrait, par accumulation, faire passer une grosse reconstitution de stock
// cible devant un petit deficit de commande ferme (point 6) : les paliers l'interdisent
// structurellement plutot que par un savant dosage de poids.
function calculerScorePrioritePlanification(besoinDecompose, rupture, echeance, seuilRuptureJours) {
  if (besoinDecompose.besoinCommandes > 0) {
    return { tier: 1, libelleTier: "Déficit certain sur commande(s) validée(s)", echeanceJours: echeance ? echeance.jours : null, magnitude: besoinDecompose.besoinCommandes };
  }
  if (rupture && rupture.etat === "projection" && rupture.joursAvantRupture != null && rupture.joursAvantRupture < seuilRuptureJours) {
    return { tier: 2, libelleTier: "Risque de rupture à court terme", echeanceJours: Math.round(rupture.joursAvantRupture), magnitude: besoinDecompose.besoinStockCible };
  }
  if (besoinDecompose.besoinStockCible > 0) {
    return { tier: 3, libelleTier: "Reconstitution du stock cible", echeanceJours: null, magnitude: besoinDecompose.besoinStockCible };
  }
  return { tier: 4, libelleTier: "Stock suffisant", echeanceJours: null, magnitude: 0 };
}
function comparerScoresPriorite(a, b) {
  if (a.tier !== b.tier) return a.tier - b.tier;
  if (a.echeanceJours != null && b.echeanceJours != null && a.echeanceJours !== b.echeanceJours) return a.echeanceJours - b.echeanceJours;
  if (a.echeanceJours != null && b.echeanceJours == null) return -1;
  if (a.echeanceJours == null && b.echeanceJours != null) return 1;
  return b.magnitude - a.magnitude;
}

// Liste des jours ouvres (point 15) a partir d'aujourd'hui, pour un horizon donne. Garde-fou anti-
// boucle infinie si joursTravail est vide par erreur de saisie.
function genererJoursTravailles(maintenant, horizonJours, joursTravail) {
  var jours = [];
  var cursor = new Date(maintenant); cursor.setHours(0, 0, 0, 0);
  var garde = 0;
  while (jours.length < horizonJours && garde < horizonJours * 4 + 14) {
    if (!joursTravail || joursTravail.length === 0 || joursTravail.indexOf(cursor.getDay()) !== -1) jours.push(cursor.getTime());
    cursor = new Date(cursor.getTime() + MS_PAR_JOUR);
    garde++;
  }
  return jours;
}

// Repartition gloutonne, capacite-contrainte, JAMAIS au-dela de capaciteJournaliere par jour (point
// 12/45). Respecte le classement de priorite a chaque jour (les types les plus prioritaires sont
// servis en premier, chaque jour, jusqu'a epuisement de leur besoin ou de la capacite du jour).
function allouerCapacitePlanification(lignesTri, joursTravailles, capaciteJournaliere) {
  if (capaciteJournaliere == null || capaciteJournaliere <= 0) {
    return { planLignes: [], calendrierPossible: false };
  }
  var restant = {};
  lignesTri.forEach(function (l) { restant[l.typeBTC] = l.besoin.besoin; });
  var planLignes = [];
  joursTravailles.forEach(function (dateJourMs) {
    var capaciteRestanteJour = capaciteJournaliere;
    for (var i = 0; i < lignesTri.length && capaciteRestanteJour > 0; i++) {
      var l = lignesTri[i];
      var reste = restant[l.typeBTC];
      if (!reste || reste <= 0) continue;
      var qte = Math.min(reste, capaciteRestanteJour);
      if (qte <= 0) continue;
      planLignes.push({
        dateMs: dateJourMs, typeBTC: l.typeBTC, quantite: qte,
        tier: l.score.tier, libelleTier: l.score.libelleTier, motif: l.motif,
        dateMaturiteTheorique: dateJourMs + l.dureeSechageJours * MS_PAR_JOUR
      });
      restant[l.typeBTC] -= qte;
      capaciteRestanteJour -= qte;
    }
  });
  var resteNonPlanifie = {};
  Object.keys(restant).forEach(function (t) { if (restant[t] > 0) resteNonPlanifie[t] = restant[t]; });
  return { planLignes: planLignes, calendrierPossible: true, resteNonPlanifie: resteNonPlanifie };
}

// Point 10/11/43 : detecte les commandes dont l'echeance est structurellement impossible a tenir
// avec les delais de sechage actuels — INDEPENDAMMENT de la capacite (meme en produisant a
// l'instant, le sechage seul suffit a rendre l'echeance intenable). Affine avec la duree de
// production estimee (derivee de la capacite configuree, jamais fabriquee) quand elle est connue.
function detecterEcheancesImpossibles(commandes, indicateursParType, dureeSechageJours, capaciteJournaliere, maintenant) {
  var aujourdHuiISO = dateLocaleISO(maintenant);
  var parType = {}; indicateursParType.forEach(function (x) { parType[x.produit.id] = x; });
  var resultats = [];
  commandes.forEach(function (c) {
    if (normTxt(c.status) !== normTxt("Validee") || !c.dateBesoin) return;
    var resteACouvrir = Math.max(0, (c.quantite || 0) - (c.quantiteLivree || 0) - (c.quantiteReservee || 0));
    if (resteACouvrir <= 0) return;
    var joursRestants = joursEntreDatesISO(c.dateBesoin, aujourdHuiISO);
    if (joursRestants == null) return;
    var x = parType[c.type];
    var dejaCouvert = x ? (x.besoin.disponible + x.besoin.sechageBientotMature) : 0;
    if (dejaCouvert >= resteACouvrir) return; // deja couvert par le stock/sechage existant -> pas de risque de sechage a analyser
    // Delai minimal incompressible = duree de sechage seule (produire a l'instant T ne rend
    // disponible qu'a T+dureeSechage). Affine avec la duree de production si la capacite est connue.
    var dureeProductionEstimee = capaciteJournaliere ? Math.ceil(resteACouvrir / capaciteJournaliere) : 0;
    var delaiMinimalJours = dureeSechageJours + dureeProductionEstimee;
    if (joursRestants < delaiMinimalJours) {
      resultats.push({
        commande: c, joursRestants: joursRestants, delaiMinimalJours: delaiMinimalJours,
        message: "Échéance impossible à tenir avec les délais actuels (séchage " + dureeSechageJours + " j" + (dureeProductionEstimee > 0 ? " + production ~" + dureeProductionEstimee + " j" : "") + ", il reste " + joursRestants + " j)."
      });
    }
  });
  return resultats;
}

// Point 11 : date de demarrage au plus tard pour une commande donnee.
function dateDemarrageAuPlusTard(dateBesoinISO, dureeSechageJours, quantite, capaciteJournaliere) {
  if (!dateBesoinISO) return null;
  var msBesoin = new Date(dateBesoinISO + "T00:00:00").getTime();
  var dureeProduction = capaciteJournaliere ? Math.ceil(quantite / capaciteJournaliere) : 0;
  return msBesoin - (dureeSechageJours + dureeProduction) * MS_PAR_JOUR;
}

// ============================================================================================
// MOTEUR PRINCIPAL — calculerPlanProduction(indicateurs, donnees, parametres, horizonJours,
// maintenant). Fonction PURE (aucun acces Firestore). "indicateurs" = sortie de
// calculerIndicateursIndustriels (Phase 9) : reutilisee telle quelle, jamais recalculee en double.
// ============================================================================================
function calculerPlanProduction(indicateurs, donnees, parametres, horizonJours, maintenant) {
  maintenant = maintenant || Date.now();
  horizonJours = horizonJours || parametres.horizonPlanificationDefaut || 7;
  var commandes = donnees.commandes || [];
  var productions = donnees.productions || [];
  var seuilRuptureJours = 5; // seuil de declenchement du "tier 2" (rupture a court terme) — documente, pas cache
  var dureeSechageJours = parametres.dureeSechageJours;

  var lignes = indicateurs.parType
    .filter(function (x) { return x.besoin.besoin > 0; })
    .map(function (x) {
      var decompose = decomposerBesoin(x.besoin);
      var echeance = echeanceLaPlusProcheParType(commandes, x.produit.id, maintenant);
      var score = calculerScorePrioritePlanification(decompose, x.rupture, echeance, seuilRuptureJours);
      var cadence = calculerCadenceHistoriqueParType(productions, x.produit.id, 30, maintenant, parametres.seuilJoursConfianceCadence);
      var motifParts = [];
      if (decompose.besoinCommandes > 0) motifParts.push(decompose.besoinCommandes.toLocaleString() + " u pour couvrir des commandes déjà validées" + (echeance ? (" (échéance la plus proche : " + echeance.commande.dateBesoin + ", dans " + echeance.jours + " j)") : ""));
      if (decompose.besoinStockCible > 0) motifParts.push(decompose.besoinStockCible.toLocaleString() + " u pour atteindre le stock cible (" + x.besoin.stockCible.toLocaleString() + " u)");
      return {
        typeBTC: x.produit.id, produit: x.produit, besoin: x.besoin, besoinDecompose: decompose,
        score: score, echeance: echeance, cadenceHistorique: cadence, dureeSechageJours: dureeSechageJours,
        motif: motifParts.join(" + ") || "Reconstitution du stock cible"
      };
    })
    .sort(function (a, b) { return comparerScoresPriorite(a.score, b.score); });

  var joursTravailles = genererJoursTravailles(maintenant, horizonJours, parametres.joursTravail);
  // Phase 10B (partie B/R-Z) : des que les heures de travail sont configurees, la capacite REELLE
  // (heures - arrets, campagnes de moule) prend le relais. Tant qu'elles ne le sont pas, comportement
  // Phase 10 d'origine STRICTEMENT inchange (non-regression garantie).
  var activitesParJourISO = donnees.activitesParJourISO || {};
  var allocation = parametres.heuresTravailJour != null
    ? allouerCapaciteAvecCampagnes(lignes, joursTravailles, parametres, activitesParJourISO)
    : allouerCapacitePlanification(lignes, joursTravailles, parametres.capaciteJournaliere);
  var echeancesImpossibles = detecterEcheancesImpossibles(commandes, indicateurs.parType, dureeSechageJours, parametres.capaciteJournaliere, maintenant);

  // Phase 10B (partie AW/AX) : croisement avec les matieres premieres, UNIQUEMENT si un stock
  // matieres a ete fourni par l'appelant (deja charge, aucune requete supplementaire ici — point 49).
  var matieresStock = donnees.matieresStock || null;
  var totalPlanifieBTC = allocation.planLignes.reduce(function (s, l) { return s + l.quantite; }, 0);
  var capaciteMatieres = matieresStock ? calculerCapaciteProductionParMatieres(matieresStock, parametres) : null;
  var approvisionnement = matieresStock ? calculerApprovisionnementPlan(totalPlanifieBTC, matieresStock, parametres) : null;

  return {
    genereLe: maintenant, horizonJours: horizonJours, joursTravailles: joursTravailles,
    lignesPrioritaires: lignes, planLignes: allocation.planLignes, calendrierPossible: allocation.calendrierPossible,
    resteNonPlanifie: allocation.resteNonPlanifie || {}, echeancesImpossibles: echeancesImpossibles,
    capaciteJournaliere: parametres.capaciteJournaliere, joursTravail: parametres.joursTravail,
    messageSiPasDeCalendrier: allocation.calendrierPossible ? null : "Plan quantitatif disponible — calendrier impossible tant que la capacité journalière n'est pas renseignée.",
    // Phase 10B : presents uniquement quand les donnees correspondantes sont configurees/fournies —
    // jamais une valeur fabriquee en leur absence.
    capaciteInfoParJour: allocation.capaciteInfoParJour || null,
    changementsMouleProposes: allocation.changementsMouleProposes || [],
    capaciteMatieres: capaciteMatieres, approvisionnement: approvisionnement, totalPlanifieBTC: totalPlanifieBTC
  };
}

// Points 8/9 : projection JOUR PAR JOUR du stock disponible sur l'horizon du plan — pour montrer
// que produire suffisamment sur l'ensemble de l'horizon n'empeche pas une rupture TEMPORAIRE si une
// commande arrive a echeance avant que la production planifiee pour la couvrir soit murie. Aucune
// consommation n'est inventee : seules les commandes VALIDEES portant une dateBesoin connue sont
// traitees comme des sorties (a defaut de dateBesoin, une commande n'est prise en compte nulle part
// dans cette projection — jamais une hypothese de consommation moyenne fabriquee). Les arrivees sont
// comptees a la date de MATURITE theorique de chaque ligne planifiee (dateProduction + sechage),
// jamais a sa date de production (point 7 : produire aujourd'hui n'est pas disponible aujourd'hui).
// Ne modelise PAS la capacite de sechage/stockage (absente des donnees, points 20/21) : aucune
// saturation physique du sechoir n'est jamais signalee ici, uniquement des ruptures de STOCK.
function calculerProjectionStock(planCalcule, indicateursParType, commandes, horizonJours, maintenant) {
  var joursCalendrier = [];
  var jour0 = new Date(maintenant); jour0.setHours(0, 0, 0, 0);
  for (var i = 0; i < horizonJours; i++) {
    var d = new Date(jour0.getTime()); d.setDate(d.getDate() + i);
    joursCalendrier.push(d.getTime());
  }
  var projectionParType = {};
  indicateursParType.forEach(function (x) {
    var typeId = x.produit.id;
    var stockCourant = x.besoin.disponible;
    var pointsJour = joursCalendrier.map(function (jourMs) {
      var jourISO = dateLocaleISO(jourMs);
      var arrivee = planCalcule.planLignes.filter(function (l) { return l.typeBTC === typeId && dateLocaleISO(l.dateMaturiteTheorique) === jourISO; })
        .reduce(function (s, l) { return s + l.quantite; }, 0);
      var sortie = commandes.filter(function (c) { return c.type === typeId && normTxt(c.status) === normTxt("Validee") && c.dateBesoin === jourISO; })
        .reduce(function (s, c) { return s + Math.max(0, (c.quantite || 0) - (c.quantiteLivree || 0)); }, 0);
      stockCourant = stockCourant + arrivee - sortie;
      return { dateMs: jourMs, stock: stockCourant, arrivee: arrivee, sortie: sortie, rupture: stockCourant < 0 };
    });
    var premiereRupture = pointsJour.find(function (p) { return p.rupture; });
    projectionParType[typeId] = { produit: x.produit, points: pointsJour, ruptureTemporaire: !!premiereRupture, premiereRuptureMs: premiereRupture ? premiereRupture.dateMs : null };
  });
  return { jours: joursCalendrier, parType: projectionParType };
}

// Point 38 : diff entre deux jeux de lignes (le dernier plan valide vs un nouveau calcul), agrege
// par type BTC (quantite totale + date la plus tot) — assez fin pour l'exemple du cahier des
// charges ("+2000 et avance d'un jour"), sans dependre d'un alignement exact ligne-a-ligne qui
// serait fragile des que la repartition jour-par-jour change legerement.
function calculerDiffPlan(lignesAvant, lignesApres) {
  function grouper(lignes) {
    var m = {};
    (lignes || []).forEach(function (l) {
      var t = l.typeBTC;
      if (!m[t]) m[t] = { quantiteTotale: 0, dateLaPlusTot: null };
      m[t].quantiteTotale += (l.quantitePrevue != null ? l.quantitePrevue : l.quantite) || 0;
      var d = l.dateMs;
      if (d != null && (m[t].dateLaPlusTot == null || d < m[t].dateLaPlusTot)) m[t].dateLaPlusTot = d;
    });
    return m;
  }
  var avant = grouper(lignesAvant), apres = grouper(lignesApres);
  var types = {};
  Object.keys(avant).forEach(function (t) { types[t] = true; });
  Object.keys(apres).forEach(function (t) { types[t] = true; });
  var resultats = [];
  Object.keys(types).forEach(function (t) {
    var a = avant[t] || { quantiteTotale: 0, dateLaPlusTot: null };
    var b = apres[t] || { quantiteTotale: 0, dateLaPlusTot: null };
    var deltaQuantite = b.quantiteTotale - a.quantiteTotale;
    var deltaJours = (a.dateLaPlusTot != null && b.dateLaPlusTot != null) ? Math.round((b.dateLaPlusTot - a.dateLaPlusTot) / MS_PAR_JOUR) : null;
    if (deltaQuantite === 0 && !deltaJours) return;
    resultats.push({ typeBTC: t, quantiteAvant: a.quantiteTotale, quantiteApres: b.quantiteTotale, deltaQuantite: deltaQuantite, deltaJours: deltaJours });
  });
  return resultats;
}

// ============================================================================================
// PHASE 10 — Persistance du plan de production. AUCUNE ecriture ne se produit avant un clic
// explicite "Valider le plan" (point 24) : jusque-la, le plan calcule par calculerPlanProduction()
// vit uniquement en memoire cote client. Structure (point 25) :
//   plans_production/{id}          : horizon, genereLe, statut, creePar, dateCreation, version, hypotheses
//   plan_production_lignes/{id}    : planId, dateMs, typeBTC, quantitePrevue, tier/motif, statut,
//                                     dateMaturitePrevue, productionId (une fois demarree), quantiteRealisee
// Statuts volontairement minimaux (point 27) : Valide -> Termine | Reporte | Annule.
// ============================================================================================
async function validerPlanProduction(planCalcule, token, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var planRef = db.collection("plans_production").doc(token);
  var dejaExiste = await planRef.get();
  if (dejaExiste.exists) return token; // idempotence : double clic/retry sur la meme validation

  // Versionnement (point 26) : ne remplace ni n'ecrase jamais un plan deja valide — la version
  // suivante s'ajoute simplement a l'historique.
  var precedent = await db.collection("plans_production").orderBy("version", "desc").limit(1).get();
  var version = precedent.empty ? 1 : (precedent.docs[0].data().version || 0) + 1;

  var batch = db.batch();
  batch.set(planRef, {
    horizonJours: planCalcule.horizonJours, genereLe: planCalcule.genereLe,
    statut: "Valide", creePar: auteur, dateCreation: firebase.firestore.FieldValue.serverTimestamp(),
    version: version, hypotheses: {
      capaciteJournaliere: planCalcule.capaciteJournaliere, joursTravail: planCalcule.joursTravail
    }, calendrierPossible: planCalcule.calendrierPossible
  });
  planCalcule.planLignes.forEach(function (ligne, i) {
    batch.set(db.collection("plan_production_lignes").doc(token + "_" + i), {
      planId: token, dateMs: ligne.dateMs, typeBTC: ligne.typeBTC, quantitePrevue: ligne.quantite,
      tier: ligne.tier, libelleTier: ligne.libelleTier, motif: ligne.motif,
      dateMaturitePrevue: ligne.dateMaturiteTheorique, statut: "Valide",
      productionId: null, quantiteRealisee: null, dateCreation: firebase.firestore.FieldValue.serverTimestamp()
    });
  });
  await batch.commit();
  return token;
}
// Dernier plan valide + ses lignes (requetes CIBLEES, point 49 — jamais tout l'historique).
async function chargerDernierPlanProduction() {
  var planSnap = await db.collection("plans_production").orderBy("version", "desc").limit(1).get();
  if (planSnap.empty) return null;
  var plan = Object.assign({ id: planSnap.docs[0].id }, planSnap.docs[0].data());
  var lignesSnap = await db.collection("plan_production_lignes").where("planId", "==", plan.id).get();
  plan.lignes = lignesSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
  return plan;
}
// Point 28/33 : relie la ligne planifiee a la production reellement enregistree, sans jamais
// compter deux fois (planifie + realise) — la ligne passe a "Termine" et porte desormais la
// quantite REELLE, que la projection future doit utiliser a la place de la quantite prevue.
async function terminerLigneProductionPlan(ligneId, productionId, quantiteRealisee, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  await db.collection("plan_production_lignes").doc(ligneId).update({
    statut: "Termine", productionId: productionId, quantiteRealisee: quantiteRealisee,
    dateRealisation: firebase.firestore.FieldValue.serverTimestamp(), realisePar: auteur
  });
}
// Point 31 : report PROPOSE puis VALIDE par l'utilisateur — jamais deplace automatiquement.
async function reporterLigneProductionPlan(ligne, nouvelleDateMs, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var batch = db.batch();
  batch.update(db.collection("plan_production_lignes").doc(ligne.id), { statut: "Reporte", reportePar: auteur, dateReport: firebase.firestore.FieldValue.serverTimestamp() });
  var nouvelleRef = db.collection("plan_production_lignes").doc();
  batch.set(nouvelleRef, {
    planId: ligne.planId, dateMs: nouvelleDateMs, typeBTC: ligne.typeBTC, quantitePrevue: ligne.quantitePrevue,
    tier: ligne.tier, libelleTier: ligne.libelleTier, motif: "Reporté depuis le " + new Date(ligne.dateMs).toLocaleDateString("fr-FR") + " (" + ligne.motif + ")",
    dateMaturitePrevue: nouvelleDateMs + (ligne.dateMaturitePrevue - ligne.dateMs), statut: "Valide",
    productionId: null, quantiteRealisee: null, ligneReporteeDepuisId: ligne.id,
    dateCreation: firebase.firestore.FieldValue.serverTimestamp()
  });
  await batch.commit();
}
async function annulerLigneProductionPlan(ligneId, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  await db.collection("plan_production_lignes").doc(ligneId).update({ statut: "Annule", annulePar: auteur, dateAnnulation: firebase.firestore.FieldValue.serverTimestamp() });
}

// ============================================================================================
// PHASE 10B — ACTIVITES INDUSTRIELLES. Audit (partie A) : aucune notion d'arret machine ni de
// moule n'existait avant cette phase. Principe central (partie B) : BTC Manager ne doit plus
// confondre "temps de presence de l'usine" et "temps reellement disponible pour produire des BTC".
// ============================================================================================
var TYPES_ACTIVITES_INDUSTRIELLES = [
  { id: "PRODUCTION", libelle: "Production BTC", icone: "🏭", categorie: "production" },
  { id: "CONCASSAGE", libelle: "Concassage / broyage terre", icone: "🪨", categorie: "process" },
  { id: "CHANGEMENT_MOULE", libelle: "Changement de moule", icone: "🔧", categorie: "process" },
  { id: "MAINTENANCE", libelle: "Maintenance", icone: "🛠", categorie: "subi" },
  { id: "NETTOYAGE", libelle: "Nettoyage", icone: "🧹", categorie: "process" },
  { id: "PANNE", libelle: "Panne", icone: "⚠️", categorie: "subi" },
  { id: "ATTENTE_MATIERE", libelle: "Attente matière", icone: "⏳", categorie: "subi" },
  { id: "COUPURE_ELECTRIQUE", libelle: "Coupure électrique", icone: "⚡", categorie: "subi" },
  { id: "AUTRE", libelle: "Autre", icone: "❓", categorie: "subi" }
];
function libelleActivite(typeId) { var t = TYPES_ACTIVITES_INDUSTRIELLES.find(function (x) { return x.id === typeId; }); return t ? t.libelle : typeId; }

// Point BB : duree d'une activite en minutes — le REEL remplace toujours le PREVU dans le calcul de
// capacite (jamais un cumul des deux). Le prevu reste conserve tel quel sur le document, uniquement
// pour comparaison (point L/BB), jamais ecrase.
function dureeActiviteMinutes(a) {
  if (a.dureeReelleMinutes != null) return a.dureeReelleMinutes;
  if (a.dureePrevueMinutes != null) return a.dureePrevueMinutes;
  return 0;
}

// Heures indisponibles pour la production BTC un jour donne, par type d'activite process/subi —
// jamais PRODUCTION elle-meme (qui consomme le temps restant, ce n'est pas un "arret").
function calculerHeuresIndisponiblesJour(activitesDuJour) {
  var parType = {}, totalMinutes = 0;
  (activitesDuJour || []).forEach(function (a) {
    if (a.type === "PRODUCTION" || a.statut === "Annule") return;
    var m = dureeActiviteMinutes(a);
    parType[a.type] = (parType[a.type] || 0) + m;
    totalMinutes += m;
  });
  var parTypeHeures = {};
  Object.keys(parType).forEach(function (t) { parTypeHeures[t] = parType[t] / 60; });
  return { totalHeures: totalMinutes / 60, parTypeHeures: parTypeHeures };
}

// Points B/E/F : capacite REELLEMENT disponible = fonction(heures de travail − heures d'arret
// planifiees/reelles), jamais seulement capaciteJournaliere. Repli honnete (calculable:false) tant
// que heuresTravailJour n'est pas configure — aucune heure ni cadence n'est jamais fabriquee.
function calculerCapaciteReelleJour(capaciteJournaliere, heuresTravailJour, activitesDuJour) {
  if (capaciteJournaliere == null || heuresTravailJour == null || heuresTravailJour <= 0) {
    return { calculable: false, capaciteReelle: null, capaciteTheorique: capaciteJournaliere, cadenceHoraire: null, heuresIndisponibles: 0, heuresDisponibles: null, parTypeHeures: {} };
  }
  var cadenceHoraire = capaciteJournaliere / heuresTravailJour;
  var indispo = calculerHeuresIndisponiblesJour(activitesDuJour);
  var heuresDisponibles = Math.max(0, heuresTravailJour - indispo.totalHeures);
  var capaciteReelle = Math.round(cadenceHoraire * heuresDisponibles);
  return { calculable: true, capaciteReelle: capaciteReelle, capaciteTheorique: capaciteJournaliere, cadenceHoraire: cadenceHoraire, heuresIndisponibles: indispo.totalHeures, heuresDisponibles: heuresDisponibles, parTypeHeures: indispo.parTypeHeures };
}

// Point P : explique automatiquement un ecart plan/reel du jour par les activites non prevues —
// jamais presente automatiquement comme une sous-performance de l'operateur (point BF).
function calculerEcartActiviteJour(planifieBTC, realiseBTC, activitesReellesJour, activitesPrevuesJour) {
  var heuresPrevues = calculerHeuresIndisponiblesJour(activitesPrevuesJour || []).totalHeures;
  var heuresReelles = calculerHeuresIndisponiblesJour(activitesReellesJour || []).totalHeures;
  return { ecartBTC: realiseBTC - planifieBTC, heuresPrevues: heuresPrevues, heuresReelles: heuresReelles, heuresImprevues: Math.max(0, heuresReelles - heuresPrevues) };
}

// Persistance — demarrer/terminer une activite reelle (UX cible partie CP : "Démarrer concassage"
// puis "Terminer concassage"). ID deterministe (token) pour l'idempotence (point BQ) : un double-clic
// sur "Démarrer" ne cree jamais deux activites.
async function demarrerActiviteIndustrielle(champs, token, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var ref = db.collection("activites_industrielles").doc(token);
  var existe = await ref.get();
  if (existe.exists) return token; // idempotence (double-clic)
  var maintenant = Date.now();
  await ref.set({
    date: dateLocaleISO(maintenant), type: champs.type, statut: "EnCours",
    heureDebutPrevue: null, heureFinPrevue: null, dureePrevueMinutes: champs.dureePrevueMinutes != null ? champs.dureePrevueMinutes : null,
    heureDebutReelle: maintenant, heureFinReelle: null, dureeReelleMinutes: null,
    typeBTC: champs.typeBTC || null, ancienMoule: champs.ancienMoule || null, nouveauMoule: champs.nouveauMoule || null,
    volumeTerreConcasseeM3: null, motif: champs.motif || "", commentaire: champs.commentaire || "",
    creePar: auteur, validePar: null, dateCreation: firebase.firestore.FieldValue.serverTimestamp()
  });
  return token;
}
async function terminerActiviteIndustrielle(activiteId, champs, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var ref = db.collection("activites_industrielles").doc(activiteId);
  var snap = await ref.get();
  if (!snap.exists) throw new Error("Activité introuvable.");
  var a = snap.data();
  if (a.statut === "Termine") return; // idempotence (double-clic sur "Terminer")
  var maintenant = Date.now();
  var debut = a.heureDebutReelle || maintenant;
  var dureeReelleMinutes = Math.max(0, Math.round((maintenant - debut) / 60000));
  await ref.update({
    statut: "Termine", heureFinReelle: maintenant, dureeReelleMinutes: dureeReelleMinutes,
    volumeTerreConcasseeM3: (champs && champs.volumeTerreConcasseeM3 != null) ? champs.volumeTerreConcasseeM3 : null,
    commentaire: (champs && champs.commentaire) || a.commentaire || "", validePar: auteur,
    dateModification: firebase.firestore.FieldValue.serverTimestamp()
  });
  // Point T : un changement de moule termine met a jour le moule reellement installe (etat courant,
  // au meme titre que le cache "stocks" pour le stock BTC).
  if (a.type === "CHANGEMENT_MOULE" && a.nouveauMoule) {
    await db.collection("parametres_industriels").doc("global").set({ mouleActuel: a.nouveauMoule }, { merge: true });
  }
  return dureeReelleMinutes;
}
// Point N : planification d'une activite future par le responsable (concassage, changement de
// moule...) — champs PREVUS uniquement, jamais de champs reels tant qu'elle n'a pas ete demarree.
async function planifierActiviteIndustrielle(champs, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var ref = await db.collection("activites_industrielles").add({
    date: champs.date, type: champs.type, statut: "Planifie",
    heureDebutPrevue: champs.heureDebutPrevue || null, heureFinPrevue: champs.heureFinPrevue || null,
    dureePrevueMinutes: champs.dureePrevueMinutes || null,
    heureDebutReelle: null, heureFinReelle: null, dureeReelleMinutes: null,
    typeBTC: champs.typeBTC || null, ancienMoule: champs.ancienMoule || null, nouveauMoule: champs.nouveauMoule || null,
    volumeTerreConcasseeM3: null, motif: champs.motif || "", commentaire: champs.commentaire || "",
    creePar: auteur, validePar: null, dateCreation: firebase.firestore.FieldValue.serverTimestamp()
  });
  return ref.id;
}

// ============================================================================================
// PHASE 10B — MATIERES PREMIERES. Recette centralisee (jamais dispersee), grand livre
// matiere_mouvements + cache matieres_stock (memes principes exacts que stock_mouvements/stocks :
// ID deterministe -> idempotence, jamais de double consommation).
// ============================================================================================

var LIBELLES_MATIERES = { terre: "Terre", ciment: "Ciment", sable: "Sable", eau: "Eau" };
function getLibelleMatiere(id) { return LIBELLES_MATIERES[id] || id; }
// Point AB : formule centralisee. terreM3 ne depend que de la recette (toujours calculable) ; le
// reste depend de densiteTerreSecheKgM3, jamais inventee si absente (point AA/CO).
function calculerConsommationMatieresProduction(quantiteBTC, parametres) {
  var facteur = quantiteBTC / 100;
  var terreM3 = parametres.recetteTerreM3Pour100BTC * facteur;
  if (parametres.densiteTerreSecheKgM3 == null) {
    return { calculable: false, terreM3: terreM3, terreSecheKg: null, cimentKg: null, sableKg: null, eauLitres: null };
  }
  var terreSecheKg = terreM3 * parametres.densiteTerreSecheKgM3;
  var cimentKg = terreSecheKg * parametres.recetteTauxCimentPct;
  var sableKg = terreSecheKg * parametres.recetteTauxSablePct;
  var eauLitres = Math.max(0, terreSecheKg * (parametres.recetteHumiditeCiblePct - parametres.recetteHumiditeInitialePct));
  return { calculable: true, terreM3: terreM3, terreSecheKg: terreSecheKg, cimentKg: cimentKg, sableKg: sableKg, eauLitres: eauLitres };
}

function idMouvementMatiere(sourceType, sourceId, matiereId) {
  return (sourceType + "_" + sourceId + "_" + matiereId).replace(/[\/\s]/g, "-").slice(0, 400);
}
async function verifierMouvementMatiereExistant(tx, sourceType, sourceId, matiereId) {
  var id = idMouvementMatiere(sourceType, sourceId, matiereId);
  var snap = await tx.get(db.collection("matiere_mouvements").doc(id));
  return { id: id, existe: snap.exists };
}
function ecrireMouvementMatiere(tx, id, mvt) {
  tx.set(db.collection("matiere_mouvements").doc(id), {
    matiereId: mvt.matiereId, type: mvt.type, quantite: mvt.quantite, unite: mvt.unite,
    prixUnitaire: mvt.prixUnitaire != null ? mvt.prixUnitaire : null,
    sourceType: mvt.sourceType, sourceId: mvt.sourceId, utilisateur: mvt.utilisateur || "inconnu",
    commentaire: mvt.commentaire || "", dateCreation: firebase.firestore.FieldValue.serverTimestamp()
  });
}
// Point AF : cout moyen pondere du stock — jamais un simple remplacement du dernier prix.
function calculerCoutMoyenPondere(quantiteAvant, coutMoyenAvant, quantiteEntree, prixUnitaireEntree) {
  var quantiteApres = quantiteAvant + quantiteEntree;
  if (quantiteApres <= 0) return 0;
  var valeurAvant = quantiteAvant * (coutMoyenAvant || 0);
  var valeurEntree = quantiteEntree * (prixUnitaireEntree || 0);
  return (valeurAvant + valeurEntree) / quantiteApres;
}

// Point AE/AF : reception d'une matiere premiere generique (ciment/sable, achats hors camion).
async function receptionnerMatierePremiere(matiereId, quantite, unite, prixTotal, fournisseur, token, user, userData) {
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var prixUnitaire = (prixTotal != null && quantite > 0) ? prixTotal / quantite : null;
  var stockRef = db.collection("matieres_stock").doc(matiereId);
  await db.runTransaction(async function (tx) {
    var stockSnap = await tx.get(stockRef);
    var chk = await verifierMouvementMatiereExistant(tx, "reception", token, matiereId);
    if (chk.existe) return; // idempotence
    var s = stockSnap.exists ? stockSnap.data() : { quantite: 0, coutMoyenPondere: 0 };
    var nouveauCout = calculerCoutMoyenPondere(s.quantite || 0, s.coutMoyenPondere || 0, quantite, prixUnitaire);
    ecrireMouvementMatiere(tx, chk.id, { matiereId: matiereId, type: "RECEPTION", quantite: quantite, unite: unite, prixUnitaire: prixUnitaire, sourceType: "reception", sourceId: token, utilisateur: auteur, commentaire: fournisseur ? ("Fournisseur : " + fournisseur) : "" });
    tx.set(stockRef, { quantite: (s.quantite || 0) + quantite, unite: unite, coutMoyenPondere: nouveauCout }, { merge: true });
  });
}

// Points AM-AS : reception de terre par camions-bennes — l'unite terrain est le camion, la source de
// verite matiere reste le m³. volumeTheoriqueM3 (nombreCamions × capaciteCamionM3) et volumeReelM3
// (correction eventuelle) sont TOUS DEUX conserves, jamais l'un remplace par l'autre (point AQ).
async function receptionnerCamionsTerre(champs, token, user, userData) {
  var nombreCamions = champs.nombreCamions, capaciteCamionM3 = champs.capaciteCamionM3;
  var volumeTheoriqueM3 = nombreCamions * capaciteCamionM3;
  var volumeM3 = (champs.volumeReelM3 != null && champs.volumeReelM3 > 0) ? champs.volumeReelM3 : volumeTheoriqueM3;
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  var prixUnitaire = (champs.prixTotal != null && volumeM3 > 0) ? champs.prixTotal / volumeM3 : null;
  var stockRef = db.collection("matieres_stock").doc("terre");
  await db.runTransaction(async function (tx) {
    var stockSnap = await tx.get(stockRef);
    var chk = await verifierMouvementMatiereExistant(tx, "reception_camion", token, "terre");
    if (chk.existe) return; // idempotence
    var s = stockSnap.exists ? stockSnap.data() : { quantite: 0, coutMoyenPondere: 0 };
    var nouveauCout = calculerCoutMoyenPondere(s.quantite || 0, s.coutMoyenPondere || 0, volumeM3, prixUnitaire);
    ecrireMouvementMatiere(tx, chk.id, {
      matiereId: "terre", type: "RECEPTION_CAMION", quantite: volumeM3, unite: "m3", prixUnitaire: prixUnitaire,
      sourceType: "reception_camion", sourceId: token, utilisateur: auteur,
      commentaire: nombreCamions + " camion(s) × " + capaciteCamionM3 + " m³" + (champs.origine ? (" — " + champs.origine) : "")
    });
    tx.set(stockRef, { quantite: (s.quantite || 0) + volumeM3, unite: "m3", coutMoyenPondere: nouveauCout }, { merge: true });
  });
  // Tracabilite detaillee de la reception (point AO/AS), distincte du grand livre agrege.
  await db.collection("receptions_terre").doc(token).set({
    nombreCamions: nombreCamions, capaciteCamionM3: capaciteCamionM3, volumeTheoriqueM3: volumeTheoriqueM3,
    volumeReelM3: champs.volumeReelM3 != null ? champs.volumeReelM3 : null, volumeRetenuM3: volumeM3,
    origine: champs.origine || "", fournisseur: champs.fournisseur || "", prixTotal: champs.prixTotal != null ? champs.prixTotal : null,
    prixUnitaireM3: prixUnitaire, prixParCamion: (champs.prixTotal != null && nombreCamions > 0) ? champs.prixTotal / nombreCamions : null,
    creePar: auteur, dateCreation: firebase.firestore.FieldValue.serverTimestamp()
  });
}

// Point AH : apercu PUR (aucune ecriture) des matieres necessaires avant validation d'une production.
// Le suivi matiere n'est considere ACTIVE que si densiteTerreSecheKgM3 a ete explicitement configure
// (le signal volontaire du responsable, au meme titre que capaciteJournaliere pour la planification) —
// tant qu'il ne l'est pas, ne bloque JAMAIS la production (non-regression : l'application fonctionnait
// sans aucun suivi matiere avant cette phase, elle continue de le faire tant que ce n'est pas active).
function apercuMatieresProduction(quantiteBTC, matieresStock, parametres) {
  if (parametres.densiteTerreSecheKgM3 == null) {
    return { suivi: false, calculable: false, consommation: null, lignes: [], stocksApres: {}, suffisant: true, manques: [] };
  }
  var conso = calculerConsommationMatieresProduction(quantiteBTC, parametres);
  var lignes = [
    { id: "terre", unite: "m3", besoin: conso.terreM3 },
    { id: "ciment", unite: "kg", besoin: conso.cimentKg },
    { id: "sable", unite: "kg", besoin: conso.sableKg },
    { id: "eau", unite: "L", besoin: conso.eauLitres }
  ].filter(function (l) { return l.besoin != null; });
  var manques = [], stocksApres = {};
  lignes.forEach(function (l) {
    var dispo = (matieresStock[l.id] && matieresStock[l.id].quantite) || 0;
    stocksApres[l.id] = dispo - l.besoin;
    if (dispo < l.besoin) manques.push({ id: l.id, manque: l.besoin - dispo, unite: l.unite });
  });
  return { suivi: true, calculable: conso.calculable, consommation: conso, lignes: lignes, stocksApres: stocksApres, suffisant: manques.length === 0, manques: manques };
}

// Points AG/AI/AJ/BQ/BR : verifie ET consomme les matieres en une SEULE transaction atomique —
// jamais de demi-ecriture (production creee sans consommation, ou consommation partielle). Si le
// stock est insuffisant, la transaction leve une erreur explicite AVANT toute ecriture. Le cout est
// FIGE au moment de la production (cout moyen pondere courant), il ne changera jamais retroactivement
// si le prix d'achat evolue plus tard (point AJ).
async function consommerMatieresPourProduction(quantiteBTC, parametres, token, user, userData) {
  var conso = calculerConsommationMatieresProduction(quantiteBTC, parametres);
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  if (!conso.calculable) {
    // Densite non configuree (jamais inventee) : seule la terre est quantifiable -> uniquement la
    // terre est deduite, signale explicitement plutot que de fabriquer ciment/sable/eau.
    var refTerre = db.collection("matieres_stock").doc("terre");
    var coutTerreSeule = null;
    await db.runTransaction(async function (tx) {
      var snap = await tx.get(refTerre);
      var chk = await verifierMouvementMatiereExistant(tx, "production", token, "terre");
      if (chk.existe) return;
      var s = snap.exists ? snap.data() : { quantite: 0, coutMoyenPondere: 0 };
      if ((s.quantite || 0) < conso.terreM3) throw new Error("Production impossible — matières insuffisantes (terre : manque " + (conso.terreM3 - (s.quantite || 0)).toFixed(1) + " m³).");
      coutTerreSeule = (s.coutMoyenPondere || 0) * conso.terreM3;
      ecrireMouvementMatiere(tx, chk.id, { matiereId: "terre", type: "CONSOMMATION_PRODUCTION", quantite: -conso.terreM3, unite: "m3", prixUnitaire: s.coutMoyenPondere || 0, sourceType: "production", sourceId: token, utilisateur: auteur });
      tx.set(refTerre, { quantite: (s.quantite || 0) - conso.terreM3, unite: "m3", coutMoyenPondere: s.coutMoyenPondere || 0 }, { merge: true });
    });
    return { calculable: false, consommation: conso, coutMatieresProduction: coutTerreSeule, coutMatiereParBTC: null, avertissement: "Densité de la terre sèche non configurée — seule la terre a été déduite du stock ; ciment/sable/eau non calculés." };
  }
  var lignes = [
    { id: "terre", quantite: conso.terreM3, unite: "m3" },
    { id: "ciment", quantite: conso.cimentKg, unite: "kg" },
    { id: "sable", quantite: conso.sableKg, unite: "kg" },
    { id: "eau", quantite: conso.eauLitres, unite: "L" }
  ];
  var refs = lignes.map(function (l) { return db.collection("matieres_stock").doc(l.id); });
  var coutMatieresProduction = 0;
  await db.runTransaction(async function (tx) {
    var snaps = [];
    for (var i = 0; i < refs.length; i++) snaps.push(await tx.get(refs[i]));
    var chks = [];
    for (var j = 0; j < lignes.length; j++) chks.push(await verifierMouvementMatiereExistant(tx, "production", token, lignes[j].id));
    if (chks[0].existe) { coutMatieresProduction = null; return; } // idempotence : deja consomme (double-clic)
    var manques = [];
    var etats = lignes.map(function (l, i) {
      var s = snaps[i].exists ? snaps[i].data() : { quantite: 0, coutMoyenPondere: 0 };
      if ((s.quantite || 0) < l.quantite) manques.push({ id: l.id, manque: l.quantite - (s.quantite || 0), unite: l.unite });
      return s;
    });
    if (manques.length > 0) {
      var msg = manques.map(function (m) { return m.id + " : manque " + m.manque.toFixed(1) + " " + m.unite; }).join(" · ");
      throw new Error("Production impossible — matières insuffisantes (" + msg + ").");
    }
    coutMatieresProduction = 0;
    lignes.forEach(function (l, i) {
      var s = etats[i];
      coutMatieresProduction += (s.coutMoyenPondere || 0) * l.quantite;
      ecrireMouvementMatiere(tx, chks[i].id, { matiereId: l.id, type: "CONSOMMATION_PRODUCTION", quantite: -l.quantite, unite: l.unite, prixUnitaire: s.coutMoyenPondere || 0, sourceType: "production", sourceId: token, utilisateur: auteur });
      tx.set(refs[i], { quantite: (s.quantite || 0) - l.quantite, unite: l.unite, coutMoyenPondere: s.coutMoyenPondere || 0 }, { merge: true });
    });
  });
  return { calculable: true, consommation: conso, coutMatieresProduction: coutMatieresProduction, coutMatiereParBTC: (coutMatieresProduction != null && quantiteBTC > 0) ? coutMatieresProduction / quantiteBTC : null };
}
// Point AK/AL : correction/annulation d'une production deja consommee — cree des mouvements
// CORRECTIFS (le delta), ne modifie ni n'efface jamais les mouvements d'origine.
async function corrigerConsommationMatieresProduction(ancienneQuantite, nouvelleQuantite, parametres, token, user, userData) {
  if (parametres.densiteTerreSecheKgM3 == null) return { calculable: false };
  var consoAncienne = calculerConsommationMatieresProduction(ancienneQuantite, parametres);
  var consoNouvelle = calculerConsommationMatieresProduction(nouvelleQuantite, parametres);
  var deltas = { terre: consoNouvelle.terreM3 - consoAncienne.terreM3, ciment: consoNouvelle.cimentKg - consoAncienne.cimentKg, sable: consoNouvelle.sableKg - consoAncienne.sableKg, eau: consoNouvelle.eauLitres - consoAncienne.eauLitres };
  var unites = { terre: "m3", ciment: "kg", sable: "kg", eau: "L" };
  var auteur = (userData && userData.nom) || (user && user.email) || "inconnu";
  await db.runTransaction(async function (tx) {
    var ids = Object.keys(deltas);
    var refs = ids.map(function (id) { return db.collection("matieres_stock").doc(id); });
    var snaps = [];
    for (var i = 0; i < refs.length; i++) snaps.push(await tx.get(refs[i]));
    var chks = [];
    for (var j = 0; j < ids.length; j++) chks.push(await verifierMouvementMatiereExistant(tx, "correction_production", token, ids[j]));
    if (chks[0].existe) return; // idempotence
    ids.forEach(function (id, i) {
      var delta = deltas[id];
      if (delta === 0) return;
      var s = snaps[i].exists ? snaps[i].data() : { quantite: 0, coutMoyenPondere: 0 };
      ecrireMouvementMatiere(tx, chks[i].id, { matiereId: id, type: "CORRECTION_PRODUCTION", quantite: -delta, unite: unites[id], prixUnitaire: s.coutMoyenPondere || 0, sourceType: "correction_production", sourceId: token, utilisateur: auteur });
      tx.set(refs[i], { quantite: (s.quantite || 0) - delta, unite: unites[id], coutMoyenPondere: s.coutMoyenPondere || 0 }, { merge: true });
    });
  });
  return { calculable: true, deltas: deltas };
}

// ============================================================================================
// PHASE 10B — Enregistrement CENTRAL et ATOMIQUE d'une production reelle (points AG/BR) : cree la
// production, met a jour le stock BTC ET consomme les matieres premieres dans UNE SEULE transaction
// Firestore — jamais de production creee sans sa consommation matiere correspondante, jamais de
// demi-ecriture. Le lot QSE est cree APRES (meme pattern deja etabli ailleurs dans l'application,
// hors transaction, best-effort) : une production existe toujours meme si le suivi qualite echoue a
